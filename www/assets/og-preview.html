<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MissedCall Respondr OG</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter','Nimbus Sans','DejaVu Sans',sans-serif;width:1200px;height:630px;overflow:hidden}
.bg{width:1200px;height:630px;background:linear-gradient(135deg,#0a0c10 0%,#0f1520 50%,#0a0c10 100%);position:relative;overflow:hidden}
.accent-bar{position:absolute;left:0;top:0;width:6px;height:100%;background:linear-gradient(180deg,#10b981 0%,#34d399 100%)}
.glow1{position:absolute;top:-80px;right:40px;width:480px;height:480px;border-radius:50%;background:radial-gradient(circle,rgba(16,185,129,0.06) 0%,transparent 70%)}
.glow2{position:absolute;bottom:-40px;right:200px;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(52,211,153,0.04) 0%,transparent 70%)}
.content{position:absolute;left:80px;top:64px;z-index:1}
.badge{display:inline-flex;align-items:center;padding:8px 20px;border:1.5px solid #10b981;border-radius:100px;background:rgba(16,185,129,0.12);margin-bottom:20px}
.badge-text{font-size:14px;font-weight:700;color:#10b981;letter-spacing:0.04em}
.headline{font-size:52px;font-weight:900;line-height:1.2;color:#ffffff;margin-bottom:6px}
.headline-accent{font-size:52px;font-weight:900;color:#10b981;margin-bottom:24px}
.subtitle{font-size:21px;color:#9ca3af;line-height:1.5;margin-bottom:32px}
.subtitle2{font-size:21px;color:#9ca3af;margin-bottom:4px}
.pills{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:36px}
.pill{border:1.5px solid rgba(16,185,129,0.4);border-radius:100px;padding:8px 20px;background:rgba(16,185,129,0.08);font-size:13px;font-weight:700;color:#10b981}
.pill-neutral{border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.03);color:#9ca3af;font-size:13px;font-weight:600;border-radius:100px;padding:8px 20px}
.cta{display:inline-flex;align-items:center;justify-content:center;min-width:260px;padding:0 32px;height:56px;border-radius:12px;background:linear-gradient(135deg,#10b981 0%,#34d399 100%);font-size:22px;font-weight:800;color:#ffffff}
.visual{position:absolute;right:70px;top:100px;opacity:0.5}
/* Phone/Call visual */
.phone-icon{width:120px;height:120px;border-radius:50%;border:2px solid rgba(16,185,129,0.15);background:rgba(16,185,129,0.04);display:flex;align-items:center;justify-content:center;font-size:48px;margin-bottom:16px}
.msg-bubble{background:rgba(16,185,129,0.08);border:1.5px solid rgba(16,185,129,0.15);border-radius:12px;padding:12px 16px;margin-bottom:8px;font-size:12px;color:rgba(16,185,129,0.3);max-width:200px}
.msg-bubble-outgoing{background:rgba(34,211,238,0.06);border-color:rgba(34,211,238,0.12);margin-left:40px;width:160px}
.msg-line{height:6px;border-radius:3px;background:rgba(16,185,129,0.15);margin-bottom:4px;width:80%}
.small{width:50%}
.dot{position:absolute;border-radius:50%;background:rgba(16,185,129,0.12)}
.d1{top:40px;right:380px;width:8px;height:8px}
.d2{top:180px;right:140px;width:6px;height:6px}
.d3{top:400px;right:360px;width:8px;height:8px}
.d4{top:500px;right:100px;width:6px;height:6px}
.branding{position:absolute;left:80px;bottom:54px;display:flex;align-items:center;gap:10px}
.brand-name{font-size:16px;font-weight:800;color:#ffffff}
.brand-accent{font-size:16px;font-weight:800;color:#10b981}
.brand-domain{font-size:13px;color:#6b7280}
.outer-border{position:absolute;inset:0;border:1px solid rgba(255,255,255,0.06)}
</style>
</head>
<body>
<div class="bg">
  <div class="accent-bar"></div>
  <div class="glow1"></div>
  <div class="glow2"></div>

  <div class="content">
    <div class="badge"><span class="badge-text">📞 24/7 AUTO-RESPONSE</span></div>
    <div class="headline">Never Miss a</div>
    <div class="headline-accent">Business Call Again</div>
    <div class="subtitle">Auto text-back, voicemail transcription, and smart lead</div>
    <div class="subtitle2">routing — all before you even pick up your phone.</div>

    <div class="pills" style="margin-top:28px">
      <span class="pill">85% Never Call Back</span>
      <span class="pill">3 Min Setup</span>
      <span class="pill-neutral">CallRail</span>
      <span class="pill-neutral">Grasshopper</span>
    </div>

    <div class="cta">Start Capturing Calls  &rarr;</div>
  </div>

  <!-- Phone/Message visual -->
  <div class="visual">
    <div class="phone-icon">📞</div>
    <div class="msg-bubble">
      <div class="msg-line"></div>
      <div class="msg-line small"></div>
    </div>
    <div class="msg-bubble msg-bubble-outgoing">
      <div class="msg-line" style="background:rgba(34,211,238,0.12)"></div>
      <div class="msg-line small" style="background:rgba(34,211,238,0.12)"></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <div style="width:62px;height:62px;border-radius:14px;border:2px solid rgba(16,185,129,0.12);background:rgba(16,185,129,0.03);display:flex;align-items:center;justify-content:center;font-size:22px">📱</div>
      <div style="width:62px;height:62px;border-radius:14px;border:2px solid rgba(52,211,153,0.1);background:rgba(52,211,153,0.03);display:flex;align-items:center;justify-content:center;font-size:22px">🎙️</div>
      <div style="width:62px;height:62px;border-radius:14px;border:2px solid rgba(34,211,238,0.1);background:rgba(34,211,238,0.03);display:flex;align-items:center;justify-content:center;font-size:22px">🔄</div>
    </div>
  </div>

  <!-- Dots -->
  <div class="dot d1"></div>
  <div class="dot d2"></div>
  <div class="dot d3"></div>
  <div class="dot d4"></div>

  <div class="branding">
    <span class="brand-name">MissedCall</span><span class="brand-accent"> Respondr</span>
    <span class="brand-domain">missedcallrespondr.com</span>
  </div>

  <div class="outer-border"></div>
</div>
</body>
</html>
