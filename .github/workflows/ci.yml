name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-24.04

    env:
      SQLX_OFFLINE: true

    steps:
      - uses: actions/checkout@v4

      # Pin the toolchain to this box's rustc 1.97.1, not @stable: a newer stable
      # clippy flags lints (e.g. double_must_use) that the pinned rustc cannot
      # reproduce locally, so CI goes red for no code reason. Keep in step with
      # rust-toolchain.toml.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Build
        run: cargo build --release
