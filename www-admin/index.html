<script type="module">
// ABSOLUTE specifiers (were './vendor/…'). The vhost's SPA fallback serves this shell at ANY path,
// so a relative specifier resolved against the REQUEST path: an operator at
// https://admin.missedcallrespondr.com/<any-path> requested <any-path>/vendor/preact.js (404) and the
// console rendered BLANK (measured in real Chromium 2026-10-12). /vendor/* is served at every path.
import { h, render } from '/vendor/preact.js';
import { useState, useEffect } from '/vendor/hooks.js';
import htm from '/vendor/htm.js';
const html = htm.bind(h);
const showUpgradePrompt = (msg) => {
  const div = document.createElement("div");
  div.className = "upgrade-overlay";
  div.innerHTML = "<div class='upgrade-box'><h2>🚀 Upgrade Required</h2><p>" + (msg || "This feature requires a higher plan.") + "</p><button class='btn-upgrade' onclick=\"this.closest('.upgrade-overlay').remove()\">Got it</button></div>";
  document.body.appendChild(div);
  div.addEventListener("click", (e) => { if (e.target === div) div.remove(); });
};


const API = (() => {
  const base = window.location.origin + '/api/v1';
  let token = sessionStorage.getItem('mc_token');
  let user = JSON.parse(sessionStorage.getItem('mc_user') || 'null');

  const headers = () => ({ 'Content-Type': 'application/json', ...(token ? { 'Authorization': 'Bearer ' + token } : {}) });
  const handle = async (r) => { const d = await r.json(); if (!r.ok) throw new Error(d.error || d.message || 'Request failed'); return d; };
  const login = (e, p) => fetch(base + '/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email:e,password:p}) }).then(handle);
  // A 401 on a request that CARRIED a session means the session the server knows about is gone: the
  // panel's 7-day token has expired or was revoked. Ending it HERE is the only way this console gets
  // back to a sign-in — measured in real Chromium on admin.missedcallrespondr.com (2026-10-16): with
  // an expired session in storage the panel kept the signed-in shell and every screen failed, and no
  // sign-in was offered (browser-run/mcr-session-expiry-proof.js, PRE arm). API.login() is a separate
  // call that carries NO token, so a wrong password still shows the API's own sentence.
  const sessionEnded = () => {
    token = null; user = null;
    try { sessionStorage.removeItem('mc_token'); sessionStorage.removeItem('mc_user'); } catch (e) { /* storage can be blocked; the in-memory clear still signs the panel out */ }
    S.sessionEnded = true; S.view = 'dashboard'; S.error = null;
    renderApp();
    throw new Error('session ended');
  };
  const send = (p, opts) => {
    const carried = !!token;
    return fetch(base + p, opts).then((r) => (r.status === 401 && carried ? sessionEnded() : handle(r)));
  };
  const get = (p) => send(p, {headers:headers()}).catch(e => { console.error(e); throw e; });
  const post = (p, b) => send(p, {method:'POST', headers:headers(), body:JSON.stringify(b)});
  const put = (p, b) => send(p, {method:'PUT', headers:headers(), body:JSON.stringify(b)});
  const del = (p) => send(p, {method:'DELETE', headers:headers()});
  return {
    login, get, post, put, del,
    get token(){ return token; },
    get user(){ return user; },
    setAuth(t, u){ token = t; user = u; sessionStorage.setItem('mc_token', t); sessionStorage.setItem('mc_user', JSON.stringify(u)); },
    logout(){ token = null; user = null; sessionStorage.removeItem('mc_token'); sessionStorage.removeItem('mc_user'); }
  };
})();

const S = { view: 'dashboard', loading: false, error: null, views: {} };
const _get = API.get, _post = API.post, _put = API.put, _del = API.del;
API.get = async (p) => _get(p).catch(e => { if (e.message && e.message.indexOf("Upgrade")>=0) showUpgradePrompt(e.message); throw e; });
API.post = async (p, b) => _post(p, b).catch(e => { if (e.message && e.message.indexOf("Upgrade")>=0) showUpgradePrompt(e.message); throw e; });
API.put = async (p, b) => _put(p, b).catch(e => { if (e.message && e.message.indexOf("Upgrade")>=0) showUpgradePrompt(e.message); throw e; });
API.del = async (p) => _del(p).catch(e => { if (e.message && e.message.indexOf("Upgrade")>=0) showUpgradePrompt(e.message); throw e; });

const viewState = (name, defaults = {}) => { if (!S.views[name]) S.views[name] = Object.assign({}, defaults); return S.views[name]; };

// ---- PLATFORM ADMIN SURFACE (kanban t_d11d4157) ----
// ONE definition of platform admin, mirroring the API that actually enforces it
// (src/auth/middleware.rs::is_platform_admin). Until now the panel had no role check at all,
// so a tenant account_owner who logged in here was shown the panel chrome and got 403
// 'Platform admin role required' from every action. The API remains the enforcement point;
// this only stops the panel from pretending. The tenant app is a DIFFERENT ORIGIN, so its
// host cannot be derived from window.location.
const PLATFORM_ADMIN_ROLES = ['admin', 'super_admin', 'agency_admin'];
const TENANT_APP = 'https://app.missedcallrespondr.com';

// Timestamps on this panel arrive from the API as naive-UTC strings (the columns are
// `timestamp without time zone` and the Rust models serialise `NaiveDateTime`, so the JSON has
// no zone suffix). A bare `new Date(v)` parses such a string as LOCAL time, so every render here
// was shifted by the viewer's UTC offset (4 hours in EDT). These three helpers pin the value to
// UTC first; `utcIso` is the mirror used on the WRITE side — the calendar form is labelled
// "(UTC)", so its `datetime-local` value must be stamped as UTC before it is sent, otherwise
// saving an event moved it by the local offset every time.
const utcIso = (v) => {
  const s = String(v == null ? '' : v);
  if (!s) return s;
  return /[zZ]|[+-]\d\d:?\d\d$/.test(s) ? s : s + 'Z';
};
const utcDate = (v) => { if (!v) return '-'; const d = new Date(utcIso(v)); return isNaN(d.getTime()) ? '-' : d.toLocaleDateString(); };
const utcStamp = (v) => { if (!v) return '-'; const d = new Date(utcIso(v)); return isNaN(d.getTime()) ? '-' : d.toISOString().slice(0, 16).replace('T', ' ') + ' UTC'; };
// A count of 1 must not render the plural noun — the same class the customer dashboard's
// plural(value, one, many) helper was added for. Every count this console renders beside a noun
// goes through here.
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

// ---- LOGIN ----
const LoginView = () => {
  // kanban t_02ef49ca — the login draft lives in the SHARED view object (S.views['login_form']),
  // never a per-render local: the Sign In handler itself calls renderApp() (S.loading / S.error),
  // so the old `let email = '', pw = ''` blanked BOTH fields on every attempt.
  const f = viewState('login_form', { email: '', pw: '' });
  const submit = async (e) => { e.preventDefault(); S.loading = true; S.error = null; renderApp();
    try {
      const r = await API.login(f.email, f.pw);
      const u = r.team_member || r.user || null;
      if (!u || PLATFORM_ADMIN_ROLES.indexOf(u.role) < 0) {
        API.logout();
        S.error = 'This is the platform admin panel, and your account is not a platform administrator. Opening your own dashboard ...';
        S.loading = false; renderApp();
        setTimeout(() => { window.location.replace(TENANT_APP + '/dashboard'); }, 1500);
        return;
      }
      API.setAuth(r.token, u); S.sessionEnded = false; f.email = ''; f.pw = ''; S.view = 'dashboard';
    } catch(err) { S.error = err.message; }
    S.loading = false; renderApp();
  };
  return html`<div class="flex items-center justify-center min-h-screen w-full">
    <div class="card w-full max-w-sm mx-4">
      <div class="text-center mb-6">
        <div class="text-3xl mb-2">📞</div>
        <h1 class="text-xl font-bold text-gray-800">MissedCall Respondr</h1>
        <p class="text-sm text-gray-500 mt-1">Auto-Response Platform</p>
      </div>
      <form onSubmit=${submit} class="space-y-4">
        <div><label class="text-sm font-medium text-gray-600 block mb-1">Email</label><input type="email" class="input" value=${f.email} onInput=${e => f.email = e.target.value} placeholder="admin@company.com" required /></div>
        <div><label class="text-sm font-medium text-gray-600 block mb-1">Password</label><input type="password" class="input" value=${f.pw} onInput=${e => f.pw = e.target.value} placeholder="......" required /></div>
        ${S.sessionEnded && html`<div class="text-amber-800 text-sm bg-amber-50 p-2 rounded-lg">Your session ended, so you were signed out. Sign in again to carry on.</div>`}
        ${S.error && html`<div class="text-red-600 text-sm bg-red-50 p-2 rounded-lg">${S.error}</div>`}
        <button type="submit" class="btn w-full">Sign In</button>
        <a href="https://app.missedcallrespondr.com/forgot-password.html" class="block text-center text-sm text-indigo-600 hover:underline mt-3">Forgot password?</a>
      </form>
    </div>
  </div>`;
};

// ---- DASHBOARD ----
// ---- EMAIL BRANDING (per-account identity on transactional email) ----
// The per-account email-branding backend (kanban t_feab8aff) shipped with NO screen in this
// console: GET|PUT /api/v1/settings/branding carry brand_name/brand_color, the logo BYTES go to
// POST|DELETE /api/v1/settings/branding/logo as `multipart/form-data` (field `file`), the fleet-wide
// upload convention, and the public GET /api/v1/branding/logo/:tenant_id streams it back for a mail
// client's <img src>. A backend route with no UI is a defect.
const Branding = () => {
  const st = viewState('branding', { _loaded: false, brand_name: '', brand_color: '#4f46e5', logo_url: '', busy: false, msg: null });
  if (!st._loaded) { st._loaded = true;
    API.get('/settings/branding').then(b => {
      b = b && typeof b === 'object' ? b : {};
      st.brand_name = b.brand_name || ''; st.brand_color = b.brand_color || '#4f46e5'; st.logo_url = b.logo_url || '';
      renderApp();
    }).catch(() => { st._loaded = false; });
  }
  const save = async () => {
    st.busy = true; st.msg = null; renderApp();
    try {
      const r = await API.put('/settings/branding', { brand_name: st.brand_name, brand_color: st.brand_color });
      st.logo_url = (r && r.logo_url) || st.logo_url;
      st.msg = { ok: true, text: 'Email branding saved.' };
    } catch(e) { st.msg = { ok: false, text: e.message }; }
    st.busy = false; renderApp();
  };
  const upload = async (file) => {
    if (file.size > 2 * 1024 * 1024) { st.msg = { ok: false, text: 'That image is larger than 2 MB' }; renderApp(); return; }
    st.busy = true; st.msg = null; renderApp();
    try {
      const fd = new FormData(); fd.append('file', file, file.name || 'logo');
      const r = await fetch(window.location.origin + '/api/v1/settings/branding/logo', {
        method: 'POST',
        headers: API.token ? { 'Authorization': 'Bearer ' + API.token } : {},
        body: fd });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.message || j.error || ('Error ' + r.status));
      st.logo_url = j.logo_url || st.logo_url; st.msg = { ok: true, text: 'Logo uploaded.' };
    } catch(e) { st.msg = { ok: false, text: 'Upload failed: ' + e.message }; }
    st.busy = false; renderApp();
  };
  const removeLogo = async () => {
    if (!confirm('Remove your email logo?')) return;
    st.busy = true; st.msg = null; renderApp();
    try { await API.del('/settings/branding/logo'); st.logo_url = ''; st.msg = { ok: true, text: 'Logo removed.' }; }
    catch(e) { st.msg = { ok: false, text: 'Remove failed: ' + e.message }; }
    st.busy = false; renderApp();
  };
  const branded = !!(st.brand_name || st.logo_url);
  return html`<div>
    <h2 class="text-xl font-bold mb-4">🎨 Email Branding</h2>
    <div class="card">
      <div class="flex items-center gap-3 mb-2">
        <div class="font-semibold">Your branding on transactional email</div>
        <span class="badge ${branded ? 'badge-green' : 'badge-yellow'}">${branded ? 'branded' : 'not branded'}</span>
      </div>
      <p class="text-sm text-gray-500 mb-4">This is what your callers see at the top of the missed-call reply, invite and password emails sent for your account. Leave it empty to send with MissedCall's own identity.</p>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="md:col-span-2 space-y-3">
          <div><label class="text-sm font-medium text-gray-600 block mb-1">Brand display name</label>
            <input class="input" maxlength="60" value=${st.brand_name} placeholder="e.g. Acme Plumbing" onInput=${e => { st.brand_name = e.target.value; }} /></div>
          <div><label class="text-sm font-medium text-gray-600 block mb-1">Brand colour</label>
            <div class="flex items-center gap-2">
              <input type="color" value=${st.brand_color} style="width:44px;height:34px;padding:2px;border:1px solid #cbd5e1;border-radius:8px;background:#fff" onInput=${e => { st.brand_color = e.target.value; }} />
              <input class="input" value=${st.brand_color} placeholder="#4f46e5" onInput=${e => { st.brand_color = e.target.value; }} />
            </div>
            <div class="text-xs text-gray-400 mt-1">A hex colour such as #4f46e5. It draws the rule under your logo.</div></div>
          <div><button class="btn" disabled=${st.busy} onClick=${save}>Save branding</button></div>
        </div>
        <div>
          <label class="text-sm font-medium text-gray-600 block mb-1">Logo</label>
          <div style="border:1px dashed #cbd5e1;border-radius:10px;height:110px;display:flex;align-items:center;justify-content:center;background:#f8fafc;overflow:hidden">
            ${st.logo_url ? html`<img src=${st.logo_url} alt=${st.brand_name || 'Your logo'} style="max-width:100%;max-height:100%" />` : html`<span class="text-xs text-gray-400">No logo yet</span>`}
          </div>
          <input type="file" id="mc-brand-logo-file" accept="image/png,image/jpeg,image/webp,image/gif" style="display:none" onChange=${e => { const f = e.target.files && e.target.files[0]; if (f) upload(f); e.target.value = ''; }} />
          <div class="flex gap-2 mt-2 flex-wrap">
            <button class="btn btn-outline btn-sm" onClick=${() => { const el = document.getElementById('mc-brand-logo-file'); if (el) el.click(); }}>${st.logo_url ? 'Replace logo' : 'Upload logo'}</button>
            ${st.logo_url && html`<button class="btn btn-outline btn-sm" onClick=${removeLogo}>Remove</button>`}
          </div>
          <div class="text-xs text-gray-400 mt-2">PNG, JPEG, WebP or GIF, up to 2 MB.</div>
        </div>
      </div>
      ${st.msg && html`<div class="mt-3 text-sm ${st.msg.ok ? 'text-green-600' : 'text-red-600'}">${st.msg.ok ? 'OK - ' : 'Error - '}${st.msg.text}</div>`}
    </div>
  </div>`;
};

const Dashboard = () => {
  const st = viewState('dashboard', {});
  if (!st._loaded) { st._loaded = true;
    API.get('/dashboard/stats').then(s => { Object.assign(st, s); renderApp(); }).catch(() => {});
  }
  return html`<div>

// ---- RESPONSE RULES ----
// kanban t_31f9cf38 — these rules are EVALUATED now (src/handlers/response_rule_eval.rs): on an
// inbound call the tenant's active rules are walked in priority order and the first match acts. The
// form therefore carries what the call path reads — a trigger, an action with a transport behind it,
// the message text, and the priority. This form used to save `response_type:'sms'` with the CONDITION
// text as the message body (so a rule whose condition was "After hours" would have texted the words
// "After hours"), and it never offered a trigger, a message or a priority at all. `email`/`voice` are
// gone: a call carries no email address and this service has no outbound-call transport.
const RULE_TRIGGERS = [['all_missed_calls', 'All missed calls'], ['specific_numbers', 'Specific numbers'], ['time_of_day', 'Time of day'], ['day_of_week', 'Day of week']];
const RULE_ACTIONS = [['sms', 'SMS — text the caller back'], ['callback', 'Callback — queue a return call']];
const RULE_DAYS = [['mon', 'Mon'], ['tue', 'Tue'], ['wed', 'Wed'], ['thu', 'Thu'], ['fri', 'Fri'], ['sat', 'Sat'], ['sun', 'Sun']];
const ruleLabel = (pairs, v) => { const hit = pairs.find(p => p[0] === v); return hit ? hit[1] : (v || '-'); };
const ruleScheduleOf = (f) => f.trigger === 'specific_numbers'
  ? { numbers: (f.numbers || '').split(/[\n,;]+/).map(s => s.trim()).filter(Boolean) }
  : f.trigger === 'time_of_day'
    ? { window: { start: f.start || '09:00', end: f.end || '17:00' } }
    : f.trigger === 'day_of_week' ? { days: (f.days || []).slice() } : null;
const ResponseRules = () => {
  const st = viewState('rules', { list: [], showModal: false, editItem: null, search: '' });
  const load = async () => { try { const data = await API.get('/response-rules'); st.list = Array.isArray(data) ? data : []; renderApp(); } catch(e) { console.error(e); } };
  if (!st._loaded) { st._loaded = true; load(); }

  const show = (item) => { st.editItem = item; st.formSeeded = false; st.showModal = true; renderApp(); };
  const hide = () => { st.showModal = false; renderApp(); };
  const save = async (data) => {
    try { if(st.editItem) await API.put('/response-rules/' + st.editItem.id, data); else await API.post('/response-rules', data); st.showModal = false; load(); } catch(e){ alert(e.message); }
  };
  const remove = async (id) => { if(!confirm('Delete?')) return; await API.del('/response-rules/' + id); load(); };

  const filtered = st.list.filter(r => !st.search || (r.name||'').toLowerCase().includes(st.search.toLowerCase()));

  return html`<div>
    <div class="flex items-center justify-between mb-4"><h2 class="text-xl font-bold">Response Rules</h2><div class="flex gap-2 items-center"><input class="input" style="width:240px" placeholder="Search..." value=${st.search || ''} onInput=${e => { st.search = e.target.value; renderApp(); }} /><button class="btn btn-sm btn-green" onClick=${() => { show(null); }}>+ Add Rule</button></div></div>
    <p class="text-sm text-gray-500 mb-4">Rules are evaluated on every inbound call, in priority order (lowest number first): the first matching rule acts. A text leaves through Telnyx, so the Telnyx API key and messaging profile must be saved in the Telnyx Config panel first.</p>
    <div class="card p-0 overflow-hidden">
      <table class="table"><thead><tr><th>Name</th><th>Trigger</th><th>Action</th><th>Priority</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody>${filtered.map(r => html`<tr>
          <td class="font-medium">${r.name}</td>
          <td class="text-gray-500">${ruleLabel(RULE_TRIGGERS, r.trigger_condition)}</td>
          <td class="text-gray-500">${ruleLabel(RULE_ACTIONS, r.response_type)}</td>
          <td class="text-gray-500">${r.priority == null ? 100 : r.priority}</td>
          <td><span class="badge ${r.is_active ? 'badge-green' : 'badge-red'}">${r.is_active ? 'Active' : 'Inactive'}</span></td>
          <td><button class="btn btn-sm btn-outline" onClick=${() => { show(r); }}>Edit</button><button class="btn btn-sm btn-red" onClick=${() => remove(r.id)}>Delete</button></td>
        </tr>`)}
        ${filtered.length === 0 && html`<tr><td colspan="6" class="text-center text-gray-400 py-8">No response rules yet.</td></tr>`}
      </tbody></table>
    </div>
    ${st.showModal && html`<div class="modal" onClick=${e => e.target === e.currentTarget && (hide())}>
      <div class="modal-content"><h3 class="text-lg font-bold mb-4">${st.editItem ? 'Edit' : 'Add'} Response Rule</h3>
        ${(() => {
          // kanban t_13330c68 — the draft lives in the SHARED view object (S.views['rules_form']), seeded ON
          // OPEN because show() clears st.formSeeded. The template IIFE re-runs on every renderApp(), so a
          // per-render local re-initialised the field from the stored ROW and wiped what the operator
          // typed (guard rule 4); a re-render can no longer do that.
          const f = viewState('rules_form', { name: '', trigger: 'all_missed_calls', type: 'sms', text: '', numbers: '', start: '09:00', end: '17:00', days: [], priority: 100, active: true });
          if (!st.formSeeded) {
            const row = st.editItem;
            f.name = row?.name||'';
            // A row written before this change could hold a free-text condition or a retired action;
            // seed the picker with the stored value only when it is one the call path reads.
            f.trigger = RULE_TRIGGERS.some(t => t[0] === row?.trigger_condition) ? row.trigger_condition : 'all_missed_calls';
            f.type = RULE_ACTIONS.some(a => a[0] === row?.response_type) ? row.response_type : 'sms';
            f.text = (row?.response_content||{}).text||'';
            f.numbers = ((row?.schedule||{}).numbers||[]).join('\n');
            f.start = ((row?.schedule||{}).window||{}).start||'09:00';
            f.end = ((row?.schedule||{}).window||{}).end||'17:00';
            f.days = ((row?.schedule||{}).days||[]).slice();
            f.priority = row?.priority == null ? 100 : row.priority;
            f.active = row ? row.is_active !== false : true;
            st.formSeeded = true;
          }
          return html`<div class="space-y-3">
            <div><label class="text-sm font-medium block mb-1">Name</label><input class="input" value=${f.name} onInput=${e => { f.name = e.target.value; }} /></div>
            <div><label class="text-sm font-medium block mb-1">Trigger</label><select class="input" value=${f.trigger} onChange=${e => { f.trigger = e.target.value; renderApp(); }}>${RULE_TRIGGERS.map(t => html`<option value=${t[0]}>${t[1]}</option>`)}</select></div>
            ${f.trigger === 'specific_numbers' && html`<div><label class="text-sm font-medium block mb-1">Caller numbers (one per line)</label><textarea class="input" rows="3" value=${f.numbers} onInput=${e => { f.numbers = e.target.value; }} placeholder="+15550101234"></textarea></div>`}
            ${f.trigger === 'time_of_day' && html`<div class="flex gap-2"><div class="flex-1"><label class="text-sm font-medium block mb-1">From</label><input class="input" type="time" value=${f.start} onInput=${e => { f.start = e.target.value; }} /></div><div class="flex-1"><label class="text-sm font-medium block mb-1">To</label><input class="input" type="time" value=${f.end} onInput=${e => { f.end = e.target.value; }} /></div></div>`}
            ${f.trigger === 'day_of_week' && html`<div><label class="text-sm font-medium block mb-1">Days</label><div class="flex flex-wrap gap-3">${RULE_DAYS.map(d => html`<label class="text-sm flex items-center gap-1"><input type="checkbox" checked=${f.days.indexOf(d[0]) >= 0} onChange=${e => { const on = e.target.checked; f.days = on ? f.days.concat([d[0]]) : f.days.filter(x => x !== d[0]); renderApp(); }} />${d[1]}</label>`)}</div></div>`}
            <div><label class="text-sm font-medium block mb-1">Action</label><select class="input" value=${f.type} onChange=${e => { f.type = e.target.value; renderApp(); }}>${RULE_ACTIONS.map(a => html`<option value=${a[0]}>${a[1]}</option>`)}</select></div>
            ${f.type === 'sms' && html`<div><label class="text-sm font-medium block mb-1">Message</label><textarea class="input" rows="3" value=${f.text} onInput=${e => { f.text = e.target.value; }} placeholder="Sorry we missed you! We will call you back shortly."></textarea></div>`}
            <div class="flex gap-3 items-end"><div style="width:140px"><label class="text-sm font-medium block mb-1">Priority</label><input class="input" type="number" min="1" value=${f.priority} onInput=${e => { f.priority = parseInt(e.target.value, 10) || 100; }} /></div><label class="text-sm flex items-center gap-1 mb-2"><input type="checkbox" checked=${f.active} onChange=${e => { f.active = e.target.checked; renderApp(); }} />Enabled</label></div>
            <div class="flex gap-2 justify-end mt-4">
              <button class="btn btn-outline" onClick=${() => { hide(); }}>Cancel</button>
              <button class="btn" onClick=${() => save({ name: f.name, trigger_condition: f.trigger, response_type: f.type, response_content: { text: f.text }, schedule: ruleScheduleOf(f), priority: f.priority, is_active: f.active })}>${st.editItem ? 'Save' : 'Add'}</button>
            </div>
          </div>`; })()}
      </div>
    </div>`}
  </div>`;
};

// ---- EMAIL TEMPLATES (the PLATFORM's mail wording) ----
// GET|POST /api/v1/email-templates and GET|PUT|DELETE /api/v1/email-templates/:id existed with NO
// screen in this console: the operator could restyle the mail (Email Branding) but had no way to
// change a word of it — the welcome and credentials mails were editable only from psql. A backend
// route with no UI is a defect. The rows are platform-global (the handler writes `aid = NULL`, and
// `list` selects the whole table), so this screen is adminOnly and the API family is inside the
// platform-admin surface (src/auth/middleware.rs).
// `template_type` is what the sender looks up: welcome, welcome_credentials and password_reset are
// the three this app's own senders use; the field stays free-text so a new type needs no deploy.
const EMAIL_TEMPLATE_TYPES = ['welcome', 'welcome_credentials', 'password_reset'];
const EmailTemplates = () => {
  const st = viewState('email-templates', { list: null, note: null, showModal: false, editItem: null, busy: false });
  const load = async () => {
    try {
      const d = await API.get('/email-templates');

      st.note = null;
    } catch (e) { st.list = []; st.note = e.message; }

  const show = (item) => { st.editItem = item; st.formSeeded = false; st.showModal = true; renderApp(); };
  const hide = () => { st.showModal = false; renderApp(); };

    st.busy = true; renderApp();
    try {
      if (st.editItem) await API.put('/email-templates/' + st.editItem.id, data);

      st.showModal = false; st.busy = false; load();

    if (!confirm('Delete the template "' + t.name + '"? Mail of that type falls back to the built-in copy.')) return;

        <h2 class="text-xl font-bold">Email Templates</h2>

    <div class="card p-0 overflow-hidden">
      <table class="table"><thead><tr><th>Name</th><th>Type</th><th>Subject</th><th>Default</th><th>Updated</th><th>Actions</th></tr></thead>

          <td class="font-medium">${t.name || '-'}</td>

        ${(st.list || []).length === 0 && html`<tr><td colspan="6" class="text-center text-gray-400" style="padding:28px">No templates yet. Every mail falls back to the app's built-in copy.</td></tr>`}

      <div class="modal-content">
        <h3 class="text-lg font-bold mb-1">${st.editItem ? 'Edit Template' : 'New Template'}</h3>

          <td class="font-medium">${t.name || '-'}</td>

        </tr>`)}

      <div class="modal-content"><h3 class="text-lg font-bold mb-4">${st.editItem ? 'Edit' : 'Add'} Template</h3>
        ${(() => {
          // kanban t_13330c68 — the draft lives in the SHARED view object (S.views['templates_form']), seeded ON
          // OPEN because show() clears st.formSeeded. The template IIFE re-runs on every renderApp(), so a
          // per-render local re-initialised the field from the stored ROW and wiped what the operator
          // typed (guard rule 4); a re-render can no longer do that.
          // kanban t_31f9cf38 — a template is a saved text body and nothing else: `message_templates`
          // has no `type` column, so the Type picker (SMS / Email / Voice) was answered by the API
          // with a silently dropped field and every row painted "sms". Nothing reads a template type —
          // the response rule's own Action chooses the transport.
          const f = viewState('templates_form', { name: '', body: '' });
          if (!st.formSeeded) {
            f.name = st.editItem?.name||'';
            f.body = st.editItem?.body||st.editItem?.content||'';
            st.formSeeded = true;
          }
          return html`<div class="space-y-3">
            <div><label class="text-sm font-medium block mb-1">Name</label><input class="input" value=${f.name} onInput=${e => { f.name = e.target.value; }} /></div>
            <div><label class="text-sm font-medium block mb-1">Message Body</label><textarea class="input" rows="4" value=${f.body} onInput=${e => { f.body = e.target.value; }}></textarea></div>
            <div class="flex gap-2 justify-end mt-4">
              <button class="btn btn-outline" onClick=${() => { hide(); }}>Cancel</button>
              <button class="btn" onClick=${() => save({name: f.name, body: f.body})}>${st.editItem ? 'Save' : 'Add'}</button>
            </div>
          </div>`; })()}
      </div>
    </div>`}
  </div>`;
};

// ---- CONTACTS ----
// Contact CUSTOM FIELDS (2026-10-18 cron). The backend has served these routes since before this
// screen existed — GET|POST /contacts/custom-fields, PUT|DELETE /contacts/custom-fields/:id,
// GET /contacts/:id/fields, PUT /contacts/:id/fields/:field_id — and this console had NO screen
// calling any of them, so an operator could neither define an extra field nor fill one in on a
// contact. David's rule: a backend route with no UI is a DEFECT, not a feature.
const CF_TYPES = [['text','Text'],['textarea','Long text'],['number','Number'],['date','Date']];
const Contacts = () => {
  const st = viewState('contacts', { list: [], search: '', showFields: false, editing: null });
  const cf = viewState('contacts_fields', { list: null, err: null, open: false, busy: false, msg: null, loaded: false });
  const cfForm = viewState('contacts_fields_form', { name: '', type: 'text', required: false, order: 0 });
  // `cf.edit` is the in-place editor's draft (null = no row is being edited). It is the only caller
  // of PUT /contacts/custom-fields/:id, which the API has always served.
  if (cf.edit === undefined) cf.edit = null;
  const cv = viewState('contacts_values', { rows: null, busy: false, msg: null });

  const load = async () => { try { const data = await API.get('/contacts'); st.list = Array.isArray(data) ? data : []; renderApp(); } catch(e) { console.error(e); } };
  const loadFields = async () => {
    try { const d = await API.get('/contacts/custom-fields'); cf.list = Array.isArray(d) ? d : []; cf.err = null; }
    catch (e) { cf.err = e.message || 'Could not list the fields'; }
    cf.loaded = true; renderApp();
  };
  if (!st._loaded) { st._loaded = true; load(); }
  if (!cf.loaded) { loadFields(); }

  const addField = async () => {
    const name = String(cfForm.name || '').trim();
    if (!name) { cf.msg = { ok: false, text: 'Give the field a name first' }; renderApp(); return; }
    cf.busy = true; cf.msg = null; renderApp();
    try {
      await API.post('/contacts/custom-fields', {
        field_name: name,
        field_type: cfForm.type || 'text',
        is_required: !!cfForm.required,
        field_order: parseInt(cfForm.order, 10) || 0
      });
      cfForm.name = ''; cfForm.required = false;
      cf.msg = { ok: true, text: 'Field "' + name + '" added' };
      await loadFields();
    } catch (e) { cf.msg = { ok: false, text: e.message || 'Could not add the field' }; }
    cf.busy = false; renderApp();
  };

  const saveEdit = async (f) => {
    const name = String(cf.edit.name || '').trim();
    if (!name) { cf.msg = { ok: false, text: 'Give the field a name first' }; renderApp(); return; }
    cf.busy = true; cf.msg = null; renderApp();
    try {
      await API.put('/contacts/custom-fields/' + f.id, {
        field_name: name,
        field_type: cf.edit.type || 'text',
        is_required: !!cf.edit.required,
        field_order: parseInt(cf.edit.order, 10) || 0
      });
      cf.edit = null; cf.msg = { ok: true, text: 'Field updated' };
      await loadFields();
    } catch (e) { cf.msg = { ok: false, text: e.message || 'Could not update the field' }; }
    cf.busy = false; renderApp();
  };

  const dropField = async (f) => {
    if (!confirm('Remove the "' + f.field_name + '" field? Every value stored in it is deleted with it.')) return;
    cf.busy = true; cf.msg = null; renderApp();
    try { await API.del('/contacts/custom-fields/' + f.id); cf.msg = { ok: true, text: 'Field removed' }; await loadFields(); }
    catch (e) { cf.msg = { ok: false, text: e.message || 'Could not remove the field' }; }
    cf.busy = false; renderApp();
  };

  // Fill in ONE contact's extra fields: GET /contacts/:id/fields answers the contact WITH its
  // custom_fields (name, type, current value); each box saves through PUT …/fields/:field_id.
  const openFields = async (c) => {
    st.showFields = true; st.editing = c; cv.rows = null; cv.msg = null; renderApp();
    try {
      const d = await API.get('/contacts/' + c.id + '/fields');
      const rows = (d && Array.isArray(d.custom_fields)) ? d.custom_fields : [];
      cv.rows = rows.map(r => ({ field_id: r.field_id, field_name: r.field_name, field_type: r.field_type, value: r.value == null ? '' : String(r.value) }));
    } catch (e) { cv.msg = { ok: false, text: e.message || 'Could not load this contact' }; cv.rows = []; }
    renderApp();
  };

  const saveValues = async () => {
    cv.busy = true; cv.msg = null; renderApp();
    let failed = 0;
    for (const r of (cv.rows || [])) {
      try { await API.put('/contacts/' + st.editing.id + '/fields/' + r.field_id, { value: r.value }); }
      catch (e) { failed++; }
    }
    cv.msg = failed ? { ok: false, text: failed + ' value(s) could not be saved' } : { ok: true, text: 'Saved' };
    cv.busy = false; renderApp();
  };

  const filtered = st.list.filter(c => !st.search || (c.name||'').toLowerCase().includes(st.search.toLowerCase()) || (c.phone||'').toLowerCase().includes(st.search.toLowerCase()) || (c.email||'').toLowerCase().includes(st.search.toLowerCase()));

  return html`<div>
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-xl font-bold">Contacts</h2>
      <div class="flex gap-2 items-center">
        <input class="input" style="width:240px" placeholder="Search..." value=${st.search || ''} onInput=${e => { st.search = e.target.value; renderApp(); }} />
        <button class="btn btn-sm btn-outline" id="cfToggle" data-contacts="fields-toggle" onClick=${() => { cf.open = !cf.open; renderApp(); }}>Custom fields (${cf.list ? cf.list.length : 0})</button>
      </div>
    </div>
    ${cf.open && html`<div class="card mb-4" id="cfCard" data-contacts="fields-card">
      <div class="font-semibold mb-2">Contact custom fields</div>
      <p class="text-xs text-gray-500 mb-3">Extra information your team records on a contact — an account number, a gate code, a date. Each field appears on every contact under “Fields”.</p>
      ${cf.err && html`<div class="text-sm text-red-600 mb-2">${cf.err}</div>`}
      ${(cf.list && cf.list.length) ? html`<table class="table mb-3"><thead><tr><th>Name</th><th>Type</th><th>Required</th><th>Order</th><th></th></tr></thead><tbody>
        ${cf.list.map(f => (cf.edit && cf.edit.id === f.id) ? html`<tr data-contacts="field-row" data-editing="1">
          <td><input class="input" id="cfEditName" data-contacts="edit-name" value=${cf.edit.name} onInput=${e => { cf.edit.name = e.target.value; }} /></td>
          <td><select class="input" id="cfEditType" data-contacts="edit-type" value=${cf.edit.type} onChange=${e => { cf.edit.type = e.target.value; }}>${CF_TYPES.map(t => html`<option value=${t[0]}>${t[1]}</option>`)}</select></td>
          <td><input type="checkbox" checked=${cf.edit.required ? true : false} onChange=${e => { cf.edit.required = e.target.checked; }} /></td>
          <td><input class="input" type="number" value=${cf.edit.order} onInput=${e => { cf.edit.order = e.target.value; }} /></td>
          <td><button class="btn btn-sm" id="cfEditSave" data-contacts="edit-save" disabled=${cf.busy} onClick=${() => saveEdit(f)}>Save</button><button class="btn btn-sm btn-outline" disabled=${cf.busy} onClick=${() => { cf.edit = null; renderApp(); }}>Cancel</button></td></tr>`
        : html`<tr data-contacts="field-row"><td class="font-medium">${f.field_name}</td><td class="text-gray-500">${f.field_type}</td><td>${f.is_required ? 'Yes' : 'No'}</td><td class="text-gray-500">${f.field_order}</td><td><button class="btn btn-sm btn-outline" data-contacts="edit" disabled=${cf.busy} onClick=${() => { cf.edit = { id: f.id, name: f.field_name, type: f.field_type, required: !!f.is_required, order: f.field_order }; cf.msg = null; renderApp(); }}>Edit</button><button class="btn btn-sm btn-red" data-contacts="remove" disabled=${cf.busy} onClick=${() => dropField(f)}>Remove</button></td></tr>`)}</tbody></table>` : html`<p class="text-sm text-gray-500 mb-3">No custom fields yet — add the first one below.</p>`}
      <div class="grid grid-cols-1 md:grid-cols-4 gap-3 items-end">
        <div><label class="text-sm font-medium block mb-1">Field name</label><input class="input" id="cfName" data-contacts="field-name" placeholder="e.g. Account number" value=${cfForm.name} onInput=${e => { cfForm.name = e.target.value; }} /></div>
        <div><label class="text-sm font-medium block mb-1">Type</label><select class="input" id="cfType" data-contacts="field-type" value=${cfForm.type} onChange=${e => { cfForm.type = e.target.value; }}>${CF_TYPES.map(t => html`<option value=${t[0]}>${t[1]}</option>`)}</select></div>
        <div><label class="text-sm font-medium block mb-1">Order</label><input class="input" type="number" value=${cfForm.order} onInput=${e => { cfForm.order = e.target.value; }} /></div>
        <div class="flex items-center gap-3"><label class="text-sm flex items-center gap-1"><input type="checkbox" checked=${cfForm.required ? true : false} onChange=${e => { cfForm.required = e.target.checked; }} /> Required</label><button class="btn btn-sm" id="cfAdd" data-contacts="field-add" disabled=${cf.busy} onClick=${addField}>Add field</button></div>
      </div>
      ${cf.msg && html`<div class="text-sm mt-2 ${cf.msg.ok ? 'text-green-700' : 'text-red-600'}" id="cfMsg" data-contacts="fields-msg">${cf.msg.text}</div>`}
    </div>`}
    <div class="card p-0 overflow-hidden">
      <table class="table"><thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Created</th><th></th></tr></thead>
        <tbody>${filtered.slice(0, 100).map(c => html`<tr>
          <td class="font-medium">${c.name || c.full_name || '-'}</td>
          <td class="text-gray-500">${c.phone || '-'}</td>
          <td class="text-gray-500">${c.email || '-'}</td>
          <td class="text-gray-500 text-sm">${utcDate(c.created_at)}</td>
          <td><button class="btn btn-sm btn-outline" data-contacts="contact-fields" onClick=${() => openFields(c)}>Fields</button></td>
        </tr>`)}
        ${filtered.length === 0 && html`<tr><td colspan="5" class="text-center text-gray-400 py-8">No contacts yet.</td></tr>`}
      </tbody></table>
    </div>
    ${st.showFields && html`<div class="modal" onClick=${e => { if (e.target === e.currentTarget) { st.showFields = false; renderApp(); } }}>
      <div class="modal-content" id="cvCard" data-contacts="values-card"><h3 class="text-lg font-bold mb-1">Fields — ${(st.editing && (st.editing.name || st.editing.phone)) || 'contact'}</h3>
        <p class="text-xs text-gray-500 mb-3">These are the custom fields this workspace defines. Leave one blank to clear it.</p>
        ${cv.rows === null ? html`<p class="text-sm text-gray-500">Loading...</p>`
          : (cv.rows.length === 0 ? html`<p class="text-sm text-gray-500">This workspace has no custom fields yet — add one under “Custom fields”.</p>`
             : html`<div class="space-y-3">${cv.rows.map(r => html`<div><label class="text-sm font-medium block mb-1">${r.field_name}${(r.field_type && r.field_type !== 'text') ? html` <span class="text-xs text-gray-400">(${r.field_type})</span>` : null}</label><input class="input" data-contacts="value" value=${r.value} onInput=${e => { r.value = e.target.value; }} /></div>`)}</div>`)}
        ${cv.msg && html`<div class="text-sm mt-2 ${cv.msg.ok ? 'text-green-700' : 'text-red-600'}" id="cvMsg" data-contacts="values-msg">${cv.msg.text}</div>`}
        <div class="flex gap-2 justify-end mt-4"><button class="btn btn-outline" onClick=${() => { st.showFields = false; renderApp(); }}>Close</button>${(cv.rows && cv.rows.length) ? html`<button class="btn" id="cvSave" data-contacts="values-save" disabled=${cv.busy} onClick=${saveValues}>Save</button>` : null}</div>
      </div>
    </div>`}
  </div>`;
};

const Tickets = () => {

  if (!st._loaded) { st._loaded = true; load(); }
  const show = (item) => { st.editItem = item; st.formSeeded = false; st.showModal = true; renderApp(); };
  const hide = () => { st.showModal = false; renderApp(); };
  const save = async (data) => {
    try { if(st.editItem) await API.put('/tickets/' + st.editItem.id, data); else await API.post('/tickets', data); st.showModal = false; load(); } catch(e){ alert(e.message); }
  };
  const remove = async (id) => { if(!confirm('Delete this ticket?')) return; await API.del('/tickets/' + id); load(); };
  // ── Conversation (2026-10-19) ──────────────────────────────────────────────────────────────────
  // MEASURED before this: the screen could file, re-status and delete a ticket, but it had no reply
  // box and `ticket_messages` was written only by create() — so an operator could not ANSWER the
  // customer at all, and a Plan & Billing request sat in a list saying nothing. The thread is the
  // app's own `GET /tickets/:id` (ticket + messages); the reply is `POST /tickets/:id/messages`
  // with sender_type 'agent', which is also what mails the customer their answer.
  const openThread = async (t) => {
    try {
      const d = await API.get('/tickets/' + t.id);
      st.threadId = t.id; st.thread = d; st.reply = ''; renderApp();
    } catch (e) { alert('Could not open the ticket: ' + e.message); }
  };
  const closeThread = () => { st.threadId = null; st.thread = null; st.reply = ''; renderApp(); };
  const sendReply = async () => {
    const body = (st.reply || '').trim();
    if (!body) { alert('Type your reply first.'); return; }
    if (st.busy) return;
    st.busy = true; renderApp();
    try {
      await API.post('/tickets/' + st.threadId + '/messages', { sender_type: 'agent', body: body });
      st.thread = await API.get('/tickets/' + st.threadId);
      st.reply = ''; st.busy = false; load();
    } catch (e) { st.busy = false; renderApp(); alert('The reply was not saved: ' + e.message); }
  };
  return html`<div>
    <div class="flex items-center justify-between mb-4"><h2 class="text-xl font-bold">Tickets</h2><button class="btn btn-sm btn-green" onClick=${() => { show(null); }}>+ New Ticket</button></div>

        <tbody>${st.list.map(t => html`<tr>
          <td class="font-medium">${t.subject || '-'}</td>
          <td><span class="badge ${t.status==='open'?'badge-yellow':t.status==='resolved'?'badge-green':'badge-blue'}">${t.status || 'open'}</span></td>
          <td class="text-gray-500">${t.priority || 'medium'}</td>
          <td class="text-gray-500 text-sm">${t.created_at ? new Date(t.created_at).toLocaleDateString() : '-'}</td>
          <td><button class="btn btn-sm" onClick=${() => openThread(t)}>Open</button><button class="btn btn-sm btn-outline" onClick=${() => { show(t); }}>Edit</button><button class="btn btn-sm btn-red" onClick=${() => remove(t.id)}>Delete</button></td>
        </tr>`)}
        ${st.list.length === 0 && html`<tr><td colspan="5" class="text-center text-gray-400 py-8">No tickets yet.</td></tr>`}
      </tbody></table>
    </div>
    ${st.threadId && html`<div id="tk-thread" class="card mt-4 p-4">
      <div class="flex items-center justify-between mb-3">
        <h3 class="text-lg font-bold">Conversation${st.thread && st.thread.ticket && st.thread.ticket.subject ? ' · ' + st.thread.ticket.subject : ''}</h3>
        <button class="btn btn-sm btn-outline" onClick=${closeThread}>Close</button>
      </div>
      <div class="space-y-2 mb-3">
        ${((st.thread && st.thread.messages) || []).map(m => html`<div class="p-2 rounded" style="background:#f9fafb">
          <div class="text-xs text-gray-500 mb-1">${m.sender_type === 'customer' ? 'Customer' : 'Your team'} · ${m.created_at ? new Date(m.created_at).toLocaleString() : ''}</div>
          <div style="white-space:pre-wrap">${m.body}</div>
        </div>`)}
        ${((st.thread && st.thread.messages) || []).length === 0 && html`<div class="text-sm text-gray-400">No messages on this ticket yet.</div>`}
      </div>
      <label class="text-sm font-medium block mb-1">Reply to the customer</label>
      <textarea id="tk-reply" class="input" rows="3" value=${st.reply || ''} onInput=${e => { st.reply = e.target.value; }} placeholder="This is emailed to the customer and shown on their dashboard."></textarea>
      <div class="flex justify-end mt-2"><button id="tk-send" class="btn" disabled=${st.busy} onClick=${sendReply}>${st.busy ? 'Sending…' : 'Send reply'}</button></div>
    </div>`}
    ${st.showModal && html`<div class="modal" onClick=${e => e.target === e.currentTarget && (hide())}>
      <div class="modal-content"><h3 class="text-lg font-bold mb-4">${st.editItem ? 'Edit' : 'New'} Ticket</h3>
        ${(() => {

          ${st.expandedLeads.length === 0 ? html`<p class="text-gray-400 text-sm">No leads in this list yet.</p>` : html`<table class="table"><thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Status</th><th>Tags</th></tr></thead><tbody>${st.expandedLeads.map(ld => html`<tr><td class="font-medium">${ld.name||'-'}</td><td class="text-gray-500">${ld.phone||'-'}</td><td class="text-gray-500">${ld.email||'-'}</td><td><span class="badge badge-blue">${ld.status||'new'}</span></td><td class="text-gray-500 text-sm">${(ld.tags||[]).join(', ')||'-'}</td></tr>`)}</tbody></table>`}
        </div></td></tr>`}
        ${st.list.length === 0 && html`<tr><td colspan="4" class="text-center text-gray-400 py-8">No lists yet. Create a campaign to auto-generate its list, or add a standalone list here.</td></tr>`}
      </tbody></table>
    </div>
    ${st.showModal && html`<div class="modal" onClick=${e => e.target === e.currentTarget && (hide())}>
      <div class="modal-content"><h3 class="text-lg font-bold mb-4">${st.editItem ? 'Edit' : 'Add'} List</h3>
        ${(() => {
          // kanban t_13330c68 — the draft lives in the SHARED view object (S.views['lists_form']), seeded ON
          // OPEN because show() clears st.formSeeded. The template IIFE re-runs on every renderApp(), so a
          // per-render local re-initialised the field from the stored ROW and wiped what the operator
          // typed (guard rule 4); a re-render can no longer do that.
          const f = viewState('lists_form', { name: '', description: '' });
          if (!st.formSeeded) {
            f.name = st.editItem?.name||'';
            f.description = st.editItem?.description||'';
            st.formSeeded = true;
          }
          return html`<div class="space-y-3">
            <div><label class="text-sm font-medium block mb-1">Name</label><input class="input" value=${f.name} onInput=${e => { f.name = e.target.value; }} /></div>

          </div>`; })()}

// ---- CORE INTEGRATION ----
const CoreIntegration = () => {
  const st = viewState('core', { status: null, lists: [], listsErr: null, campaigns: [], checked: false, keyIn: '', busy: null, msg: null });
  const load = async () => {
    try { const s = await API.get('/integrations/coreswift/status'); st.status = s; } catch(e) { st.status = { connected: false, error: e.message }; }
    /* kanban cron-20261013: a 400 here is the "not connected" refusal, NOT an empty CoreSwift account.
       The card used to swallow it and print "Connected? No lists found in CoreSwift." on a workspace
       with no key at all — the API's own reason was discarded, which is the false-cause defect the
       Card Analytics / Location Tracking screens were fixed for. Carry the refusal's message through.
       Measured live 2026-10-13 on admin.missedcallrespondr.com: status 200 {connected:false};
       lists 400 {"error":"CoreSwift is not connected — store your csk_ key in the Integration Center first"}. */
    try { const l = await API.get('/integrations/coreswift/lists'); st.lists = (l && l.lists) || (Array.isArray(l) ? l : []); st.listsErr = null; }
    catch(e) { st.lists = []; st.listsErr = (e && e.message) || 'Could not load your CoreSwift lists.'; }
    try { const c = await API.get('/campaigns'); st.campaigns = Array.isArray(c) ? c : []; } catch(e) { console.error(e); }
    st.checked = true; renderApp(); };
  if (!st._loaded) { st._loaded = true; load(); }
  // kanban cron-20261015: this screen told the operator to store the key under "Settings ->
  // Integrations" -- a screen that does not exist in THIS console (the tenant app has one; the
  // admin console's key store is the Operator Console's Provider Keys panel, which is not where a
  // reader of this sentence looks). An instruction that names a screen the reader cannot open is a
  // dead end, so the screen now carries the control itself, on the SAME three routes the tenant
  // Integration Center uses: POST /provider-keys (provider=coreswift), POST
  // /provider-keys/coreswift/test, DELETE /provider-keys/coreswift.
  const connectCore = async () => {
    const k = (st.keyIn || '').trim();
    if (!k) { st.msg = { ok: false, text: 'Paste the CoreSwift key first' }; renderApp(); return; }
    st.busy = 'save'; st.msg = null; renderApp();
    try {
      await API.post('/provider-keys', { provider: 'coreswift', api_key: k });
      st.keyIn = ''; await load();
      // A stored key is not a WORKING key: the status above only says a key exists. Run the same live
      // probe the Test button uses and show its verdict HERE, so a rejected key is reported at connect
      // time instead of leaving a green badge the operator has to take on trust.
      try {
        const r = await API.post('/provider-keys/coreswift/test', {});
        st.msg = (r && r.ok)
          ? { ok: true,  text: 'Key saved and CoreSwift accepted it.' }
          : { ok: false, text: 'Key saved, but CoreSwift refused it: ' + ((r && r.message) || 'no detail') };
      } catch (e) { st.msg = { ok: false, text: 'Key saved, but the live test failed: ' + ((e && e.message) || 'unknown error') }; }
    } catch (e) { st.msg = { ok: false, text: 'Could not connect: ' + ((e && e.message) || 'unknown error') }; }
    st.busy = null; renderApp();
  };
  const testCore = async () => {
    st.busy = 'test'; st.msg = null; renderApp();
    try {
      const r = await API.post('/provider-keys/coreswift/test', {});
      st.msg = { ok: !!(r && r.ok), text: (r && r.message) || 'No live connection test available for this provider yet' };
    } catch (e) { st.msg = { ok: false, text: 'Test failed: ' + ((e && e.message) || 'unknown error') }; }
    st.busy = null; renderApp();
  };
  const disconnectCore = async () => {
    if (!confirm('Disconnect CoreSwift? Leads stop pushing until a key is stored again.')) return;
    st.busy = 'del'; st.msg = null; renderApp();
    try {
      await API.del('/provider-keys/coreswift');
      st.msg = { ok: true, text: 'CoreSwift disconnected.' }; await load();
    } catch (e) { st.msg = { ok: false, text: 'Could not disconnect: ' + ((e && e.message) || 'unknown error') }; }
    st.busy = null; renderApp();
  };
  return html`<div>
    <h2 class="text-xl font-bold mb-4">CoreSwift Integration</h2>
    ${!st.checked ? html`<p class="text-gray-500 text-sm">Checking...</p>` : html`
    <div class="card mb-4">
      <h3 class="font-semibold mb-2">Connection Status</h3>
      ${st.status && st.status.connected
        ? html`<span class="badge badge-green">✅ Connected</span><p class="text-sm text-gray-500 mt-2">CoreSwift is connected via your personal API key. Leads pushed to CoreSwift land in your account's contact pool / linked campaign lists.</p>
        ${st.status.base_url ? html`<p class="text-xs text-gray-400 mt-1">→ ${st.status.base_url}</p>` : ''}
        <div class="flex gap-2 mt-3">
          <button class="btn btn-sm btn-outline" disabled=${st.busy === 'test'} onClick=${testCore}>Test connection</button>
          <button class="btn btn-sm btn-red" disabled=${st.busy === 'del'} onClick=${disconnectCore}>Disconnect</button>
        </div>`
        : html`<span class="badge badge-red">⚠️ Not connected</span><p class="text-sm text-gray-500 mt-2">Paste your CoreSwift API key (<code>csk_...</code>) below. It is stored against this workspace only, and the leads this workspace captures push through it.</p>
        <div class="space-y-2 mt-3" style="max-width:520px">
          <input class="input" id="core-key-input" type="password" placeholder="csk_..." value=${st.keyIn} onInput=${e => { st.keyIn = e.target.value; }} />
          <div class="flex gap-2">
            <button class="btn btn-sm" id="core-connect-btn" disabled=${st.busy === 'save'} onClick=${connectCore}>${st.busy === 'save' ? 'Connecting...' : 'Connect CoreSwift'}</button>
            <button class="btn btn-sm btn-outline" disabled=${st.busy === 'test'} onClick=${testCore}>Test connection</button>
          </div>
        </div>`}
      ${st.msg ? html`<p class="text-xs mt-2 ${st.msg.ok ? 'text-green-700' : 'text-amber-700'}">${st.msg.text}</p>` : ''}
    </div>
    <div class="card mb-4">
      <h3 class="font-semibold mb-2">Your CoreSwift Lists</h3>
      ${st.listsErr ? html`<p class="text-gray-500 text-sm">${st.listsErr}</p>`
        : st.lists.length === 0 ? html`<p class="text-gray-400 text-sm">Connected, but this CoreSwift account has no lists yet.</p>`
        : html`<table class="table"><thead><tr><th>Name</th><th>ID</th></tr></thead><tbody>${st.lists.map(l => html`<tr><td class="font-medium">${l.name||l.title||'-'}</td><td class="text-gray-500">${l.id||'-'}</td></tr>`)}</tbody></table>`}
    </div>
    <div class="card">
      <h3 class="font-semibold mb-2">Campaign → CoreSwift List</h3>
      <p class="text-sm text-gray-500 mb-2">Leads that carry a campaign's linked tag are pushed to that campaign's own list (via CoreSwift contact sync) and appear under the campaign's list view.</p>
      <table class="table"><thead><tr><th>Campaign</th><th>Linked Tag</th><th>Auto list</th></tr></thead><tbody>${st.campaigns.map(c => html`<tr><td class="font-medium">${c.name||'-'}</td><td class="text-gray-500">${(c.metadata&&c.metadata.coreswift&&c.metadata.coreswift.tag_id)||'-'}</td><td class="text-gray-500">${c.name||'-'}</td></tr>`)}${st.campaigns.length===0&&html`<tr><td colspan="3" class="text-center text-gray-400 py-6">No campaigns yet.</td></tr>`}</tbody></table>
    </div>`}
  </div>`;
};

// Pure payload builder for an Ops action. Extracted to module scope so the SHIPPED bytes can be
// exercised in node (see /opt/swift/scripts/mcr-ops-bool-test.js) instead of eyeballed.
//
// `act.booleans` lists fields rendered as checkboxes whose value must reach the API as a real
// JSON boolean. It exists because `email_templates.is_default` is a bool column: sending the
// string "true" is a serde type error, which `Json` surfaces as a text/plain 422 the admin SPA
// cannot read at all (card t_95721228) — i.e. the field would be a silent no-op in the UI.
// `act.numeric` (pre-existing) is the same idea for numbers.
const buildOpsBody = (act, v, path) => {
  if (act.json) return JSON.parse((v.json || '{}').trim() || '{}');
  if (act.method === 'GET' || act.method === 'DELETE') return undefined;
  const body = {};
  (act.fields || []).forEach(f => {
    // Skip path parameters by looking at the TEMPLATE (`/email-templates/:id`), not the resolved
    // path: the original code checked the resolved path, where `:id` has already been replaced,
    // so the check never fired and the path param was sent in the body as well. Harmless for a
    // handler that ignores unknown keys, but it means `{:id, is_default}` actions carried a
    // stray `id` string — the field belongs in the path only.
    if (act.path.indexOf(':' + f) >= 0) return;
    if ((act.booleans || []).indexOf(f) >= 0) { body[f] = v[f] === true; return; }
    const s = (v[f] || '').trim();
    if (s === '') return;
    body[f] = (act.numeric || []).indexOf(f) >= 0 ? Number(s) : s;
  });
  return body;
};

// Resolve an action's path: every `:field` placeholder is filled from that field's value.
// Also module scope, and for the same reason as `buildOpsBody` above.
const opsActionPath = (act, v) => {
  let path = act.path;
  (act.fields || []).forEach(f => { if (path.indexOf(':' + f) >= 0) path = path.replace(':' + f, encodeURIComponent(String(v[f] == null ? '' : v[f]).trim())); });
  return path;
};

const OpsAction = ({ act }) => {
  // `act.checked` = boolean fields that start ticked. For "Create template" that means the
  // common case (an admin creating a template for a type expects the sender to USE it) works
  // without the admin having to know about is_default; untick it to stage a second template.
  const [v, setV] = useState(() => { const i = {}; (act.checked || []).forEach(f => { i[f] = true; }); return i; });
  const [res, setRes] = useState(null);
  const [busy, setBusy] = useState(false);
  const go = async () => {
    setBusy(true); setRes(null);
    try {
      const path = opsActionPath(act, v);
      if (path.indexOf(':') >= 0) throw new Error('missing path parameter: ' + path);
      const body = buildOpsBody(act, v, path);
      const r = act.method === 'GET' ? await OPSAPI.get(path)
        : act.method === 'POST' ? await OPSAPI.post(path, body || {})
        : act.method === 'PUT' ? await OPSAPI.put(path, body || {})
        : await OPSAPI.del(path);
      setRes({ ok: true, text: JSON.stringify(r, null, 1).slice(0, 3000) });
    } catch (e) { setRes({ ok: false, text: String((e && e.message) || e) }); }
    setBusy(false);
  };
  return html`<div class="ops-action border rounded-lg p-2 mb-2 bg-gray-50">
    <div class="flex flex-wrap gap-2 items-end">
      ${(act.fields || []).map(f => (act.booleans || []).indexOf(f) >= 0
        ? html`<label class="text-xs text-gray-600 flex flex-col">
        <span>${f}${(act.hints || {})[f] ? html` <span class="text-gray-400">— ${act.hints[f]}</span>` : ''}</span>
        <input type="checkbox" class="border rounded px-2 py-1 ops-f-${f}" checked=${v[f] === true}
          onChange=${e => setV(s => Object.assign({}, s, { [f]: e.target.checked }))} />
      </label>`
        : html`<label class="text-xs text-gray-600 flex flex-col">
        <span>${f}</span>
        <input class="border rounded px-2 py-1 text-sm ops-f-${f}" style=${f === 'json' ? 'min-width:420px;font-family:monospace' : ''}
          value=${v[f] || ''} onInput=${e => setV(s => Object.assign({}, s, { [f]: e.target.value }))} />
      </label>`)}
      <button class="px-3 py-1 rounded bg-indigo-600 text-white text-sm disabled:opacity-50" disabled=${busy} onClick=${go}>
        ${busy ? '...' : (act.label || act.method)}</button>
      ${res && html`<span class="text-xs ${res.ok ? 'text-green-700' : 'text-red-600'}">${res.ok ? 'OK' : 'ERROR'}</span>`}
    </div>
    <div class="text-xs text-gray-500 mt-1"><code>${act.method} /api/v1${act.path}</code></div>
    ${res && html`<pre class="text-xs bg-white border rounded p-2 mt-1 overflow-auto" style="max-height:200px">${res.text}</pre>`}
  </div>`;
};

const OpsList = ({ path }) => {
  const [data, setData] = useState(null);
  const [err, setErr] = useState(null);
  const [busy, setBusy] = useState(false);
  const load = async () => {
    setBusy(true); setErr(null);
    try { setData(await OPSAPI.get(path)); } catch (e) { setErr(String((e && e.message) || e)); }
    setBusy(false);
  };
  useEffect(() => { load(); }, []);
  let rows = null;
  if (Array.isArray(data)) rows = data;
  else if (data && typeof data === 'object') {
    const k = Object.keys(data).find(kk => Array.isArray(data[kk]));
    if (k) rows = data[k];
  }
  let body;
  if (err) body = html`<div class="text-xs text-red-600">${err}</div>`;
  else if (!data) body = html`<div class="text-xs text-gray-400">loading...</div>`;
  else if (rows) {
    const cols = Array.from(rows.slice(0, 5).reduce((a, r) => { if (r && typeof r === 'object') Object.keys(r).forEach(k => a.add(k)); return a; }, new Set())).slice(0, 12);
    body = html`<div class="text-xs text-gray-500 mb-1">${rows.length} row(s)</div>
      <div class="overflow-auto" style="max-height:260px"><table class="ops-table text-xs w-full border-collapse">
        <thead><tr>${cols.map(c => html`<th class="text-left border-b px-2 py-1 bg-gray-100">${c}</th>`)}</tr></thead>
        <tbody>${rows.slice(0, 50).map(r => html`<tr>${cols.map(c => html`<td class="border-b px-2 py-1 align-top">${r && r[c] != null ? String(typeof r[c] === 'object' ? JSON.stringify(r[c]) : r[c]).slice(0, 80) : ''}</td>`)}</tr>`)}</tbody>
      </table></div>`;
  } else {
    body = html`<pre class="text-xs bg-white border rounded p-2 overflow-auto" style="max-height:200px">${JSON.stringify(data, null, 1).slice(0, 3000)}</pre>`;
  }
  return html`<div class="ops-list mb-2">
    <div class="flex items-center gap-2 mb-1">
      <code class="text-xs text-gray-500">GET /api/v1${path}</code>
      <button class="px-2 py-0.5 rounded border text-xs" disabled=${busy} onClick=${load}>${busy ? '...' : 'reload'}</button>
    </div>${body}</div>`;
};

const OpsPanel = ({ panel }) => {
  const [open, setOpen] = useState(false);
  return html`<div class="ops-panel bg-white border rounded-xl mb-3">
    <div class="flex items-center justify-between px-4 py-2 cursor-pointer" onClick=${() => setOpen(o => !o)}>
      <span class="font-semibold text-gray-800 text-sm">${panel.title}</span>
      <span class="text-xs text-gray-400">${plural((panel.actions || []).length,'control','controls')} ${open ? '\u2212' : '+'}</span>
    </div>
    ${open && html`<div class="px-4 pb-3 border-t pt-3">
      ${panel.note && html`<p class="text-xs text-amber-700 mb-2">${panel.note}</p>`}
      ${panel.list && html`<${OpsList} path=${panel.list} />`}
      ${(panel.actions || []).map(a => html`<${OpsAction} act=${a} />`)}
    </div>`}
  </div>`;
};

/* Owner cell for a workspace row (kanban t_81a1ba13). The list endpoint answers `owner_email`:
   the workspace's own user, preferring its owner-ish role. A reserved-domain address
   (.invalid/.example/.test/.local) can never belong to a customer, so it is badged as a probe —
   that is what keeps a leftover probe workspace from reading like a paying one at a glance. */
// A workspace address that no customer can hold -- the fleet's probe badge. THREE arms, because a
// workspace can be a probe for three different reasons and only two of them leave an address behind:
//  * `probe_harness` -- the marker the signup door stamps from the `X-Swift-Harness` HEADER. It is
//    the ONLY arm that survives a deleted user row, where there is no address left to read.
//  * the reserved TLDs (RFC 2606/6761: .invalid/.example/.test/.local, plus example.com/.net/.org).
//  * the fleet's OWN machine-minted probe domains, which are not reserved TLDs and so were invisible
//    to the address arm alone: the nightly tenancy canary keys its fixtures at
//    `probe-canary-a@swiftsoftware.dev`, so the two `Tenancy Canary A/B` workspaces sat in the
//    operator's own Tenants list looking like unrecognised signups.
//  * kanban t_56ad38a1: `maxxspace.com` joins this arm for the same reason. It is the fleet's
//    mail.tm probe inbox and the tag-provision probe DOES mint account owners there
//    (`probe-arm…@maxxspace.com`, measured live in ADASwift and WorkflowSwift 2026-10-16), so a
//    workspace minted that way would otherwise read as a customer in this list. IncentiveSwift
//    already carried the arm; this console did not.
// `swiftsoftware.com` is deliberately NOT here: it is a real, routable domain and the operator's own.
// Definition ported verbatim from the fleet standard (FunnelSwift www-admin/index.html).
const RESERVED_ADDR_RE = /@(?:[^@]*\.)?(?:invalid|example|test|local)$|@(?:[^@]*\.)?example\.(?:com|net|org)$/i;
const FLEET_PROBE_ADDR_RE = /@(?:[^@]*\.)?(?:swiftsoftware\.(?:dev|local)|sw\.dev|maxxspace\.com)$|@local\.(?:funnelswift|coreswift|adaswift|incentiveswift|workflowswift|missedcallrespondr|multidirectory)$/i;
function isProbeAddress(addr) {
  const a = String(addr || '');
  return RESERVED_ADDR_RE.test(a) || FLEET_PROBE_ADDR_RE.test(a);
}
const ownerCell = (t) => {
  const oe = String((t && (t.owner_email || t.email)) || '').trim();
  const tag = String((t && t.probe_harness) || '').trim();
  const probe = Boolean(tag) || isProbeAddress(oe);
  // The tooltip names the harness the COLUMN recorded (fleet shape, kanban t_c13803ad): the column
  // is authoritative and the address arms are only the fallback for rows minted before it existed.
  const badge = probe
    ? html` <span class="badge badge-yellow" title=${tag
        ? 'minted by the "' + tag + '" test harness — a probe, not a customer'
        : 'a reserved or fleet-probe address — a probe, not a customer'}>probe</span>`
    : '';
  if (!oe) return html`<span class="text-gray-400">—</span>${badge}`;
  return html`<span class="text-gray-500">${oe}</span>${badge}`;
};

/* ===== 🔑 IMPERSONATE A TENANT (kanban t_25b8c662) =====
   The working operator control for `POST /admin/impersonate`, on the only surface that can name a
   tenant: `GET /admin/tenants` returns EVERY tenant (admin_handler::list_all_tenants), while
   `GET /portfolio-companies` is caller-scoped to the admin's own tenant. The Portfolio tab used to
   carry a per-row Impersonate button that this replaces; its four measured defects are documented
   above that function. Hand-off: the token travels in the URL FRAGMENT -- a fragment is never sent
   to the server, so it cannot reach nginx's access log or a Referer, and the tenant shell stores it
   and strips it on arrival (skill: session-credential-out-of-url-and-logs). */
const ImpersonateTenants = () => {
  const st = viewState('impersonate', { list: null, err: null, busy: null, msg: null, ok: true });
  const load = async () => {
    try {
      const d = await API.get('/admin/tenants');
      st.list = Array.isArray(d) ? d : ((d && d.tenants) || []);
      st.err = null;
    } catch (e) { st.err = e.message; st.list = null; }
    st.busy = null; renderApp();
  };
  const reload = async () => { st.busy = 'list'; renderApp(); await load(); };
  if (!st._loaded) { st._loaded = true; load(); }
  const go = async (t) => {
    const name = t.name || t.slug || t.id;
    if (!confirm('Sign in as "' + name + '"?\n\nYou will land in the customer app as that tenant for 15 minutes.')) return;
    st.busy = t.id; st.msg = null; st.ok = true; renderApp();
    try {
      const r = await API.post('/admin/impersonate', { tenant_id: t.id });
      const tok = r && (r.impersonation_token || r.token);
      if (!tok) throw new Error('the API answered without an impersonation_token');
      window.open(TENANT_APP + '/dashboard/#impersonation_token=' + encodeURIComponent(tok)
        + '&impersonation_tenant=' + encodeURIComponent(name), '_blank', 'noopener');
      st.msg = 'Opened ' + name + ' in a new tab. That tab is the customer session; this panel is untouched.';
    } catch (e) { st.ok = false; st.msg = 'Impersonation failed: ' + e.message; }
    st.busy = null; renderApp();
  };
  return html`<div class="card mb-3" data-impersonate="tenant">
    <div class="flex items-center justify-between mb-1">
      <h2 class="text-base font-bold text-gray-800">🔑 Impersonate a tenant</h2>
      <button class="btn btn-sm btn-outline" disabled=${st.busy === 'list'} onClick=${reload}>${st.busy === 'list' ? '...' : 'reload'}</button>
    </div>
    <p class="text-xs text-gray-500 mb-2">Opens ${TENANT_APP} signed in as the tenant you pick. 15-minute token; your operator session on this panel is not affected.</p>
    ${st.msg && html`<div class="text-sm mb-2 ${st.ok ? 'text-green-700' : 'text-red-600'}">${st.msg}</div>`}
    ${st.err && html`<div class="text-sm text-red-600 mb-2">Could not list tenants: ${st.err}</div>`}
    ${Array.isArray(st.list) ? html`<div class="overflow-auto" style="max-height:300px"><table class="table">
      <thead><tr><th>Tenant</th><th>Owner</th><th>Slug</th><th>Users</th><th>Plan</th><th></th></tr></thead>
      <tbody>${st.list.map(t => html`<tr>
        <td class="font-medium">${t.name || '-'}</td><td>${ownerCell(t)}</td><td class="text-gray-500">${t.slug || '-'}</td>
        <td>${t.user_count == null ? '-' : t.user_count}</td><td class="text-gray-500">${t.plan_name || '—'}</td>
        <td><button class="btn btn-sm btn-blue" disabled=${st.busy === t.id} onClick=${() => go(t)}>${st.busy === t.id ? '...' : '🔑 Impersonate'}</button></td>
      </tr>`)}</tbody></table></div>`
      : (st.err ? '' : html`<div class="text-xs text-gray-400">loading tenants...</div>`)}
  </div>`;
};

/* ===== 🗂️ TENANTS — every workspace, with the bulk retire control (kanban t_31951eca) =====
   The platform-wide list is the same gated read the plan pickers already use
   (GET /admin/tenants → admin_handler::list_all_tenants; note the API answers {tenants:[…]}, not a
   bare array). Selection is a per-row checkbox plus a select-all header, and the ONE write is
   POST /admin/tenants/bulk-delete, which answers PER ID: a row the backend refuses (the workspace you
   are signed in as, a portfolio company) keeps its reason on screen instead of vanishing behind a
   generic failure. The button is inert until a row is picked and is armed with the count. */
const TenantsScreen = () => {
  const st = viewState('tenants', { list: null, err: null, picked: {}, busy: null, msg: null, ok: true });
  const load = async () => {
    try {
      const d = await API.get('/admin/tenants');
      st.list = Array.isArray(d) ? d : ((d && d.tenants) || []);
      st.err = null;
    } catch (e) { st.err = e.message; st.list = null; }
    st.busy = null; renderApp();
  };
  const reload = async () => { st.busy = 'list'; st.picked = {}; st.msg = null; renderApp(); await load(); };
  if (!st._loaded) { st._loaded = true; load(); }

  const list = Array.isArray(st.list) ? st.list : [];
  const picked = list.filter(t => st.picked[t.id]);
  // Rows this install itself minted from a fleet harness (`probe_harness`, recorded from the
  // X-Swift-Harness header). The API has returned this since migration 000038, but the table never
  // showed it — so a leftover probe workspace read exactly like a customer's and clearing them out
  // meant guessing from the owner's domain. The badge and the picker below are the surface.
  const probes = list.filter(t => !!t.probe_harness);
  const allPicked = list.length > 0 && picked.length === list.length;
  const pickProbes = () => { st.picked = {}; probes.forEach(t => { st.picked[t.id] = true; }); renderApp(); };
  const toggle = (id, on) => { if (on) st.picked[id] = true; else delete st.picked[id]; renderApp(); };
  const toggleAll = (on) => { st.picked = {}; if (on) list.forEach(t => { st.picked[t.id] = true; }); renderApp(); };
  const del = async () => {
    const ids = list.filter(t => st.picked[t.id]).map(t => t.id);
    if (!ids.length) return;
    if (!confirm('Delete ' + ids.length + ' workspace(s)? This cannot be undone.')) return;
    st.busy = 'del'; st.msg = null; st.ok = true; renderApp();
    try {
      const r = await API.post('/admin/tenants/bulk-delete', { ids });
      const n = (r && typeof r.deleted === 'number') ? r.deleted : 0;
      const refused = (r && r.failed) || [];
      st.ok = refused.length === 0;
      st.msg = n + ' workspace(s) deleted'
        + (refused.length ? ' — ' + refused.length + ' refused: ' + refused.map(f => f.error).join('; ') : '');
      st.picked = {};
    } catch (e) { st.ok = false; st.msg = 'Delete failed: ' + e.message; }
    st.busy = null;
    await load();
  };

  return html`<div class="card" data-tenants="screen">
    <div class="flex items-center justify-between mb-1">
      <h2 class="text-base font-bold text-gray-800">🗂️ Tenants</h2>
      <div class="flex items-center gap-2">
        <button class="btn btn-sm btn-outline" data-tenants="select-probes" disabled=${probes.length === 0 ? true : false} onClick=${pickProbes}>Select probes (${probes.length})</button>
        <button class="btn btn-sm btn-outline" disabled=${st.busy === 'list'} onClick=${reload}>${st.busy === 'list' ? '...' : 'reload'}</button>
        <button class="btn btn-sm btn-red" id="tnDel" data-tenants="delete" disabled=${(picked.length === 0 || st.busy === 'del') ? true : false} onClick=${del}>${picked.length ? 'Delete selected (' + picked.length + ')' : 'Delete selected'}</button>
      </div>
    </div>
    <p class="text-xs text-gray-500 mb-2">Every workspace on the platform. Tick the rows to retire, then delete them in one call. The workspace you are signed in as and the portfolio companies are refused by the API. A workspace a probe run minted carries a <span class="badge badge-yellow">probe</span> badge — "Select probes" ticks exactly those, so clearing test workspaces out does not mean guessing from the owner's address.</p>
    ${st.msg && html`<div class="text-sm mb-2 ${st.ok ? 'text-green-700' : 'text-red-600'}" data-tenants="status">${st.msg}</div>`}
    ${st.err && html`<div class="text-sm text-red-600 mb-2" data-tenants="status">Could not list tenants: ${st.err}</div>`}
    ${Array.isArray(st.list) ? html`<div class="overflow-auto" style="max-height:520px"><table class="table" id="tenantsTable" data-tenants="table">
      <thead><tr>
        <th style="width:36px"><input type="checkbox" id="tnAll" data-tenants="select-all" checked=${allPicked ? true : false} onChange=${e => toggleAll(e.target.checked)} /></th>
        <th>Workspace</th><th>Owner</th><th>Slug</th><th>Users</th><th>Plan</th><th>Created</th>
      </tr></thead>
      <tbody>${list.map(t => html`<tr>
        <td><input type="checkbox" class="tn-chk" value=${t.id || ''} checked=${st.picked[t.id] ? true : false} onChange=${e => toggle(t.id, e.target.checked)} /></td>
        <td class="font-medium">${t.name || '-'}${t.probe_harness ? html`<span class="badge badge-yellow ml-1" data-tenants="probe-badge" title=${'minted by a probe run: ' + t.probe_harness}>probe</span>` : null}</td>
        <td>${ownerCell(t)}</td>
        <td class="text-gray-500">${t.slug || '-'}</td>
        <td>${t.user_count == null ? '-' : t.user_count}</td>
        <td class="text-gray-500">${t.plan_name || '—'}</td>
        <td class="text-gray-500 text-xs">${t.created_at ? String(t.created_at).slice(0, 10) : '-'}</td>
      </tr>`)}</tbody></table></div>`
      : (st.err ? '' : html`<div class="text-xs text-gray-400">loading tenants...</div>`)}
  </div>`;
};

// ── EMAIL PROVIDER (system mail) ─────────────────────────────────────────────────────────────────
// The backend serves GET/PUT /api/v1/admin/email-config (provider + sealed credential + `last_send`)
// and POST /admin/email-config/test, and the only screen that reached them was the Operator Console's
// raw JSON catalogue — so an operator could save credentials and never see whether a customer's mail
// actually left, and a "Send test email" press recorded nothing at all. A backend route with no UI is
// a defect: this is the screen.
const EmailProviderScreen = () => {
  const st = viewState('email_provider', { _loaded: false, prov: [], provider: 'mailgun', api_url: '', api_key: '', domain: '', from_address: '', from_name: '', configured: false, source: 'none', stored: false, sealed: false, credential_present: false, last: null, sends: [], to: '', busy: false, msg: null });
  const isAdmin = !!(API.user && API.user.role && PLATFORM_ADMIN_ROLES.indexOf(API.user.role) >= 0);
  const load = async () => {
    try {
      const r = await API.get('/admin/email-config');
      const c = (r && r.config) || {};
      st.prov = (r && r.providers) || [];
      st.provider = c.provider || st.provider;
      st.api_url = c.api_url || ''; st.api_key = c.api_key || ''; st.domain = c.domain || '';
      st.from_address = c.from_address || c.from_email || ''; st.from_name = c.from_name || '';
      st.configured = !!(r && r.configured); st.source = (r && r.source) || 'none';
      st.stored = !!(r && r.stored); st.last = (r && r.last_send) || null;
      // At-rest posture of the stored credential (the rule the CoreSwift panel set, kanban t_d1fcda7e):
      // the API reports whether the database holds the saved key encrypted, so this screen states the
      // fact instead of asserting "credentials are stored sealed" whether or not that is true.
      st.sealed = !!(r && r.sealed); st.credential_present = !!(r && r.credential_present);
      st.msg = null;
    } catch (e) { st.msg = { ok: false, text: (e && e.message) || 'Could not read the email config' }; }
    // The send HISTORY behind `last_send` (GET /admin/email-log, migration 000040). Read in its own
    // try so a history failure cannot make the config screen report "could not read the email
    // config" — the two are different surfaces.
    try {
      const lg = await API.get('/admin/email-log');
      st.sends = (lg && lg.sends) || [];
    } catch (e) { st.sends = st.sends || []; }
    renderApp();
  };
  if (!st._loaded && isAdmin) { st._loaded = true; load(); }
  const save = async () => {
    st.busy = true; st.msg = null; renderApp();
    try {
      await API.put('/admin/email-config', { provider: st.provider, api_url: st.api_url, api_key: st.api_key, domain: st.domain, from_address: st.from_address, from_name: st.from_name });
      await load(); st.msg = { ok: true, text: 'Email provider saved.' };
    } catch (e) { st.msg = { ok: false, text: 'Save failed: ' + ((e && e.message) || 'unknown error') }; }

  return html`<div data-email-provider="screen">

      ${st.credential_present && !st.sealed ? html`<div class="text-xs text-red-600 mb-3" data-email-provider="sealed-hint">The saved key is readable in the database as it stands. Restart the app (or save the key again from this panel) and it is encrypted at rest.</div>` : null}

        <div><label class="text-sm font-medium text-gray-600 block mb-1">API key</label>

      </div>
      ${st.msg && html`<div class="mt-3 text-sm ${st.msg.ok ? 'text-green-700' : 'text-red-600'}" data-email-provider="status">${st.msg.ok ? 'OK - ' : 'Error - '}${st.msg.text}</div>`}

      ${(st.sends && st.sends.length) ? html`<div class="overflow-x-auto"><table class="w-full text-sm" id="email-send-history-table">
        <thead><tr class="text-left text-xs text-gray-500"><th class="py-1 pr-3">When</th><th class="py-1 pr-3">To</th><th class="py-1 pr-3">What</th><th class="py-1 pr-3">Result</th><th class="py-1">Detail</th></tr></thead>
        <tbody>${st.sends.map(s => {
          const lbl = s.status === 'sent' ? '\u2705 sent' : (s.status === 'withheld' ? '\u26d4 withheld' : '\u274c failed');
          const cls = s.status === 'sent' ? 'text-green-700' : 'text-red-600';
          return html`<tr class="border-t border-gray-100" data-send-status=${s.status}>
            <td class="py-1 pr-3 text-xs text-gray-500 whitespace-nowrap">${utcStamp(s.at)}</td>
            <td class="py-1 pr-3 text-xs">${s.to || '-'}</td>
            <td class="py-1 pr-3 text-xs">${s.template || '-'}</td>
            <td class="py-1 pr-3 text-xs ${cls} whitespace-nowrap">${lbl}</td>
            <td class="py-1 text-xs text-gray-500">${(s.detail || '').slice(0, 160)}</td>
          </tr>`;
        })}</tbody></table></div>`
      : html`<div class="text-sm text-gray-400" id="email-send-history-empty">No sends recorded yet — press "Send test email" to record one.</div>`}

};
