  const SiteConfig = () => {
  // kanban t_2f99528b — this tab used to read its state out of `S.__sc_data`, guarded by
  // `S.useState ? … : [null, null]`, and NOTHING ever sets `S.useState`: the guard was always false,
  // so `data` was hard-coded null and the tab rendered "Loading..." forever. Its fields never
  // appeared, which is why "the panel's Site Settings save" had never been exercised through the UI.
  // The neighbouring components (Line 1368) use preact's own state; this one does the same.
  const [data, setData] = useState(null);
  const [err, setErr] = useState(null);
  useEffect(() => { API.get('/admin/site').then(setData).catch(e => { console.error(e); setErr(e); }); }, []);
  if (err) return html`<div class="card"><h2 class="text-xl font-bold mb-4">Site Configuration</h2><p class="text-red-500">Not available: ${String((err && err.message) || err)}</p></div>`;
  if (!data) return html`<div class="card"><h2 class="text-xl font-bold mb-4">Site Configuration</h2><p class="text-gray-500 text-sm">Loading...</p></div>`;
  
  const f = (n, v, t) => t==='textarea'
    ? html`<div class="mb-3"><label class="block text-xs font-medium text-gray-600 mb-1">${v}</label><textarea id="field_${n}" rows="3" class="input"></textarea></div>`
    : html`<div class="mb-3"><label class="block text-xs font-medium text-gray-600 mb-1">${v}</label><input id="field_${n}" class="input"></div>`;
  const gv = id => { const e = document.getElementById('field_'+id); return e ? e.value : ''; };
  const sv = (nm, v) => { const e = document.getElementById('field_'+nm); if(e) e.value = v||''; };
  
  // Fill the uncontrolled inputs once the row has arrived (the old code used a 50 ms setTimeout
  // racing the commit; a data-keyed effect cannot lose that race).
  useEffect(() => {
    if (!data) return;
    sv('title',data.title);sv('description',data.description);sv('keywords',data.keywords);
    sv('canonical_url',data.canonical_url);sv('og_title',data.og_title);sv('og_description',data.og_description);

    sv('ga_id',data.ga_id);sv('gtm_id',data.gtm_id);sv('head_scripts',data.head_scripts);sv('body_scripts',data.body_scripts);
    sv('legal_tos',data.legal_tos);sv('legal_privacy',data.legal_privacy);sv('legal_refunds',data.legal_refunds);
    sv('schema_json',data.schema_json);
  }, [data]);
  
  const save = async () => {
    const b = {};
    b.title=gv('title');b.description=gv('description');b.keywords=gv('keywords');
    b.canonical_url=gv('canonical_url');b.og_title=gv('og_title');b.og_description=gv('og_description');
    b.og_image_url=gv('og_image_url');b.favicon_url=gv('favicon_url');
    b.ga_id=gv('ga_id');b.gtm_id=gv('gtm_id');b.head_scripts=gv('head_scripts');b.body_scripts=gv('body_scripts');
    b.legal_tos=gv('legal_tos');b.legal_privacy=gv('legal_privacy');b.legal_refunds=gv('legal_refunds');
    b.schema_json=gv('schema_json');
    const st = document.getElementById('sc_status');
    if(st){st.textContent='Saving...';st.className='text-sm ml-3 text-blue-600';}
    try {
      const r = await API.put('/admin/site',b);
      const w = (r && r.static_pages && r.static_pages.writer) ? r.static_pages.within_minutes : 5;
      if(st){st.textContent='Saved — materialized on the host within ' + w + ' minutes';st.className='text-sm ml-3 text-green-600';}
    } catch(e) {
      if(st){st.textContent='Not saved: ' + ((e && e.message) || 'request failed');st.className='text-sm ml-3 text-red-600';}
    }
  };
  
  return html`<div class="card"><h2 class="text-xl font-bold mb-4">Site Configuration</h2><p class="text-xs text-gray-500 mb-4">SEO, tracking, and the three legal pages. The fields below are saved immediately; the static pages at /terms.html, /privacy.html, /refunds.html and the marketing homepage are (re)generated from them on the host within 5 minutes (mcr-site-apply.sh).</p>

  // ---- PLANS & FEATURES (kanban t_dd2f7e32 console screen) ----
  // Renders GET /api/v1/admin/plan-registry — the plan x feature CATALOGUE built from the very
  // resolvers the gates call (crate::features::{resolve_limit,resolve_flag}), so "what the panel
  // shows" is by construction the trade enforced. Every control calls a write path that already
  // existed on the API:
  //   PUT    /api/v1/admin/plans/entitlement    {plan, feature, value}   per-cell grant / cap edit
  //   POST   /api/v1/admin/plans                {name, slug, ...}        create a plan
  //   PUT    /api/v1/admin/plans/:id            {partial}                edit a plan
  //   DELETE /api/v1/admin/plans/:id                                     delete a plan
  //   POST   /api/v1/admin/plans/assign         {tenant_id, plan_id, billing_cycle}
  //   POST   /api/v1/admin/plans/grant-top-tier seat every unset key on the top tier
  const LimitCell = ({ value, unit, busy, onSave }) => {
    const [v, setV] = useState(value == null ? '' : String(value));
    useEffect(() => { setV(value == null ? '' : String(value)); }, [value]);
    const n = parseInt(v, 10);
    const dirty = !isNaN(n) && n !== value;
    const commit = () => { if (!isNaN(n)) onSave(n); };
    return html`<div class="flex items-center gap-1">
      <input class="input" style="width:84px" value=${v} disabled=${busy} placeholder="unset"
        onInput=${e => setV(e.target.value)}
        onKeyDown=${e => { if (e.key === 'Enter') commit(); }} />
      <button class="btn btn-sm ${dirty ? '' : 'btn-outline'}" disabled=${busy} onClick=${commit}
        title="Save this cap (${unit || 'value'})">${dirty ? 'Save' : 'ok'}</button>
    </div>`;
  };

  const FlagCell = ({ on, busy, onSave }) => html`<button class="btn btn-sm ${on ? 'btn-green' : 'btn-outline'}"
    disabled=${busy} onClick=${() => onSave(on ? 0 : 1)}>${on ? '✓ on' : 'off'}</button>`;

  const Plans = () => {
    const [reg, setReg] = useState(null);
    const [err, setErr] = useState(null);
    const [busy, setBusy] = useState(false);
    const [note, setNote] = useState(null);
    const [modal, setModal] = useState(null); // null | {mode:'create'|'edit', id?, form:{...}}
    const [assign, setAssign] = useState({ tenant_id: '', plan_id: '', billing_cycle: 'monthly' });

    const load = () => API.get('/admin/plan-registry').then(d => { setReg(d); setErr(null); }).catch(e => setErr(e));
    useEffect(() => { load(); }, []);
    const flash = (m) => { setNote(m); setTimeout(() => setNote(null), 5000); };

    const setCell = async (plan, feature, value) => {
      setBusy(true);
      try {
        const r = await API.put('/admin/plans/entitlement', { plan, feature, value });
        flash(`Saved ${feature} on "${plan}" (stored in ${r.storage})` + (r.warning ? ' — ' + r.warning : ''));
        await load();
      } catch(e) { alert('Not saved: ' + e.message); }
      setBusy(false);
    };
    const savePlan = async () => {
      const f = modal.form;
      if (!f.name) { alert('Plan name is required'); return; }
      setBusy(true);
      try {
        const body = { name: f.name, slug: f.slug || undefined, description: f.description || undefined,
          is_active: !!f.is_active };
        // A BLANK price field means "leave the stored value alone". It used to be sent as 0, which
        // ZEROED a plan's yearly price on every edit (e.g. just toggling Active) — the modal never
        // prefilled price_yearly, so the field was always blank on edit.
        const pm = parseFloat(f.price_monthly); if (!isNaN(pm)) body.price_monthly = pm;
        const py = parseFloat(f.price_yearly); if (!isNaN(py)) body.price_yearly = py;
        if (modal.mode === 'edit') await API.put('/admin/plans/' + modal.id, body);
        else await API.post('/admin/plans', body);
        setModal(null); flash(modal.mode === 'edit' ? 'Plan updated' : 'Plan created'); await load();
      } catch(e) { alert('Not saved: ' + e.message); }
      setBusy(false);
    };
    const delPlan = async (p) => {
      if (!confirm('Delete plan "' + p.name + '"? Tenants on it are not reassigned.')) return;
      setBusy(true);
      try { await API.del('/admin/plans/' + p.id); flash('Plan deleted'); await load(); }
      catch(e) { alert('Not deleted: ' + e.message); }
      setBusy(false);
    };
    const doAssign = async () => {
      if (!assign.tenant_id || !assign.plan_id) { alert('tenant_id and plan are required'); return; }
      setBusy(true);
      try { await API.post('/admin/plans/assign', assign); flash('Plan assigned'); }
      catch(e) { alert('Not assigned: ' + e.message); }
      setBusy(false);
    };
    const grantTop = async () => {
      setBusy(true);
      try { const r = await API.post('/admin/plans/grant-top-tier', {}); flash(`Seated ${(r.granted || []).length} key(s) on "${r.top_plan}"`); await load(); }
      catch(e) { alert('Not granted: ' + e.message); }
      setBusy(false);
    };

    if (err) return html`<div class="card"><h2 class="text-xl font-bold mb-2">Plans & Features</h2><p class="text-red-500">Not available: ${String((err && err.message) || err)}</p></div>`;
    if (!reg) return html`<div class="card"><h2 class="text-xl font-bold mb-2">Plans & Features</h2><p class="text-gray-500 text-sm">Loading...</p></div>`;

    const plans = reg.plans || [];
    const registry = reg.registry || [];
    const gmap = {};
    (reg.grant_matrix || []).forEach(r => { gmap[r.feature] = r; });

    return html`<div>
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-xl font-bold">Plans & Features</h2>
        <div class="flex gap-2">

  // ---- PROVISIONING (kanban t_1d08bd9a) ----
  // The switch that lets a FunnelSwift TAG create a real free account here, plus the in-app plan
  // that account is seated on. Both values live in `admin_settings` and are read by the receiver
  // (`src/handlers/provision_handler.rs`) on every call; this screen is the only writer.
  //   GET /api/v1/admin/provisioning-settings  -> { enabled, slug, free_plans[] }
  //   PUT /api/v1/admin/provisioning-settings  -> same shape
  // Ships ON (code default true): a tag mints a free account immediately; turn the switch
  // below OFF to make this app create nothing.
  const Provisioning = () => {
    const [data, setData] = useState(null);
    const [err, setErr] = useState(null);
    const [busy, setBusy] = useState(false);
    const [note, setNote] = useState(null);
    const [slug, setSlug] = useState('');
    const load = () => API.get('/admin/provisioning-settings')
      .then(d => { setData(d); setSlug(d.provision_entry_plan_slug || 'free'); setErr(null); })
      .catch(e => { console.error(e); setErr(e); });
    useEffect(() => { load(); }, []);
    const flash = (m) => { setNote(m); setTimeout(() => setNote(null), 5000); };
    const save = async (body) => {
      setBusy(true);
      try {
        const r = await API.put('/admin/provisioning-settings', body);
        setData(r); setSlug(r.provision_entry_plan_slug || 'free'); flash('Saved');
      } catch (e) { alert('Not saved: ' + ((e && e.message) || 'request failed')); }
      setBusy(false);
    };
    if (err) return html`<div class="card"><h2 class="text-xl font-bold mb-2">Provisioning</h2><p class="text-red-500">Not available: ${String((err && err.message) || err)}</p></div>`;
    if (!data) return html`<div class="card"><h2 class="text-xl font-bold mb-2">Provisioning</h2><p class="text-gray-500 text-sm">Loading...</p></div>`;
    const on = data.provision_from_tags_enabled === true;
    return html`<div class="card" data-provisioning=${on ? 'on' : 'off'}>
      <h2 class="text-xl font-bold mb-2">Provisioning</h2>
      <p class="text-xs text-gray-500 mb-4">When FunnelSwift tags a lead with “MissedCall Respondr — Free”, this app creates a real free account for that business: its own workspace, a login with a password emailed to them, and a plan they can upgrade from inside the app. Nothing is created for anyone while the switch below is off.</p>
      <div class="border rounded-lg p-4 mb-4 flex items-center justify-between gap-4">
        <div>
          <div class="font-semibold">Create free accounts from tags</div>
          <div class="text-xs text-gray-500">Status: <span class="badge ${on ? 'badge-green' : 'badge-yellow'}">${on ? 'ON — tags create accounts' : 'OFF — tags create nothing'}</span></div>
        </div>
        <button class="btn ${on ? 'btn-red' : 'btn-green'}" disabled=${busy} onClick=${() => save({ provision_from_tags_enabled: !on })}>${busy ? '...' : (on ? 'Turn off' : 'Turn on')}</button>
      </div>
      <div class="border rounded-lg p-4 mb-4">
        <div class="font-semibold mb-1">Plan for new accounts</div>
        <p class="text-xs text-gray-500 mb-2">The plan a tagged account starts on. Only this app's own free plans (price $0) can be chosen — a tag can never seat a paying plan.</p>
        <div class="flex gap-2 items-end flex-wrap">
          <select class="input" style="width:280px" value=${slug} onChange=${e => setSlug(e.target.value)}>
            ${(data.free_plans || []).map(p => html`<option value=${p.slug}>${p.name} (${p.slug})</option>`)}
          </select>
          <button class="btn" disabled=${busy || slug === data.provision_entry_plan_slug} onClick=${() => save({ provision_entry_plan_slug: slug })}>Save plan</button>
        </div>
      </div>
      <p class="text-xs text-gray-400">FunnelSwift calls this app with the shared internal key at <code>POST /api/v1/internal/provision-free-account</code>. Its answer tells FunnelSwift what happened: 201 account created, 200 an account already existed, 403 while the switch above is off, 422 for an address that cannot be a mailbox.</p>
      ${note && html`<p class="text-sm text-blue-700 mt-2">${note}</p>`}
    </div>`;
  };

  // ---- MY ACCOUNT ----
  // The signed-in operator's own profile. The backend has carried all five calls since
  // kanban t_9cd2c8f2 (GET /auth/me resolves the REAL plan tier from tenant_plans, PUT
  // /auth/profile edits name + company, POST /auth/avatar takes the picture, GET
  // /auth/avatar/:user_id reads it back, PUT /auth/password changes the credential) and the
  // tenant app console exercises them - but THIS console had no screen for any of them, so the
  // operator had no way to change his own name, company, picture or password here. A backend
  // route with no UI is a defect. /auth/me is re-read on every open, so the form shows what the
  // server holds, never a stale copy, and the Plan badge carries plan_name, not a role word.
  //
  // The Role line below printed the database's own value verbatim — `account_owner`, `admin`, or a
  // bare "user" when the field was empty — the same defect the sibling consoles (CoreSwift,
  // WorkflowSwift) fixed with roleLabel. A written label is shown where one exists, the stored
  // value as-is when it does not (honest, never an invented role), and an em-dash when the server
  // sent nothing. The Plan badge beside it carries the REAL plan name from GET /auth/me.
  const ROLE_LABELS = { account_owner:'Account owner', owner:'Owner', admin:'Admin',
    super_admin:'Super admin', agency_admin:'Agency admin', client_admin:'Client admin',
    company_admin:'Company admin', team_member:'Team member', member:'Member', user:'Member',
    viewer:'Viewer' };
  const roleLabel = r => { const s = String(r == null ? '' : r).trim(); if (!s) return '—'; return ROLE_LABELS[s.toLowerCase()] || s; };
  const Account = () => {
    const [me, setMe] = useState(null);
    const [err, setErr] = useState(null);
    const [busy, setBusy] = useState(false);
    const [avMsg, setAvMsg] = useState(null);
    const [pMsg, setPMsg] = useState(null);
    const [pwMsg, setPwMsg] = useState(null);
    const [name, setName] = useState('');
    const [company, setCompany] = useState('');
    const [avBust, setAvBust] = useState(0);
    const [np, setNp] = useState('');
    const [np2, setNp2] = useState('');
    const [cp, setCp] = useState('');

    useEffect(() => {
      API.get('/auth/me')
        .then(d => { setMe(d); setName(d.name || ''); setCompany(d.company || ''); setErr(null); })
        .catch(e => setErr(e));
    }, []);

    const upload = async (file) => {
      if (!file) return;
      if (file.size > 2 * 1024 * 1024) { setAvMsg({ ok: false, text: 'That image is larger than 2 MB' }); return; }
      setBusy(true); setAvMsg(null);
      try {
        // Multipart, so NOT through API.post: that helper pins Content-Type: application/json,
        // which would destroy the multipart boundary the browser generates for a FormData body.
        const fd = new FormData(); fd.append('file', file, file.name || 'picture');
        const r = await fetch(window.location.origin + '/api/v1/auth/avatar', {
          method: 'POST',
          headers: API.token ? { 'Authorization': 'Bearer ' + API.token } : {},
          body: fd });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(j.message || j.error || ('Error ' + r.status));
        const url = j.avatar_url || ('/api/v1/auth/avatar/' + (me && me.id));
        setAvBust(Date.now());
        setMe(m => Object.assign({}, m, { avatar_url: url }));
        setAvMsg({ ok: true, text: 'Picture updated' });
      } catch (e) { setAvMsg({ ok: false, text: (e && e.message) || 'Upload failed' }); }
      setBusy(false);
    };
    // The REMOVAL twin of `upload` (kanban t_0278f465). Until this existed the picture could only
    // ever be REPLACED — the upload upserts one row per user and no route deleted it — so an
    // operator who wanted his initials back had no way to ask. The route is an authenticated DELETE
    // on the caller's OWN row (no path id to spoof), and it is idempotent: the answer carries
    // `removed` (1 or 0) and an empty `avatar_url`. The screen repaints from that answer, so the
    // initials placeholder comes back and the Remove control is withdrawn in the SAME render.
    const remove = async () => {
      if (!(me && me.avatar_url)) { setAvMsg({ ok: false, text: 'There is no picture to remove' }); return; }
      if (!window.confirm('Remove your profile picture?')) return;
      setBusy(true); setAvMsg(null);
      try {
        // Multipart is irrelevant here (no body), but the request must NOT go through API.post:
        // that helper pins Content-Type: application/json. A bare DELETE with the bearer token is
        // exactly what the route expects.
        const r = await fetch(window.location.origin + '/api/v1/auth/avatar', {
          method: 'DELETE',
          headers: API.token ? { 'Authorization': 'Bearer ' + API.token } : {} });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(j.message || j.error || ('Error ' + r.status));
        setAvBust(Date.now());
        setMe(m => Object.assign({}, m, { avatar_url: '' }));
        setAvMsg({ ok: true, text: 'Picture removed' });
      } catch (e) { setAvMsg({ ok: false, text: (e && e.message) || 'Remove failed' }); }
      setBusy(false);
    };
    const saveProfile = async () => {
      if (!name.trim()) { setPMsg({ ok: false, text: 'Enter your name' }); return; }
      setBusy(true); setPMsg(null);
      try {
        await API.put('/auth/profile', { name: name.trim(), company: company.trim() });
        setPMsg({ ok: true, text: 'Saved' });
      } catch (e) { setPMsg({ ok: false, text: (e && e.message) || 'Could not save' }); }
      setBusy(false);
    };
    const savePassword = async () => {
      if (np.length < 8) { setPwMsg({ ok: false, text: 'The new password must be at least 8 characters' }); return; }
      if (np !== np2) { setPwMsg({ ok: false, text: 'The two new passwords do not match' }); return; }
      if (!cp) { setPwMsg({ ok: false, text: 'Enter your current password to confirm' }); return; }
      setBusy(true); setPwMsg(null);
      try {
        await API.put('/auth/password', { current_password: cp, new_password: np });
        setNp(''); setNp2(''); setCp(''); setPwMsg({ ok: true, text: 'Password changed' });
      } catch (e) { setPwMsg({ ok: false, text: (e && e.message) || 'Could not change the password' }); }
      setBusy(false);
    };

    if (err) return html`<div class="card"><h2 class="text-xl font-bold mb-2">My Account</h2><p class="text-red-500">Not available: ${String((err && err.message) || err)}</p></div>`;
    if (!me) return html`<div class="card"><h2 class="text-xl font-bold mb-2">My Account</h2><p class="text-gray-500 text-sm">Loading...</p></div>`;

    const av = me.avatar_url ? (me.avatar_url + (me.avatar_url.indexOf('?') >= 0 ? '&' : '?') + 'v=' + avBust) : '';
    const initial = ((me.name || me.email || '?') + '?').charAt(0).toUpperCase();
    const msg = (m) => m && html`<span class="text-sm ml-3 ${m.ok ? 'text-green-600' : 'text-red-600'}">${m.text}</span>`;

    return html`<div>
      <h2 class="text-xl font-bold mb-4">👤 My Account</h2>
      <div class="card mb-4">
        <div class="font-semibold mb-3">Profile picture</div>
        <div class="flex items-center gap-4 flex-wrap">
          ${av
            ? html`<img id="mc-acct-av" alt="Your profile picture" src=${av} style="width:72px;height:72px;border-radius:50%;object-fit:cover;background:#f1f5f9" />`
            : html`<span style="width:72px;height:72px;border-radius:50%;background:#4f46e5;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:28px;font-weight:700">${initial}</span>`}
          <div>
            <input type="file" id="mc-acct-file" accept="image/png,image/jpeg,image/gif,image/webp" style="font-size:12px"
              onChange=${e => { const f = e.target.files && e.target.files[0]; if (f) upload(f); e.target.value = ''; }} />
            <p class="text-xs text-gray-400 mt-1 mb-0">PNG, JPEG, GIF or WebP, up to 2 MB.</p>
            ${me.avatar_url && html`<button class="btn" id="mc-acct-avdel" disabled=${busy} onClick=${remove} style="margin-top:6px">Remove picture</button>`}
            ${msg(avMsg)}
          </div>
        </div>
      </div>
      <div class="card mb-4">
        <div class="font-semibold mb-3">Your details</div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div><label class="text-sm font-medium text-gray-600 block mb-1">Name</label>
            <input class="input" id="mc-acct-name" value=${name} placeholder="Your name" onInput=${e => setName(e.target.value)} /></div>
          <div><label class="text-sm font-medium text-gray-600 block mb-1">Company</label>
            <input class="input" id="mc-acct-co" value=${company} placeholder="Your company" onInput=${e => setCompany(e.target.value)} /></div>
        </div>
        <div class="mt-3"><button class="btn" id="mc-acct-save-profile" disabled=${busy} onClick=${saveProfile}>Save</button>${msg(pMsg)}</div>
      </div>
      <div class="card mb-4">
        <div class="font-semibold mb-3">Change password</div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div><label class="text-sm font-medium text-gray-600 block mb-1">New password</label>
            <input class="input" id="mc-acct-np" type="password" autocomplete="new-password" value=${np} placeholder="At least 8 characters" onInput=${e => setNp(e.target.value)} /></div>
          <div><label class="text-sm font-medium text-gray-600 block mb-1">Confirm new password</label>
            <input class="input" id="mc-acct-np2" type="password" autocomplete="new-password" value=${np2} onInput=${e => setNp2(e.target.value)} /></div>
          <div><label class="text-sm font-medium text-gray-600 block mb-1">Current password (verifies it is you)</label>
            <input class="input" id="mc-acct-cp" type="password" autocomplete="current-password" value=${cp} onInput=${e => setCp(e.target.value)} /></div>
        </div>
        <div class="mt-3"><button class="btn" id="mc-acct-save-pw" disabled=${busy} onClick=${savePassword}>Save</button>${msg(pwMsg)}</div>
      </div>
      <div class="card">
        <div class="font-semibold mb-3">Profile</div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div><label class="text-sm font-medium text-gray-600 block mb-1">Email</label><div>${me.email || '-'}</div></div>
          <div><label class="text-sm font-medium text-gray-600 block mb-1">Role</label><div><span class="badge badge-blue">${roleLabel(me.role)}</span></div></div>
          <div><label class="text-sm font-medium text-gray-600 block mb-1">Plan</label><div><span class="badge badge-green">${me.plan_name || 'Free'}</span></div></div>
        </div>
      </div>
    </div>`;
  };

// ---- PAYMENT PROVIDERS (platform admin) ----
// The app's own checkout router (src/handlers/checkout_handler.rs) mounts
//   GET    /api/v1/payment-providers                list the configured providers (secrets masked)
//   POST   /api/v1/payment-providers                upsert one (blank secret = keep the stored one)
//   DELETE /api/v1/payment-providers/:provider_type remove one
// all platform-admin only, secrets sealed at rest (`enc:v1:` ciphertext) and never returned in
// full. `get_active_provider()` reads this table on EVERY checkout session and `lookup_webhook_secret()`
// reads it on both inbound receivers (`POST /api/v1/webhooks/stripe`, `/paypal`) — while this console
// had no screen calling any of the three, so the operator could not connect the Stripe/PayPal account
// the whole payment path runs on. David's rule: a backend route with no UI is a DEFECT, not a feature.
// At-rest posture of a payment provider's SAVED credential (kanban t_d1fcda7e). Measured by the API
// from the ciphertext COLUMN, never asserted here: until 2026-10-16 the header promised "stored
// encrypted" whatever the row held, and `key_status` cannot tell a sealed row from a legacy
// plaintext one. Tri-state on purpose — a missing field prints "unknown", never "in the clear".
const ppPostureCell = (set, sealed) => !set
  ? html`<span class="text-gray-400">—</span>`
  : (sealed === true ? html`<span class="badge badge-green" data-pp="sealed">encrypted</span>`
     : sealed === false ? html`<span class="badge badge-red" data-pp="plain">in the clear</span>`
     : html`<span class="text-gray-400" data-pp="unknown">unknown</span>`);
const PP_KINDS = [['stripe', 'Stripe'], ['paypal', 'PayPal'], ['square', 'Square'], ['paddle', 'Paddle']];
const PaymentProviders = () => {
  const st = viewState('payment_providers', { list: null, err: null, busy: false, msg: null, form: null });
  const isAdmin = !!(API.user && API.user.role && PLATFORM_ADMIN_ROLES.indexOf(API.user.role) >= 0);
  const load = async () => {
    try { const d = await API.get('/payment-providers'); st.list = (d && d.providers) || []; st.err = null; }
    catch (e) { st.list = []; st.err = (e && e.message) || 'Could not load the payment providers'; }
    renderApp();
  };
  if (!st._loaded && isAdmin) { st._loaded = true; load(); }
  const openForm = (row) => {
    st.form = { open: true, edit: !!row, provider_type: row ? row.provider_type : 'stripe',
      api_key: '', webhook_secret: '', publishable_key: (row && row.publishable_key) || '',
      label: (row && row.label) || '', is_test_mode: row ? row.is_test_mode !== false : true,
      is_active: row ? row.is_active !== false : true, err: null, msg: null, busy: false };
    st.msg = null; renderApp();
  };
  const closeForm = () => { st.form = null; renderApp(); };
  // kanban t_7bdfcc4a — find out whether a payment key works BEFORE it matters. A raw fetch, NOT
  // API.post: a refusal is a 424 whose BODY carries the provider's own sentence, while API.post's
  // handle() throws on !res.ok and would show the operator the short code instead of the reason
  // Stripe gave. The key itself is never echoed back — only the mask, and only when a key was
  // actually used. `into` is the form state (the box's Test key) or the screen state (a row's
  // Test stored key); the API's `key_source` in the sentence says which key was judged.
  const test = async (pt, key, into) => {
    const p = String(pt || '').trim().toLowerCase();
    if (!p) { into.err = 'Choose a provider type first.'; renderApp(); return; }
    // An empty api_key is the API's own 'test the STORED key' signal, so it is sent as an empty
    // string rather than omitted: the body is always well-formed JSON, never a bare POST.
    const usingBox = !!(key && String(key).trim());
    into.busy = true; into.err = null; into.msg = null; renderApp();
    try {
      const res = await fetch(window.location.origin + '/api/v1/payment-providers/' + encodeURIComponent(p) + '/test', {
        method: 'POST',
        headers: Object.assign({ 'Content-Type': 'application/json' }, API.token ? { 'Authorization': 'Bearer ' + API.token } : {}),
        body: JSON.stringify({ api_key: usingBox ? String(key).trim() : '' })
      });
      let j = {};
      try { j = await res.json(); } catch (e) { j = {}; }
      const tail = j.api_key_masked ? ' (key ' + j.api_key_masked + ')' : '';
      const line = (j.message || (res.ok ? 'The key was accepted' : 'The test could not run')) + tail;
      into.busy = false;
      if (res.ok) { into.msg = line; } else { into.err = line; }
    } catch (err) {
      into.busy = false;
      into.err = 'Could not run the key test: ' + ((err && err.message) ? err.message : err);
    }
    renderApp();
  };
  const save = async () => {
    const f = st.form; if (!f) return;
    const pt = String(f.provider_type || '').trim().toLowerCase();
    if (PP_KINDS.map(k => k[0]).indexOf(pt) < 0) { f.err = 'Choose Stripe, PayPal, Square or Paddle.'; renderApp(); return; }
    if (!f.edit && !String(f.api_key || '').trim()) { f.err = 'The secret key is required the first time you connect a provider.'; renderApp(); return; }
    f.busy = true; f.err = null; f.msg = null; renderApp();
    const body = { provider_type: pt, label: (f.label || '').trim(), is_active: !!f.is_active,
      is_test_mode: !!f.is_test_mode, publishable_key: (f.publishable_key || '').trim() };
    // A BLANK credential is the "keep the stored value" signal the upsert's four arms key on, so a
    // box the operator did not type into is left OUT of the body entirely.
    if ((f.api_key || '').trim()) body.api_key = f.api_key.trim();
    if ((f.webhook_secret || '').trim()) body.webhook_secret = f.webhook_secret.trim();
    try { await API.post('/payment-providers', body); st.msg = 'Saved the ' + pt + ' configuration.'; st.form = null; await load(); }
    catch (e) { f.busy = false; f.err = (e && e.message) || 'Could not save that provider'; renderApp(); }
  };
  const remove = async (row) => {
    if (!confirm('Delete the ' + row.provider_type + ' configuration? Checkout and the inbound payment webhooks stop working until a provider is configured again.')) return;
    st.busy = true; st.msg = null; renderApp();
    try { await API.del('/payment-providers/' + encodeURIComponent(row.provider_type)); st.msg = 'Removed ' + row.provider_type + '.'; }
    catch (e) { st.msg = 'Not removed: ' + ((e && e.message) || e); }
    st.busy = false; await load();
  };
  if (!isAdmin) return html`<div class="card"><h2 class="text-xl font-bold mb-2">Payment Providers</h2><p class="text-sm text-gray-600">This screen is for platform admins: the payment keys this install collects through are set by an operator with the admin role.</p></div>`;
  const rows = st.list || [];
  return html`<div>
    <div class="flex items-center justify-between mb-4">
      <div><h2 class="text-xl font-bold">Payment Providers</h2>
        <p class="text-sm text-gray-500">The Stripe or PayPal account this install collects through. The secret key and the webhook signing secret are never shown back in full, and the Encrypted column states whether the saved copy is encrypted at rest. Every checkout session and both inbound payment webhooks read the active provider from here.</p></div>
      <button class="btn btn-sm btn-green" disabled=${st.busy} onClick=${() => openForm(null)}>+ Add provider</button>
    </div>
    ${st.msg ? html`<div class="text-sm mb-3 text-gray-700">${st.msg}</div>` : null}
    ${st.err ? html`<div class="text-sm mb-3 text-red-700">${st.err}</div>` : null}
    ${st.list === null ? html`<div class="card text-center text-gray-400 py-8">Loading...</div>`
      : rows.length === 0 ? html`<div class="card text-center text-gray-400 py-8">No payment provider is connected yet. Add your Stripe or PayPal keys so checkout and the inbound payment webhooks can work.</div>`
      : html`<div class="card p-0 overflow-hidden"><table class="table">
          <thead><tr><th>Provider</th><th>Label</th><th>Secret key</th><th>Encrypted</th><th>Publishable key</th><th>Mode</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody>${rows.map(r => html`<tr data-provider=${r.provider_type}>
            <td class="font-medium">${r.provider_type}</td>
            <td class="text-gray-500">${r.label || '—'}</td>
            <td>${r.key_status === 'configured' ? html`<span class="badge badge-green">configured</span>` : html`<span class="badge badge-yellow">not set</span>`}</td>
            <td class="text-xs whitespace-nowrap" data-pp-posture>key ${ppPostureCell(r.api_key_set, r.api_key_sealed)} webhook ${ppPostureCell(r.webhook_secret_set, r.webhook_secret_sealed)}</td>
            <td class="font-mono text-xs text-gray-500">${r.publishable_key || 'not set'}</td>
            <td>${r.is_test_mode ? html`<span class="badge badge-blue">test</span>` : html`<span class="badge badge-purple">live</span>`}</td>
            <td>${r.is_active ? html`<span class="badge badge-green">Active</span>` : html`<span class="badge badge-red">Inactive</span>`}</td>
            <td><button class="btn btn-sm" disabled=${st.busy} onClick=${() => test(r.provider_type, '', st)}>Test stored key</button>
              <button class="btn btn-sm" style="margin-left:8px" disabled=${st.busy} onClick=${() => openForm(r)}>Edit</button>
              <button class="btn btn-sm btn-red" style="margin-left:8px" disabled=${st.busy} onClick=${() => remove(r)}>Delete</button></td>
          </tr>`)}</tbody></table></div>`}
    ${st.form && st.form.open ? PaymentProviderModal({ st, closeForm, save, test }) : null}
  </div>`;
};

const PaymentProviderModal = ({ st, closeForm, save, test }) => {
  const f = st.form;
  return html`<div class="modal" onClick=${e => e.target === e.currentTarget && closeForm()}>
    <div class="modal-content" data-pp-form="1">
      <h3 class="text-lg font-bold mb-4">${f.edit ? 'Edit' : 'Add'} payment provider</h3>
      <div class="space-y-3">
        <div><label class="text-sm font-medium block mb-1">Provider</label>
          <select class="input" value=${f.provider_type} disabled=${f.edit}
            onChange=${e => { f.provider_type = e.target.value; renderApp(); }}>
            ${PP_KINDS.map(k => html`<option value=${k[0]}>${k[1]}</option>`)}
          </select>
          <div class="text-xs text-gray-400 mt-1">Stripe and PayPal have an inbound webhook receiver in this app; Square and Paddle are stored but nothing reads them yet.</div></div>
        <div><label class="text-sm font-medium block mb-1">Label (optional)</label>
          <input class="input" value=${f.label} onInput=${e => { f.label = e.target.value; }} /></div>
        <div><label class="text-sm font-medium block mb-1">Secret key${f.edit ? ' (leave blank to keep the stored one)' : ''}</label>
          <input class="input" type="password" autocomplete="new-password" value=${f.api_key} onInput=${e => { f.api_key = e.target.value; }} />
          <div class="text-xs text-gray-400 mt-1">Stripe's secret key starts <code>sk_</code>; PayPal takes <code>client_id:client_secret</code>.</div></div>
        <div><label class="text-sm font-medium block mb-1">Webhook signing secret${f.edit ? ' (leave blank to keep the stored one)' : ''}</label>
          <input class="input" type="password" autocomplete="new-password" value=${f.webhook_secret} onInput=${e => { f.webhook_secret = e.target.value; }} />
          <div class="text-xs text-gray-400 mt-1">The key an inbound payment event's signature is checked against. Stripe shows it beside the endpoint's signing secret.</div></div>
        <div><label class="text-sm font-medium block mb-1">Publishable key (optional)</label>
          <input class="input" value=${f.publishable_key} onInput=${e => { f.publishable_key = e.target.value; }} /></div>
        <div class="flex gap-4 items-center flex-wrap">
          <label class="text-sm flex items-center gap-2"><input type="checkbox" checked=${f.is_test_mode} onChange=${e => { f.is_test_mode = e.target.checked; renderApp(); }} /> Test mode (sandbox keys)</label>
          <label class="text-sm flex items-center gap-2"><input type="checkbox" checked=${f.is_active} onChange=${e => { f.is_active = e.target.checked; renderApp(); }} /> Active</label>
        </div>
        <div class="text-xs text-gray-400">Only an active provider is used. A provider left inactive is kept but takes no part in checkout.</div>
      </div>
      ${f.msg ? html`<p class="text-sm text-gray-700 mt-3">${f.msg}</p>` : null}
      ${f.err ? html`<p class="text-sm text-red-600 mt-3">${f.err}</p>` : null}
      <div class="flex gap-2 justify-end mt-4">
        <button class="btn btn-outline" disabled=${f.busy} onClick=${() => test(f.provider_type, f.api_key, f)}>Test key</button>
        <button class="btn btn-outline" disabled=${f.busy} onClick=${() => closeForm()}>Cancel</button>
        <button class="btn" disabled=${f.busy} onClick=${() => save()}>${f.busy ? 'Saving...' : (f.edit ? 'Save changes' : 'Add provider')}</button>
        <span style="font-size:12px;color:#64748b">Test key asks Stripe whether the key in the box works, without saving it.</span>
      </div>
    </div>
  </div>`;
};

  const views = { dashboard: Dashboard, portfolio: Portfolio, rules: ResponseRules, templates: Templates, contacts: Contacts, 'site-config': SiteConfig, leads: Leads, deals: Deals, campaigns: Campaigns, tickets: Tickets, clients: Clients, calendar: CalendarView, lists: Lists, core: CoreIntegration, branding: Branding, 'email-templates': EmailTemplates, 'email-provider': EmailProviderScreen, 'ops': OpsConsole, plans: Plans, provisioning: Provisioning, tenants: TenantsScreen, account: Account, 'payment-providers': PaymentProviders };
  const CurrentView = views[S.view] || Dashboard;

  return html`<div class="flex w-full">
    <div class="sidebar w-56 bg-white border-r border-gray-200 min-h-screen p-3 flex flex-col" style="flex-shrink:0">
      <div class="flex items-center gap-2 px-3 py-4 mb-2">
        <span class="text-2xl">📞</span>
        <span class="nav-text font-bold text-gray-800">MissedCall</span>
      </div>
      <div class="flex-1 space-y-1">
        ${nav.filter(n => !n.adminOnly || (API.user && API.user.role && PLATFORM_ADMIN_ROLES.indexOf(API.user.role) >= 0)).map(n => html`<div class="nav-item ${S.view === n.id ? 'active' : ''}" data-tab=${n.id} onClick=${() => { S.view = n.id; renderApp(); }}>
          <span>${n.icon}</span><span class="nav-text">${n.label}</span>
        </div>`)}
      </div>
      <!-- Admin guide (kanban t_5af0ddda): fleet standard - the console links its own guide on its
           OWN origin at /admin-guide.html. Served from this root by
           bin/publish-missedcallrespondr-frontend.sh; the source of record is
           www-admin/admin-guide.html in the app repo. -->
      <a class="nav-item" id="admin-guide-link" href="/admin-guide.html" target="_blank" rel="noopener">
        <span>📖</span><span class="nav-text">Admin Guide</span>
      </a>
      <div class="nav-item text-red-500 mt-auto" onClick=${() => { API.logout(); S.view = 'dashboard'; renderApp(); }}>
        <span>🚪</span><span class="nav-text">Logout</span>
      </div>
    </div>
    <div class="main flex-1 p-6 overflow-auto">
      <${CurrentView} />
    </div>
  </div>`;
};

const renderApp = () => { render(html`<${App} />`, document.getElementById('app')); if (window.inlineGuidePage) window.inlineGuidePage(API.token ? S.view : ''); };
renderApp();
</script>
</body>
</html>
