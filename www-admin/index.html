<script type="module">
import { h, render } from 'https://esm.sh/preact@10.26.4';
import { useState, useEffect } from 'https://esm.sh/preact@10.26.4/hooks';
import htm from 'https://esm.sh/htm@3.1.1';
const html = htm.bind(h);
const showUpgradePrompt = (msg) => {
  const div = document.createElement("div");
  div.className = "upgrade-overlay";
  div.innerHTML = "<div class='upgrade-box'><h2>🚀 Upgrade Required</h2><p>" + (msg || "This feature requires a higher plan.") + "</p><button class='btn-upgrade' onclick=\"this.closest('.upgrade-overlay').remove()\">Got it</button></div>";
  document.body.appendChild(div);
  div.addEventListener("click", (e) => { if (e.target === div) div.remove(); });
};


const API = (() => {
  const base = window.location.origin + '/api/v1';
  let token = sessionStorage.getItem('mc_token');
  let user = JSON.parse(sessionStorage.getItem('mc_user') || 'null');

  const headers = () => ({ 'Content-Type': 'application/json', ...(token ? { 'Authorization': 'Bearer ' + token } : {}) });
  const handle = async (r) => { const d = await r.json(); if (!r.ok) throw new Error(d.error || d.message || 'Request failed'); return d; };
  const login = (e, p) => fetch(base + '/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email:e,password:p}) }).then(handle);
  const get = (p) => fetch(base + p, {headers:headers()}).then(handle).catch(e => { console.error(e); throw e; });
  const post = (p, b) => fetch(base + p, {method:'POST', headers:headers(), body:JSON.stringify(b)}).then(handle);
  const put = (p, b) => fetch(base + p, {method:'PUT', headers:headers(), body:JSON.stringify(b)}).then(handle);
  const del = (p) => fetch(base + p, {method:'DELETE', headers:headers()}).then(handle);
  return {
    login, get, post, put, del,
    get token(){ return token; },
    get user(){ return user; },
    setAuth(t, u){ token = t; user = u; sessionStorage.setItem('mc_token', t); sessionStorage.setItem('mc_user', JSON.stringify(u)); },
    logout(){ token = null; user = null; sessionStorage.removeItem('mc_token'); sessionStorage.removeItem('mc_user'); }
  };
})();

const S = { view: 'dashboard', loading: false, error: null, views: {} };
const _get = API.get, _post = API.post, _put = API.put, _del = API.del;
API.get = async (p) => _get(p).catch(e => { if (e.message && e.message.indexOf("Upgrade")>=0) showUpgradePrompt(e.message); throw e; });
API.post = async (p, b) => _post(p, b).catch(e => { if (e.message && e.message.indexOf("Upgrade")>=0) showUpgradePrompt(e.message); throw e; });
API.put = async (p, b) => _put(p, b).catch(e => { if (e.message && e.message.indexOf("Upgrade")>=0) showUpgradePrompt(e.message); throw e; });
API.del = async (p) => _del(p).catch(e => { if (e.message && e.message.indexOf("Upgrade")>=0) showUpgradePrompt(e.message); throw e; });

const viewState = (name, defaults = {}) => { if (!S.views[name]) S.views[name] = Object.assign({}, defaults); return S.views[name]; };

// ---- PLATFORM ADMIN SURFACE (kanban t_d11d4157) ----
// ONE definition of platform admin, mirroring the API that actually enforces it
// (src/auth/middleware.rs::is_platform_admin). Until now the panel had no role check at all,
// so a tenant account_owner who logged in here was shown the panel chrome and got 403
// 'Platform admin role required' from every action. The API remains the enforcement point;
// this only stops the panel from pretending. The tenant app is a DIFFERENT ORIGIN, so its
// host cannot be derived from window.location.
const PLATFORM_ADMIN_ROLES = ['admin', 'super_admin', 'agency_admin'];
const TENANT_APP = 'https://app.missedcallrespondr.com';

// ---- LOGIN ----
const LoginView = () => {
  // kanban t_02ef49ca — the login draft lives in the SHARED view object (S.views['login_form']),
  // never a per-render local: the Sign In handler itself calls renderApp() (S.loading / S.error),
  // so the old `let email = '', pw = ''` blanked BOTH fields on every attempt.
  const f = viewState('login_form', { email: '', pw: '' });
  const submit = async (e) => { e.preventDefault(); S.loading = true; S.error = null; renderApp();
    try {
      const r = await API.login(f.email, f.pw);
      const u = r.team_member || r.user || null;
      if (!u || PLATFORM_ADMIN_ROLES.indexOf(u.role) < 0) {
        API.logout();
        S.error = 'This is the platform admin panel, and your account is not a platform administrator. Opening your own dashboard ...';
        S.loading = false; renderApp();
        setTimeout(() => { window.location.replace(TENANT_APP + '/dashboard'); }, 1500);
        return;
      }
      API.setAuth(r.token, u); f.email = ''; f.pw = ''; S.view = 'dashboard';
    } catch(err) { S.error = err.message; }
    S.loading = false; renderApp();
  };
  return html`<div class="flex items-center justify-center min-h-screen w-full">
    <div class="card w-full max-w-sm mx-4">
      <div class="text-center mb-6">
        <div class="text-3xl mb-2">📞</div>
        <h1 class="text-xl font-bold text-gray-800">MissedCall Respondr</h1>
        <p class="text-sm text-gray-500 mt-1">Auto-Response Platform</p>
      </div>
      <form onSubmit=${submit} class="space-y-4">
        <div><label class="text-sm font-medium text-gray-600 block mb-1">Email</label><input type="email" class="input" value=${f.email} onInput=${e => f.email = e.target.value} placeholder="admin@company.com" required /></div>
        <div><label class="text-sm font-medium text-gray-600 block mb-1">Password</label><input type="password" class="input" value=${f.pw} onInput=${e => f.pw = e.target.value} placeholder="......" required /></div>
        ${S.error && html`<div class="text-red-600 text-sm bg-red-50 p-2 rounded-lg">${S.error}</div>`}
        <button type="submit" class="btn w-full">Sign In</button>
      </form>
    </div>
  </div>`;
};

// ---- DASHBOARD ----
const Dashboard = () => {
  const st = viewState('dashboard', {});
  if (!st._loaded) { st._loaded = true;
    API.get('/dashboard/stats').then(s => { Object.assign(st, s); renderApp(); }).catch(() => {});
  }
  return html`<div>
    <h2 class="text-xl font-bold mb-4">Dashboard</h2>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="stat-card"><div class="stat-value">${st.total_rules ?? '...'}</div><div class="stat-label">Response Rules</div></div>
      <div class="stat-card"><div class="stat-value">${st.total_templates ?? '...'}</div><div class="stat-label">Templates</div></div>
      <div class="stat-card"><div class="stat-value">${st.total_contacts ?? '...'}</div><div class="stat-label">Contacts</div></div>
      <div class="stat-card"><div class="stat-value">${st.total_responses ?? '...'}</div><div class="stat-label">Auto-Responses</div></div>
    </div>
  </div>`;
};

// ---- PORTFOLIO ----
const Portfolio = () => {
  const st = viewState('portfolio', { list: [], showModal: false, editItem: null, search: '' });
  const load = async () => { try { const data = await API.get('/portfolio-companies'); st.list = Array.isArray(data) ? data : []; renderApp(); } catch(e) { console.error(e); } };
  if (!st._loaded) { st._loaded = true; load(); }

  const show = (item) => { st.editItem = item; st.formSeeded = false; st.showModal = true; renderApp(); };
  const hide = () => { st.showModal = false; renderApp(); };
  const save = async (data) => {
    try { if(st.editItem) await API.put('/portfolio-companies/' + st.editItem.id, data); else await API.post('/portfolio-companies', data); st.showModal = false; load(); } catch(e){ alert(e.message); }
  };
  const remove = async (id) => { if(!confirm('Delete this portfolio company?')) return; await API.del('/portfolio-companies/' + id); load(); };
  // kanban t_25b8c662 — the per-row "🔑 Impersonate" button that used to live on this tab is
  // DELETED, not renamed. It could never work, for four independent reasons measured on the live
  // bytes (t_d11d4157 browser-portfolio.json: POST /api/v1/admin/impersonate -> 400,
  // "Impersonation failed: valid account_id is required"):
  //   1. it posted {account_id} while admin_handler::impersonate reads tenant_id;
  //   2. GET /portfolio-companies binds claims.aid, so this list is ALWAYS the caller's own tenant,
  //      and its payload carries no tenant_id -- `company.tenant_id || company.id` resolved to a
  //      portfolio_companies.id, so even a renamed key would have minted a token for a non-tenant id;
  //   3. the handler answers `impersonation_token` while the button read `r.token`, so a 2xx would
  //      have stored the string "undefined" (renaming ONLY the key turns a loud failure into a
  //      quiet lie);
  //   4. it wrote sessionStorage on admin.missedcallrespondr.com and then opened a DIFFERENT origin
  //      (sessionStorage is per-origin) -- no session could cross.
  // A portfolio row is a sub-entity of your OWN tenant, so there is no account here to sign in as.
  // The operator control that CAN name a tenant is in the Operator Console (every tenant); the note
  // rendered below points there instead of leaving a button that 400s for every click.

  const filtered = st.list.filter(c => !st.search || (c.name||'').toLowerCase().includes(st.search.toLowerCase()) || (c.slug||'').toLowerCase().includes(st.search.toLowerCase()) || (c.domain||'').toLowerCase().includes(st.search.toLowerCase()));

  return html`<div>
    <div class="flex items-center justify-between mb-4"><h2 class="text-xl font-bold">Portfolio Companies</h2><div class="flex gap-2 items-center"><input class="input" style="width:240px" placeholder="Search..." value=${st.search || ''} onInput=${e => { st.search = e.target.value; renderApp(); }} /><button class="btn btn-sm btn-green" onClick=${() => { show(null); }}>+ Add Company</button></div></div>
    <div class="card" data-portfolio-note="1" style="border-left:4px solid #94a3b8"><p class="text-xs text-gray-600">This list is scoped to <b>your own tenant</b> by the API, and a portfolio company is not an account you can sign in as. To open a customer's tenant, use <b>Operator Console → 🔑 Impersonate a tenant</b> (it lists every tenant).</p></div>
    <div class="card p-0 overflow-hidden">
      <table class="table"><thead><tr><th>Name</th><th>Slug</th><th>Actions</th></tr></thead>
        <tbody>${filtered.map(c => html`<tr>
          <td class="font-medium">${c.name}</td><td class="text-gray-500">${c.slug || c.domain || '-'}</td>
          <td><button class="btn btn-sm btn-outline" onClick=${() => { show(c); }}>Edit</button><button class="btn btn-sm btn-red" onClick=${() => remove(c.id)}>Delete</button></td>
        </tr>`)}
        ${filtered.length === 0 && html`<tr><td colspan="3" class="text-center text-gray-400 py-8">No portfolio companies yet.</td></tr>`}
      </tbody></table>
    </div>
    ${st.showModal && html`<div class="modal" onClick=${e => e.target === e.currentTarget && (hide())}>
      <div class="modal-content"><h3 class="text-lg font-bold mb-4">${st.editItem ? 'Edit' : 'Add'} Portfolio Company</h3>
        ${(() => {
          // kanban t_13330c68 — the draft lives in the SHARED view object (S.views['portfolio_form']), seeded ON
          // OPEN because show() clears st.formSeeded. The template IIFE re-runs on every renderApp(), so a
          // per-render local re-initialised the field from the stored ROW and wiped what the operator
          // typed (guard rule 4); a re-render can no longer do that.
          const f = viewState('portfolio_form', { name: '', slug: '' });
          if (!st.formSeeded) {
            f.name = st.editItem?.name||'';
            f.slug = st.editItem?.slug||'';
            st.formSeeded = true;
          }
          return html`<div class="space-y-3">
            <div><label class="text-sm font-medium block mb-1">Company Name</label><input class="input" value=${f.name} onInput=${e => { f.name = e.target.value; }} /></div>
            <div><label class="text-sm font-medium block mb-1">Slug</label><input class="input" value=${f.slug} onInput=${e => { f.slug = e.target.value; }} /></div>
            <div class="flex gap-2 justify-end mt-4">
              <button class="btn btn-outline" onClick=${() => { hide(); }}>Cancel</button>
              <button class="btn" onClick=${() => save({name: f.name, slug: f.slug})}>${st.editItem ? 'Save' : 'Add'}</button>
            </div>
          </div>`; })()}
      </div>
    </div>`}
  </div>`;
};

// ---- RESPONSE RULES ----
// kanban t_31f9cf38 — these rules are EVALUATED now (src/handlers/response_rule_eval.rs): on an
// inbound call the tenant's active rules are walked in priority order and the first match acts. The
// form therefore carries what the call path reads — a trigger, an action with a transport behind it,
// the message text, and the priority. This form used to save `response_type:'sms'` with the CONDITION
// text as the message body (so a rule whose condition was "After hours" would have texted the words
// "After hours"), and it never offered a trigger, a message or a priority at all. `email`/`voice` are
// gone: a call carries no email address and this service has no outbound-call transport.
const RULE_TRIGGERS = [['all_missed_calls', 'All missed calls'], ['specific_numbers', 'Specific numbers'], ['time_of_day', 'Time of day'], ['day_of_week', 'Day of week']];
const RULE_ACTIONS = [['sms', 'SMS — text the caller back'], ['callback', 'Callback — queue a return call']];
const RULE_DAYS = [['mon', 'Mon'], ['tue', 'Tue'], ['wed', 'Wed'], ['thu', 'Thu'], ['fri', 'Fri'], ['sat', 'Sat'], ['sun', 'Sun']];
const ruleLabel = (pairs, v) => { const hit = pairs.find(p => p[0] === v); return hit ? hit[1] : (v || '-'); };
const ruleScheduleOf = (f) => f.trigger === 'specific_numbers'
  ? { numbers: (f.numbers || '').split(/[\n,;]+/).map(s => s.trim()).filter(Boolean) }
  : f.trigger === 'time_of_day'
    ? { window: { start: f.start || '09:00', end: f.end || '17:00' } }
    : f.trigger === 'day_of_week' ? { days: (f.days || []).slice() } : null;
const ResponseRules = () => {
  const st = viewState('rules', { list: [], showModal: false, editItem: null, search: '' });
  const load = async () => { try { const data = await API.get('/response-rules'); st.list = Array.isArray(data) ? data : []; renderApp(); } catch(e) { console.error(e); } };
  if (!st._loaded) { st._loaded = true; load(); }

  const show = (item) => { st.editItem = item; st.formSeeded = false; st.showModal = true; renderApp(); };
  const hide = () => { st.showModal = false; renderApp(); };
  const save = async (data) => {
    try { if(st.editItem) await API.put('/response-rules/' + st.editItem.id, data); else await API.post('/response-rules', data); st.showModal = false; load(); } catch(e){ alert(e.message); }
  };
  const remove = async (id) => { if(!confirm('Delete?')) return; await API.del('/response-rules/' + id); load(); };

  const filtered = st.list.filter(r => !st.search || (r.name||'').toLowerCase().includes(st.search.toLowerCase()));

  return html`<div>
    <div class="flex items-center justify-between mb-4"><h2 class="text-xl font-bold">Response Rules</h2><div class="flex gap-2 items-center"><input class="input" style="width:240px" placeholder="Search..." value=${st.search || ''} onInput=${e => { st.search = e.target.value; renderApp(); }} /><button class="btn btn-sm btn-green" onClick=${() => { show(null); }}>+ Add Rule</button></div></div>
    <p class="text-sm text-gray-500 mb-4">Rules are evaluated on every inbound call, in priority order (lowest number first): the first matching rule acts. A text leaves through Telnyx, so the Telnyx API key and messaging profile must be saved in the Telnyx Config panel first.</p>
    <div class="card p-0 overflow-hidden">
      <table class="table"><thead><tr><th>Name</th><th>Trigger</th><th>Action</th><th>Priority</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody>${filtered.map(r => html`<tr>
          <td class="font-medium">${r.name}</td>
          <td class="text-gray-500">${ruleLabel(RULE_TRIGGERS, r.trigger_condition)}</td>
          <td class="text-gray-500">${ruleLabel(RULE_ACTIONS, r.response_type)}</td>
          <td class="text-gray-500">${r.priority == null ? 100 : r.priority}</td>
          <td><span class="badge ${r.is_active ? 'badge-green' : 'badge-red'}">${r.is_active ? 'Active' : 'Inactive'}</span></td>
          <td><button class="btn btn-sm btn-outline" onClick=${() => { show(r); }}>Edit</button><button class="btn btn-sm btn-red" onClick=${() => remove(r.id)}>Delete</button></td>
        </tr>`)}
        ${filtered.length === 0 && html`<tr><td colspan="6" class="text-center text-gray-400 py-8">No response rules yet.</td></tr>`}
      </tbody></table>
    </div>
    ${st.showModal && html`<div class="modal" onClick=${e => e.target === e.currentTarget && (hide())}>
      <div class="modal-content"><h3 class="text-lg font-bold mb-4">${st.editItem ? 'Edit' : 'Add'} Response Rule</h3>
        ${(() => {
          // kanban t_13330c68 — the draft lives in the SHARED view object (S.views['rules_form']), seeded ON
          // OPEN because show() clears st.formSeeded. The template IIFE re-runs on every renderApp(), so a
          // per-render local re-initialised the field from the stored ROW and wiped what the operator
          // typed (guard rule 4); a re-render can no longer do that.
          const f = viewState('rules_form', { name: '', trigger: 'all_missed_calls', type: 'sms', text: '', numbers: '', start: '09:00', end: '17:00', days: [], priority: 100, active: true });
          if (!st.formSeeded) {
            const row = st.editItem;
            f.name = row?.name||'';
            // A row written before this change could hold a free-text condition or a retired action;
            // seed the picker with the stored value only when it is one the call path reads.
            f.trigger = RULE_TRIGGERS.some(t => t[0] === row?.trigger_condition) ? row.trigger_condition : 'all_missed_calls';
            f.type = RULE_ACTIONS.some(a => a[0] === row?.response_type) ? row.response_type : 'sms';
            f.text = (row?.response_content||{}).text||'';
            f.numbers = ((row?.schedule||{}).numbers||[]).join('\n');
            f.start = ((row?.schedule||{}).window||{}).start||'09:00';
            f.end = ((row?.schedule||{}).window||{}).end||'17:00';
            f.days = ((row?.schedule||{}).days||[]).slice();
            f.priority = row?.priority == null ? 100 : row.priority;
            f.active = row ? row.is_active !== false : true;
            st.formSeeded = true;
          }
          return html`<div class="space-y-3">
            <div><label class="text-sm font-medium block mb-1">Name</label><input class="input" value=${f.name} onInput=${e => { f.name = e.target.value; }} /></div>
            <div><label class="text-sm font-medium block mb-1">Trigger</label><select class="input" value=${f.trigger} onChange=${e => { f.trigger = e.target.value; renderApp(); }}>${RULE_TRIGGERS.map(t => html`<option value=${t[0]}>${t[1]}</option>`)}</select></div>
            ${f.trigger === 'specific_numbers' && html`<div><label class="text-sm font-medium block mb-1">Caller numbers (one per line)</label><textarea class="input" rows="3" value=${f.numbers} onInput=${e => { f.numbers = e.target.value; }} placeholder="+15550101234"></textarea></div>`}
            ${f.trigger === 'time_of_day' && html`<div class="flex gap-2"><div class="flex-1"><label class="text-sm font-medium block mb-1">From</label><input class="input" type="time" value=${f.start} onInput=${e => { f.start = e.target.value; }} /></div><div class="flex-1"><label class="text-sm font-medium block mb-1">To</label><input class="input" type="time" value=${f.end} onInput=${e => { f.end = e.target.value; }} /></div></div>`}

// Pure payload builder for an Ops action. Extracted to module scope so the SHIPPED bytes can be
// exercised in node (see /opt/swift/scripts/mcr-ops-bool-test.js) instead of eyeballed.
//
// `act.booleans` lists fields rendered as checkboxes whose value must reach the API as a real
// JSON boolean. It exists because `email_templates.is_default` is a bool column: sending the
// string "true" is a serde type error, which `Json` surfaces as a text/plain 422 the admin SPA
// cannot read at all (card t_95721228) — i.e. the field would be a silent no-op in the UI.
// `act.numeric` (pre-existing) is the same idea for numbers.
const buildOpsBody = (act, v, path) => {
  if (act.json) return JSON.parse((v.json || '{}').trim() || '{}');
  if (act.method === 'GET' || act.method === 'DELETE') return undefined;
  const body = {};
  (act.fields || []).forEach(f => {
    // Skip path parameters by looking at the TEMPLATE (`/email-templates/:id`), not the resolved
    // path: the original code checked the resolved path, where `:id` has already been replaced,
    // so the check never fired and the path param was sent in the body as well. Harmless for a
    // handler that ignores unknown keys, but it means `{:id, is_default}` actions carried a
    // stray `id` string — the field belongs in the path only.
    if (act.path.indexOf(':' + f) >= 0) return;
    if ((act.booleans || []).indexOf(f) >= 0) { body[f] = v[f] === true; return; }
    const s = (v[f] || '').trim();
    if (s === '') return;
    body[f] = (act.numeric || []).indexOf(f) >= 0 ? Number(s) : s;
  });
  return body;
};

// Resolve an action's path: every `:field` placeholder is filled from that field's value.
// Also module scope, and for the same reason as `buildOpsBody` above.
const opsActionPath = (act, v) => {
  let path = act.path;
  (act.fields || []).forEach(f => { if (path.indexOf(':' + f) >= 0) path = path.replace(':' + f, encodeURIComponent(String(v[f] == null ? '' : v[f]).trim())); });
  return path;
};

const OpsAction = ({ act }) => {
  // `act.checked` = boolean fields that start ticked. For "Create template" that means the
  // common case (an admin creating a template for a type expects the sender to USE it) works
  // without the admin having to know about is_default; untick it to stage a second template.
  const [v, setV] = useState(() => { const i = {}; (act.checked || []).forEach(f => { i[f] = true; }); return i; });
  const [res, setRes] = useState(null);
  const [busy, setBusy] = useState(false);
  const go = async () => {
    setBusy(true); setRes(null);
    try {
      const path = opsActionPath(act, v);
      if (path.indexOf(':') >= 0) throw new Error('missing path parameter: ' + path);
      const body = buildOpsBody(act, v, path);
      const r = act.method === 'GET' ? await OPSAPI.get(path)
        : act.method === 'POST' ? await OPSAPI.post(path, body || {})
        : act.method === 'PUT' ? await OPSAPI.put(path, body || {})
        : await OPSAPI.del(path);
      setRes({ ok: true, text: JSON.stringify(r, null, 1).slice(0, 3000) });
    } catch (e) { setRes({ ok: false, text: String((e && e.message) || e) }); }
    setBusy(false);
  };
  return html`<div class="ops-action border rounded-lg p-2 mb-2 bg-gray-50">
    <div class="flex flex-wrap gap-2 items-end">
      ${(act.fields || []).map(f => (act.booleans || []).indexOf(f) >= 0
        ? html`<label class="text-xs text-gray-600 flex flex-col">
        <span>${f}${(act.hints || {})[f] ? html` <span class="text-gray-400">— ${act.hints[f]}</span>` : ''}</span>
        <input type="checkbox" class="border rounded px-2 py-1 ops-f-${f}" checked=${v[f] === true}
          onChange=${e => setV(s => Object.assign({}, s, { [f]: e.target.checked }))} />
      </label>`
        : html`<label class="text-xs text-gray-600 flex flex-col">
        <span>${f}</span>
        <input class="border rounded px-2 py-1 text-sm ops-f-${f}" style=${f === 'json' ? 'min-width:420px;font-family:monospace' : ''}
          value=${v[f] || ''} onInput=${e => setV(s => Object.assign({}, s, { [f]: e.target.value }))} />
      </label>`)}
      <button class="px-3 py-1 rounded bg-indigo-600 text-white text-sm disabled:opacity-50" disabled=${busy} onClick=${go}>
        ${busy ? '...' : (act.label || act.method)}</button>
      ${res && html`<span class="text-xs ${res.ok ? 'text-green-700' : 'text-red-600'}">${res.ok ? 'OK' : 'ERROR'}</span>`}
    </div>
    <div class="text-xs text-gray-500 mt-1"><code>${act.method} /api/v1${act.path}</code></div>
    ${res && html`<pre class="text-xs bg-white border rounded p-2 mt-1 overflow-auto" style="max-height:200px">${res.text}</pre>`}
  </div>`;
};

const OpsList = ({ path }) => {
  const [data, setData] = useState(null);
  const [err, setErr] = useState(null);
  const [busy, setBusy] = useState(false);
  const load = async () => {
    setBusy(true); setErr(null);
    try { setData(await OPSAPI.get(path)); } catch (e) { setErr(String((e && e.message) || e)); }
    setBusy(false);
  };
  useEffect(() => { load(); }, []);
  let rows = null;
  if (Array.isArray(data)) rows = data;
  else if (data && typeof data === 'object') {
    const k = Object.keys(data).find(kk => Array.isArray(data[kk]));
    if (k) rows = data[k];
  }
  let body;
  if (err) body = html`<div class="text-xs text-red-600">${err}</div>`;
  else if (!data) body = html`<div class="text-xs text-gray-400">loading...</div>`;
  else if (rows) {
    const cols = Array.from(rows.slice(0, 5).reduce((a, r) => { if (r && typeof r === 'object') Object.keys(r).forEach(k => a.add(k)); return a; }, new Set())).slice(0, 12);
    body = html`<div class="text-xs text-gray-500 mb-1">${rows.length} row(s)</div>
      <div class="overflow-auto" style="max-height:260px"><table class="ops-table text-xs w-full border-collapse">
        <thead><tr>${cols.map(c => html`<th class="text-left border-b px-2 py-1 bg-gray-100">${c}</th>`)}</tr></thead>
        <tbody>${rows.slice(0, 50).map(r => html`<tr>${cols.map(c => html`<td class="border-b px-2 py-1 align-top">${r && r[c] != null ? String(typeof r[c] === 'object' ? JSON.stringify(r[c]) : r[c]).slice(0, 80) : ''}</td>`)}</tr>`)}</tbody>
      </table></div>`;
  } else {
    body = html`<pre class="text-xs bg-white border rounded p-2 overflow-auto" style="max-height:200px">${JSON.stringify(data, null, 1).slice(0, 3000)}</pre>`;
  }
  return html`<div class="ops-list mb-2">
    <div class="flex items-center gap-2 mb-1">
      <code class="text-xs text-gray-500">GET /api/v1${path}</code>
      <button class="px-2 py-0.5 rounded border text-xs" disabled=${busy} onClick=${load}>${busy ? '...' : 'reload'}</button>
    </div>${body}</div>`;
};

const OpsPanel = ({ panel }) => {
  const [open, setOpen] = useState(false);
  return html`<div class="ops-panel bg-white border rounded-xl mb-3">
    <div class="flex items-center justify-between px-4 py-2 cursor-pointer" onClick=${() => setOpen(o => !o)}>
      <span class="font-semibold text-gray-800 text-sm">${panel.title}</span>
      <span class="text-xs text-gray-400">${(panel.actions || []).length} controls ${open ? '\u2212' : '+'}</span>
    </div>
    ${open && html`<div class="px-4 pb-3 border-t pt-3">
      ${panel.list && html`<${OpsList} path=${panel.list} />`}
      ${(panel.actions || []).map(a => html`<${OpsAction} act=${a} />`)}
    </div>`}
  </div>`;
};

/* ===== 🔑 IMPERSONATE A TENANT (kanban t_25b8c662) =====
   The working operator control for `POST /admin/impersonate`, on the only surface that can name a
   tenant: `GET /admin/tenants` returns EVERY tenant (admin_handler::list_all_tenants), while
   `GET /portfolio-companies` is caller-scoped to the admin's own tenant. The Portfolio tab used to
   carry a per-row Impersonate button that this replaces; its four measured defects are documented
   above that function. Hand-off: the token travels in the URL FRAGMENT -- a fragment is never sent
   to the server, so it cannot reach nginx's access log or a Referer, and the tenant shell stores it
   and strips it on arrival (skill: session-credential-out-of-url-and-logs). */
const ImpersonateTenants = () => {
  const st = viewState('impersonate', { list: null, err: null, busy: null, msg: null, ok: true });
  const load = async () => {
    try {
      const d = await API.get('/admin/tenants');
      st.list = Array.isArray(d) ? d : ((d && d.tenants) || []);
      st.err = null;
    } catch (e) { st.err = e.message; st.list = null; }
    st.busy = null; renderApp();
  };
  const reload = async () => { st.busy = 'list'; renderApp(); await load(); };
  if (!st._loaded) { st._loaded = true; load(); }
  const go = async (t) => {
    const name = t.name || t.slug || t.id;
    if (!confirm('Sign in as "' + name + '"?\n\nYou will land in the customer app as that tenant for 15 minutes.')) return;
    st.busy = t.id; st.msg = null; st.ok = true; renderApp();
    try {
      const r = await API.post('/admin/impersonate', { tenant_id: t.id });
      const tok = r && (r.impersonation_token || r.token);
      if (!tok) throw new Error('the API answered without an impersonation_token');
      window.open(TENANT_APP + '/dashboard/#impersonation_token=' + encodeURIComponent(tok)
        + '&impersonation_tenant=' + encodeURIComponent(name), '_blank', 'noopener');
      st.msg = 'Opened ' + name + ' in a new tab. That tab is the customer session; this panel is untouched.';
    } catch (e) { st.ok = false; st.msg = 'Impersonation failed: ' + e.message; }
    st.busy = null; renderApp();
  };
  return html`<div class="card mb-3" data-impersonate="tenant">
    <div class="flex items-center justify-between mb-1">
      <h2 class="text-base font-bold text-gray-800">🔑 Impersonate a tenant</h2>
      <button class="btn btn-sm btn-outline" disabled=${st.busy === 'list'} onClick=${reload}>${st.busy === 'list' ? '...' : 'reload'}</button>
    </div>
    <p class="text-xs text-gray-500 mb-2">Opens ${TENANT_APP} signed in as the tenant you pick. 15-minute token; your operator session on this panel is not affected.</p>
    ${st.msg && html`<div class="text-sm mb-2 ${st.ok ? 'text-green-700' : 'text-red-600'}">${st.msg}</div>`}
    ${st.err && html`<div class="text-sm text-red-600 mb-2">Could not list tenants: ${st.err}</div>`}
    ${Array.isArray(st.list) ? html`<div class="overflow-auto" style="max-height:300px"><table class="table">
      <thead><tr><th>Tenant</th><th>Slug</th><th>Users</th><th>Plan</th><th></th></tr></thead>
      <tbody>${st.list.map(t => html`<tr>
        <td class="font-medium">${t.name || '-'}</td><td class="text-gray-500">${t.slug || '-'}</td>
        <td>${t.user_count == null ? '-' : t.user_count}</td><td class="text-gray-500">${t.plan_name || '—'}</td>
        <td><button class="btn btn-sm btn-blue" disabled=${st.busy === t.id} onClick=${() => go(t)}>${st.busy === t.id ? '...' : '🔑 Impersonate'}</button></td>
      </tr>`)}</tbody></table></div>`
      : (st.err ? '' : html`<div class="text-xs text-gray-400">loading tenants...</div>`)}
  </div>`;
};

const OpsConsole = () => {
  return html`<div class="ops-console space-y-1" data-ops="console">
    <h1 class="text-xl font-bold text-gray-800">Operator Console</h1>
    <p class="text-xs text-gray-500 mb-2">Direct operator controls for admin endpoints that had no UI. Every control calls the existing API with your session token.</p>
    <${ImpersonateTenants} />
    ${OPS_PANELS.map(p => html`<${OpsPanel} panel=${p} />`)}
  </div>`;
};

const App = () => {
  if(!API.token) return html`<${LoginView} />`;

  const nav = [
    { id: 'ops', label: 'Operator Console', icon: '🛠', adminOnly: true },
    { id: 'dashboard', label: 'Dashboard', icon: '📊' },
    { id: 'portfolio', label: 'Portfolio', icon: '🏢' },
    { id: 'rules', label: 'Response Rules', icon: '⚙️' },
    { id: 'templates', label: 'Templates', icon: '📋' },
    { id: 'contacts', label: 'Contacts', icon: '👥' },
    { id: 'leads', label: 'Leads', icon: '🎯' },
    { id: 'deals', label: 'Deals', icon: '💰' },
    { id: 'workflows', label: 'Workflows', icon: '⚡' },
    { id: 'campaigns', label: 'Campaigns', icon: '📣' },
    { id: 'lists', label: 'Lists', icon: '📇' },
    { id: 'core', label: 'CoreSwift', icon: '🔗' },
    { id: 'tickets', label: 'Tickets', icon: '🎫' },
    { id: 'clients', label: 'Clients', icon: '🤝' },
    { id: 'calendar', label: 'Calendar', icon: '📅' },
      { id: 'site-config', label: 'Site Config', icon: '🌐' }
  ];

  const SiteConfig = () => {
  // kanban t_2f99528b — this tab used to read its state out of `S.__sc_data`, guarded by
  // `S.useState ? … : [null, null]`, and NOTHING ever sets `S.useState`: the guard was always false,
  // so `data` was hard-coded null and the tab rendered "Loading..." forever. Its fields never
  // appeared, which is why "the panel's Site Settings save" had never been exercised through the UI.
  // The neighbouring components (Line 1368) use preact's own state; this one does the same.
  const [data, setData] = useState(null);
  const [err, setErr] = useState(null);
  useEffect(() => { API.get('/admin/site').then(setData).catch(e => { console.error(e); setErr(e); }); }, []);
  if (err) return html`<div class="card"><h2 class="text-xl font-bold mb-4">Site Configuration</h2><p class="text-red-500">Not available: ${String((err && err.message) || err)}</p></div>`;
  if (!data) return html`<div class="card"><h2 class="text-xl font-bold mb-4">Site Configuration</h2><p class="text-gray-500 text-sm">Loading...</p></div>`;
  
  const f = (n, v, t) => t==='textarea'
    ? html`<div class="mb-3"><label class="block text-xs font-medium text-gray-600 mb-1">${v}</label><textarea id="field_${n}" rows="3" class="input"></textarea></div>`
    : html`<div class="mb-3"><label class="block text-xs font-medium text-gray-600 mb-1">${v}</label><input id="field_${n}" class="input"></div>`;
  const gv = id => { const e = document.getElementById('field_'+id); return e ? e.value : ''; };
  const sv = (nm, v) => { const e = document.getElementById('field_'+nm); if(e) e.value = v||''; };
  
  // Fill the uncontrolled inputs once the row has arrived (the old code used a 50 ms setTimeout
  // racing the commit; a data-keyed effect cannot lose that race).
  useEffect(() => {
    if (!data) return;
    sv('title',data.title);sv('description',data.description);sv('keywords',data.keywords);
    sv('canonical_url',data.canonical_url);sv('og_title',data.og_title);sv('og_description',data.og_description);
    sv('og_image_url',data.og_image_url);sv('favicon_url',data.favicon_url);
    sv('ga_id',data.ga_id);sv('gtm_id',data.gtm_id);sv('head_scripts',data.head_scripts);sv('body_scripts',data.body_scripts);
    sv('legal_tos',data.legal_tos);sv('legal_privacy',data.legal_privacy);sv('legal_refunds',data.legal_refunds);
    sv('schema_json',data.schema_json);
  }, [data]);
  
  const save = async () => {
    const b = {};
    b.title=gv('title');b.description=gv('description');b.keywords=gv('keywords');
    b.canonical_url=gv('canonical_url');b.og_title=gv('og_title');b.og_description=gv('og_description');
    b.og_image_url=gv('og_image_url');b.favicon_url=gv('favicon_url');
    b.ga_id=gv('ga_id');b.gtm_id=gv('gtm_id');b.head_scripts=gv('head_scripts');b.body_scripts=gv('body_scripts');
    b.legal_tos=gv('legal_tos');b.legal_privacy=gv('legal_privacy');b.legal_refunds=gv('legal_refunds');
    b.schema_json=gv('schema_json');
    const st = document.getElementById('sc_status');
    if(st){st.textContent='Saving...';st.className='text-sm ml-3 text-blue-600';}
    try {
      const r = await API.put('/admin/site',b);
      const w = (r && r.static_pages && r.static_pages.writer) ? r.static_pages.within_minutes : 5;
      if(st){st.textContent='Saved — materialized on the host within ' + w + ' minutes';st.className='text-sm ml-3 text-green-600';}
    } catch(e) {
      if(st){st.textContent='Not saved: ' + ((e && e.message) || 'request failed');st.className='text-sm ml-3 text-red-600';}
    }
  };
  
  return html`<div class="card"><h2 class="text-xl font-bold mb-4">Site Configuration</h2><p class="text-xs text-gray-500 mb-4">SEO, tracking, and the three legal pages. The fields below are saved immediately; the static pages at /terms.html, /privacy.html, /refunds.html and the marketing homepage are (re)generated from them on the host within 5 minutes (mcr-site-apply.sh).</p>
    <div class="border rounded-lg p-4 mb-4"><h3 class="font-semibold mb-3">🔍 SEO & Meta</h3>
      ${f('title','Page Title')}${f('description','Meta Description','textarea')}${f('keywords','Keywords','textarea')}
      ${f('canonical_url','Canonical URL')}${f('og_title','OG Title')}${f('og_description','OG Description','textarea')}
      ${f('og_image_url','OG Image URL')}${f('favicon_url','Favicon URL')}
    </div>
    <div class="border rounded-lg p-4 mb-4"><h3 class="font-semibold mb-3">📊 Analytics & Tracking</h3>
      ${f('ga_id','Google Analytics ID')}${f('gtm_id','Google Tag Manager ID')}
      ${f('head_scripts','Head Scripts','textarea')}${f('body_scripts','Body Scripts','textarea')}
    </div>
    <div class="border rounded-lg p-4 mb-4"><h3 class="font-semibold mb-3">⚖️ Legal Pages</h3>
      <p class="text-xs text-gray-400 mb-2">Rendered at /terms.html, /privacy.html, /refunds.html</p>
      ${f('legal_tos','Terms of Service','textarea')}${f('legal_privacy','Privacy Policy','textarea')}${f('legal_refunds','Refund & Cancellation Policy','textarea')}
    </div>
    <div class="border rounded-lg p-4 mb-4"><h3 class="font-semibold mb-3">📋 Structured Data</h3>
      ${f('schema_json','Schema.org JSON','textarea')}
    </div>
    <button class="btn" onClick=${save}>Save Configuration</button><span id="sc_status" class="text-sm ml-3"></span>
  </div>`;
};


  const views = { dashboard: Dashboard, portfolio: Portfolio, rules: ResponseRules, templates: Templates, contacts: Contacts, 'site-config': SiteConfig, leads: Leads, deals: Deals, workflows: Workflows, campaigns: Campaigns, tickets: Tickets, clients: Clients, calendar: CalendarView, lists: Lists, core: CoreIntegration, 'ops': OpsConsole};
  const CurrentView = views[S.view] || Dashboard;

  return html`<div class="flex w-full">
    <div class="sidebar w-56 bg-white border-r border-gray-200 min-h-screen p-3 flex flex-col" style="flex-shrink:0">
      <div class="flex items-center gap-2 px-3 py-4 mb-2">
        <span class="text-2xl">📞</span>
        <span class="nav-text font-bold text-gray-800">MissedCall</span>
      </div>
      <div class="flex-1 space-y-1">
        ${nav.map(n => html`<div class="nav-item ${S.view === n.id ? 'active' : ''}" onClick=${() => { S.view = n.id; renderApp(); }}>
          <span>${n.icon}</span><span class="nav-text">${n.label}</span>
        </div>`)}
      </div>
      <div class="nav-item text-red-500 mt-auto" onClick=${() => { API.logout(); S.view = 'dashboard'; renderApp(); }}>
        <span>🚪</span><span class="nav-text">Logout</span>
      </div>
    </div>
    <div class="main flex-1 p-6 overflow-auto">
      <${CurrentView} />
    </div>
  </div>`;
};

const renderApp = () => render(html`<${App} />`, document.getElementById('app'));
renderApp();
</script>
</body>
</html>
