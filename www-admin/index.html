<body class="min-h-screen">
<div id="app" class="flex min-h-screen"></div>

<script type="module">
import { h, render } from 'https://esm.sh/preact@10.26.4';
import htm from 'https://esm.sh/htm@3.1.1';
const html = htm.bind(h);
const showUpgradePrompt = (msg) => {
  const div = document.createElement("div");
  div.className = "upgrade-overlay";
  div.innerHTML = "<div class='upgrade-box'><h2>🚀 Upgrade Required</h2><p>" + (msg || "This feature requires a higher plan.") + "</p><button class='btn-upgrade' onclick=\"this.closest('.upgrade-overlay').remove()\">Got it</button></div>";
  document.body.appendChild(div);
  div.addEventListener("click", (e) => { if (e.target === div) div.remove(); });
};


const API = (() => {
  const base = window.location.origin + '/api/v1';
  let token = sessionStorage.getItem('mc_token');
  let user = JSON.parse(sessionStorage.getItem('mc_user') || 'null');

  const headers = () => ({ 'Content-Type': 'application/json', ...(token ? { 'Authorization': 'Bearer ' + token } : {}) });
  const handle = async (r) => { const d = await r.json(); if (!r.ok) throw new Error(d.error || d.message || 'Request failed'); return d; };
  const login = (e, p) => fetch(base + '/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email:e,password:p}) }).then(handle);
  const get = (p) => fetch(base + p, {headers:headers()}).then(handle).catch(e => { console.error(e); throw e; });
  const post = (p, b) => fetch(base + p, {method:'POST', headers:headers(), body:JSON.stringify(b)}).then(handle);
  const put = (p, b) => fetch(base + p, {method:'PUT', headers:headers(), body:JSON.stringify(b)}).then(handle);
  const del = (p) => fetch(base + p, {method:'DELETE', headers:headers()}).then(handle);
  return {
    login, get, post, put, del,
    get token(){ return token; },
    get user(){ return user; },
    setAuth(t, u){ token = t; user = u; sessionStorage.setItem('mc_token', t); sessionStorage.setItem('mc_user', JSON.stringify(u)); },
    logout(){ token = null; user = null; sessionStorage.removeItem('mc_token'); sessionStorage.removeItem('mc_user'); }
  };
})();

const S = { view: 'dashboard', loading: false, error: null, views: {} };
const _get = API.get, _post = API.post, _put = API.put, _del = API.del;
API.get = async (p) => _get(p).catch(e => { if (e.message && e.message.indexOf("Upgrade")>=0) showUpgradePrompt(e.message); throw e; });
API.post = async (p, b) => _post(p, b).catch(e => { if (e.message && e.message.indexOf("Upgrade")>=0) showUpgradePrompt(e.message); throw e; });
API.put = async (p, b) => _put(p, b).catch(e => { if (e.message && e.message.indexOf("Upgrade")>=0) showUpgradePrompt(e.message); throw e; });
API.del = async (p) => _del(p).catch(e => { if (e.message && e.message.indexOf("Upgrade")>=0) showUpgradePrompt(e.message); throw e; });

const viewState = (name, defaults = {}) => { if (!S.views[name]) S.views[name] = Object.assign({}, defaults); return S.views[name]; };

// ---- LOGIN ----
const LoginView = () => {
  let email = '', pw = '';
  const submit = async (e) => { e.preventDefault(); S.loading = true; S.error = null; renderApp();
    try { const r = await API.login(email, pw); API.setAuth(r.token, r.team_member || r.user); S.view = 'dashboard'; } catch(err) { S.error = err.message; }
    S.loading = false; renderApp();
  };
  return html`<div class="flex items-center justify-center min-h-screen w-full">
    <div class="card w-full max-w-sm mx-4">
      <div class="text-center mb-6">
        <div class="text-3xl mb-2">📞</div>
        <h1 class="text-xl font-bold text-gray-800">MissedCall Respondr</h1>
        <p class="text-sm text-gray-500 mt-1">Auto-Response Platform</p>
      </div>
      <form onSubmit=${submit} class="space-y-4">
        <div><label class="text-sm font-medium text-gray-600 block mb-1">Email</label><input type="email" class="input" value=${email} onInput=${e => email = e.target.value} placeholder="admin@company.com" required /></div>
        <div><label class="text-sm font-medium text-gray-600 block mb-1">Password</label><input type="password" class="input" value=${pw} onInput=${e => pw = e.target.value} placeholder="......" required /></div>
        ${S.error && html`<div class="text-red-600 text-sm bg-red-50 p-2 rounded-lg">${S.error}</div>`}
        <button type="submit" class="btn w-full">Sign In</button>
      </form>
    </div>
  </div>`;
};

// ---- PORTFOLIO ----
const Portfolio = () => {
  const st = viewState('portfolio', { list: [], showModal: false, editItem: null, search: '' });
  const load = async () => { try { const data = await API.get('/portfolio-companies'); st.list = Array.isArray(data) ? data : []; renderApp(); } catch(e) { console.error(e); } };
  if (!st._loaded) { st._loaded = true; load(); }

  const show = (item) => { st.editItem = item; st.showModal = true; renderApp(); };
  const hide = () => { st.showModal = false; renderApp(); };
  const save = async (data) => {
    try { if(st.editItem) await API.put('/portfolio-companies/' + st.editItem.id, data); else await API.post('/portfolio-companies', data); st.showModal = false; load(); } catch(e){ alert(e.message); }
  };
  const remove = async (id) => { if(!confirm('Delete this portfolio company?')) return; await API.del('/portfolio-companies/' + id); load(); };
  const impersonate = async (company) => {
    if(!confirm('Impersonate as ' + company.name + '?')) return;
    try {
      const r = await API.post('/admin/impersonate', { account_id: company.tenant_id || company.id });
      sessionStorage.setItem('impersonate_token', r.token);
      sessionStorage.setItem('impersonate_company', JSON.stringify(company));
      window.open('https://missedcallrespondr.com', '_blank');
    } catch(e) { alert('Impersonation failed: ' + e.message); }
  };

  const filtered = st.list.filter(c => !st.search || (c.name||'').toLowerCase().includes(st.search.toLowerCase()) || (c.slug||'').toLowerCase().includes(st.search.toLowerCase()) || (c.domain||'').toLowerCase().includes(st.search.toLowerCase()));

  return html`<div>
    <div class="flex items-center justify-between mb-4"><h2 class="text-xl font-bold">Portfolio Companies</h2><div class="flex gap-2 items-center"><input class="input" style="width:240px" placeholder="Search..." value=${st.search || ''} onInput=${e => { st.search = e.target.value; renderApp(); }} /><button class="btn btn-sm btn-green" onClick=${() => { show(null); }}>+ Add Company</button></div></div>
    <div class="card p-0 overflow-hidden">
      <table class="table"><thead><tr><th>Name</th><th>Slug</th><th>Actions</th></tr></thead>
        <tbody>${filtered.map(c => html`<tr>
          <td class="font-medium">${c.name}</td><td class="text-gray-500">${c.slug || c.domain || '-'}</td>
          <td><button class="btn btn-sm btn-blue" onClick=${() => impersonate(c)} title="Impersonate">🔑 Impersonate</button><button class="btn btn-sm btn-outline" onClick=${() => { show(c); }}>Edit</button><button class="btn btn-sm btn-red" onClick=${() => remove(c.id)}>Delete</button></td>
        </tr>`)}
        ${filtered.length === 0 && html`<tr><td colspan="3" class="text-center text-gray-400 py-8">No portfolio companies yet.</td></tr>`}
      </tbody></table>
    </div>
    ${st.showModal && html`<div class="modal" onClick=${e => e.target === e.currentTarget && (hide())}>
      <div class="modal-content"><h3 class="text-lg font-bold mb-4">${st.editItem ? 'Edit' : 'Add'} Portfolio Company</h3>
        ${(() => { let name = st.editItem?.name||'', slug = st.editItem?.slug||'';
          return html`<div class="space-y-3">
            <div><label class="text-sm font-medium block mb-1">Company Name</label><input class="input" value=${name} onInput=${e => name = e.target.value} /></div>
            <div><label class="text-sm font-medium block mb-1">Slug</label><input class="input" value=${slug} onInput=${e => slug = e.target.value} /></div>
            <div class="flex gap-2 justify-end mt-4">
              <button class="btn btn-outline" onClick=${() => { hide(); }}>Cancel</button>
              <button class="btn" onClick=${() => save({name,slug})}>${st.editItem ? 'Save' : 'Add'}</button>
            </div>
          </div>`; })()}
      </div>
    </div>`}
  </div>`;
};

        <div class="text-xs text-gray-500 mt-1">${ev.start_at ? new Date(ev.start_at).toLocaleString() : '-'}${ev.end_at ? ' → ' + new Date(ev.end_at).toLocaleString() : ''}</div>
        <div class="text-sm text-gray-600 mt-1">${ev.event_type || 'call'}</div>
        <div class="flex gap-2 mt-3"><button class="btn btn-sm btn-outline" onClick=${() => { show(ev); }}>Edit</button><button class="btn btn-sm btn-red" onClick=${() => remove(ev.id)}>Delete</button></div>
      </div>`)}
      ${st.list.length === 0 && html`<div class="col-span-full text-center text-gray-400 py-8">No calendar events yet.</div>`}
    </div>
    ${st.showModal && html`<div class="modal" onClick=${e => e.target === e.currentTarget && (hide())}>
      <div class="modal-content"><h3 class="text-lg font-bold mb-4">${st.editItem ? 'Edit' : 'Add'} Event</h3>
        ${(() => { let title = st.editItem?.title||'', event_type = st.editItem?.event_type||'call', start_at = st.editItem?.start_at||'';
          return html`<div class="space-y-3">
            <div><label class="text-sm font-medium block mb-1">Title</label><input class="input" value=${title} onInput=${e => title = e.target.value} /></div>
            <div><label class="text-sm font-medium block mb-1">Type</label><select class="input" value=${event_type} onChange=${e => event_type = e.target.value}><option value="call">Call</option><option value="meeting">Meeting</option><option value="follow-up">Follow-up</option></select></div>
            <div><label class="text-sm font-medium block mb-1">Start (UTC)</label><input class="input" type="datetime-local" value=${start_at ? start_at.slice(0,16) : ''} onInput=${e => start_at = e.target.value} /></div>
            <div class="flex gap-2 justify-end mt-4"><button class="btn btn-outline" onClick=${() => { hide(); }}>Cancel</button><button class="btn" onClick=${() => save({title, event_type, start_at: start_at ? new Date(start_at).toISOString() : null})}>${st.editItem ? 'Save' : 'Add'}</button></div>
          </div>`; })()}
      </div>
    </div>`}
  </div>`;
};

// ---- LISTS ----
const Lists = () => {
  const st = viewState('lists', { list: [], showModal: false, editItem: null, expanded: null, expandedLeads: [], campaigns: [] });
  const load = async () => {
    try { const data = await API.get('/lists'); st.list = Array.isArray(data) ? data : []; } catch(e) { console.error(e); }
    try { const c = await API.get('/campaigns'); st.campaigns = Array.isArray(c) ? c : []; } catch(e) { console.error(e); }
    renderApp(); };
  if (!st._loaded) { st._loaded = true; load(); }
  const show = (item) => { st.editItem = item; st.showModal = true; renderApp(); };
  const hide = () => { st.showModal = false; renderApp(); };
  const save = async (data) => { try { if(st.editItem) await API.put('/lists/' + st.editItem.id, data); else await API.post('/lists', data); st.showModal = false; load(); } catch(e){ alert(e.message); } };
  const remove = async (id) => { if(!confirm('Delete this list?')) return; await API.del('/lists/' + id); load(); };
  const toggleExpand = async (l) => {
    if (st.expanded === l.id) { st.expanded = null; st.expandedLeads = []; renderApp(); return; }
    st.expanded = l.id; st.expandedLeads = []; renderApp();
    try { const ld = await API.get('/lists/' + l.id + '/leads'); st.expandedLeads = Array.isArray(ld) ? ld : []; renderApp(); } catch(e){ console.error(e); } };
  const campaignName = (id) => { const f = st.campaigns.find(c => String(c.id) === String(id)); return f ? f.name : null; };
  return html`<div>
    <div class="flex items-center justify-between mb-4"><h2 class="text-xl font-bold">Lists</h2><button class="btn btn-sm btn-green" onClick=${() => { show(null); }}>+ Add List</button></div>
    <div class="card p-0 overflow-hidden">
      <table class="table"><thead><tr><th>Name</th><th>Campaign</th><th>Leads</th><th>Actions</th></tr></thead>
        <tbody>${st.list.map(l => html`<tr>
          <td class="font-medium">${l.name || '-'}</td>
          <td class="text-gray-500">${l.campaign_id ? (campaignName(l.campaign_id) || 'Linked') : '<span class="text-gray-400 text-sm">standalone</span>'}</td>
          <td><button class="btn btn-sm btn-outline" onClick=${() => toggleExpand(l)}>${st.expanded === l.id ? 'Hide' : 'View leads'}</button></td>
          <td><button class="btn btn-sm btn-outline" onClick=${() => { show(l); }}>Edit</button><button class="btn btn-sm btn-red" onClick=${() => remove(l.id)}>Delete</button></td>
        </tr>`)}
        ${st.expanded && html`<tr><td colspan="4" class="bg-gray-50"><div class="p-3"><div class="font-semibold text-sm mb-2">Leads in ${(st.list.find(l=>String(l.id)===String(st.expanded))||{}).name||'list'}</div>
          ${st.expandedLeads.length === 0 ? html`<p class="text-gray-400 text-sm">No leads in this list yet.</p>` : html`<table class="table"><thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Status</th><th>Tags</th></tr></thead><tbody>${st.expandedLeads.map(ld => html`<tr><td class="font-medium">${ld.name||'-'}</td><td class="text-gray-500">${ld.phone||'-'}</td><td class="text-gray-500">${ld.email||'-'}</td><td><span class="badge badge-blue">${ld.status||'new'}</span></td><td class="text-gray-500 text-sm">${(ld.tags||[]).join(', ')||'-'}</td></tr>`)}</tbody></table>`}
        </div></td></tr>`}
        ${st.list.length === 0 && html`<tr><td colspan="4" class="text-center text-gray-400 py-8">No lists yet. Create a campaign to auto-generate its list, or add a standalone list here.</td></tr>`}
      </tbody></table>
    </div>
    ${st.showModal && html`<div class="modal" onClick=${e => e.target === e.currentTarget && (hide())}>
      <div class="modal-content"><h3 class="text-lg font-bold mb-4">${st.editItem ? 'Edit' : 'Add'} List</h3>
        ${(() => { let name = st.editItem?.name||'', description = st.editItem?.description||'';
          return html`<div class="space-y-3">
            <div><label class="text-sm font-medium block mb-1">Name</label><input class="input" value=${name} onInput=${e => name = e.target.value} /></div>
            <div><label class="text-sm font-medium block mb-1">Description</label><input class="input" value=${description} onInput=${e => description = e.target.value} /></div>
            <div class="flex gap-2 justify-end mt-4"><button class="btn btn-outline" onClick=${() => { hide(); }}>Cancel</button><button class="btn" onClick=${() => save({name, description})}>${st.editItem ? 'Save' : 'Add'}</button></div>
          </div>`; })()}
      </div>
    </div>`}
  </div>`;
};

// ---- CORE INTEGRATION ----
const CoreIntegration = () => {
  const st = viewState('core', { status: null, lists: [], campaigns: [], checked: false });
  const load = async () => {
    try { const s = await API.get('/integrations/coreswift/status'); st.status = s; } catch(e) { st.status = { connected: false, error: e.message }; }
    try { const l = await API.get('/integrations/coreswift/lists'); st.lists = (l && l.lists) || (Array.isArray(l) ? l : []); } catch(e) { st.lists = []; }
    try { const c = await API.get('/campaigns'); st.campaigns = Array.isArray(c) ? c : []; } catch(e) { console.error(e); }
    st.checked = true; renderApp(); };
  if (!st._loaded) { st._loaded = true; load(); }
  return html`<div>
    <h2 class="text-xl font-bold mb-4">CoreSwift Integration</h2>
    ${!st.checked ? html`<p class="text-gray-500 text-sm">Checking...</p>` : html`
    <div class="card mb-4">
      <h3 class="font-semibold mb-2">Connection Status</h3>
      ${st.status && st.status.connected
        ? html`<span class="badge badge-green">✅ Connected</span><p class="text-sm text-gray-500 mt-2">CoreSwift is connected via your personal API key. Leads pushed to CoreSwift land in your account's contact pool / linked campaign lists.</p>`
        : html`<span class="badge badge-red">⚠️ Not connected</span><p class="text-sm text-gray-500 mt-2">Connect CoreSwift by adding a personal API key (<code>csk_...</code>) under <b>Settings → Integrations</b> with provider <code>coreswift</code>.</p>`}
    </div>
    <div class="card mb-4">
      <h3 class="font-semibold mb-2">Your CoreSwift Lists</h3>
      ${st.lists.length === 0 ? html`<p class="text-gray-400 text-sm">Connected? No lists found in CoreSwift.</p>`
        : html`<table class="table"><thead><tr><th>Name</th><th>ID</th></tr></thead><tbody>${st.lists.map(l => html`<tr><td class="font-medium">${l.name||l.title||'-'}</td><td class="text-gray-500">${l.id||'-'}</td></tr>`)}</tbody></table>`}
    </div>
    <div class="card">
      <h3 class="font-semibold mb-2">Campaign → CoreSwift List</h3>
      <p class="text-sm text-gray-500 mb-2">Leads that carry a campaign's linked tag are pushed to that campaign's own list (via CoreSwift contact sync) and appear under the campaign's list view.</p>
      <table class="table"><thead><tr><th>Campaign</th><th>Linked Tag</th><th>Auto list</th></tr></thead><tbody>${st.campaigns.map(c => html`<tr><td class="font-medium">${c.name||'-'}</td><td class="text-gray-500">${(c.metadata&&c.metadata.coreswift&&c.metadata.coreswift.tag_id)||'-'}</td><td class="text-gray-500">${c.name||'-'}</td></tr>`)}${st.campaigns.length===0&&html`<tr><td colspan="3" class="text-center text-gray-400 py-6">No campaigns yet.</td></tr>`}</tbody></table>
    </div>`}
  </div>`;
};

// ---- SHELL ----
const App = () => {
  if(!API.token) return html`<${LoginView} />`;

  const nav = [
    { id: 'dashboard', label: 'Dashboard', icon: '📊' },
    { id: 'portfolio', label: 'Portfolio', icon: '🏢' },
    { id: 'rules', label: 'Response Rules', icon: '⚙️' },
    { id: 'templates', label: 'Templates', icon: '📋' },
    { id: 'contacts', label: 'Contacts', icon: '👥' },
    { id: 'leads', label: 'Leads', icon: '🎯' },
    { id: 'deals', label: 'Deals', icon: '💰' },
    { id: 'workflows', label: 'Workflows', icon: '⚡' },
    { id: 'campaigns', label: 'Campaigns', icon: '📣' },
    { id: 'lists', label: 'Lists', icon: '📇' },
    { id: 'core', label: 'CoreSwift', icon: '🔗' },
    { id: 'tickets', label: 'Tickets', icon: '🎫' },
    { id: 'clients', label: 'Clients', icon: '🤝' },
    { id: 'calendar', label: 'Calendar', icon: '📅' },
      { id: 'site-config', label: 'Site Config', icon: '🌐' }
  ];

  const SiteConfig = () => {
  const [data, setData] = S.useState ? (() => { const [d, sd] = S.useState ? [null, null] : [null, null]; try { const [d2, sd2] = [S.__sc_data||null, (v) => { S.__sc_data=v; renderApp(); }]; return [d2, sd2]; } catch(e) { return [null, null]; } })() : [null, null];
  const loaded = S.__sc_loaded || false;
  if (!loaded) {
    S.__sc_loaded = true;
    API.get('/admin/site').then(d => {
      S.__sc_data = d;
      renderApp();
    }).catch(() => { S.__sc_error = true; renderApp(); });
  }
  if (S.__sc_error) return html`<div class="card"><h2 class="text-xl font-bold mb-4">Site Configuration</h2><p class="text-red-500">Not available.</p></div>`;
  if (!data) return html`<div class="card"><h2 class="text-xl font-bold mb-4">Site Configuration</h2><p class="text-gray-500 text-sm">Loading...</p></div>`;
  
  const hp = data.homepage || {};
  const f = (n, v, t) => t==='textarea'
    ? html`<div class="mb-3"><label class="block text-xs font-medium text-gray-600 mb-1">${v}</label><textarea id="field_${n}" rows="3" class="input"></textarea></div>`
    : html`<div class="mb-3"><label class="block text-xs font-medium text-gray-600 mb-1">${v}</label><input id="field_${n}" class="input"></div>`;
  const gv = id => { const e = document.getElementById('field_'+id); return e ? e.value : ''; };
  const sv = (nm, v) => { const e = document.getElementById('field_'+nm); if(e) e.value = v||''; };
  
  setTimeout(() => {
    sv('title',data.title);sv('description',data.description);sv('keywords',data.keywords);
    sv('canonical_url',data.canonical_url);sv('og_title',data.og_title);sv('og_description',data.og_description);
    sv('og_image_url',data.og_image_url);sv('favicon_url',data.favicon_url);
    sv('ga_id',data.ga_id);sv('gtm_id',data.gtm_id);sv('head_scripts',data.head_scripts);sv('body_scripts',data.body_scripts);
    sv('homepage_headline',hp.headline);sv('homepage_subheadline',hp.subheadline);
    sv('legal_tos',data.legal_tos);sv('legal_privacy',data.legal_privacy);sv('legal_refunds',data.legal_refunds);
    sv('schema_json',data.schema_json);
  }, 50);
  
  const save = async () => {
    const b = {};
    b.title=gv('title');b.description=gv('description');b.keywords=gv('keywords');
    b.canonical_url=gv('canonical_url');b.og_title=gv('og_title');b.og_description=gv('og_description');
    b.og_image_url=gv('og_image_url');b.favicon_url=gv('favicon_url');
    b.ga_id=gv('ga_id');b.gtm_id=gv('gtm_id');b.head_scripts=gv('head_scripts');b.body_scripts=gv('body_scripts');
    b.homepage={headline:gv('homepage_headline'),subheadline:gv('homepage_subheadline')};
    b.legal_tos=gv('legal_tos');b.legal_privacy=gv('legal_privacy');b.legal_refunds=gv('legal_refunds');
    b.schema_json=gv('schema_json');
    const st = document.getElementById('sc_status');
    if(st){st.textContent='Saving...';st.className='text-sm ml-3 text-blue-600';}
    const r = await API.put('/admin/site',b);
    if(st){if(r){st.textContent='Saved!';st.className='text-sm ml-3 text-green-600'}else{st.textContent='Error.';st.className='text-sm ml-3 text-red-600'}}
  };
  
  return html`<div class="card"><h2 class="text-xl font-bold mb-4">Site Configuration</h2><p class="text-xs text-gray-500 mb-4">SEO, tracking, legal pages, and homepage content. Saved changes regenerate the live marketing site.</p>
    <div class="border rounded-lg p-4 mb-4"><h3 class="font-semibold mb-3">🔍 SEO & Meta</h3>
      ${f('title','Page Title')}${f('description','Meta Description','textarea')}${f('keywords','Keywords','textarea')}
      ${f('canonical_url','Canonical URL')}${f('og_title','OG Title')}${f('og_description','OG Description','textarea')}
      ${f('og_image_url','OG Image URL')}${f('favicon_url','Favicon URL')}
    </div>
    <div class="border rounded-lg p-4 mb-4"><h3 class="font-semibold mb-3">📊 Analytics & Tracking</h3>
      ${f('ga_id','Google Analytics ID')}${f('gtm_id','Google Tag Manager ID')}
      ${f('head_scripts','Head Scripts','textarea')}${f('body_scripts','Body Scripts','textarea')}
    </div>
    <div class="border rounded-lg p-4 mb-4"><h3 class="font-semibold mb-3">🏠 Homepage</h3>
      ${f('homepage_headline','Headline','textarea')}${f('homepage_subheadline','Subheadline','textarea')}
    </div>
    <div class="border rounded-lg p-4 mb-4"><h3 class="font-semibold mb-3">⚖️ Legal Pages</h3>
      <p class="text-xs text-gray-400 mb-2">Rendered at /terms.html, /privacy.html, /refunds.html</p>
      ${f('legal_tos','Terms of Service','textarea')}${f('legal_privacy','Privacy Policy','textarea')}${f('legal_refunds','Refund & Cancellation Policy','textarea')}
    </div>
    <div class="border rounded-lg p-4 mb-4"><h3 class="font-semibold mb-3">📋 Structured Data</h3>
      ${f('schema_json','Schema.org JSON','textarea')}
    </div>
    <button class="btn" onClick=${save}>Save Configuration</button><span id="sc_status" class="text-sm ml-3"></span>
  </div>`;
};


  const views = { dashboard: Dashboard, portfolio: Portfolio, rules: ResponseRules, templates: Templates, contacts: Contacts, 'site-config': SiteConfig, leads: Leads, deals: Deals, workflows: Workflows, campaigns: Campaigns, tickets: Tickets, clients: Clients, calendar: CalendarView, lists: Lists, core: CoreIntegration };
  const CurrentView = views[S.view] || Dashboard;

  return html`<div class="flex w-full">
    <div class="sidebar w-56 bg-white border-r border-gray-200 min-h-screen p-3 flex flex-col" style="flex-shrink:0">
      <div class="flex items-center gap-2 px-3 py-4 mb-2">
        <span class="text-2xl">📞</span>
        <span class="nav-text font-bold text-gray-800">MissedCall</span>
      </div>
      <div class="flex-1 space-y-1">
        ${nav.map(n => html`<div class="nav-item ${S.view === n.id ? 'active' : ''}" onClick=${() => { S.view = n.id; renderApp(); }}>
          <span>${n.icon}</span><span class="nav-text">${n.label}</span>
        </div>`)}
      </div>
      <div class="nav-item text-red-500 mt-auto" onClick=${() => { API.logout(); S.view = 'dashboard'; renderApp(); }}>
        <span>🚪</span><span class="nav-text">Logout</span>
      </div>
    </div>
    <div class="main flex-1 p-6 overflow-auto">
      <${CurrentView} />
    </div>
  </div>`;
};

const renderApp = () => render(html`<${App} />`, document.getElementById('app'));
renderApp();
</script>
</body>
</html>
