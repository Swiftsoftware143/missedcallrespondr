[package]
name = "missedcallrespondr"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rand = "0.8"
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid", "rust_decimal"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
jsonwebtoken = "9"
argon2 = "0.5"
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
dotenvy = "0.15"
rust_decimal = { version = "1.42.1", features = ["serde"] }
ring = "0.17"
hex = "0.4"
url = "2"
serde_urlencoded = "0.7"
# The private inbox (kanban t_44028656, ported from ADASwift/CoreSwift): tenant credentials are
# sealed at rest with AES-256-GCM whose master is derived from JWT_SECRET.
aes-gcm = "0.10"
sha2 = "0.10"
async-trait = "0.1"
hmac = "0.12"
# The private inbox's SMTP provider arm (customer's own SMTP mailbox, ported from ADASwift).
lettre = { version = "0.11.22", features = ["tokio1", "tokio1-native-tls"] }
base64 = "0.22"

[dev-dependencies]
# Tests only: `ServiceExt::oneshot` drives a real Router through the middleware stack so the
# body-read deadline is proven to fire (kanban t_7f688018). tower 0.5 is already in the lock as
# axum's own dependency, so this adds no package — it only makes the trait nameable in tests, and
# the production graph's feature set is untouched.
tower = { version = "0.5", features = ["util"] }
# Tests only: a request body that never arrives is built from a `futures_core::Stream` via
# `Body::from_stream`. futures-core is already in the production graph (axum-core depends on it),
# so this makes the trait nameable in tests without adding a package.
futures-core = "0.3"
