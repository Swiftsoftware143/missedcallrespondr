<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MissedCall Respondr — Sign Up</title>
<link rel="stylesheet" href="/tailwind-base.css">
<style>
body{font-family:Inter,system-ui,sans-serif;background:#f8fafc;min-height:100vh;display:flex;align-items:center;justify-content:center;margin:0}
.card{background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.08);padding:32px;width:100%;max-width:420px}
.btn{background:#2563eb;color:#fff;padding:12px 20px;border-radius:8px;cursor:pointer;border:none;font-weight:500;width:100%;font-size:15px;transition:background .2s}
.btn:hover{background:#1d4ed8}
.btn:disabled{opacity:.6;cursor:not-allowed}
.input{border:1px solid #cbd5e1;border-radius:8px;padding:10px 14px;width:100%;font-size:14px;outline:0;box-sizing:border-box;transition:border-color .2s}
.input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.error{background:#fee2e2;color:#991b1b;padding:10px 14px;border-radius:8px;font-size:13px;display:none}
.success{background:#dcfce7;color:#166534;padding:10px 14px;border-radius:8px;font-size:13px;display:none}
</style>
</head>
<body>
<div class="card">
  <div style="text-align:center;margin-bottom:28px">
    <h1 style="font-size:24px;font-weight:700;color:#1e293b;margin:0">📞 MissedCall Respondr</h1>
    <p style="color:#64748b;font-size:14px;margin:6px 0 0">Create your free account</p>
  </div>
  <div class="error" id="error"></div>
  <div class="success" id="success"></div>
  <div id="planNote" style="display:none;background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0;border-radius:8px;padding:10px 14px;font-size:13px;line-height:1.5;margin-bottom:16px"></div>
  <form id="regForm" style="display:flex;flex-direction:column;gap:16px">
    <div>
      <label style="font-size:13px;font-weight:500;color:#475569;display:block;margin-bottom:6px">Full Name</label>
      <input type="text" class="input" id="name" placeholder="John Smith" required autocomplete="name" aria-label="Your name">
    </div>
    <div>
      <label style="font-size:13px;font-weight:500;color:#475569;display:block;margin-bottom:6px">Email</label>
      <input type="email" class="input" id="email" placeholder="you@company.com" required autocomplete="email" aria-label="Email">
    </div>
    <p style="font-size:12px;color:#64748b;margin:0">No password to choose — we'll email your login details so you can confirm your address by signing in.</p>
    <p style="font-size:12px;color:#64748b;margin:0">By creating an account you agree to our
      <a href="https://missedcallrespondr.com/terms" target="_blank" rel="noopener" style="color:#2563eb;text-decoration:none">Terms of Service</a> and
      <a href="https://missedcallrespondr.com/privacy" target="_blank" rel="noopener" style="color:#2563eb;text-decoration:none">Privacy Policy</a>.</p>
    <button type="submit" class="btn" id="submitBtn">Create Free Account</button>
  </form>
  <p style="text-align:center;color:#64748b;font-size:13px;margin-top:16px">
    Already have an account? <a href="/login" style="color:#2563eb;text-decoration:none;font-weight:500">Sign in</a>
  </p>
</div>

<script>
// A visitor who picks a card on missedcallrespondr.com/#pricing arrives here with ?plan=<slug>.
// Before this, every card linked to a bare /register/, so the pick vanished and the page's only
// plan word was "Create your free account" — a visitor who chose Pro Monthly had nothing telling
// them what the account would start on. The slugs are the three the catalogue actually serves
// (free, pro-monthly, enterprise); anything else is ignored. Every new account still STARTS on Free
// and no card is taken — the pick is filed with the server as a plan request the team can act on
// (cron 2026-10-23), so it is no longer dropped at the door.
var PLAN_LABELS = { 'free': 'Free', 'pro-monthly': 'Pro Monthly', 'enterprise': 'Enterprise' };
var pickedPlan = '';
(function () {
  var picked = (new URLSearchParams(location.search).get('plan') || '').trim().toLowerCase();
  var label = PLAN_LABELS[picked];
  if (!label || picked === 'free') return;
  pickedPlan = picked;
  var el = document.getElementById('planNote');
  el.textContent = 'You picked ' + label + '. We\'ll note that with your new account so the team '
    + 'can set your workspace up on it \u2014 nothing is charged at signup.';
  el.style.display = 'block';
})();
document.getElementById('regForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const err = document.getElementById('error');
  const ok = document.getElementById('success');
  err.style.display = 'none';
  ok.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Creating account...';

  const email = document.getElementById('email').value;
  const qEmail = encodeURIComponent(email);
  try {
    const res = await fetch('/api/v1/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      // David's signup model: NAME + EMAIL only. The server mints the login credentials and
      // emails them, so there is nothing to store here and NO auto-login — the user confirms
      // their address by signing in with the password we sent. The tier picked on the pricing
      // page rides along (cron 2026-10-23) and the server files it as a plan request the operator
      // can see, instead of dropping it at the door.
      body: JSON.stringify({
        name: document.getElementById('name').value,
        email: email,
        plan: pickedPlan || 'free'
      })
    });
    const data = await res.json();
    if (res.ok) {
      var escEmail = email.replace(/[<>&"]/g, '');
      ok.innerHTML = '<strong>Account created!</strong><br>Check your email — we sent your login details to ' + escEmail + '.' + (pickedPlan && PLAN_LABELS[pickedPlan] ? '<br><br>Your interest in ' + PLAN_LABELS[pickedPlan] + ' is noted \u2014 the team sets that up with you; nothing was charged.' : '') + '<br><br>You can change your password any time in your profile settings.'
        + '<div style="margin-top:12px;padding-top:10px;border-top:1px solid rgba(0,0,0,.08);font-size:13px">'
        + 'Nothing in your inbox after a minute? Check your spam folder, then '
        + '<a href="/forgot-password.html?email=' + qEmail + '" style="color:#2563eb;font-weight:600">send yourself a reset code</a>'
        + ' or <a href="/login" style="color:#2563eb;font-weight:600">sign in</a>.'
        + '</div>';
      ok.style.display = 'block';
      btn.textContent = 'Check your email';
      btn.disabled = true;
      return;
    } else {
      // An address that is ALREADY registered used to reach a dead end here: the server's
      // duplicate-email refusal was printed with nothing to press, right after the visitor had
      // picked a plan on the pricing page. Keep the refusal, then offer the two doors that help —
      // sign in to the account they already own, or have a reset code sent — with the address they
      // typed carried into both links. A paid pick is pointed at Plan & Billing, where the same
      // request is filed for the workspace they already have.
      var msg = String(data.error || data.message || 'Registration failed. Please try again.');
      var alreadyRegistered = res.status === 409 || /already exists/i.test(msg);
      err.innerHTML = msg.replace(/[<>&"]/g, '')
        + (alreadyRegistered
          ? '<div style="margin-top:8px;font-size:13px">'
            + '<a href="/login?email=' + qEmail + '" style="color:#2563eb;font-weight:600">Sign in to that account</a>'
            + ' or <a href="/forgot-password.html?email=' + qEmail + '" style="color:#2563eb;font-weight:600">send yourself a reset code</a>.'
            + (pickedPlan && PLAN_LABELS[pickedPlan]
              ? ' Once you are in, open Plan &amp; Billing and ask for ' + PLAN_LABELS[pickedPlan]
                + ' there \u2014 that files the same request this page would have filed.'
              : '')
            + '</div>'
          : '');
      err.style.display = 'block';
    }
  } catch (ex) {
    err.textContent = 'Network error. Please try again.';
    err.style.display = 'block';
  }
  btn.disabled = false;
  btn.textContent = 'Create Free Account';
});
</script>
</body>
</html>
