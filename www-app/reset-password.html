<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Choose a new password — MissedCall Respondr</title>
<meta name="robots" content="noindex">
<style>
:root{--page-bg:linear-gradient(135deg,#eef2ff,#e0e7ff);--card-bg:#ffffff;--heading:#1e1b4b;--text-primary:#16181d;--text-secondary:#4b5563;--accent:#6366f1;--accent-hover:#4f46e5;--border:#d1d5db;--surface-0:#f6f7fb;--surface-1:#eef0f6;--surface-2:#ffffff;--surface-3:#ffffff;--shadow-1:0 1px 3px rgba(16,24,40,.08);--shadow-2:0 8px 32px rgba(16,24,40,.16);--z-sticky:10;--z-dropdown:20;--z-modal:30;--z-toast:40;color-scheme:light}
html[data-theme="dark"]{--page-bg:linear-gradient(135deg,#1e1b4b,#312e81);--card-bg:#1a1d27;--heading:#e8eaed;--text-primary:#e8eaed;--text-secondary:#9aa0a6;--accent:#818cf8;--accent-hover:#a5b4fc;--border:#2d3148;--surface-0:#0f1117;--surface-1:#1a1d27;--surface-2:#222532;--surface-3:#2a2d3a;--shadow-1:0 1px 3px rgba(0,0,0,.35);--shadow-2:0 8px 32px rgba(0,0,0,.5);color-scheme:dark}
.theme-toggle{position:fixed;left:16px;bottom:16px;z-index:var(--z-toast);display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;border:1px solid var(--border);background:var(--card-bg);color:var(--text-primary);font-size:13px;font-weight:600;cursor:pointer;box-shadow:var(--shadow-1);font-family:inherit}
.theme-toggle:hover{border-color:var(--accent)}
html[data-theme="dark"] .msg.e{background:rgba(239,68,68,.15);color:#fca5a5}
html[data-theme="dark"] .msg.o{background:rgba(34,197,94,.15);color:#4ade80}
html[data-theme="dark"] .msg.i{background:rgba(99,102,241,.15)}

*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:var(--page-bg);display:flex;justify-content:center;align-items:center;min-height:100vh;padding:24px}
.c{background:var(--card-bg);border-radius:12px;padding:40px;width:400px;max-width:95vw;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.c h1{font-size:22px;color:var(--heading);margin-bottom:4px}
.c p.sub{font-size:13px;color:var(--text-secondary);margin-bottom:24px;line-height:1.5}
.c label{display:block;font-size:12px;font-weight:600;color:var(--text-secondary);margin:0 0 6px}
.c input{width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;font-size:14px;margin-bottom:12px;display:block;outline:none;background:var(--card-bg);color:var(--text-primary)}
.c input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(99,102,241,.15)}
.c button{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer}
.c button:hover{background:var(--accent-hover)}
.c button:disabled{opacity:.5}
.msg{padding:10px;border-radius:6px;font-size:13px;margin-top:12px;display:none}
.msg.e{background:#fee2e2;color:#991b1b;display:block}
.msg.o{background:#d1fae5;color:#065f46;display:block}
.msg.i{color:var(--accent);display:block}
.lk{margin-top:16px;font-size:12px;border-top:1px solid var(--border);padding-top:14px;text-align:center}
.lk a{color:var(--accent);cursor:pointer;text-decoration:none}
</style>
<script>
(function(){try{var t=localStorage.getItem('mc_theme');if(!t)t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light');}catch(e){document.documentElement.setAttribute('data-theme','light');}})();
</script>
</head>
<body>
<button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle day/night mode"><span id="theme-toggle-icon" aria-hidden="true">🌙</span><span id="theme-toggle-label">Night mode</span></button>
<script>
(function(){var b=document.getElementById('theme-toggle');if(!b)return;function p(){var d=document.documentElement.getAttribute('data-theme')==='dark';var i=document.getElementById('theme-toggle-icon');var l=document.getElementById('theme-toggle-label');if(i)i.textContent=d?'☀️':'🌙';if(l)l.textContent=d?'Day mode':'Night mode';}b.addEventListener('click',function(){var n=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('mc_theme',n);}catch(e){}p();});p();})();
</script>

<div class="c">
<h1>Choose a new password</h1>
<p class="sub" id="sub">Enter the reset code from your email, then choose a new password.</p>

<form id="f" onsubmit="return S(event)">
  <label for="c">Reset code</label>
  <input id="c" type="text" autocapitalize="off" autocomplete="one-time-code" placeholder="Paste the code from your email" required>
  <label for="p">New password</label>
  <input id="p" type="password" placeholder="At least 8 characters" autocomplete="new-password" required minlength="8">
  <label for="p2">Confirm new password</label>
  <input id="p2" type="password" placeholder="Repeat the new password" autocomplete="new-password" required minlength="8">
  <button id="b" type="submit">Set new password</button>
</form>

<form id="rf" onsubmit="return R(event)" style="display:none">
  <label for="e">Account email</label>
  <input id="e" type="email" placeholder="you@company.com" autocomplete="email" required>
  <button id="rb" type="submit">Email me a reset code</button>
</form>

<div id="m" class="msg"></div>
<div class="lk" id="sw"><a id="swl">Need a new code? Request one &rarr;</a></div>
<div class="lk"><a href="/login">&larr; Back to sign in</a></div>
</div>
<script>
(function(){
  var TOKEN = new URLSearchParams(window.location.search).get("token") || "";
  var f=document.getElementById("f"), rf=document.getElementById("rf"),
      m=document.getElementById("m"), b=document.getElementById("b"),
      sub=document.getElementById("sub"), code=document.getElementById("c"),
      sw=document.getElementById("sw");
  function say(k,t){m.className="msg "+k;m.textContent=t;}
  // The reset email carries the CODE (the app's own `password_reset` template renders
  // "Your password reset code is: {token}" and nothing else — there is no link), so the page must
  // accept the code TYPED. Before this fix the page only read a `?token=` query param and offered no
  // field, so a user holding a valid code had no way to set a password (measured 2026-10-10: the
  // served page had 0 code inputs and the email body carried no URL). A link that does carry the
  // token still works: it is pre-filled here.
  if(TOKEN){code.value=TOKEN;}
  code.focus();
  window.S=function(ev){
    ev.preventDefault();
    var c=code.value.trim(),p=document.getElementById("p").value,p2=document.getElementById("p2").value;
    if(!c){say("e","Enter the reset code from your email.");return false;}
    if(p.length<8){say("e","Password must be at least 8 characters.");return false;}
    if(p!==p2){say("e","The two passwords do not match.");return false;}
    b.disabled=true;say("i","Saving your new password...");
    fetch("/api/v1/auth/reset-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:c,new_password:p})})
      .then(function(r){return r.json().then(function(d){return {ok:r.ok,d:d}})})
      .then(function(x){
        if(!x.ok) throw new Error(x.d.error||x.d.message||"Could not reset the password");
        f.style.display="none";sw.style.display="none";
        say("o","Password updated. You can sign in with your new password now. Redirecting...");
        setTimeout(function(){window.location.href="/login"},1800);
      })
      .catch(function(err){say("e",err.message);b.disabled=false});
    return false;
  };
  document.getElementById("swl").addEventListener("click",function(ev){
    ev.preventDefault();
    f.style.display="none";sw.style.display="none";rf.style.display="block";
    sub.textContent="Enter your account email and we will send you a reset code.";
    m.className="msg";
    document.getElementById("e").focus();
  });
  window.R=function(ev){
    ev.preventDefault();
    var rb=document.getElementById("rb"),e=document.getElementById("e").value.trim();
    if(!e){say("e","Enter your email address");return false;}
    rb.disabled=true;say("i","Sending...");
    fetch("/api/v1/auth/forgot-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:e})})
      .then(function(r){return r.json().then(function(d){return {ok:r.ok,d:d}})})
      .then(function(x){
        if(!x.ok) throw new Error(x.d.error||x.d.message||"Request failed");
        rf.style.display="none";f.style.display="block";
        sub.textContent="Enter the reset code from your email, then choose a new password.";
        say("i","If that email exists, a reset code is on its way. Enter the code below.");
        code.focus();
      })
      .catch(function(err){say("e",err.message);rb.disabled=false});
    return false;
  };
})();
</script>
</body>
</html>
