<!DOCTYPE html>
<html lang="en">
<head>
<!-- AUTH GUARD — canonical login redirect -->
<script>
!function(){
  var p = window.location.pathname;
  if (p === '/login' || p === '/login.html' || p.startsWith('/api/') || p.startsWith('/ref/')) return;
  // This app's login writes `mc_token` to SESSION storage and nothing to localStorage, so a
  // signed-in user was carrying no key this guard looked at: the app root answered them with a
  // SECOND sign-in form for a session they already had (measured 2026-10-12). Either store now
  // means "signed in" and the app belongs at /dashboard/, which answers an anonymous visitor with
  // its own sign-in screen - so the fallback is safe even when the session is stale.
  var t = sessionStorage.getItem('mc_token')
       || localStorage.getItem('ws_fs_token') || localStorage.getItem('token') || localStorage.getItem('access_token');
  if (!t) { window.location.replace('/login'); return; }
  window.location.replace('/dashboard/');
}();
</script>

<!-- The app root's own favicon pair (kanban t_81bbc2b6). app.missedcallrespondr.com answered
     `404 text/html 162` for /favicon.ico and /favicon.svg, and this shell declared no icon, so a real
     Chromium load (the inline auth guard below answers the root from /login.html) issued the browser's
     automatic `GET /favicon.ico` and 404'd it — a failed sub-resource on every page load
     (/opt/swift/audits/t_81bbc2b6/10-chromium-before.txt). The bytes are the SAME pair the console and
     the marketing root ship (one generation, bin/mcr-make-favicon.py writes all three roots), so the
     app carries one mark. Files are published by bin/publish-missedcallrespondr-frontend.sh. -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="alternate icon" href="/favicon.ico">
<link rel="stylesheet" href="/tailwind-base.css">
<style>
body{font-family:Inter,system-ui,sans-serif;background:#f8fafc;min-height:100vh;display:flex;align-items:center;justify-content:center;margin:0}
.card{background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.08);padding:32px;width:100%;max-width:400px}
.btn{background:#2563eb;color:#fff;padding:10px 20px;border-radius:8px;cursor:pointer;border:none;font-weight:500;width:100%;font-size:15px;transition:background .2s}
.btn:hover{background:#1d4ed8}
.btn:disabled{opacity:.6;cursor:not-allowed}
.input{border:1px solid #cbd5e1;border-radius:8px;padding:10px 14px;width:100%;font-size:14px;outline:0;box-sizing:border-box;transition:border-color .2s}
.input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.error{background:#fee2e2;color:#991b1b;padding:10px 14px;border-radius:8px;font-size:13px;display:none}
.spinner{animation:spin .6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.tab-content{display:none}.tab-content.active{display:block}
</style>
</head>
<body>
<div class="card">
  <div style="text-align:center;margin-bottom:28px">
    <h1 style="font-size:24px;font-weight:700;color:#1e293b;margin:0">MissedCall Respondr</h1>
    <p style="color:#64748b;font-size:14px;margin:6px 0 0">Sign in to your account</p>
  </div>
  <div class="error" id="error"></div>
  <div class="tab-content active" id="loginTab">
  <form id="loginForm" style="display:flex;flex-direction:column;gap:16px">
    <div>
      <label style="font-size:13px;font-weight:500;color:#475569;display:block;margin-bottom:6px">Email</label>
      <input type="email" class="input" id="email" placeholder="you@company.com" required autocomplete="email">
    </div>
    <div>
      <label style="font-size:13px;font-weight:500;color:#475569;display:block;margin-bottom:6px">Password</label>
      <input type="password" class="input" id="password" placeholder="••••••••" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn" id="submitBtn">Sign In</button>
    <p style="text-align:center;margin:10px 0 0"><a href="/forgot-password.html" style="color:#2563eb;font-size:13px">Forgot password?</a></p>
  </form>  </div>
  <p style="text-align:center;margin:14px 0 0"><a href="/register/" style="color:#2563eb;font-size:13px">Create an account</a></p>
  <p style="text-align:center;font-size:12px;color:#94a3b8;margin-top:20px">MissedCall Respondr &copy; 2026 &middot; <a href="/guide.html" target="_blank" rel="noopener" style="color:#2563eb">User Guide</a></p>
</div>

<script>
const API_BASE = window.location.origin + '/api/v1';
const TOKEN_KEY = 'mc_token';
const USER_KEY = 'mc_user';

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('error');
  const btn = document.getElementById('submitBtn');
  errorEl.style.display = 'none';
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner" style="display:inline-block;width:16px;height:16px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;margin-right:8px;vertical-align:middle"></span> Signing in...';

  try {
    const res = await fetch(API_BASE + '/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || data.message || 'Invalid credentials');
    
    sessionStorage.setItem(TOKEN_KEY, data.token);
    sessionStorage.setItem(USER_KEY, JSON.stringify(data.team_member || data));
    window.location.href = '/dashboard';
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Sign In';
  }
});

const token = sessionStorage.getItem(TOKEN_KEY);
const user = sessionStorage.getItem(USER_KEY);
if (token && user) {
  window.location.href = '/dashboard';
}
</script>
</body>
</html>
