<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Forgot password — MissedCall Respondr</title>
<style>
:root{--page-bg:linear-gradient(135deg,#eef2ff,#e0e7ff);--card-bg:#ffffff;--heading:#1e1b4b;--text-primary:#16181d;--text-secondary:#4b5563;--accent:#6366f1;--accent-hover:#4f46e5;--border:#d1d5db;--surface-0:#f6f7fb;--surface-1:#eef0f6;--surface-2:#ffffff;--surface-3:#ffffff;--shadow-1:0 1px 3px rgba(16,24,40,.08);--shadow-2:0 8px 32px rgba(16,24,40,.16);--z-sticky:10;--z-dropdown:20;--z-modal:30;--z-toast:40;color-scheme:light}
html[data-theme="dark"]{--page-bg:linear-gradient(135deg,#1e1b4b,#312e81);--card-bg:#1a1d27;--heading:#e8eaed;--text-primary:#e8eaed;--text-secondary:#9aa0a6;--accent:#818cf8;--accent-hover:#a5b4fc;--border:#2d3148;--surface-0:#0f1117;--surface-1:#1a1d27;--surface-2:#222532;--surface-3:#2a2d3a;--shadow-1:0 1px 3px rgba(0,0,0,.35);--shadow-2:0 8px 32px rgba(0,0,0,.5);color-scheme:dark}
.theme-toggle{position:fixed;left:16px;bottom:16px;z-index:var(--z-toast);display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;border:1px solid var(--border);background:var(--card-bg);color:var(--text-primary);font-size:13px;font-weight:600;cursor:pointer;box-shadow:var(--shadow-1);font-family:inherit}
.theme-toggle:hover{border-color:var(--accent)}
html[data-theme="dark"] .msg.e{background:rgba(239,68,68,.15);color:#fca5a5}
html[data-theme="dark"] .msg.o{background:rgba(34,197,94,.15);color:#4ade80}
html[data-theme="dark"] .msg.i{background:rgba(99,102,241,.15)}

*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:var(--page-bg);display:flex;justify-content:center;align-items:center;min-height:100vh}
.c{background:var(--card-bg);border-radius:12px;padding:40px;width:400px;max-width:95vw;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.c h1{font-size:22px;color:var(--heading);margin-bottom:4px}
.c p.sub{font-size:13px;color:var(--text-secondary);margin-bottom:24px}
.c input{width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;font-size:14px;margin-bottom:12px;display:block;outline:none;background:var(--card-bg);color:var(--text-primary)}
.c input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(99,102,241,.15)}
.c button{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer}
.c button:hover{background:var(--accent-hover)}
.c button:disabled{opacity:.5}
.msg{padding:10px;border-radius:6px;font-size:13px;margin-top:12px;display:none}
.msg.e{background:#fee2e2;color:#991b1b;display:block}
.msg.o{background:#d1fae5;color:#065f46;display:block}
.msg.i{color:var(--accent);display:block}
.lk{margin-top:16px;font-size:12px;border-top:1px solid var(--border);padding-top:14px;text-align:center}
.lk a{color:var(--accent)}
.sup{margin-top:12px;font-size:12px;line-height:1.55;color:var(--text-secondary);text-align:center}
.sup a{color:var(--accent)}
</style>
<script>
(function(){try{var t=localStorage.getItem('mc_theme');if(!t)t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light');}catch(e){document.documentElement.setAttribute('data-theme','light');}})();
</script>
</head>
<body>
<button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle day/night mode"><span id="theme-toggle-icon" aria-hidden="true">🌙</span><span id="theme-toggle-label">Night mode</span></button>
<script>
(function(){var b=document.getElementById('theme-toggle');if(!b)return;function p(){var d=document.documentElement.getAttribute('data-theme')==='dark';var i=document.getElementById('theme-toggle-icon');var l=document.getElementById('theme-toggle-label');if(i)i.textContent=d?'☀️':'🌙';if(l)l.textContent=d?'Day mode':'Night mode';}b.addEventListener('click',function(){var n=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('mc_theme',n);}catch(e){}p();});p();})();
</script>

<div class="c">
<h1>Reset your password</h1>
<p class="sub">We'll email you a reset code to choose a new one.</p>
<form id="f" onsubmit="return S(event)">
  <input id="e" type="email" placeholder="you@company.com" autocomplete="email" required aria-label="Email">
  <button id="b" type="submit">Email me a reset code</button>
</form>
<div id="m" class="msg"></div>
<div class="lk"><a href="/login">&larr; Back to sign in</a></div>
<p class="sup">No code arriving? Check the spam folder first, then write to <a href="/contact.html">our contact page</a> and we will get you back in.</p>
</div>
<script>
/* Prefill from ?email= so the signup success panel's "send yourself a reset code" link lands
   with the address already filled in — the customer typed it seconds ago and should not have to
   type it again to recover the mail that did not arrive. No query param -> unchanged behaviour. */
(function(){try{var q=new URLSearchParams(location.search).get("email")||"";if(q){document.getElementById("e").value=q;}}catch(ex){}})();
function S(ev){
  ev.preventDefault();
  var e=document.getElementById("e").value.trim(),m=document.getElementById("m"),b=document.getElementById("b");
  if(!e){m.className="msg e";m.textContent="Enter your email address";return false}
  m.className="msg i";m.textContent="Sending...";b.disabled=true;
  fetch("/api/v1/auth/forgot-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:e})})
    .then(function(r){return r.json().then(function(d){return {ok:r.ok,d:d}})})
    .then(function(x){
      if(!x.ok) throw new Error(x.d.error||x.d.message||"Request failed");
      m.className="msg o";m.textContent="If that email exists, a reset code is on its way. Enter it on the next page to choose a new password.";
      setTimeout(function(){window.location.href="/reset-password.html"},2200);
    })
    .catch(function(err){m.className="msg e";m.textContent=err.message;b.disabled=false});
  return false;
}
</script>
</body>
</html>
