    // Deleting a contact frees one slot, so the cap gate must lift with it — otherwise the
    // customer who just made room still faces a disabled "+ New Contact".
    try { await API.del('/contacts/' + c.id); st.notice = 'Contact deleted'; st.gated = null; }
    catch (e) { st.error = 'Could not delete the contact: ' + e.message; }
    st.busy = null; load();
  };

  const openValues = async (c) => {
    st.showValues = c; st.values = {}; st.error = null; renderApp();
    const seed = (c.custom_fields || []).reduce((a, f) => { a[f.field_id] = f.value == null ? '' : f.value; return a; }, {});
    if (Object.keys(seed).length) { st.values = seed; renderApp(); return; }
    try {
      const d = await API.get('/contacts/' + c.id + '/fields');
      (d.custom_fields || []).forEach(f => { st.values[f.field_id] = f.value == null ? '' : f.value; });
    } catch (e) { /* no values yet is not an error */ }
    renderApp();
  };
  const saveValues = async () => {
    const c = st.showValues; if (!c) return;
    st.busy = 'values'; st.error = null; renderApp();
    try {
      for (const f of st.fields) {
        const v = st.values[fieldKey(f)];
        if (v === undefined) continue;
        await API.put('/contacts/' + c.id + '/fields/' + fieldKey(f), { value: v });
      }
      st.notice = 'Saved custom fields for ' + (c.name || c.phone || 'contact');
      st.showValues = null; st.busy = null; load();
    } catch (e) { st.error = 'Could not save field values: ' + e.message; st.busy = null; renderApp(); }
  };

  // The roster had no way OUT of the app: Calls could export a CSV and Contacts could not
  // (measured 2026-10-31). Same shape as the Calls export — the server answers text/csv with a
  // dated filename, so the browser saves `contacts-YYYY-MM-DD.csv` rather than showing a blob.
  const exportCsv = async () => {
    st.error = null; st.notice = null; renderApp();
    try {
      const r = await fetch(window.location.origin + '/api/v1/contacts/export', { headers: { 'Authorization': 'Bearer ' + API.token } });
      if (!r.ok) {
        let m = 'Export failed (' + r.status + ')';
        try { const j = await r.json(); m = j.error || j.message || m; } catch (e) { /* not JSON */ }
        throw new Error(m);
      }
      const url = URL.createObjectURL(await r.blob());
      const a = document.createElement('a');
      a.href = url; a.download = 'contacts.csv';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      st.notice = 'Contact list exported as contacts.csv';
    } catch (e) { st.error = 'Could not export the contact list: ' + e.message; }
    renderApp();
  };

  const rows = st.list.slice(0, 100);
  return html`<div>
    <div class="flex items-center justify-between mb-4" style="flex-wrap:wrap;gap:8px">
      <h2 class="text-xl font-bold">Contacts</h2>
      <div class="flex items-center gap-2" style="flex-wrap:wrap">
        <input class="input" style="width:240px;max-width:100%" placeholder="Search name, phone, email..." value=${st.search || ''} onInput=${e => onSearch(e.target.value)} />
        <button class="btn btn-sm btn-green" onClick=${() => showContact(null)} disabled=${!!st.gated}>+ New Contact</button>
        <button class="btn btn-sm btn-outline" onClick=${() => { st.showFields = !st.showFields; renderApp(); }}>Custom fields (${st.fields.length})</button>
        <button class="btn btn-sm btn-outline" onClick=${() => load()}>Refresh</button>
        <button class="btn btn-sm btn-outline" onClick=${exportCsv}>Export CSV</button>
      </div>
    </div>
    ${st.searching && html`<p class="text-xs text-gray-400 mb-2">Searching…</p>`}
    ${st.error && html`<div class="card" style="border-left:4px solid #dc2626"><p class="text-sm text-red-700">${st.error}</p></div>`}
    ${st.notice && html`<div class="card" style="border-left:4px solid #059669"><p class="text-sm text-gray-700">${st.notice}</p></div>`}
    ${st.gated && html`<div class="card" id="contacts-gated" style="border-left:4px solid #b45309">
      <p class="text-sm text-gray-700">${st.gated}</p>
      <p class="text-xs text-gray-500 mt-2">Nothing was saved and your existing contacts are untouched. A bigger plan raises the allowance.</p>
      <button type="button" class="btn btn-sm mt-3" onClick=${() => { S.view = 'billing'; renderApp(); }}>See the plans</button>
    </div>`}
    ${st.showFields && html`<div class="card">
      <h3 class="font-semibold mb-2">Custom field definitions</h3>
      <table class="table mb-3"><thead><tr><th>Name</th><th>Type</th><th>Order</th><th></th></tr></thead>
        <tbody>${st.fields.map(f => html`<tr><td class="font-medium">${f.field_name}</td><td class="text-gray-500">${f.field_type}</td><td class="text-gray-500">${f.field_order}</td>
          <td><button class="btn btn-sm btn-red" disabled=${st.busy === f.id} onClick=${() => removeField(f)}>Delete</button></td></tr>`)}
          ${st.fields.length === 0 && html`<tr><td colspan="4" class="text-center text-gray-400 py-4">No custom fields defined yet.</td></tr>`}
        </tbody></table>
      <div class="flex items-end gap-2">
        <div><label class="text-sm font-medium block mb-1">Field name</label><input class="input" value=${st.draft.name || ''} onInput=${e => { st.draft.name = e.target.value; }} /></div>
        <div><label class="text-sm font-medium block mb-1">Type</label><select class="input" onChange=${e => { st.draft.type = e.target.value; }}>
          <option value="text">text</option><option value="number">number</option><option value="date">date</option><option value="boolean">boolean</option></select></div>
        <div><label class="text-sm font-medium block mb-1">Order</label><input class="input" style="width:80px" value=${String(st.draft.order || 0)} onInput=${e => { st.draft.order = e.target.value; }} /></div>
        <button class="btn btn-sm btn-green" disabled=${st.busy === 'addfield'} onClick=${addField}>Add field</button>
      </div>
    </div>`}
    <div class="card p-0 overflow-hidden">
      <table class="table"><thead><tr><th>Name</th><th>Phone</th><th>Email</th>${st.fields.map(f => html`<th>${f.field_name}</th>`)}<th></th></tr></thead>
        <tbody>${rows.map(c => {
          const vals = (c.custom_fields || []).reduce((a, f) => { a[f.field_id] = f.value; return a; }, {});
          return html`<tr>
            <td class="font-medium">${c.name || c.full_name || '-'}</td>
            <td class="text-gray-500">${c.phone || '-'}</td>
            <td class="text-gray-500">${c.email || '-'}</td>
            ${st.fields.map(f => { const k = fieldKey(f); return html`<td class="text-gray-500">${vals[k] != null && vals[k] !== '' ? vals[k] : html`<span class="text-gray-300">—</span>`}</td>`; })}
            <td><div class="flex gap-1 justify-end"><button class="btn btn-sm btn-outline" data-contact-history=${c.id} onClick=${() => openHistory(c)}>History</button>${st.fields.length ? html`<button class="btn btn-sm btn-outline" onClick=${() => openValues(c)}>Fields</button>` : ''}<button class="btn btn-sm btn-outline" onClick=${() => showContact(c)}>Edit</button><button class="btn btn-sm btn-red" disabled=${st.busy === c.id} onClick=${() => removeContact(c)}>Delete</button></div></td>
          </tr>`; })}
        ${rows.length === 0 && html`<tr><td colspan=${4 + st.fields.length} class="text-center text-gray-400 py-8">No contacts yet.</td></tr>`}
      </tbody></table>
    </div>
    ${st.hist && html`<div class="modal" onClick=${e => e.target === e.currentTarget && (st.hist = null, renderApp())}><div class="modal-content" data-contact-history-card style="max-width:820px">
      <h3 class="text-lg font-bold mb-1">${st.hist.contact.name || st.hist.contact.full_name || 'Contact'} \u2014 history</h3>
      <p class="text-sm text-gray-500 mb-3">${st.hist.contact.phone || 'no number on file'}</p>
      ${st.hist.busy ? html`<p class="text-sm text-gray-500">Loading this contact\u2019s calls and messages\u2026</p>`
        : html`<div>
          ${st.hist.err && html`<p class="text-sm text-red-600 mb-2">${st.hist.err}</p>`}
          ${!st.hist.contact.phone ? html`<p class="text-sm text-gray-500">This contact has no phone number, so there are no calls or messages to match.</p>` : html`<div>
            <h4 class="font-semibold mb-2">Calls (${st.hist.calls.length})</h4>
            ${st.hist.calls.length === 0 ? html`<p class="text-sm text-gray-400 mb-3">No calls from this number.</p>`
              : html`<table class="table mb-3"><thead><tr><th>When</th><th>From</th><th>Duration</th><th>Outcome</th></tr></thead><tbody>
                ${st.hist.calls.slice(0, 20).map(x => html`<tr><td class="text-sm">${utcTime(x.call_time)}</td><td>${x.caller_number}</td><td>${x.duration != null ? x.duration + 's' : '\u2014'}</td><td>${x.disposition || '\u2014'}</td></tr>`)}
              </tbody></table>`}
            <h4 class="font-semibold mb-2">Messages (${st.hist.messages.length})</h4>
            ${st.hist.messages.length === 0 ? html`<p class="text-sm text-gray-400">No messages exchanged with this number.</p>`
              : html`<table class="table"><thead><tr><th>When</th><th>Direction</th><th>Message</th></tr></thead><tbody>
                ${st.hist.messages.slice(0, 20).map(x => html`<tr><td class="text-sm">${utcTime(x.created_at)}</td><td>${x.direction || '\u2014'}</td><td class="text-sm">${x.body || ''}</td></tr>`)}
              </tbody></table>`}
          </div>`}
        </div>`}
      <div class="flex gap-2 justify-end mt-4"><button class="btn btn-outline" onClick=${() => { st.hist = null; renderApp(); }}>Close</button></div>
    </div></div>`}
    ${st.showValues && html`<div class="modal" onClick=${e => e.target === e.currentTarget && (st.showValues = null, renderApp())}><div class="modal-content">
      <h3 class="text-lg font-bold mb-4">Field values — ${st.showValues.name || st.showValues.phone || 'contact'}</h3>
      <div class="space-y-3">${st.fields.map(f => html`<div><label class="text-sm font-medium block mb-1">${f.field_name}</label>
        <input class="input" value=${st.values[fieldKey(f)] == null ? '' : st.values[fieldKey(f)]} onInput=${e => { st.values[fieldKey(f)] = e.target.value; }} /></div>`)}
        ${st.fields.length === 0 && html`<p class="text-sm text-gray-500">Define a custom field first.</p>`}</div>
      <div class="flex gap-2 justify-end mt-4">
        <button class="btn btn-outline" onClick=${() => { st.showValues = null; renderApp(); }}>Cancel</button>
        <button class="btn" disabled=${st.busy === 'values' || st.fields.length === 0} onClick=${saveValues}>Save</button>
      </div>
    </div></div>`}
    ${st.showForm && html`<div class="modal" onClick=${e => e.target === e.currentTarget && hideContact()}><div class="modal-content">
      <h3 class="text-lg font-bold mb-4">${st.editItem ? 'Edit' : 'New'} Contact</h3>
      ${(() => {
        const f = viewState('contacts_form', { name: '', phone: '', email: '', company: '', notes: '', tags: '' });
        if (!st.formSeeded) {
          const row = st.editItem;
          f.name = row ? (row.name || '') : '';
          f.phone = row ? (row.phone || '') : '';
          f.email = row ? (row.email || '') : '';
          f.company = row ? (row.company || '') : '';
          f.notes = row ? (row.notes || '') : '';
          f.tags = row && Array.isArray(row.tags) ? row.tags.join(', ') : '';
          st.formSeeded = true;
        }
        const submit = () => {
          const name = (f.name || '').trim(), phone = (f.phone || '').trim();
          if (!name || !phone) { st.error = 'Name and phone are required'; renderApp(); return; }
          saveContact({ name: name, phone: phone, email: (f.email || '').trim(), company: (f.company || '').trim(), notes: (f.notes || '').trim(), tags: (f.tags || '').split(',').map(s => s.trim()).filter(Boolean) }, !!st.editItem);
        };
        return html`<div class="space-y-3">
        <div><label class="text-sm font-medium block mb-1">Name</label><input class="input" value=${f.name} onInput=${e => { f.name = e.target.value; }} /></div>
        <div><label class="text-sm font-medium block mb-1">Phone</label><input class="input" value=${f.phone} onInput=${e => { f.phone = e.target.value; }} placeholder="+15551234567" /></div>
        <div><label class="text-sm font-medium block mb-1">Email (optional)</label><input class="input" value=${f.email} onInput=${e => { f.email = e.target.value; }} /></div>
        <div><label class="text-sm font-medium block mb-1">Company (optional)</label><input class="input" value=${f.company} onInput=${e => { f.company = e.target.value; }} /></div>
        <div><label class="text-sm font-medium block mb-1">Tags (comma separated, optional)</label><input class="input" value=${f.tags} onInput=${e => { f.tags = e.target.value; }} placeholder="vip, after-hours" /></div>
        <div><label class="text-sm font-medium block mb-1">Notes (optional)</label><textarea class="input" rows="3" value=${f.notes} onInput=${e => { f.notes = e.target.value; }}></textarea></div>
        <div class="flex gap-2 justify-end mt-4"><button class="btn btn-outline" onClick=${hideContact}>Cancel</button><button class="btn" disabled=${st.busy === 'form'} onClick=${submit}>${st.editItem ? 'Save' : 'Add'}</button></div>
      </div>`; })()}
    </div></div>`}
  </div>`;
};

// ===== LISTS (card t_e3b93d6c, 2026-11-04) =====
// GET|POST /lists, GET /lists/:id/leads, POST /lists/:id/leads and DELETE
// /lists/:id/leads/:lead_id were all mounted, and NO served page called any of them: a list existed
// only inside the database, so a customer could not see who a campaign had collected and — the
// reported complaint — could not take a lead off a list at all. This screen is that surface.
//
//   * The index carries `lead_count`, computed server-side (lists_handler::list), so "how many
//     people are in this list" costs one request, not one per row.
//   * Remove ends the MEMBERSHIP, never the person: the lead stays in the account and in Contacts.
//     The confirm text says exactly that, because a Remove button beside a name reads like a delete.
//   * "Add a lead" exists so Remove is not a one-way door — without it one misclick could never be
//     undone from the interface.
//   * A list is created by the SERVER for each campaign (lists_handler::ensure_campaign_list), so a
//     campaign's list is shown as "Campaign" and the screen never offers to create one by hand for
//     a campaign. Standalone lists can be made here.
//   * Everything removing answers is trusted: DELETE says 404 when the person was not in the list
//     (a stale tab), so the row is re-read from the server after every write instead of being
//     dropped from the local array.
const Lists = () => {
  const st = viewState('lists', {
    list: [], selected: null, leads: null, leadsErr: null,
    busy: null, error: null, notice: null,
    showNew: false, draft: { name: '', description: '' },
    renaming: false, renameDraft: '',
    addOpen: false, pick: '', pickErr: null, pickList: null
  });
  const load = async () => {
    try {
      const d = await API.get('/lists');
      st.list = Array.isArray(d) ? d : [];
    } catch (e) { st.error = 'Could not load your lists: ' + e.message; st.list = []; }
    renderApp();
  };
  if (!st._loaded) { st._loaded = true; load(); }

  const openList = async (l) => {
    st.selected = l; st.leads = null; st.leadsErr = null;
    st.addOpen = false; st.pick = ''; st.pickList = null; st.pickErr = null;
    st.error = null; st.notice = null; renderApp();
    try {
      const d = await API.get('/lists/' + l.id + '/leads');
      st.leads = Array.isArray(d) ? d : [];
    } catch (e) { st.leadsErr = 'Could not load the people in this list: ' + e.message; st.leads = []; }
    renderApp();
  };

  // After every write: re-read BOTH the list's people and the index, so the count on the row above
  // matches the table below instead of drifting.
  const reload = async () => {
    const sel = st.selected;
    if (sel) {
      try {
        const d = await API.get('/lists/' + sel.id + '/leads');
        st.leads = Array.isArray(d) ? d : [];
      } catch (e) { st.leadsErr = 'Could not load the people in this list: ' + e.message; }
    }
    try {
      const l = await API.get('/lists');
      st.list = Array.isArray(l) ? l : [];
      if (sel) st.selected = st.list.filter(x => x.id === sel.id)[0] || sel;
    } catch (e) { /* the index keeps its last good copy rather than blanking the screen */ }
    renderApp();
  };

  const removeLead = async (lead) => {
    const who = lead.name || lead.phone || 'this lead';
    if (!confirm('Remove ' + who + ' from "' + st.selected.name + '"?\n\nThey stay in your account and in Contacts — only their place in this list ends.')) return;
    st.busy = 'rm:' + lead.id; st.error = null; st.notice = null; renderApp();
    try {
      await API.del('/lists/' + st.selected.id + '/leads/' + lead.id);
      st.notice = who + ' removed from ' + st.selected.name + '. They are still in your account.';
    } catch (e) { st.error = 'Could not remove ' + who + ' from this list: ' + e.message; }
    st.busy = null; reload();
  };

  const openAdd = async () => {
    st.addOpen = true; st.pick = ''; st.pickErr = null; st.error = null; st.notice = null;
    st.pickList = null; renderApp();
    try {
      // Read the roster fresh every time the picker opens: a lead added a minute ago must be
      // selectable, and this console has no cache to invalidate.
      const d = await API.get('/leads');
      st.pickList = Array.isArray(d) ? d : [];
    } catch (e) { st.pickErr = 'Could not load your leads: ' + e.message; st.pickList = []; }
    renderApp();
  };

  const addLead = async () => {
    if (!st.pick) { st.pickErr = 'Pick a lead first.'; renderApp(); return; }
    const picked = (st.pickList || []).filter(l => l.id === st.pick)[0];
    st.busy = 'add'; st.error = null; st.notice = null; st.pickErr = null; renderApp();
    try {
      await API.post('/lists/' + st.selected.id + '/leads', { lead_id: st.pick });
      st.notice = (picked && picked.name ? picked.name : 'That lead') + ' added to ' + st.selected.name;
      st.addOpen = false; st.pick = '';
    } catch (e) { st.error = 'Could not add that lead to the list: ' + e.message; }
    st.busy = null; reload();
  };

  const createList = async () => {
    const name = (st.draft.name || '').trim();
    if (!name) { st.error = 'A list needs a name.'; renderApp(); return; }
    st.busy = 'new'; st.error = null; st.notice = null; renderApp();
    let made = null;
    try {
      const body = { name: name };
      const desc = (st.draft.description || '').trim();
      if (desc) body.description = desc;
      made = await API.post('/lists', body);
      st.notice = 'List "' + name + '" created';
      st.showNew = false; st.draft = { name: '', description: '' };
    } catch (e) { st.error = 'Could not create the list: ' + e.message; }
    st.busy = null;
    await load();
    // openList() clears `notice` (a stale sentence from a previous list must not follow you into a
    // different one), so the creation sentence is set AFTER it opens the new list.
    if (made && made.id) {
      await openList(made);
      st.notice = 'List "' + name + '" created. Press “Add a lead” to put someone in it.';
      renderApp();
    }
  };

  // RENAME — PUT /api/v1/lists/:id was mounted and had no caller anywhere in this console, so a
  // list could be created but never corrected (a typo in its name was permanent). Same for DELETE
  // below: a list the workspace made for itself could never be removed. Both write only the
  // caller's own row (the handler binds tenant_id), and list_leads cascades on delete while
  // leads are untouched — the confirm says so, because "delete" reads like "delete my people".
  const renameList = async () => {
    const nm = (st.renameDraft || '').trim();
    if (!nm) { st.error = 'A list needs a name.'; renderApp(); return; }
    st.busy = 'rename'; st.error = null; st.notice = null; renderApp();
    try {
      const r = await API.put('/lists/' + st.selected.id, { name: nm });
      st.renaming = false; st.busy = null;
      st.notice = 'List renamed to "' + ((r && r.name) || nm) + '".';
    } catch (e) { st.busy = null; st.error = 'Could not rename the list: ' + e.message; }
    await reload();
  };
  const deleteList = async () => {
    const nm = st.selected.name;
    if (!confirm('Delete the list "' + nm + '"?\n\nEveryone in it stays in your account and in Contacts — only the list goes.')) return;
    st.busy = 'del'; st.error = null; st.notice = null; renderApp();
    try {
      await API.del('/lists/' + st.selected.id);
      st.selected = null; st.leads = null; st.addOpen = false; st.leadsErr = null;
      st.renaming = false; st.busy = null;
      st.notice = 'List "' + nm + '" deleted. Its people are still in Contacts.';
    } catch (e) { st.busy = null; st.error = 'Could not delete the list: ' + e.message; }
    await load();
  };

  const stamp = (v) => {
    if (!v) return '—';
    const d = new Date(v);
    return isNaN(d.getTime()) ? '—' : utcTime(v);
  };

  return html`<div>
    <div class="flex items-center justify-between mb-4" style="flex-wrap:wrap;gap:8px">
      <h2 class="text-xl font-bold">Lists</h2>
      <div class="flex items-center gap-2" style="flex-wrap:wrap">
        <button type="button" id="lists-new" class="btn btn-sm btn-green" onClick=${() => { st.showNew = true; st.draft = { name: '', description: '' }; st.error = null; st.notice = null; renderApp(); }}>+ New list</button>
        <button type="button" class="btn btn-sm btn-outline" onClick=${() => load()}>Refresh</button>
      </div>
    </div>
    ${st.error && html`<div class="card" style="border-left:4px solid #dc2626"><p class="text-sm text-red-700">${st.error}</p></div>`}
    ${st.notice && html`<div class="card" id="lists-notice" style="border-left:4px solid #059669"><p class="text-sm text-gray-700">${st.notice}</p></div>`}
    <div class="card">
      <p class="text-sm text-gray-500 mb-3">A list is a named group of your leads. Every campaign keeps its own list, and a lead carrying that campaign's tag joins it automatically — so this is where you see everyone a campaign has collected, and take someone off it.</p>
      <table class="table" id="lists-table"><thead><tr><th>List</th><th>People</th><th>Source</th><th></th></tr></thead>
        <tbody>
          ${st.list.map(l => html`<tr>
            <td class="font-medium">${l.name}${l.description ? html`<div class="text-xs text-gray-400">${l.description}</div>` : ''}</td>
            <td>${l.lead_count == null ? '—' : l.lead_count}</td>
            <td>${l.campaign_id ? html`<span class="badge badge-blue">Campaign</span>` : html`<span class="badge badge-gray">Your own</span>`}</td>
            <td><button type="button" class="btn btn-sm btn-outline" onClick=${() => openList(l)}>${st.selected && st.selected.id === l.id ? 'Viewing' : 'View leads'}</button></td>
          </tr>`)}
          ${st.list.length === 0 && html`<tr><td colspan="4" class="text-center text-gray-400 py-6">No lists yet. One is created for each of your campaigns the moment a lead carries its tag — or press “+ New list” to make one of your own.</td></tr>`}
        </tbody></table>
    </div>
    ${st.showNew && html`<div class="modal" onClick=${e => e.target === e.currentTarget && (st.showNew = false, renderApp())}><div class="modal-content">
      <h3 class="text-lg font-bold mb-4">New list</h3>
      <div class="space-y-3">
        <div><label class="text-sm font-medium block mb-1">Name</label><input class="input" id="lists-name" value=${st.draft.name || ''} onInput=${e => { st.draft.name = e.target.value; }} placeholder="After-hours callers" /></div>
        <div><label class="text-sm font-medium block mb-1">Description (optional)</label><input class="input" value=${st.draft.description || ''} onInput=${e => { st.draft.description = e.target.value; }} placeholder="Why these people are grouped together" /></div>
        <div class="flex gap-2 justify-end mt-4"><button type="button" class="btn btn-outline" onClick=${() => { st.showNew = false; renderApp(); }}>Cancel</button><button type="button" id="lists-create" class="btn" disabled=${st.busy === 'new'} onClick=${createList}>${st.busy === 'new' ? 'Creating…' : 'Create list'}</button></div>
      </div>
    </div></div>`}
    ${st.selected && html`<div class="card" id="list-detail" data-list-id=${st.selected.id} data-list-name=${st.selected.name}>
      <div class="flex items-center justify-between mb-3" style="flex-wrap:wrap;gap:8px">
        <h3 class="font-semibold">${st.selected.name}${st.leads ? html`<span class="text-sm text-gray-400"> — ${st.leads.length} ${st.leads.length === 1 ? 'person' : 'people'}</span>` : ''}</h3>
        <div class="flex gap-2" style="flex-wrap:wrap">
          <button type="button" id="list-add-lead" class="btn btn-sm" onClick=${openAdd} disabled=${st.busy === 'add'}>Add a lead</button>
          <button type="button" id="list-rename" class="btn btn-sm btn-outline" onClick=${() => { st.renaming = true; st.renameDraft = st.selected.name || ''; st.error = null; st.notice = null; renderApp(); }}>Rename</button>
          ${!st.selected.campaign_id && html`<button type="button" id="list-delete" class="btn btn-sm btn-red" disabled=${st.busy === 'del'} onClick=${deleteList}>${st.busy === 'del' ? 'Deleting…' : 'Delete list'}</button>`}
          <button type="button" class="btn btn-sm btn-outline" onClick=${() => { st.selected = null; st.leads = null; st.addOpen = false; st.leadsErr = null; renderApp(); }}>Close</button>
        </div>
      </div>
      ${st.renaming && html`<div class="mb-4" id="list-rename-box" style="border:1px solid #e2e8f0;border-radius:8px;padding:12px">
        <label class="text-sm font-medium block mb-1">List name</label>
        <div class="flex gap-2" style="flex-wrap:wrap;align-items:center">
          <input class="input" id="list-rename-input" style="max-width:420px" value=${st.renameDraft || ''} onInput=${e => { st.renameDraft = e.target.value; }} placeholder="After-hours callers" />
          <button type="button" id="list-rename-save" class="btn btn-sm" disabled=${st.busy === 'rename'} onClick=${renameList}>${st.busy === 'rename' ? 'Saving…' : 'Save name'}</button>
          <button type="button" class="btn btn-sm btn-outline" onClick=${() => { st.renaming = false; st.error = null; renderApp(); }}>Cancel</button>
        </div>
        <p class="text-xs text-gray-400 mt-2">Renaming keeps the list's link and everyone already in it.</p>
      </div>`}
      ${st.addOpen && html`<div class="mb-4" style="border:1px solid #e2e8f0;border-radius:8px;padding:12px">
        <label class="text-sm font-medium block mb-1">Which lead?</label>
        ${st.pickList === null
          ? html`<p class="text-sm text-gray-400">Loading your leads…</p>`
          : html`<div class="flex gap-2" style="flex-wrap:wrap;align-items:center">
              <select class="input" id="list-pick" style="max-width:420px" value=${st.pick} onChange=${e => { st.pick = e.target.value; renderApp(); }}>
                <option value="">Pick a lead…</option>
                ${st.pickList.map(l => html`<option value=${l.id}>${(l.name || '(no name)') + (l.phone ? ' · ' + l.phone : (l.email ? ' · ' + l.email : ''))}</option>`)}
              </select>
              <button type="button" id="list-add-confirm" class="btn btn-sm" disabled=${st.busy === 'add'} onClick=${addLead}>${st.busy === 'add' ? 'Adding…' : 'Add to list'}</button>
              <button type="button" class="btn btn-sm btn-outline" onClick=${() => { st.addOpen = false; st.pickErr = null; renderApp(); }}>Cancel</button>
            </div>
            ${st.pickList.length === 0 && !st.pickErr && html`<p class="text-sm text-gray-400 mt-2">You have no leads yet, so there is nobody to add. Leads arrive from your calls and messages.</p>`}`}
        ${st.pickErr && html`<p class="text-sm text-red-700 mt-2">${st.pickErr}</p>`}
      </div>`}
      ${st.leadsErr && html`<p class="text-sm text-red-700">${st.leadsErr}</p>`}
      ${st.leads === null && !st.leadsErr && html`<p class="text-sm text-gray-400">Loading…</p>`}
      ${st.leads && html`<table class="table" id="list-leads"><thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Status</th><th>Added</th><th></th></tr></thead>
        <tbody>
          ${st.leads.map(l => html`<tr data-lead-id=${l.id}>
            <td class="font-medium">${l.name || '(no name)'}</td>
            <td>${l.phone || '—'}</td>
            <td>${l.email || '—'}</td>
            <td><span class="badge badge-gray">${l.status || '—'}</span></td>
            <td class="text-gray-500">${stamp(l.added_at)}</td>
            <td><button type="button" id=${'rm-' + l.id} class="btn btn-sm btn-red" disabled=${st.busy === 'rm:' + l.id} onClick=${() => removeLead(l)}>${st.busy === 'rm:' + l.id ? 'Removing…' : 'Remove'}</button></td>
          </tr>`)}
          ${st.leads.length === 0 && html`<tr><td colspan="6" class="text-center text-gray-400 py-6">Nobody is in this list right now.</td></tr>`}
        </tbody></table>`}
    </div>`}
  </div>`;
};

// ===== TICKETS =====
// ===== CALENDAR (2026-11-04) =====
// A backend with no UI is a defect (David's standing rule). GET|POST /api/v1/calendar-events and
// GET|PUT|DELETE /api/v1/calendar-events/:id were all mounted, `has_calendar` is granted by the
// ENTERPRISE plan (a `feature_limits` row; feature_registry key `has_calendar`, enforced by
// calendar_events_handler::create) and NO served page called any of them: the calendar table had
// 0 rows and a customer paying $199/mo could not open the feature their plan sells. This screen is
// that surface.
//
//   * The LIST route is not gated, so a workspace without the grant still sees its own (empty)
//     calendar rather than an error it cannot act on. The CREATE route IS gated: a 402 comes back
//     with the server's own sentence, and this screen shows that sentence plus the way to the plan
//     page — never a dead form that looks broken.
//   * Times are entered in the browser's local zone (`datetime-local`) and sent as UTC ISO, which is
//     what the handler parses; every row is painted back with `utcTime`, the console's one formatter.
//   * Every write re-reads the list from the server, so the table is the database's own answer and
//     not a local guess.
const Calendar = () => {
  const st = viewState('calendar', {
    list: [], loaded: false, error: null, notice: null, gated: null,
    showNew: false, busy: null, editing: null, sortKey: 'start_at',
    draft: { title: '', type: 'call', start: '', notes: '' }
  });
  const load = async () => {
    st.error = null;
    try {
      const d = await API.get('/calendar-events?limit=200');
      st.list = Array.isArray(d) ? d : [];
    } catch (e) {
      st.error = 'Could not load your calendar: ' + e.message;
      st.list = [];
    }
    st.loaded = true; renderApp();
  };
  if (!st.loaded) { st.loaded = true; load(); }

  const isGate = (e) => /current plan|upgrade to access/i.test(String(e && e.message || ''));
  const blank = { title: '', type: 'call', start: '', notes: '' };
  const localInput = (iso) => {
    const d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    const p = (n) => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
  };

  const openNew = () => {
    st.showNew = true; st.editing = null; st.draft = Object.assign({}, blank);
    st.error = null; st.notice = null; renderApp();
  };
  const openEdit = (ev) => {
    st.showNew = true; st.editing = ev.id;
    st.draft = { title: ev.title || '', type: ev.event_type || 'call', start: localInput(ev.start_at), notes: ev.description || '' };
    st.error = null; st.notice = null; renderApp();
  };

  const save = async () => {
    const title = (st.draft.title || '').trim();
    if (!title) { st.error = 'An event needs a title.'; renderApp(); return; }
    if (!st.draft.start) { st.error = 'Pick the date and time of the event.'; renderApp(); return; }
    const when = new Date(st.draft.start);
    if (isNaN(when.getTime())) { st.error = 'That date and time could not be read — use the picker.'; renderApp(); return; }
    const body = { title: title, start_at: when.toISOString(), event_type: st.draft.type || 'call' };
    const notes = (st.draft.notes || '').trim();
    if (notes) body.description = notes;
    const wasEditing = st.editing;
    st.busy = 'save'; st.error = null; st.notice = null; renderApp();
    try {
      if (wasEditing) await API.put('/calendar-events/' + wasEditing, body);
      else await API.post('/calendar-events', body);
      st.notice = (wasEditing ? 'Updated "' : 'Added "') + title + '" on your calendar.';
      st.showNew = false; st.editing = null; st.draft = Object.assign({}, blank);
    } catch (e) {
      if (isGate(e)) { st.gated = e.message; st.showNew = false; }
      else st.error = 'Could not save the event: ' + e.message;
    }
    st.busy = null; await load();
  };

  const remove = async (ev) => {
    if (!confirm('Delete "' + ev.title + '" from your calendar?')) return;
    st.busy = 'rm:' + ev.id; st.error = null; st.notice = null; renderApp();
    try {
      await API.del('/calendar-events/' + ev.id);
      st.notice = 'Deleted "' + ev.title + '".';
    } catch (e) { st.error = 'Could not delete the event: ' + e.message; }
    st.busy = null; await load();
  };

  const sorted = (st.list || []).slice().sort((a, b) => String(a.start_at || '').localeCompare(String(b.start_at || '')));
  const now = Date.now();
  const upcoming = sorted.filter(e => new Date(e.start_at).getTime() >= now - 60 * 60 * 1000);
  const past = sorted.filter(e => new Date(e.start_at).getTime() < now - 60 * 60 * 1000).reverse();

  const row = (ev, dim) => html`<tr data-event-id=${ev.id} style=${dim ? 'opacity:.6' : ''}>
    <td class="font-medium">${ev.title}</td>
    <td>${utcTime(ev.start_at)}</td>
    <td><span class="badge badge-gray">${ev.event_type || 'call'}</span></td>
    <td class="text-gray-500" style="max-width:320px">${ev.description || '—'}</td>
    <td class="whitespace-nowrap">
      <button type="button" class="btn btn-sm btn-outline" onClick=${() => openEdit(ev)}>Edit</button>
      <button type="button" class="btn btn-sm btn-red" disabled=${st.busy === 'rm:' + ev.id} onClick=${() => remove(ev)}>${st.busy === 'rm:' + ev.id ? 'Deleting…' : 'Delete'}</button>
    </td>
  </tr>`;

  return html`<div>
    <div class="flex items-center justify-between mb-4" style="flex-wrap:wrap;gap:8px">
      <h2 class="text-xl font-bold">Calendar</h2>
      <div class="flex items-center gap-2" style="flex-wrap:wrap">
        <button type="button" id="cal-new" class="btn btn-sm btn-green" onClick=${openNew} disabled=${!!st.gated}>+ New event</button>
        <button type="button" class="btn btn-sm btn-outline" onClick=${() => load()}>Refresh</button>
      </div>
    </div>
    ${st.error && html`<div class="card" style="border-left:4px solid #dc2626"><p class="text-sm text-red-700">${st.error}</p></div>`}
    ${st.notice && html`<div class="card" id="cal-notice" style="border-left:4px solid #059669"><p class="text-sm text-gray-700">${st.notice}</p></div>`}
    ${st.gated && html`<div class="card" id="cal-gated" style="border-left:4px solid #b45309">
      <p class="text-sm text-gray-700">${st.gated}</p>
      <p class="text-xs text-gray-500 mt-2">The calendar is part of the Enterprise plan. Nothing was changed.</p>
      <button type="button" class="btn btn-sm mt-3" onClick=${() => { S.view = 'billing'; renderApp(); }}>See the plans</button>
    </div>`}
    <div class="card">
      <p class="text-sm text-gray-500 mb-3">Your own appointments, callbacks and reminders for this workspace. An event lives only in your account — nothing is sent to a caller from here.</p>
      ${!st.loaded && html`<p class="text-sm text-gray-400">Loading your calendar…</p>`}
      ${st.loaded && sorted.length === 0 && html`<p class="text-sm text-gray-400 py-4">Nothing on the calendar yet. Press “+ New event” to add a callback, an appointment or a reminder.</p>`}
      ${upcoming.length > 0 && html`<h3 class="font-semibold mb-2">Upcoming</h3>
        <table class="table" id="cal-upcoming"><thead><tr><th>Event</th><th>When</th><th>Type</th><th>Notes</th><th></th></tr></thead>
          <tbody>${upcoming.map(e => row(e, false))}</tbody></table>`}
      ${past.length > 0 && html`<h3 class="font-semibold mb-2 mt-6">Already passed</h3>
        <table class="table" id="cal-past"><thead><tr><th>Event</th><th>When</th><th>Type</th><th>Notes</th><th></th></tr></thead>
          <tbody>${past.map(e => row(e, true))}</tbody></table>`}
    </div>
    ${st.showNew && html`<div class="modal" onClick=${e => e.target === e.currentTarget && (st.showNew = false, st.editing = null, renderApp())}><div class="modal-content">
      <h3 class="text-lg font-bold mb-4">${st.editing ? 'Edit event' : 'New event'}</h3>
      <div class="space-y-3">
        <div><label class="text-sm font-medium block mb-1">What is it?</label><input class="input" id="cal-title" value=${st.draft.title || ''} onInput=${e => { st.draft.title = e.target.value; }} placeholder="Call back about the quote" /></div>
        <div><label class="text-sm font-medium block mb-1">When</label><input class="input" id="cal-start" type="datetime-local" value=${st.draft.start || ''} onInput=${e => { st.draft.start = e.target.value; }} /></div>
        <div><label class="text-sm font-medium block mb-1">Type</label><select class="input" id="cal-type" value=${st.draft.type || 'call'} onChange=${e => { st.draft.type = e.target.value; }}>
          ${['call', 'callback', 'appointment', 'reminder', 'other'].map(t => html`<option value=${t}>${t}</option>`)}
        </select></div>
        <div><label class="text-sm font-medium block mb-1">Notes (optional)</label><input class="input" id="cal-notes" value=${st.draft.notes || ''} onInput=${e => { st.draft.notes = e.target.value; }} placeholder="Anything you want beside the event" /></div>
        <div class="flex gap-2 justify-end mt-4">
          <button type="button" class="btn btn-outline" onClick=${() => { st.showNew = false; st.editing = null; st.error = null; renderApp(); }}>Cancel</button>
          <button type="button" id="cal-save" class="btn" disabled=${st.busy === 'save'} onClick=${save}>${st.busy === 'save' ? 'Saving…' : (st.editing ? 'Save changes' : 'Add to calendar')}</button>
        </div>
      </div>
    </div></div>`}
  </div>`;
};

const Tickets = () => {
  const st = viewState('tickets', { list: [], stats: null, showModal: false, editItem: null, threadId: null, thread: null, reply: '', busy: false });
  // The list AND the counts. GET /api/v1/tickets/stats had no caller anywhere in this console, so
  // "see what is still open" was a question the screen could not answer. Its own catch keeps a
  // stats hiccup from blanking the list, and the strip renders only what the API answered.
  const load = async () => {
    try {
      const r = await Promise.all([
        API.get('/tickets'),
        API.get('/tickets/stats').catch(() => null),
      ]);
      st.list = Array.isArray(r[0]) ? r[0] : [];
      st.stats = (r[1] && typeof r[1] === 'object') ? r[1] : null;
      renderApp();
    } catch (e) { console.error(e); }
  };
  if (!st._loaded) { st._loaded = true; load(); }
  const show = (i) => { st.editItem = i; st.formSeeded = false; st.showModal = true; renderApp(); };
  const hide = () => { st.showModal = false; renderApp(); };
  // A ticket the CUSTOMER files is stored with sender_type 'customer', so the thread attributes the
  // opening words to them rather than to the team. The admin console's own "+ New Ticket" keeps the
  // default ('agent') — it is filed on the workspace's behalf.
  const save = async (data) => { try { if (st.editItem) await API.put('/tickets/' + st.editItem.id, data); else await API.post('/tickets', Object.assign({ sender_type: 'customer' }, data)); st.showModal = false; load(); } catch (e) { alert(e.message); } };
  // ── The conversation (2026-10-19) ─────────────────────────────────────────────────────────────
  // This screen files a ticket (Plan & Billing sends one when checkout is closed) and then showed
  // nothing but its status, so an answer from the team was invisible unless the customer guessed to
  // reload. The thread is `GET /tickets/:id`; a reply is `POST /tickets/:id/messages` with
  // sender_type 'customer', which the team reads on the same ticket in their console.
  const openThread = async (t) => {
    try {
      const d = await API.get('/tickets/' + t.id);
      st.threadId = t.id; st.thread = d; st.reply = ''; renderApp();
    } catch (e) { alert('Could not open the ticket: ' + e.message); }
  };
  const closeThread = () => { st.threadId = null; st.thread = null; st.reply = ''; renderApp(); };
  const sendReply = async () => {
    const body = (st.reply || '').trim();
    if (!body) { alert('Type your message first.'); return; }
    if (st.busy) return;
    st.busy = true; renderApp();
    try {
      await API.post('/tickets/' + st.threadId + '/messages', { sender_type: 'customer', body: body });
      st.thread = await API.get('/tickets/' + st.threadId);
      st.reply = ''; st.busy = false; load();
    } catch (e) { st.busy = false; renderApp(); alert('Your message was not saved: ' + e.message); }
  };
  return html`<div>
    <div class="flex items-center justify-between mb-4"><h2 class="text-xl font-bold">Tickets</h2><button class="btn btn-sm btn-green" onClick=${() => show(null)}>+ New Ticket</button></div>
    ${st.stats && html`<div id="tk-stats" class="card p-3 mb-4 flex flex-wrap gap-4 text-sm text-gray-600">
      <span><strong>${st.stats.open||0}</strong> open</span>
      <span><strong>${st.stats.in_progress||0}</strong> in progress</span>
      <span><strong>${st.stats.resolved||0}</strong> resolved</span>
      <span><strong>${st.stats.closed||0}</strong> closed</span>
      <span class="text-gray-400">${st.stats.total||0} total</span>
    </div>`}
    <div class="card p-0 overflow-hidden">
      <table class="table"><thead><tr><th>Subject</th><th>Status</th><th>Priority</th><th>Actions</th></tr></thead>
        <tbody>${st.list.map(t => html`<tr><td class="font-medium">${t.subject||'-'}</td><td><span class="badge ${t.status==='open'?'badge-yellow':t.status==='resolved'?'badge-green':'badge-blue'}">${t.status||'open'}</span></td><td class="text-gray-500">${t.priority||'medium'}</td><td><button class="btn btn-sm" onClick=${() => openThread(t)}>Open</button><button class="btn btn-sm btn-outline" onClick=${() => show(t)}>Edit</button></td></tr>`)}
        ${st.list.length===0 && html`<tr><td colspan="4" class="text-center text-gray-400 py-8">No tickets yet.</td></tr>`}
      </tbody></table>
    </div>
    ${st.threadId && html`<div id="tk-thread" class="card mt-4 p-4">
      <div class="flex items-center justify-between mb-3">
        <h3 class="text-lg font-bold">Conversation${st.thread && st.thread.ticket && st.thread.ticket.subject ? ' · ' + st.thread.ticket.subject : ''}</h3>
        <button class="btn btn-sm btn-outline" onClick=${closeThread}>Close</button>
      </div>
      <div class="space-y-2 mb-3">
        ${((st.thread && st.thread.messages) || []).map(m => html`<div class="p-2 rounded" style="background:#f9fafb">
          <div class="text-xs text-gray-500 mb-1">${m.sender_type === 'customer' ? 'You' : 'The team'} · ${m.created_at ? new Date(m.created_at).toLocaleString() : ''}</div>
          <div style="white-space:pre-wrap">${m.body}</div>
        </div>`)}
        ${((st.thread && st.thread.messages) || []).length === 0 && html`<div class="text-sm text-gray-400">No messages on this ticket yet.</div>`}
      </div>
      <label class="text-sm font-medium block mb-1">Add to this ticket</label>
      <textarea id="tk-reply" class="input" rows="3" value=${st.reply || ''} onInput=${e => { st.reply = e.target.value; }} placeholder="Ask a question or add a detail for the team."></textarea>
      <div class="flex justify-end mt-2"><button id="tk-send" class="btn" disabled=${st.busy} onClick=${sendReply}>${st.busy ? 'Sending…' : 'Send'}</button></div>
    </div>`}
    ${st.showModal && html`<div class="modal" onClick=${e => e.target===e.currentTarget && hide()}><div class="modal-content"><h3 class="text-lg font-bold mb-4">${st.editItem?'Edit':'New'} Ticket</h3>
      ${(() => {
        // kanban t_13330c68 — the draft lives in the SHARED view object (S.views['tickets_form']), seeded ON
        // OPEN because show() clears st.formSeeded. The template IIFE re-runs on every renderApp(), so a
        // per-render local re-initialised the field from the stored ROW and wiped what the operator
        // typed (guard rule 4); a re-render can no longer do that.
        const f = viewState('tickets_form', { subject: '', status: 'open', priority: 'medium' });
        if (!st.formSeeded) {
          f.subject = st.editItem?.subject||'';
          f.status = st.editItem?.status||'open';
          f.priority = st.editItem?.priority||'medium';
          st.formSeeded = true;
        }
        return html`<div class="space-y-3"><div><label class="text-sm font-medium block mb-1">Subject</label><input class="input" value=${f.subject} onInput=${e => { f.subject = e.target.value; }} /></div><div><label class="text-sm font-medium block mb-1">Status</label><select class="input" value=${f.status} onChange=${e => { f.status = e.target.value; }}><option value="open">Open</option><option value="in_progress">In Progress</option><option value="resolved">Resolved</option><option value="closed">Closed</option></select></div><div><label class="text-sm font-medium block mb-1">Priority</label><select class="input" value=${f.priority} onChange=${e => { f.priority = e.target.value; }}><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option><option value="urgent">Urgent</option></select></div><div class="flex gap-2 justify-end mt-4"><button class="btn btn-outline" onClick=${() => hide()}>Cancel</button><button class="btn" onClick=${() => save({subject: f.subject, status: f.status, priority: f.priority})}>${st.editItem?'Save':'Add'}</button></div></div>`; })()}
    </div></div>`}
  </div>`;
};

// ===== INTEGRATIONS (Integration Center) =====
// Renders the LIVE available_providers catalogue (no hardcoded provider array), CoreSwift
// pinned first as the upgrade path. Keys are BYOK per tenant: stored via
// POST /api/v1/provider-keys, masked on read, never rendered raw.
const Integrations = () => {
  const st = viewState('integrations', { providers: [], keys: [], hubStatus: null, keyInput: {}, baseInput: {}, busy: null, probe: null, error: null, notice: null, push: {}, pushRes: null, pushBusy: false });
  const load = async () => {
    try { const p = await API.get('/available-providers'); st.providers = Array.isArray(p) ? p : (p.providers || []); }
    catch (e) { st.error = 'Could not load providers: ' + e.message; }
    try { const k = await API.get('/provider-keys'); st.keys = Array.isArray(k) ? k : (k.keys || []); } catch (e) { st.keys = []; }
    try { st.hubStatus = await API.get('/integrations/coreswift/status'); } catch (e) { st.hubStatus = null; }
    renderApp();
  };
  if (!st._loaded) { st._loaded = true; load(); }
  const keyFor = (key) => (st.keys || []).find(k => k.provider === key && k.is_active !== false);
  const isConnected = (p) => p.key === 'coreswift' ? !!(st.hubStatus && st.hubStatus.connected) : !!keyFor(p.key);
  // CoreSwift is pinned first (fleet standard); the rest is whatever the catalogue returns.
  const ordered = () => st.providers.slice().sort((a, b) => (a.key === 'coreswift' ? -1 : 0) - (b.key === 'coreswift' ? -1 : 0) || (a.name || a.key || '').localeCompare(b.name || b.key || ''));
  const connect = async (p) => {
    const api_key = (st.keyInput[p.key] || '').trim();
    if (!api_key) { st.error = 'Paste the ' + (p.name || p.key) + ' key first'; renderApp(); return; }
    st.busy = p.key; st.error = null; st.probe = null; renderApp();
    const body = { provider: p.key, api_key };
    const bu = (st.baseInput[p.key] || '').trim();
    if (bu) body.base_url = bu;
    try {
      await API.post('/provider-keys', body);
      st.keyInput[p.key] = '';
      // A STORED key is not a WORKING key: this used to announce "<Provider> connected" and nothing
      // more, so a credential the far side rejects still read as a live integration. Run the same
      // live probe the Test button uses and report ITS verdict — including the honest "no live test
      // for this provider yet" case, which is `ok: null` and must not be dressed up as success.
      const nm = p.name || p.key;
      let v = { ok: null, message: 'No live connection test available for this provider yet' };
      try { v = await API.post('/provider-keys/' + encodeURIComponent(p.key) + '/test', {}); }
      catch (e) { v = { ok: false, message: 'the live test could not be run: ' + ((e && e.message) || 'unknown error') }; }
      st.probe = { key: p.key, ok: v && v.ok, message: (v && v.message) || '' };
      if (v && v.ok === true) st.notice = nm + ' connected — the key was accepted.';
      else if (v && v.ok === null) st.notice = nm + ' key saved. ' + ((v && v.message) || 'No live connection test available for this provider yet');
      else st.notice = nm + ' key saved, but the connection test failed: ' + ((v && v.message) || 'no detail');
    }
    catch (e) { st.error = (p.name || p.key) + ': ' + e.message; }
    st.busy = null; load();
  };
  const disconnect = async (p) => {
    if (!confirm('Disconnect ' + (p.name || p.key) + '?')) return;
    st.busy = p.key; st.error = null; renderApp();
    try { await API.del('/provider-keys/' + p.key); st.notice = (p.name || p.key) + ' disconnected'; }
    catch (e) { st.error = (p.name || p.key) + ': ' + e.message; }
    st.busy = null; load();
  };
  const test = async (p) => {
    st.busy = p.key; st.probe = null; renderApp();
    try { const r = await API.post('/provider-keys/' + p.key + '/test', {}); st.probe = { key: p.key, ok: r.ok, message: r.message || '' }; }
    catch (e) { st.probe = { key: p.key, ok: false, message: e.message }; }
    st.busy = null; renderApp();
  };
  const controls = (p) => {
    const k = keyFor(p.key);
    const connected = isConnected(p);
    const pr = st.probe && st.probe.key === p.key ? st.probe : null;
    // kanban t_3bdea5eb - a provider the app cannot spend is served with coming_soon=true
    // (GET /available-providers). LABEL, don't hide: the card stays visible but offers NO key
    // input and NO Connect/Test button, so a customer cannot paste a credential nothing reads.
    if (p.coming_soon) {
      return html`<div class="mt-3 space-y-2">
        <div class="flex items-center gap-2"><span class="badge badge-gray">Coming Soon</span></div>
        <p class="text-xs text-gray-500">This integration is coming soon — there is nothing to connect yet, so no key is needed.</p>
      </div>`;
    }
    return html`<div class="mt-3 space-y-2">
      <div class="flex items-center gap-2">
        <span class="badge ${connected ? 'badge-green' : 'badge-yellow'}">${connected ? 'Connected' : 'Not connected'}</span>
        ${connected && k ? html`<span class="text-xs text-gray-400">key ${k.api_key}</span>` : ''}
        ${connected && p.key === 'coreswift' && st.hubStatus && st.hubStatus.base_url ? html`<span class="text-xs text-gray-400">→ ${st.hubStatus.base_url}</span>` : ''}
      </div>
      ${connected ? html`<div class="flex gap-2">
          <button class="btn btn-sm btn-outline" disabled=${st.busy === p.key} onClick=${() => test(p)}>Test connection</button>
          <button class="btn btn-sm btn-red" disabled=${st.busy === p.key} onClick=${() => disconnect(p)}>Disconnect</button>
        </div>`
      : html`<div class="space-y-2">
          <input class="input" type="password" placeholder=${(p.name || p.key) + ' API key'} value=${st.keyInput[p.key] || ''} onInput=${e => st.keyInput[p.key] = e.target.value} />
          ${p.requires_base_url ? html`<input class="input" placeholder="Base URL (optional — defaults to the platform URL)" value=${st.baseInput[p.key] || ''} onInput=${e => st.baseInput[p.key] = e.target.value} />` : ''}
          <div class="flex gap-2">
            <button class="btn btn-sm" disabled=${st.busy === p.key} onClick=${() => connect(p)}>Connect</button>
            <button class="btn btn-sm btn-outline" disabled=${st.busy === p.key} onClick=${() => test(p)}>Test connection</button>
          </div>
        </div>`}
      ${pr ? html`<div class="text-xs ${pr.ok ? 'text-green-700' : 'text-amber-700'}">${pr.message || (pr.ok ? 'OK' : 'Failed')}</div>` : ''}
    </div>`;
  };
  // Manual "push now" — POST /integrations/coreswift/push is the same code path the automatic
  // capture uses, exposed for the operator who captured a lead outside the normal flow.
  const pushNow = async () => {
    const p = st.push || {};
    if (!(p.name || '').trim() && !(p.phone || '').trim() && !(p.email || '').trim()) {
      st.error = 'Give the lead at least a name, a phone or an email'; renderApp(); return;
    }
    st.pushBusy = true; st.pushRes = null; st.error = null; renderApp();
    const body = { name: p.name, company: p.company, email: p.email, phone: p.phone, list_id: p.list_id, notes: p.notes };
    body.tags = (p.tags || '').split(',').map(s => s.trim()).filter(Boolean);
    Object.keys(body).forEach(k => { if (body[k] === undefined || body[k] === '') delete body[k]; });
    try { st.pushRes = { ok: true, text: JSON.stringify(await API.post('/integrations/coreswift/push', body)) }; }
    catch (e) { st.pushRes = { ok: false, text: 'Push failed: ' + e.message }; }
    st.pushBusy = false; renderApp();
  };
  const list = ordered();
  const core = list.find(p => p.key === 'coreswift');
  const rest = list.filter(p => p.key !== 'coreswift');
  return html`<div>
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-xl font-bold">Integrations</h2>
      <button class="btn btn-sm btn-outline" onClick=${() => load()}>Refresh</button>
    </div>
    ${st.error ? html`<div class="card" style="border-left:4px solid #dc2626"><b class="text-red-700">Error</b><p class="text-sm text-gray-600 mt-.5">${st.error}</p></div>` : ''}
    ${st.notice ? html`<div class="card" style="border-left:4px solid #059669"><p class="text-sm text-gray-600">${st.notice}</p></div>` : ''}
    ${core ? html`<div class="card" style="border:2px solid #2563eb">
      <div class="flex items-start justify-between gap-4" style="flex-wrap:wrap">
        <div style="flex:1">
          <h3 class="font-semibold text-lg">🔗 ${core.name || 'CoreSwift CRM'} <span class="badge badge-blue">Recommended</span></h3>
          <p class="text-sm text-gray-600 mt-1">${core.description || 'Push leads into CoreSwift CRM'}</p>
          <p class="text-xs text-gray-500 mt-1">Every caller you capture here lands in CoreSwift automatically — the single home for all of your leads.</p>
          ${controls(core)}
        </div>
        <div style="min-width:210px;max-width:100%" class="text-right">
          <div class="text-sm font-semibold text-blue-700">One CRM for every tool you connect</div>
          <a class="btn btn-sm" style="display:inline-block;margin-top:8px;text-decoration:none" href="https://coreswiftcrm.com/?utm_source=missedcallrespondr&utm_medium=integration_center" target="_blank" rel="noopener">Get CoreSwift CRM →</a>
          <div class="mt-2"><a class="text-xs text-blue-600" id="billing-link" href="#" onClick=${e => { e.preventDefault(); S.view = 'billing'; renderApp(); }}>See plans & upgrade</a></div>
        </div>
      </div>
    </div>` : ''}
    ${core && st.hubStatus && st.hubStatus.connected ? html`<div class="card" style="border-left:4px solid #059669">
      <h3 class="font-semibold">Push a lead to CoreSwift now</h3>
      <p class="text-sm text-gray-600 mt-1">The same push the automatic capture path uses, for a lead you captured by hand.</p>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-2 mt-3">
        <input class="input" placeholder="Name" value=${st.push.name || ''} onInput=${e => { st.push.name = e.target.value; }} />
        <input class="input" placeholder="Company" value=${st.push.company || ''} onInput=${e => { st.push.company = e.target.value; }} />
        <input class="input" placeholder="Phone" value=${st.push.phone || ''} onInput=${e => { st.push.phone = e.target.value; }} />
        <input class="input" placeholder="Email" value=${st.push.email || ''} onInput=${e => { st.push.email = e.target.value; }} />
        <input class="input" placeholder="Tags (comma separated)" value=${st.push.tags || ''} onInput=${e => { st.push.tags = e.target.value; }} />
        <input class="input" placeholder="CoreSwift list id (optional)" value=${st.push.list_id || ''} onInput=${e => { st.push.list_id = e.target.value; }} />
        <input class="input" placeholder="Notes" value=${st.push.notes || ''} onInput=${e => { st.push.notes = e.target.value; }} />
      </div>
      <div class="flex items-center gap-3 mt-3">
        <button class="btn btn-sm btn-green" disabled=${st.pushBusy} onClick=${pushNow}>Push now</button>
        ${st.pushRes && html`<span class="text-xs ${st.pushRes.ok ? 'text-green-700' : 'text-red-600'}">${st.pushRes.ok ? 'Pushed' : 'Failed'}</span>`}
      </div>
      ${st.pushRes && html`<pre class="text-xs bg-gray-50 border rounded p-2 mt-2 overflow-auto" style="max-height:160px">${st.pushRes.text}</pre>`}
    </div>` : ''}
    ${rest.length === 0 && !core ? html`<div class="card text-center text-gray-400 py-8">No providers available yet.</div>` : ''}
    ${rest.map(p => html`<div class="card">
      <h3 class="font-semibold">${p.icon ? p.icon + ' ' : ''}${p.name || p.key}</h3>
      <p class="text-sm text-gray-600 mt-1">${p.description || ''}</p>
      ${controls(p)}
    </div>`)}
  </div>`;
};

// ===== PLAN & BILLING =====
// kanban t_a57ae7db (2026-10-15). This console showed the account's tier NAME and nothing else, and
// the only "See plans & upgrade" link it carried pointed at https://coreswiftcrm.com/pricing — a
// DIFFERENT product's pricing page — which answers 404 (measured live, browser UA). So a
// MissedCall Respondr tenant had no shipped screen on which to see the ladder or pay for it, while
// the app can in fact sell: plans are $0 / $49 / $199 and POST /api/v1/checkout/create is mounted.
// This screen reads the SAME catalogue the operator's Plans table edits (GET /plans, added to the
// tenant router alongside this screen) and drives the REAL checkout. Whatever the server refuses —
// no provider configured, provider declined, plan not on sale — is shown in the server's own words,
// never replaced by a generic failure, so an unconfigured install says what is missing instead of
// looking broken.
// The customer's own PLAN REQUESTS -- the tickets this screen files when checkout is closed.
// GET /api/v1/tickets is credential-scoped (the handler reads tenant_id from the session), so this
// lists THIS workspace's tickets only; the filter keeps the ones filed from Plan & Billing. A
// transient "request sent" notice was the whole record before this: a reload lost it, and the
// customer could not tell whether anything had been filed.
const loadPlanRequests = async (st) => {
  try {
    const d = await API.get('/tickets');
    const list = Array.isArray(d) ? d : ((d && d.tickets) || []);
    // BOTH source names are a plan request. This screen's own button files `plan_request`
    // (the fleet name the operator's queue and `platform_stats` read), while rows filed
    // before 2026-10-20 carry `billing` — the server counts both, so the customer's list
    // must too. It filtered on `billing` ALONE, so the request this very screen had just
    // filed was invisible on it: measured live 2026-10-21, POST /tickets answered 200 with
    // source=plan_request and the Billing screen rendered no "Your plan requests" card at
    // all — after the notice had promised "its live status is in the list below".
    st.requests = list.filter(t => ['billing', 'plan_request'].indexOf(String(t.source || '')) !== -1);
  } catch (e) { st.requests = []; }
  st.requestsLoaded = true;
  renderApp();
};

// Taking back a plan request the workspace no longer wants (cron 2026-10-27). The app already
// serves a credential-scoped DELETE /api/v1/tickets/{id}, so nothing new is exposed here: the
// button only appears while the row can really go — an applied switch or a closed request keeps
// its record. Same confirm-then-reload shape the other delete buttons in this console use.
const withdraw = async (st, t) => {
  if (!confirm('Withdraw this plan request? Nothing has been charged, and you can ask again later.')) return;
  st.withdrawing = t.id; st.notice = null; st.error = null; renderApp();
  try {
    await API.del('/tickets/' + t.id);
    st.notice = 'That request is withdrawn. Nothing was charged, and you can ask again any time.';
    await loadPlanRequests(st);
  } catch (e) {
    st.error = 'That request could not be withdrawn: ' + e.message;
  }
  st.withdrawing = null; renderApp();
};

const Billing = () => {
  const st = viewState('billing', { loaded: false, busy: false, plans: [], notice: null, error: null, buying: null, requestFor: null, requests: [], requestsLoaded: false, withdrawing: null, till: null, tillTried: false, term: 'month' });
  if (!st.loaded && !st.busy) {
    st.busy = true;
    loadPlanRequests(st);
    API.get('/plans').then(d => {
      const list = (d && d.plans) || d || [];
      st.plans = (Array.isArray(list) ? list : []).filter(p => p.is_active !== false);
      st.loaded = true; st.busy = false; renderApp();
    }).catch(e => {
      st.error = 'Could not load the plans: ' + e.message;
      st.loaded = true; st.busy = false; renderApp();
    });
  }
  // ASK THE TILL BEFORE INVITING A PURCHASE (2026-11-08, card t_93214280). Every paid tier used to
  // carry an "Upgrade to <plan>" button and the customer learned that this installation cannot take
  // a payment only AFTER pressing it, from a refusal. GET /checkout/status answers what the till can
  // actually do — a provider armed with a usable key, or an active plan carrying its own hosted
  // payment page — so the buttons below can ask the team to make the switch instead of offering a
  // purchase that must refuse. A failed or absent read leaves the previous behaviour in place: the
  // refusal path below is honest and files the ask, so a slow status call must never hide a working
  // purchase.
  if (!st.tillTried) {
    st.tillTried = true;
    API.get('/checkout/status').then(d => { st.till = d || null; renderApp(); })
      .catch(() => { st.till = null; renderApp(); });
  }
  const me = API.user || {};
  const current = me.plan_name ? String(me.plan_name).trim().toLowerCase() : '';
  const nameOf = p => p.name || p.slug || 'Plan';
  const keyOf = p => p.slug || p.name || String(p.id);
  // A plan the workspace HOLDS is not the same as the tier it is bounded by (2026-10-28).
  // `/auth/me` publishes `plan_assigned` for exactly this: false when the workspace holds no
  // active tenant_plans row, in which case `plan_name` is the fallback the write gates apply,
  // not a plan the customer ever picked. Absent (older payload) is read as assigned so this
  // change cannot make a genuinely-subscribed workspace look plan-less.
  const assigned = me.plan_assigned !== false;
  const isCurrent = p => {
    const a = String(p.name || '').trim().toLowerCase(), b = String(p.slug || '').trim().toLowerCase();
    return assigned && !!current && (a === current || b === current);
  };
  const monthly = p => Number(p.price_monthly || 0);
  // ── THE BILLING TERM (2026-11-10) ─────────────────────────────────────────────────────────────
  // Every plan record carries BOTH a monthly and a yearly price (the admin panel writes both), but
  // this screen only ever quoted the monthly rate and only ever sent the monthly amount, so the
  // annual offer in the catalogue could not be bought from the one place a customer buys. The switch
  // below offers it, the amount sent is the chosen term's own figure from the row, and the saving is
  // COMPUTED from the two figures in that row — never written here, so a price change cannot leave a
  // stale claim on the tile.
  const yearlyPrice = p => Number(p.price_yearly || 0);
  const money = n => '$' + (Number(n) % 1 === 0 ? Number(n).toFixed(0) : Number(n).toFixed(2));
  // A tier with NO yearly price is never sold a year: the switch simply keeps quoting its monthly
  // rate, and the server refuses a yearly ask by name if one is ever sent.
  const termOf = p => (st.term === 'year' && yearlyPrice(p) > 0 ? 'year' : 'month');
  const amountOf = p => (termOf(p) === 'year' ? yearlyPrice(p) : monthly(p));
  const termNote = p => {
    if (termOf(p) !== 'year') return '';
    const perYear = monthly(p) * 12;
    if (perYear <= 0) return '';
    const savings = perYear - yearlyPrice(p);
    // NO DISCOUNT IS NOT A SAVING (measured live 2026-11-10): the Enterprise row prices a year at
    // exactly 12 × its monthly rate, and the tile read "$0 off a year". A term that costs the same
    // says nothing extra, so the line is simply not painted.
    if (savings <= 0.005) return '';
    const monthsFree = Math.round(savings / monthly(p));
    if (monthsFree >= 1) return monthsFree + (monthsFree === 1 ? ' month free' : ' months free');
    return money(savings) + ' off a year';
  };
  const termBar = () => {
    const anyYearly = st.plans.some(p => yearlyPrice(p) > 0);
    if (!anyYearly) return null;
    const b = (v, label) => html`<button type="button" class=${'btn btn-sm' + (st.term === v ? '' : ' btn-outline')}
        data-billing-term=${v} aria-pressed=${st.term === v ? 'true' : 'false'}
        onClick=${() => { if (st.term !== v) { st.term = v; st.requestFor = null; st.notice = null; renderApp(); } }}>${label}</button>`;
    return html`<div class="card" id="billing-term">
      <h3 class="font-semibold mb-1">How you pay</h3>
      <p class="text-sm text-gray-600 mb-2">Pay monthly, or pay for a year up front at the yearly price each plan carries. The yearly figure is not a guess: it is the tier's own stored price, and the saving shown on each tile is worked out from the monthly and yearly figures in that same row.</p>
      <div class="flex items-center gap-2" style="flex-wrap:wrap">${b('month', 'Monthly')}${b('year', 'Yearly')}</div>
    </div>`;
  };
  // FALSE only when the till itself said nothing can be sold on this install: no provider armed
  // with a usable key AND no active plan carrying a usable hosted payment page (2026-11-08). An
  // absent answer (route failed, older server) is NOT "closed", so the purchase button and its
  // honest refusal path stay in place.
  const tillClosed = !!(st.till && st.till.can_purchase === false);
  // The price slot must carry a PRICE, not a second copy of the plan's own name. It read
  // `monthly(p) <= 0 ? 'Free' : …`, and this screen already prints the plan name in the `h3`
  // directly above it (`nameOf(p)`), so the free tier rendered as "Free / Free" — the tile's
  // headline and its price line said the same word — while every sibling console shows the $0:
  // WorkflowSwift renders "$0/mo" and IncentiveSwift "$0/month". Measured live 2026-10-15 on
  // app.missedcallrespondr.com/dashboard/ (the only tile on the screen whose price line was not a
  // price). Same "$X / month" shape as the paid tiles now, for every plan including free.
  const priceLine = p => money(amountOf(p)) + (termOf(p) === 'year' ? ' / year' : ' / month');
  // WHAT THE BUYER READS ON A TILE (cron 2026-10-26). The tile used to print the plan row's own
  // JSON keys verbatim — "included credits: 50", "max phone numbers: 1", "multi_tenant" — so the
  // one screen where a customer decides to pay showed lower-case database slugs, and the Free
  // tile listed the same 50 credits twice under two key names. Measured live on
  // app.missedcallrespondr.com/dashboard/ against the Free / Pro Monthly / Enterprise rows.
  // These labels add NO claim the stored row does not already carry: an unknown key falls back to
  // its own slug in sentence case, a numeric value keeps its own number (thousands separators
  // only), capabilities are listed before allowances, and two keys that resolve to the same
  // sentence collapse into one so a tile cannot show the same thing twice.
  const fmtNum = n => { const v = Number(n); return isFinite(v) ? v.toLocaleString('en-US') : String(n); };
  const sentence = k => String(k).replace(/[_-]+/g, ' ').replace(/\s+/g, ' ').trim().replace(/\b\w/g, c => c.toUpperCase());
  const FEATURE_LINE = {
    unlimited_leads: () => 'Unlimited leads',
    advanced_tags: () => 'Advanced tags',
    dual_routing: () => 'Dual routing',
    multi_tenant: () => 'Multi-tenant',
    white_label: () => 'White label',
    priority_support: () => 'Priority support',
    starter_credits: v => fmtNum(v) + ' starter credits',
    included_credits: v => fmtNum(v) + ' included credits',
    bonus_credits: v => fmtNum(v) + ' bonus credits',
    max_phone_numbers: v => 'Up to ' + fmtNum(v) + (Number(v) === 1 ? ' phone number' : ' phone numbers'),
    max_leads: v => (Number(v) ? 'Up to ' + fmtNum(v) + ' leads' : 'Unlimited leads'),
    max_tags: v => (Number(v) ? 'Up to ' + fmtNum(v) + ' tags' : 'Unlimited tags')
  };
  const FEATURE_ORDER = ['unlimited_leads', 'advanced_tags', 'dual_routing', 'multi_tenant', 'white_label',
    'priority_support', 'included_credits', 'bonus_credits', 'starter_credits', 'max_phone_numbers',
    'max_leads', 'max_tags'];
  const features = p => {
    const f = p.features;
    if (!f) return [];
    let pairs = Array.isArray(f) ? f.map(x => [String(x), null]) : Object.keys(f).map(k => [k, f[k]]);
    // ONE FACT, ONE LINE: `starter_credits` and `included_credits` describe the same starter
    // allowance when they hold the same number — the Free row stores 50 in both — and printing both
    // read as a duplicate on the only tile a free customer is asked to upgrade from. The value is
    // kept (it comes from the row), only the second sentence goes.
    const get = k => { const hit = pairs.find(([key]) => key === k); return hit ? hit[1] : undefined; };
    if (get('starter_credits') != null && String(get('starter_credits')) === String(get('included_credits'))) {
      pairs = pairs.filter(([k]) => k !== 'starter_credits');
    }
    // A fixed reading order (capabilities, then the allowances the row really stores), with any
    // key the map does not know kept after them in stored order.
    const rank = k => { const i = FEATURE_ORDER.indexOf(k); return i === -1 ? FEATURE_ORDER.length : i; };
    pairs.sort((a, b) => rank(a[0]) - rank(b[0]));
    const lines = pairs.map(([k, v]) => {
      const label = FEATURE_LINE[k];
      if (label) return label(v);
      return v == null ? sentence(k) : sentence(k) + ': ' + (typeof v === 'number' ? fmtNum(v) : String(v));
    });
    return [...new Set(lines)];
  };
  // When the till says nothing can be sold here, a paid tier asks our team instead of opening a
  // payment page that must refuse (2026-11-08). The request panel and requestPlan() below already
  // file the ticket on this app's own /tickets route with source plan_request, so this only opens
  // that panel for THIS tier: one press becomes the same ask a refused purchase files, and no card
  // details are entered either way.
  const askFor = p => {
    st.notice = null; st.error = null;
    st.requestFor = { key: keyOf(p), slug: (p.slug || ''), name: nameOf(p), price: amountOf(p), term: termOf(p) };
    renderApp();
    setTimeout(() => {
      const el = document.getElementById('billing-request');
      if (el && el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 0);
  };
  const buy = async p => {
    st.busy = true; st.buying = keyOf(p); st.notice = null; st.error = null; st.requestFor = null; renderApp();
    try {
      // The handler REFUSES a plan checkout without `amount` (measured live 2026-10-15:
      // POST /checkout/create {purchasable_type, purchasable_id} answers 400 "amount is
      // required"), so the tier's own stored monthly price is sent explicitly rather than
      // assumed to be derived server-side. `currency` defaults to USD.
      const r = await API.post('/checkout/create', {
        purchasable_type: 'plan',
        purchasable_id: p.id,
        amount: amountOf(p),
        currency: 'USD',
        // WHICH TERM (2026-11-10). Absent used to be the only thing the server could read, so every
        // session was monthly. The field is optional there, so this is additive, and the server
        // judges the amount against THIS term's own catalogue price.
        billing_cycle: termOf(p),
        success_url: window.location.origin + '/dashboard/',
        cancel_url: window.location.origin + '/dashboard/'
      });
      const url = (r && (r.checkout_url || r.url)) || '';
      if (url) { window.location.href = url; return; }
      st.notice = 'A checkout session was opened on the server but the payment provider returned no link.';
    } catch (e) {
      // A refused purchase must not answer the BUYER in the operator's words. This arm put the
      // server's own sentence straight into the red card — measured live 2026-10-15: POST
      // /api/v1/checkout/create answered 400 {"error":"No active stripe provider configured"} and
      // the buyer read exactly that. It names the one thing a customer cannot act on, and reads
      // like something they broke. Fleet convention, already shipped by ADASwift's dashboard,
      // WorkflowSwift's Plan & Billing and IncentiveSwift's Plan & Billing: lead with the
      // customer's own line and the fact that nothing was charged, then the server's detail
      // unchanged so the operator still reads the whole cause. A refused /checkout/create never
      // creates a session (measured on this leg: checkout_sessions 0 -> 0), so "nothing was
      // charged" holds on every refusal arm.
      const detail = (e && e.message) ? String(e.message) : '';
      const noProvider = /provider|not configured/i.test(detail);
      // A refused checkout must not dead-end the customer. IncentiveSwift shipped this path on
      // 2026-10-18: when the install has no payment provider, the screen files a billing request
      // and the team performs the switch by hand. Same shape here, on this app's own ticket route
      // (POST /api/v1/tickets), so a tenant can still move plan while checkout is closed.
      // THE REFUSAL ALREADY FILED IT (measured live 2026-10-29 on this app: the 503 body of
      // POST /checkout/create carries request_recorded:true and plan_request.already_open:false, so
      // the SERVER records the ask in the same press that refuses the checkout). Filing through
      // /tickets afterwards only made the server answer `already_open` for the row it had just
      // written, and this screen then told the customer "You already have an open request" on their
      // FIRST press. Read the server's flag: file only when it did NOT record.
      // `var`, not `const`: the branches that read it (`autoFiled` / `recorded`, below) run AFTER
      // this catch block closes, so a block-scoped binding would throw a ReferenceError there and
      // leave the buyer staring at the red refusal line with no confirmation — the exact shape
      // measured in Chromium on the first run of this fix (2026-11-05).
      var rb = (e && e.body) || {};
      var recorded = rb.request_recorded === true;
      var alreadyOpen = !!(rb.plan_request && rb.plan_request.already_open === true);
      st.requestFor = (noProvider && !recorded)
        ? { key: keyOf(p), slug: (p.slug || ''), name: nameOf(p), price: monthly(p) }
        : null;
      // ONE PRESS FILES IT (cron 2026-10-20). Measured LIVE in Chromium on
      // app.missedcallrespondr.com/dashboard before this change: pressing an upgrade answered 400
      // /api/v1/checkout/create, the screen rendered the request card, and GET /api/v1/tickets still
      // returned 0 — the customer had to press a second button before anything reached the team.
      // File it on the same press here; the button remains for the failure case (requestPlan's catch
      // arm leaves st.requestFor set and the button enabled, so pressing it retries).
      var autoFiled = noProvider && !recorded;
      // The customer line stands ALONE on the no-provider arm. It used to have the server's own
      // sentence appended, which is how a buyer came to read "No active none provider configured"
      // (measured live 2026-10-19) — `none` is the placeholder `plans.payment_provider` carries on a
      // tier that is not on sale, not a provider name. The server now answers that arm in plain
      // words, and repeating it after the customer line adds nothing a buyer can act on. The cause
      // still reaches whoever needs it: the hand-off request below is what the team acts on, and
      // the refusal is in the server log with the plan and provider it tried.
      st.error = noProvider
        ? 'Upgrades are not open on this workspace yet \u2014 nothing was charged.'
        : 'The upgrade could not be started \u2014 nothing was charged.'
          + (detail ? ' ' + detail : '');
    }
    st.busy = false; st.buying = null; renderApp();
    // The one-press arm: the request it describes is filed HERE rather than waiting for a second
    // button press.
    // MEASURED LIVE 2026-10-21 (Chromium, app.missedcallrespondr.com, throwaway workspace): one
    // press of "Upgrade to Pro Monthly" on an install with no payment provider rendered TWO cards
    // at once \u2014 the red "Upgrades are not open on this workspace yet, nothing was charged"
    // AND the green "Request sent: our team will move this workspace to the Pro Monthly plan and we
    // have emailed you a copy of this request". Both statements were true, and together they
    // read as a failure that had also succeeded, so the buyer could not tell whether the press
    // counted. ONE outcome now: while the notice stands, the refusal line is cleared, and the
    // notice itself carries the "nothing was charged" fact.
    if (autoFiled) {
      await requestPlan();
      if (st.notice) st.error = null;
      renderApp();
    } else if (recorded) {
      // The checkout refusal already filed it: confirm what actually happened, and keep the dedupe
      // sentence for the case where the server itself says an open request already existed.
      st.notice = alreadyOpen
        ? 'You already have an open request for the ' + nameOf(p) + ' plan \u2014 our team is on it,'
          + ' and its live status is in the list below.'
        : 'Request recorded \u2014 nothing was charged. Our team will move this workspace to the '
          + nameOf(p) + ' plan and confirm here; its live status is in the list below.'
          // The server now emails the buyer a receipt on THIS door too (2026-11-05): the refusal
          // carries `receipt_emailed`, so the promise is made only when a message was really queued
          // — the same rule the ticket route's `acknowledged` follows below.
          + (rb.receipt_emailed === true ? ' A copy is in your inbox.' : '');
      st.error = null;
      loadPlanRequests(st);
      renderApp();
    }
  };
