<!-- IMPERSONATION HAND-OFF (kanban t_25b8c662). The operator console on admin.missedcallrespondr.com
     mints a 15-minute `impersonated` token and opens THIS url with the token in the FRAGMENT.
     A fragment is never sent to the server, so it cannot land in an access log or a Referer; we
     adopt it once, then strip it from the address bar (skill: session-credential-out-of-url-and-logs).
     Inline and in <head> on purpose: it must run BEFORE the module below reads sessionStorage, and
     before any subresource request could carry the fragment in a Referer. -->
<script>
!function () {
  try {
    var h = window.location.hash || '';
    if (h.indexOf('impersonation_token=') < 0) return;
    var q = {};
    h.replace(/^#/, '').split('&').forEach(function (kv) {
      var i = kv.indexOf('=');
      if (i > 0) q[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1));
    });
    if (!q.impersonation_token) return;
    var who = q.impersonation_tenant || 'a tenant';
    sessionStorage.setItem('mc_token', q.impersonation_token);
    // Its OWN key too (kanban t_ff1e3bb1). `mc_token` is what every scoped API call on this origin
    // uses, but the Stop control must be able to present THE IMPERSONATION TOKEN specifically: the
    // route that ends a session exists for that caller, so handing it the operator's own token (or a
    // later normal login's token) would prove nothing. Kept apart, discarded with the session.
    sessionStorage.setItem('mc_impersonation_token', q.impersonation_token);
    // NOT the operator's identity: the impersonated token keeps the operator's `sub`, so
    // GET /auth/me would hand this shell the ADMIN's own user row. A marker instead.
    sessionStorage.setItem('mc_user', JSON.stringify({
      email: 'impersonated@' + who, name: 'Impersonating ' + who, impersonated: true, tenant: who
    }));
    history.replaceState(null, '', window.location.pathname + window.location.search);
  } catch (e) { /* never let the hand-off break the shell; the guard below still applies */ }
}();
</script>

<script type="module">
// preact + htm, exactly the fleet pattern the other shells use (www-admin, WorkflowSwift).
// The shipped tag loaded cdn.jsdelivr.net/npm/lit-html@2.8.0/lit-html.min.js in a CLASSIC
// script and then read window['lit-html']: jsDelivr serves that path as a raw ES module, so
// the browser threw "Unexpected token 'export'", the destructure threw
// "Cannot destructure property 'html' of 'window.lit-html' as it is undefined", and the
// dashboard rendered NOTHING — every view, and every fetch it owns, was dead. The shell is
// written in preact/htm style anyway (onClick=/onInput= props and <${Component} /> tags, 41/25/3
// occurrences — lit-html supports none of those), so the loader was pointing at the wrong library.
import { h, render } from './vendor/preact.js';
import htm from './vendor/htm.js';
const html = htm.bind(h);

// ===== API =====
const API = (() => {
  const base = window.location.origin + '/api/v1';
  let token = sessionStorage.getItem('mc_token');
  let user = JSON.parse(sessionStorage.getItem('mc_user') || 'null');
  const headers = () => ({ 'Content-Type': 'application/json', ...(token ? { 'Authorization': 'Bearer ' + token } : {}) });
  const handle = async (r) => { const d = await r.json(); if (!r.ok) throw new Error(d.error || d.message || 'Request failed'); return d; };
  // A 401 on a request that CARRIED a session means the session the server knows about is gone: the
  // token's 7 days are up (`exp: now + 86400 * 7`, src/auth/handlers.rs) or it was revoked. Ending
  // it HERE is the only way this console can get back to a sign-in — measured in real Chromium on
  // app.missedcallrespondr.com (2026-10-16): with an expired session in storage, /auth/me, /me/usage,
  // /dashboard/stats and /dashboard/activity each answered 401 while the signed-in shell, its nav and
  // the account level stayed painted and NO sign-in was ever offered (browser-run/
  // mcr-session-expiry-proof.js, PRE arm). The sign-in request itself carries no token, so a wrong
  // password still shows the API's own sentence instead of being read as an expired session.
  const sessionEnded = () => {
    token = null; user = null;
    try {
      sessionStorage.removeItem('mc_token');
      sessionStorage.removeItem('mc_user');
      sessionStorage.removeItem('mc_impersonation_token');
    } catch (e) { /* storage can be blocked; the in-memory clear above still signs the shell out */ }
    S.sessionEnded = true; S.view = 'overview'; S.error = null;
    renderApp();
    throw new Error('session ended');
  };
  const send = (p, opts) => {
    const carried = !!token;
    return fetch(base + p, opts).then((r) => (r.status === 401 && carried ? sessionEnded() : handle(r)));
  };
  const get = (p) => send(p, { headers: headers() });
  const post = (p, b) => send(p, { method: 'POST', headers: headers(), body: JSON.stringify(b) });
  const put = (p, b) => send(p, { method: 'PUT', headers: headers(), body: JSON.stringify(b) });
  const del = (p) => send(p, { method: 'DELETE', headers: headers() });
  // A WRONG CURRENT PASSWORD IS A 401 BY CONTRACT, NOT A DEAD SESSION (2026-10-17). PUT /auth/password
  // answers 401 "Current password is incorrect" NAMING the field (src/auth/handlers.rs:275), while
  // send() ends the session on ANY 401 that carried a token — so a mistyped current password signed
  // the customer out and the sentence never appeared (measured in real Chromium, PRE arm of
  // browser-run/mcr-pw401-1017.js). This call keeps the two apart: only a 401 that is NOT the field's
  // own refusal ends the session; the field's sentence is thrown back with `field: true`.
  const changePassword = (current_password, new_password) => fetch(base + '/auth/password', {
    method: 'PUT', headers: headers(), body: JSON.stringify({ current_password, new_password })
  }).then(async (r) => {
    let d = {};
    try { d = await r.json(); } catch (e) { /* a non-JSON refusal still has a status */ }
    if (r.ok) return d;
    const msg = (d && (d.error || d.message)) || ('Request failed (' + r.status + ')');
    const fieldRefusal = r.status === 401 && /current password/i.test(String(msg));
    if (r.status === 401 && !fieldRefusal) sessionEnded();
    const err = new Error(msg); err.status = r.status; err.field = fieldRefusal; throw err;
  });
  return {
    get, post, put, del, changePassword,
    get token() { return token; },
    get user() { return user; },
    setAuth(t, u) { token = t; user = u; sessionStorage.setItem('mc_token', t); sessionStorage.setItem('mc_user', JSON.stringify(u)); },
    // Re-read the account row from the server (kanban t_9cd2c8f2). The login answer carries no plan
    // tier and no picture, so the console signs in against /auth/login and then refreshes from
    // GET /auth/me — which is where the REAL plan_name, company, username and avatar_url come from.
    // Never throws: a failed refresh leaves the session usable and the label falls back.
    refreshMe() {
      if (!token) return Promise.resolve(null);
      return get('/auth/me').then(function (me) {
        user = Object.assign({}, user || {}, me);
        // `/auth/me` OMITS `avatar_url` when the account has NO picture (the server skips a None),
        // and the merge above spreads the answer OVER the cached row — so an ABSENT key left the
        // STALE URL alive. Measured in a real browser after Remove (kanban t_0278f465): the picture
        // stayed painted (and its <img> then 404'd) and the Remove control was still offered, i.e.
        // the removal looked like it had not happened. Take the field from the answer, so every
        // caller - including the Profile view's own merge of this result - sees the cleared value.
        user.avatar_url = me.avatar_url || '';
        sessionStorage.setItem('mc_user', JSON.stringify(user));
        return user;
      }).catch(function () { return null; });
    },
    logout() { token = null; user = null; sessionStorage.removeItem('mc_token'); sessionStorage.removeItem('mc_user'); sessionStorage.removeItem('mc_impersonation_token'); }
  };
})();

/* ===== END THE IMPERSONATION SESSION (kanban t_ff1e3bb1) =====
   The banner used to offer only a local logout: the control discarded the token in this tab and
   returned to the admin panel WITHOUT telling the server, and the route that exists for exactly
   this caller (`POST /api/v1/admin/stop-impersonation`) was refused 403 by the platform-admin gate
   even for the session itself. Both halves are fixed: the gate carries the one carve-out (keyed on
   the impersonation role, pinned to that exact path), and this control presents THE IMPERSONATION
   TOKEN to it before discarding anything. A refusal is shown on screen, never hidden behind a
   logout that would make it look like the session ended. */
function endImpersonation() {
  const tok = sessionStorage.getItem('mc_impersonation_token');
  S.impStopError = null;
  const leave = () => {
    API.logout();
    window.location.href = 'https://admin.missedcallrespondr.com/';
  };
  // Nothing to end (the session was never handed a token to this tab): just leave.
  if (!tok) { leave(); return; }
  fetch(window.location.origin + '/api/v1/admin/stop-impersonation', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + tok },
    body: '{}'
  }).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (d) { return { ok: r.ok, status: r.status, d: d }; });
  }).then(function (res) {
    if (!res.ok) {
      S.impStopError = 'The session could not be ended (' + res.status + '): '
        + ((res.d && (res.d.error || res.d.message)) || 'unknown error');
      renderApp();
      return;
    }
    leave();
  }).catch(function (e) {
    S.impStopError = 'The session could not be ended: ' + e.message;
    renderApp();
  });
}

const S = { view: 'overview', loading: false, error: null, views: {} };
const viewState = (name, defaults = {}) => { if (!S.views[name]) S.views[name] = Object.assign({}, defaults); return S.views[name]; };

// ===== LOGIN =====
const LoginView = () => {
  // kanban t_02ef49ca — the login draft lives in the SHARED view object (S.views['login_form']),
  // never a per-render local: the Sign In handler itself calls renderApp() (S.loading / S.error),
  // so the old `let email = '', pw = ''` blanked BOTH fields on every attempt.
  const f = viewState('login_form', { email: '', pw: '' });
  const submit = async (e) => { e.preventDefault(); S.loading = true; S.error = null; renderApp();
    try { const r = await API.post('/auth/login', { email: f.email, password: f.pw }); API.setAuth(r.token, r.team_member || r.user || r); S.meLoaded = false; S.sessionEnded = false; f.email = ''; f.pw = ''; S.view = 'overview'; } catch (err) { S.error = err.message; }
    S.loading = false; renderApp();
  };
  return html`<div class="flex items-center justify-center min-h-screen w-full">
    <div class="card w-full max-w-sm mx-4">
      <div class="text-center mb-6">
        <div class="text-3xl mb-2">📞</div>
        <h1 class="text-xl font-bold text-gray-800">MissedCall Respondr</h1>
        <p class="text-sm text-gray-500 mt-1">Auto-Response Platform</p>
      </div>
      <form onSubmit=${submit} class="space-y-4">
        <div><label class="text-sm font-medium text-gray-600 block mb-1">Email</label><input type="email" class="input" value=${f.email} onInput=${e => f.email = e.target.value} required /></div>
        <div><label class="text-sm font-medium text-gray-600 block mb-1">Password</label><input type="password" class="input" value=${f.pw} onInput=${e => f.pw = e.target.value} required /></div>
        ${S.sessionEnded && html`<div class="text-amber-800 text-sm bg-amber-50 p-2 rounded-lg">Your session ended, so you were signed out. Sign in again to carry on.</div>`}
        ${S.error && html`<div class="text-red-600 text-sm bg-red-50 p-2 rounded-lg">${S.error}</div>`}
        <button type="submit" class="btn w-full">Sign In</button>
      </form>
      <p class="text-sm text-gray-500 mt-4 text-center">New to MissedCall? <a href="/register" class="text-blue-600">Create an account</a></p>
      <p class="text-sm text-gray-500 mt-2 text-center"><a href="/forgot-password.html" class="text-blue-600">Forgot password?</a></p>
    </div>
  </div>`;
};

// ===== OVERVIEW =====
// kanban t_9cd2c8f2 — this screen used to render FOUR tiles that could never show a number: it read
// `st.total_rules` / `total_templates` / `total_contacts` / `total_responses`, while
// `GET /dashboard/stats` answers `total_calls` / `missed_calls` / `answered_calls` /
// `follow_ups_pending` / `response_rate` — so every tile sat on "..." forever (measured in real
// Chromium), and the "Credits" card read `usage.available_credits` from a payload that carries
// `contacts/leads/deals/phone_numbers/rules/users`, so it sat on "Loading…" forever. A dashboard of
// eternal placeholders IS the "dead/placeholder panel" the card refuses. Every value below is one
// the API really returns, and a missing one shows an em dash rather than a fake zero.
const Overview = () => {
  const st = viewState('overview', {});
  if (!st._loaded) { st._loaded = true;
    API.get('/dashboard/stats').then(s => Object.assign(st, s)).catch(() => {}).then(renderApp);
    API.get('/me/usage').then(u => { st.usage = u; renderApp(); }).catch(() => {});
    // GET /dashboard/activity — the backend route existed with NO caller and, until this card, no
    // writer either (nothing in the crate inserted into `activity_log`). Both halves now exist, so
    // the panel below shows what the tenant's auto-response setup actually did.
    API.get('/dashboard/activity').then(a => { st.activity = Array.isArray(a) ? a.slice(0, 8) : []; renderApp(); })
      .catch(() => { st.activity = []; renderApp(); });
  }
  const c = API.user || {};
  const u = st.usage || {};
  const num = (v) => (v === undefined || v === null) ? '—' : v;
  // A count of 1 must not render the plural noun — the same class as the CoreSwift usage readout
  // that printed "1 users" for every workspace. `num` still supplies the dash when the payload
  // omits the value, so the noun is the only thing this decides.
  const plural = (v, one, many) => `${num(v)} ${v === 1 ? one : many}`;
  // kanban cron-1016 — each figure is the workspace's real count beside the allowance its OWN plan
  // row carries. BOTH halves come from the server on the SAME read: the counts from this route and
  // the allowances object that `features::get_usage_json` resolves with `resolve_limit` — the one
  // resolver the purchase gate itself calls — so what a tenant reads here cannot disagree with the
  // number a purchase is refused against. A key the plan does not declare shows the count alone (the
  // gate allows it); -1 is the fleet's unlimited sentinel; and 0 means the plan does not grant the
  // thing at all, which is words, not "0/0": the shape FunnelSwift's dashboard shipped.
  const al = (u.allowances && typeof u.allowances === 'object') ? u.allowances : {};
  const withCap = (used, key, one, many) => {
    const base = plural(used, one, many);
    if (!Object.prototype.hasOwnProperty.call(al, key)) return base;
    const cap = Number(al[key]);
    if (!isFinite(cap)) return base;
    if (cap < 0) return base + ' \u2014 unlimited';
    if (cap === 0) return base + ' \u2014 not on this plan';
    return base + ' of ' + cap + ((typeof used === 'number' && used > cap) ? ' \u26a0' : '');
  };
  // The call credits this account has LEFT (measured gap, 2026-10-17). Every inbound call handled
  // on the platform's own number spends one, and at zero the call is hung up — so the balance is
  // shown beside the plan that granted it instead of living only in the database. A tenant on its
  // own Telnyx key is never charged, so its balance simply stays put.
  const creditNote = (u) => {
    const n = u && u.credits;
    if (typeof n !== 'number' || !isFinite(n)) return '';
    if (n <= 0) {
      // CORRECTED 2026-10-17 (cron `default`): the first wording told the tenant to "Add credits",
      // which no screen of this app offers — there is no top-up route and no top-up control, and a
      // plan change deliberately does NOT touch `credit_balance` (plans_handler's UPDATE arm). So
      // the sentence sent a stopped customer looking for a control that does not exist. The real
      // route is the operator: `admin_handler`'s manual add (POS / adjust credits). It is named here
      // with a mail link so the only instruction on the panel is one the customer can carry out.
      return html`<p class="text-sm" style="color:#b91c1c;margin:8px 0 0" id="credit-note">No call credits left \u2014 incoming calls are being refused. Credits are added by our team, not from this screen: email <a href="mailto:support@swiftsoftware.net?subject=Add%20call%20credits" style="color:#b91c1c;text-decoration:underline">support@swiftsoftware.net</a> to top them up.</p>`;
    }
    const cap = Object.prototype.hasOwnProperty.call(al, 'included_credits') ? Number(al.included_credits) : null;
    const of = (cap !== null && isFinite(cap) && cap > 0) ? ' of ' + cap : '';
    return html`<p class="text-sm text-gray-600 mt-2" id="credit-note">${n}${of} call credit${n === 1 ? '' : 's'} left</p>`;
  };
  // Activity-feed labels. A new action kind shows its RAW token until a label is added here, which
  // is honest rather than invisible.
  const ACT_LABEL = { 'call.received': '📞 Missed call received', 'message.sent': '💬 Reply sent', 'contact.created': '👤 Contact added' };
  // A stored value is only as short as the write path allowed it to be, and the contact create/update
  // paths were unbounded until today (a 250-character name was accepted and one is already in the
  // activity log). Rows written before that cap must not be able to stretch this feed, so every
  // value the feed prints is clipped first — the name is what would actually break the layout.
  const clipAct = (value, max) => {
    const s = (value === null || value === undefined) ? '' : String(value);
    return s.length > max ? s.slice(0, max - 1) + '…' : s;
  };
  const actDetail = (a) => {
    const m = (a.metadata && typeof a.metadata === 'object') ? a.metadata : {};
    if (a.action === 'call.received') return m.caller_number ? ' from ' + clipAct(m.caller_number, 40) : '';
    if (a.action === 'message.sent') return (m.auto_rule ? ' (' + clipAct(m.auto_rule, 40) + ')' : '') + (m.to_number ? ' to ' + clipAct(m.to_number, 40) : '');
    if (a.action === 'contact.created') return m.name ? ': ' + clipAct(m.name, 60) : '';
    return '';
  };
  // cron 2026-10-27 — a brand-new workspace lands on this screen as a grid of zeros with no next
  // step: the two things a customer MUST do before a single call can be answered (connect a number,
  // write a response rule) were only discoverable by reading the sidebar and guessing the order.
  // This card names them in order and links each to the screen that does it.
  //   * It paints only once BOTH reads behind it have answered (`/dashboard/stats` for the call
  //     counts, `/me/usage` for the rule and number counts), so a failed read can never make a busy
  //     workspace look new.
  //   * It removes itself the moment a number, a rule or a call exists — never permanent furniture.
  //   * It promises only what this app actually does: a number is what callers dial, and the rule is
  //     what a missed caller gets (a text back, or a callback queued in Follow-ups). The Telnyx
  //     credential is the PLATFORM's, not the customer's, so it is not a step here.
  const firstSteps = () => {
    if (typeof u.rules !== 'number' || typeof u.phone_numbers !== 'number') return '';
    if (u.rules > 0 || u.phone_numbers > 0) return '';
    if (Number(st.total_calls) > 0) return '';
    const steps = [
      ['Connect a phone number', 'This is the number your callers dial. Until one is connected nothing can reach MissedCall, so there is no call to answer.', 'phoneNumbers', 'Connect a number'],
      ['Write your first response rule', 'The rule decides what a missed caller gets: a text back, or a callback queued for you in Follow-ups.', 'rules', 'Add a rule'],
    ];
    return html`<div class="card" data-first-steps="1" style="margin-bottom:16px">
      <h3 class="font-semibold" style="margin:0 0 2px">Get set up</h3>
      <p class="text-sm text-gray-500" style="margin:0 0 10px">Two steps and your next missed call answers itself. This card goes away once either one is done.</p>
      ${steps.map((s, i) => html`<div style="display:flex;gap:12px;align-items:flex-start;padding:10px 0${i ? ';border-top:1px solid #e2e8f0' : ''}">
        <div style="flex:0 0 24px;height:24px;border-radius:50%;background:#eef2ff;color:#4338ca;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center">${i + 1}</div>
        <div style="flex:1">
          <div class="font-semibold text-sm">${s[0]}</div>
          <div class="text-sm text-gray-500" style="margin:2px 0 6px;max-width:60ch">${s[1]}</div>
          <button type="button" class="btn btn-sm" data-first-step=${s[2]} onClick=${() => { S.view = s[2]; renderApp(); }}>${s[3]}</button>
        </div>
      </div>`)}
    </div>`;
  };
  const totalCalls = st.total_calls;
  // `response_rate` is ALREADY a percentage — the handler computes answered/total*100. The console
  // multiplied it by 100 a second time, so any tenant with a real call history read e.g. "5000%".
  const rate = (st.response_rate === undefined || st.response_rate === null) ? null : Math.round(st.response_rate);
  return html`<div>
    <h2 class="text-xl font-bold mb-4">Overview</h2>
    <div class="card"><p class="text-sm text-gray-600">Welcome back, <b>${c.name || c.email || 'there'}</b>. Here's what's happening with your auto-response setup.</p></div>
    ${firstSteps()}
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4">
      <div class="stat-card"><div class="stat-value">${num(st.total_calls)}</div><div class="stat-label">Calls received</div></div>
      <div class="stat-card"><div class="stat-value">${num(st.missed_calls)}</div><div class="stat-label">Missed calls</div></div>
      <div class="stat-card"><div class="stat-value">${num(st.answered_calls)}</div><div class="stat-label">Answered</div></div>
      <div class="stat-card"><div class="stat-value">${num(st.follow_ups_pending)}</div><div class="stat-label">Follow-ups pending</div></div>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="card"><h3 class="font-semibold mb-2">Response rate</h3>
        <p class="text-sm text-gray-600">${totalCalls === 0 ? 'No calls yet — your response rate shows here once calls land.'
          : (rate === null ? 'Not measured yet' : rate + '% of calls answered or sent an automatic reply')}</p></div>
      <div class="card"><h3 class="font-semibold mb-2">Your plan</h3>
        <p class="text-sm text-gray-600"><span class="badge badge-blue">${c.plan_name || '\u2014'}</span></p>
        <p class="text-sm text-gray-600 mt-2">${withCap(u.rules, 'max_rules', 'response rule', 'response rules')} · ${withCap(u.phone_numbers, 'max_phone_numbers', 'phone number', 'phone numbers')} · ${withCap(u.contacts, 'max_contacts', 'contact', 'contacts')}</p>${creditNote(u)}</div>
    </div>
    <div class="card mt-4"><h3 class="font-semibold mb-2">Recent activity</h3>
      ${(st.activity && st.activity.length)
        ? html`<ul style="list-style:none;padding:0;margin:0">
            ${st.activity.map(a => html`<li class="text-sm text-gray-600" style="padding:6px 0;border-bottom:1px solid #f1f5f9">
              <b>${ACT_LABEL[a.action] || a.action}</b>${actDetail(a)}
              <span class="text-gray-400" style="float:right">${utcTime(a.created_at)}</span></li>`)}
          </ul>`
        : html`<p class="text-sm text-gray-400">Nothing yet — a call, an automatic reply or a captured contact shows here.</p>`}
    </div>
  </div>`;
};

// ===== PHONE NUMBERS =====
// kanban t_f06b1710 — this screen was read-only while POST /telnyx/numbers and
// DELETE /telnyx/numbers/:id were mounted and gated by the plan's own max_phone_numbers, so the
// sold entitlement had no panel. Adding a number buys it on the platform's Telnyx account when the
// platform holds a credential; a Pro/Enterprise tenant that has connected its own Telnyx key
// (Integrations) registers a number it already owns. Releasing leaves the list (the route
// soft-deletes the row) and frees the plan slot. Whatever the server refuses, its own sentence shows.
const PhoneNumbers = () => {
  const st = viewState('phoneNumbers', { list: [], showAdd: false, busy: null, notice: null, error: null });
  const load = async () => {
    // kanban t_f06b1710 — the reload must NOT clear st.error: every write action ends with load(),
    // so a `st.error = null` here wiped the server's own refusal the moment the list reloaded, and
    // the operator saw "nothing happened" instead of "Telnyx not configured by admin" (measured in
    // real Chromium). Each action clears the slot when it STARTS.
    try { const d = await API.get('/telnyx/numbers'); st.list = Array.isArray(d) ? d : (Array.isArray(d.numbers) ? d.numbers : []); }
    catch (e) { st.error = 'Could not load numbers: ' + e.message; st.list = []; }
    renderApp();
  };
  if (!st._loaded) { st._loaded = true; load(); }
  const openAdd = () => { st.error = null; st.notice = null; Object.assign(viewState('numbers_form', {}), { number: '', name: '' }); st.showAdd = true; renderApp(); };
  const add = async () => {
    const f = viewState('numbers_form', { number: '', name: '' });
    const number = (f.number || '').trim();
    if (!number) { st.error = 'Enter the phone number with its country code, e.g. +15551234567'; renderApp(); return; }
    st.busy = 'add'; st.error = null; st.notice = null; renderApp();
    try {
      const body = { number };
      if ((f.name || '').trim()) body.friendly_name = f.name.trim();
      await API.post('/telnyx/numbers', body);
      st.notice = number + ' added'; st.showAdd = false; f.number = ''; f.name = '';
    } catch (e) { st.error = 'Could not add the number: ' + e.message; }
    st.busy = null; load();
  };
  const release = async (n) => {
    if (!confirm('Release ' + (n.number || 'this number') + '? It leaves your account and frees the plan slot.')) return;
    st.busy = n.id; st.error = null; st.notice = null; renderApp();
    try { await API.del('/telnyx/numbers/' + n.id); st.notice = (n.number || 'The number') + ' released'; }
    catch (e) { st.error = 'Could not release the number: ' + e.message; }
    st.busy = null; load();
  };
  return html`<div>
    <div class="flex items-center justify-between mb-4"><h2 class="text-xl font-bold">Phone Numbers</h2>
      <button class="btn btn-sm btn-green" onClick=${openAdd}>+ Add Number</button></div>
    ${st.error && html`<div class="card" style="border-left:4px solid #dc2626"><p class="text-sm text-red-700">${st.error}</p></div>`}
    ${st.notice && html`<div class="card" style="border-left:4px solid #059669"><p class="text-sm text-gray-700">${st.notice}</p></div>`}
    <div class="card p-0 overflow-hidden">
      <table class="table"><thead><tr><th>Number</th><th>Status</th><th>Added</th><th></th></tr></thead>
        <tbody>${st.list.map(n => html`<tr><td class="font-medium">${n.number || n.phone_number || n.id || '-'}</td><td><span class="badge ${n.status==='active'||(n.active!==false)?'badge-green':'badge-yellow'}">${n.status||(n.active!==false?'active':'inactive')}</span></td><td class="text-gray-500">${utcDate(n.created_at)}</td><td><button class="btn btn-sm btn-red" disabled=${st.busy === n.id} onClick=${() => release(n)}>Release</button></td></tr>`)}
        ${st.list.length===0 && html`<tr><td colspan="4" class="text-center text-gray-400 py-8">No phone numbers yet. Add one, or wait for the platform operator to provision it.</td></tr>`}
      </tbody></table>
    </div>
    ${st.showAdd && html`<div class="modal" onClick=${e => e.target===e.currentTarget && (st.showAdd = false, renderApp())}><div class="modal-content">
      <h3 class="text-lg font-bold mb-4">Add a number</h3>
      ${(() => { const f = viewState('numbers_form', { number: '', name: '' });
        return html`<div class="space-y-3">
        <div><label class="text-sm font-medium block mb-1">Phone number</label><input class="input" value=${f.number} onInput=${e => { f.number = e.target.value; }} placeholder="+15551234567" /></div>
        <div><label class="text-sm font-medium block mb-1">Label (optional)</label><input class="input" value=${f.name} onInput=${e => { f.name = e.target.value; }} placeholder="Front desk" /></div>
        <p class="text-xs text-gray-500">The number is bought on the platform's Telnyx account when the platform holds one. A tenant that has connected its own Telnyx key under Integrations registers a number it already owns. Your plan limits how many you can hold.</p>
        <div class="flex gap-2 justify-end mt-4"><button class="btn btn-outline" onClick=${() => { st.showAdd = false; renderApp(); }}>Cancel</button><button class="btn" disabled=${st.busy === 'add'} onClick=${add}>Add</button></div>
      </div>`; })()}
    </div></div>`}
  </div>`;
};

// ===== CALLS (the missed-call queue + the respond action) =====
// GET /calls lists this tenant's inbound calls. POST /calls/:id/respond is the product's core
// action: the handler schedules the call-back follow-up, and it only writes one for a call whose
// disposition is 'missed' — so the button is offered exactly there (and never faked elsewhere).
const Calls = () => {
  const st = viewState('calls', { list: [], responded: {}, busy: null, notice: null, error: null });
  const load = async () => {
    try { const d = await API.get('/calls'); st.list = Array.isArray(d) ? d : []; st.error = null; }
    catch (e) { st.error = 'Could not load calls: ' + e.message; st.list = []; }
    renderApp();
  };
  if (!st._loaded) { st._loaded = true; load(); }
  // kanban t_f06b1710 — export what this screen lists. The route used to read `call_logs` while the
  // table below lists `inbound_calls` (GET /calls); it now reads the SAME table and emits these
  // columns, so the file cannot disagree with the rows on screen. The token rides in the header, so
  // the file is fetched and handed to a blob download rather than opened as a bare link.
  const exportCsv = async () => {
    st.error = null; st.notice = null; renderApp();
    try {
      const r = await fetch(window.location.origin + '/api/v1/call-logs/export', { headers: { 'Authorization': 'Bearer ' + API.token } });
      if (!r.ok) {
        let m = 'Export failed (' + r.status + ')';
        try { const j = await r.json(); m = j.error || j.message || m; } catch (e) { /* not JSON */ }
        throw new Error(m);
      }
      const url = URL.createObjectURL(await r.blob());
      const a = document.createElement('a');
      a.href = url; a.download = 'call-log.csv';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      st.notice = 'Call log exported as call-log.csv';
    } catch (e) { st.error = 'Could not export the call log: ' + e.message; }
    renderApp();
  };
  const respond = async (c) => {
    st.busy = c.id; st.notice = null; st.error = null; renderApp();
    try {
      const r = await API.post('/calls/' + c.id + '/respond', {});
      st.responded = Object.assign({}, st.responded, { [c.id]: true });
      st.notice = (r.message || 'Response queued') + ' — a call-back follow-up was created (see Follow-ups).';
    } catch (e) { st.error = 'Respond failed: ' + e.message; }
    st.busy = null; renderApp();
  };
  const rows = st.list.slice(0, 100);
  return html`<div>
    <div class="flex items-center justify-between mb-4"><h2 class="text-xl font-bold">Calls</h2>
      <div class="flex items-center gap-2">
        <button class="btn btn-sm btn-outline" onClick=${exportCsv}>Export CSV</button>
        <button class="btn btn-sm btn-outline" onClick=${() => load()}>Refresh</button>
      </div></div>
    ${st.error && html`<div class="card" style="border-left:4px solid #dc2626"><p class="text-sm text-red-700">${st.error}</p></div>`}
    ${st.notice && html`<div class="card" style="border-left:4px solid #059669"><p class="text-sm text-gray-700">${st.notice}</p></div>`}
    <div class="card p-0 overflow-hidden">
      <table class="table"><thead><tr><th>Caller</th><th>Called</th><th>When</th><th>Disposition</th><th>Action</th></tr></thead>
        <tbody>${rows.map(c => html`<tr>
          <td class="font-medium">${c.caller_name || c.caller_number || '-'}</td>
          <td class="text-gray-500">${c.called_number || '-'}</td>
          <td class="text-gray-500 text-sm">${utcTime(c.call_time)}</td>
          <td><span class="badge ${c.disposition === 'missed' ? 'badge-red' : 'badge-blue'}">${c.disposition || '-'}</span></td>
          <td>${c.disposition === 'missed'
            ? html`<button class="btn btn-sm ${st.responded[c.id] ? 'btn-outline' : 'btn-green'}" disabled=${st.busy === c.id || !!st.responded[c.id]} onClick=${() => respond(c)}>${st.responded[c.id] ? 'Queued ✓' : 'Respond'}</button>`
            : html`<span class="text-gray-400 text-sm">—</span>`}</td>
        </tr>`)}
        ${rows.length === 0 && html`<tr><td colspan="5" class="text-center text-gray-400 py-8">No calls yet. Calls land here from your Telnyx number.</td></tr>`}
      </tbody></table>
    </div>
  </div>`;
};

// ===== PROFILE (kanban t_9cd2c8f2) =====
// The fleet account screen: picture + Name + Company + Level, and a Change Password block whose
// fields are NEW password, CONFIRM new password, then the CURRENT password as the VERIFICATION
// field underneath, then Save. Every field is seeded from GET /auth/me (via API.user), and every
// Save re-reads /auth/me so what the screen shows is the server's answer, not a local guess.
const Profile = () => {
  const c = API.user || {};
  const st = viewState('profile', {
    name: null, company: null, username: null, picture: null,
    notice: null, error: null, busy: false, bust: null,
    cur: '', next: '', confirm: '',
    // The sign-in-address change (kanban t_0d1aa081): the draft address, the server's sentence
    // (an error or a confirmation), and its own busy flag so a send cannot lock the whole card.
    ecNew: '', ecMsg: null, ecErr: null, ecBusy: false
  });
  // Seed the drafts ONCE from the account row (never on every render — that is what wiped typed
  // values in the sibling consoles).
  if (st.name === null) st.name = c.name || '';
  if (st.company === null) st.company = c.company || '';
  if (st.username === null) st.username = c.username || '';
  const pictureUrl = () => (c.avatar_url ? c.avatar_url + (st.bust ? '?t=' + st.bust : '') : null);

  const refresh = async () => {
    const me = await API.refreshMe();
    if (me) API.setAuth(API.token, Object.assign({}, c, me));
  };

  const save = async () => {
    if (!(st.name || '').trim()) { st.error = 'Name cannot be empty'; st.notice = null; renderApp(); return; }
    st.busy = true; st.notice = null; st.error = null; renderApp();
    try {
      await API.put('/auth/profile', { name: st.name, company: st.company, username: st.username });
      await refresh();
      st.notice = 'Saved';
    } catch (e) { st.error = 'Save failed: ' + e.message; }
    st.busy = false; renderApp();
  };

  // The picture is POSTed as `multipart/form-data` (field `file`) — the fleet-wide upload
  // convention; the server takes the first non-empty part and sniffs its magic bytes, so the part
  // name is not significant. (This used to send the RAW bytes; kanban t_9cd2c8f2 normalised it.)
  const upload = async (e) => {
    const file = (e.target.files || [])[0];
    if (!file) return;
    st.busy = true; st.notice = null; st.error = null; renderApp();
    try {
      const fd = new FormData(); fd.append('file', file, file.name || 'avatar');
      const r = await fetch(window.location.origin + '/api/v1/auth/avatar', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + API.token },
        body: fd
      });
      let d = {}; try { d = await r.json(); } catch (e2) { /* non-JSON */ }
      if (!r.ok) throw new Error(d.error || d.message || ('Upload failed (' + r.status + ')'));
      // Change the cache-buster so the <img> repaints with the NEW bytes this render, not the
      // 5-minute-cached previous picture.
      st.bust = Date.now(); S.avatarBust = st.bust;
      await refresh();
      st.notice = 'Picture updated';
      if (e.target) e.target.value = '';
    } catch (err) { st.error = 'Upload failed: ' + err.message; }
    st.busy = false; renderApp();
  };

  // The REMOVAL twin of `upload` (kanban t_0278f465). The upload upserts one row per user and no
  // route deleted it, so a picture could only ever be REPLACED — an operator who wanted his initials
  // back had no way to ask, and this screen could only offer "Change picture". The route is an
  // authenticated DELETE on the caller's OWN row (no path id to spoof) and is idempotent: the answer
  // carries `removed` (1 or 0) and an empty `avatar_url`. `refresh()` re-reads /auth/me, so the
  // repaint below drops BOTH the profile picture and the sidebar chip back to their placeholders,
  // and the Remove control (rendered only while a picture exists) is withdrawn in the same render.
  const remove = async () => {
    if (!c.avatar_url) { st.error = 'There is no picture to remove'; renderApp(); return; }
    if (!window.confirm('Remove your profile picture?')) return;
    st.busy = true; st.notice = null; st.error = null; renderApp();
    try {
      // The API helper adds the bearer token and JSON headers; the route refuses an anonymous
      // caller at the boundary (401) before it can reach the handler.
      await API.del('/auth/avatar');
      st.bust = Date.now(); S.avatarBust = st.bust;
      await refresh();
      st.notice = 'Picture removed';
    } catch (e) { st.error = 'Remove failed: ' + e.message; }
    st.busy = false; renderApp();
  };

  // ── SIGN-IN EMAIL (kanban t_0d1aa081) ─────────────────────────────────────────────────────────
  // The address field above stays READ-ONLY, and this is the block that can move it. Moving is a
  // TWO-ARM flow on purpose: this form only ASKS — `POST /auth/email-change` writes ONE pending
  // `email_changes` row and mails a confirmation link to the NEW address — and nothing moves until
  // the person who controls that mailbox opens the link. That is what stops a typo (or someone
  // holding a borrowed session) from locking a customer out of their own account.
  //
  // The refusals (not an address / already your address / address taken / mail could not be sent)
  // are 400s carrying the server's own sentence, so they land beside the field rather than as a
  // failed save. A reserved test address answers `delivered:false`: the sender withheld the mail,
  // and the sentence it returns says exactly that — nothing was sent, nothing changed.
  const sendEmailChange = async () => {
    const next = (st.ecNew || '').trim();
    st.ecMsg = null; st.ecErr = null;
    if (!next) { st.ecErr = 'Enter the new email address.'; renderApp(); return; }
    st.ecBusy = true; renderApp();
    try {
      const d = await API.post('/auth/email-change', { new_email: next });
      if (d && d.delivered === false) {
        st.ecErr = d.message || 'That address cannot receive mail, so nothing was sent.';
      } else {
        st.ecNew = '';
        st.ecMsg = (d && d.message) || 'Check the new address for the confirmation link.';
      }
    } catch (e) { st.ecErr = (e && e.message) || 'Could not start the change.'; }
    st.ecBusy = false; renderApp();
  };

  const changePw = async () => {
    st.notice = null; st.error = null;
    if (!st.next || st.next.length < 8) { st.error = 'New password must be at least 8 characters'; renderApp(); return; }
    if (st.next !== st.confirm) { st.error = 'The two new passwords do not match'; renderApp(); return; }
    st.busy = true; renderApp();
    try {
      await API.changePassword(st.cur, st.next);
      st.notice = 'Password updated'; st.cur = ''; st.next = ''; st.confirm = '';
    } catch (e) {
      // A field refusal is the server's sentence about the box, not a failed request: show it as
      // written (the card below the heading is where this view reports results) and stay signed in.
      st.error = (e && e.field) ? e.message : ('Password change failed: ' + e.message);
    }
    st.busy = false; renderApp();
  };

  const pic = pictureUrl();
  return html`<div>
    <h2 class="text-xl font-bold mb-4">Profile</h2>
    ${st.error && html`<div class="card" style="border-left:4px solid #dc2626"><p class="text-sm text-red-700">${st.error}</p></div>`}
    ${st.notice && html`<div class="card" style="border-left:4px solid #059669"><p class="text-sm text-gray-700">${st.notice}</p></div>`}
    <div class="card">
      <h3 class="font-semibold mb-3">Your details</h3>
      <div class="flex items-start gap-5">
        <div class="text-center">
          ${pic
            ? html`<img id="profile-picture" src=${pic} alt="Profile picture" class="w-24 h-24 rounded-full object-cover" style="border:1px solid #e2e8f0" />`
            : html`<div id="profile-picture" class="w-24 h-24 rounded-full flex items-center justify-center text-3xl" style="background:#f1f5f9;border:1px solid #e2e8f0">👤</div>`}
          <label class="btn btn-sm btn-outline" style="display:inline-block;margin-top:8px;cursor:pointer">
            ${pic ? 'Change picture' : 'Upload picture'}
            <input id="picture-input" type="file" accept="image/png,image/jpeg,image/gif,image/webp" style="display:none" onChange=${upload} />
          </label>
          ${pic && html`<button id="remove-picture" class="btn btn-sm btn-outline" style="margin-top:8px" disabled=${st.busy} onClick=${remove}>Remove picture</button>`}
          <p class="text-xs text-gray-400 mt-2">PNG, JPEG, GIF or WebP · up to 2 MB</p>
        </div>
        <div class="space-y-3" style="flex:1;max-width:420px">
          <div><label class="text-sm font-medium block mb-1">Email</label>
            <input id="profile-email" class="input" value=${c.email || ''} disabled /></div>

// ===== EMAIL BRANDING =====
// kanban t_feab8aff (app 5 of the per-tenant email-branding port). The account sets a logo, a
// display name and a colour; every transactional mail this app sends for that account then opens
// with that branding (the server's ONE render funnel adds it). Additive: an account with none gets
// byte-identical mail to before. The logo is POSTed as `multipart/form-data` (field `file`) — the
// fleet-wide upload convention, matching the avatar upload in this same file — to
// /api/v1/settings/branding/logo.
// What a RECIPIENT sees — mirrors Branding::header_html in the app (src/branding.rs) and the pane's
// own admin twin: a centred logo (max 56px high / 240px wide, alt = the display name); otherwise the
// display name in 20px bold #111827; then a 3px rule in the effective brand colour; and nothing at
// all (just the note) when neither is set. Reads this pane's OWN controls and the logo the template
// already rendered, so it sends nothing and cannot disagree with what Save would store.
const brandEffColor = (c) => /^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$/.test(String(c || '').trim())
  ? String(c).trim() : '#4f46e5';
function syncBrandPreview() {
  const wrap = document.getElementById('brand-bp-header');
  const blank = document.getElementById('brand-bp-blank');
  if (!wrap || !blank) return;
  const img = document.getElementById('brand-bp-logo');
  const logo = (img && img.getAttribute('src')) ? img.getAttribute('src') : '';
  const nameEl = document.getElementById('brand-name-input');
  const colourEl = document.getElementById('brand-color-input');
  const name = ((nameEl && nameEl.value) || '').trim();
  const colour = brandEffColor(colourEl && colourEl.value);
  const branded = !!(logo || name);
  wrap.style.display = branded ? 'block' : 'none';
  blank.style.display = branded ? 'none' : 'block';
  if (img) { img.style.display = logo ? 'block' : 'none'; img.setAttribute('alt', name); }
  const nm = document.getElementById('brand-bp-name');
  if (nm) { nm.textContent = name; nm.style.display = (branded && !logo) ? 'block' : 'none'; }
  const rule = document.getElementById('brand-bp-rule');
  if (rule) rule.style.borderTop = '3px solid ' + colour;
}
const Branding = () => {
  const st = viewState('branding', {
    loaded: false, brand_name: '', brand_color: '', logo_url: '',
    notice: null, error: null, busy: false, bust: null,
    previewBusy: false, previewMsg: null
  });
  if (!st.loaded && !st.busy) {
    st.busy = true;
    API.get('/settings/branding').then(d => {
      st.brand_name = d.brand_name || '';
      st.brand_color = d.brand_color || '';
      st.logo_url = d.logo_url || '';
      st.loaded = true; st.busy = false; renderApp();
    }).catch(e => {
      st.error = 'Could not load branding: ' + e.message;
      st.loaded = true; st.busy = false; renderApp();
    });
  }
  const logoUrl = () => {
    if (!st.logo_url) return null;
    if (!st.bust) return st.logo_url;
    return st.logo_url + (st.logo_url.includes('?') ? '&' : '?') + 't=' + st.bust;
  };

  const save = async () => {
    st.busy = true; st.notice = null; st.error = null; renderApp();
    try {
      const d = await API.put('/settings/branding', { brand_name: st.brand_name, brand_color: st.brand_color });
      if (d.brand_name !== undefined) st.brand_name = d.brand_name || '';
      if (d.brand_color !== undefined) st.brand_color = d.brand_color || '';
      if (d.logo_url !== undefined) st.logo_url = d.logo_url || '';
      st.notice = 'Branding saved';
    } catch (e) { st.error = 'Save failed: ' + e.message; }
    st.busy = false; renderApp();
  };

  const upload = async (e) => {
    const file = (e.target.files || [])[0];
    if (!file) return;
    st.busy = true; st.notice = null; st.error = null; renderApp();
    try {
      const fd = new FormData(); fd.append('file', file, file.name || 'logo');
      const r = await fetch(window.location.origin + '/api/v1/settings/branding/logo', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + API.token },
        body: fd
      });
      let d = {}; try { d = await r.json(); } catch (e2) { /* non-JSON refusal */ }
      if (!r.ok) throw new Error(d.error || d.message || ('Upload failed (' + r.status + ')'));
      st.logo_url = d.logo_url || st.logo_url;
      st.bust = Date.now();
      st.notice = 'Logo uploaded';
      if (e.target) e.target.value = '';
    } catch (err) { st.error = 'Upload failed: ' + err.message; }
    st.busy = false; renderApp();
  };

  const removeLogo = async () => {
    st.busy = true; st.notice = null; st.error = null; renderApp();
    try {
      await API.del('/settings/branding/logo');
      st.logo_url = ''; st.bust = Date.now(); st.notice = 'Logo removed.';
    } catch (e) { st.error = 'Remove failed: ' + e.message; }
    st.busy = false; renderApp();
  };

  // "Send me a preview email" (2026-10-24): the app's OWN POST /api/v1/settings/branding/preview mails a
  // sample of THIS account's branded mail to the caller's own address. The request carries no
  // recipient at all, so the route can never be used as a relay, and a reserved test address comes
  // back as {sent:false, detail:"'…' is a reserved test address…"} instead of a false "sent" — the
  // sentence under the button is the server's, never invented here.
  const sendPreview = async () => {
    st.previewBusy = true; st.previewMsg = null; renderApp();
    try {
      const r = await fetch(window.location.origin + '/api/v1/settings/branding/preview', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + API.token }
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || j.message || ('Preview failed (' + r.status + ')'));
      st.previewMsg = { ok: !!j.sent, text: j.detail || (j.sent ? ('Preview sent to ' + j.to) : 'No preview was sent.') };
    } catch (e) { st.previewMsg = { ok: false, text: 'Preview failed: ' + e.message }; }
    st.previewBusy = false; renderApp();
  };

  const logo = logoUrl();
  setTimeout(syncBrandPreview, 0);
  return html`<div>
    <h2 class="text-xl font-bold mb-4">Email Branding</h2>
    ${st.error && html`<div class="card" style="border-left:4px solid #dc2626"><p class="text-sm text-red-700">${st.error}</p></div>`}
    ${st.notice && html`<div class="card" style="border-left:4px solid #059669"><p class="text-sm text-gray-700">${st.notice}</p></div>`}
    <div class="card">
      <h3 class="font-semibold mb-3">Your logo</h3>
      <div class="flex items-start gap-5">
        <div class="text-center">
          ${logo
            ? html`<img id="brand-logo-preview" src=${logo} alt="Brand logo" style="max-height:72px;max-width:200px;border:1px solid #e2e8f0;border-radius:8px;padding:6px;background:#fff" />`
            : html`<div id="brand-logo-preview" class="w-24 h-24 rounded flex items-center justify-center text-3xl" style="background:#f1f5f9;border:1px solid #e2e8f0">🎨</div>`}
          <div class="mt-2 space-x-2">
            <label class="btn btn-sm btn-outline" id="brand-upload-btn" style="display:inline-block;cursor:pointer">
              ${logo ? 'Change logo' : 'Upload logo'}
              <input id="brand-logo-input" type="file" accept="image/png,image/jpeg,image/gif,image/webp" style="display:none" onChange=${upload} />
            </label>
            ${logo && html`<button id="brand-remove-btn" class="btn btn-sm btn-outline" disabled=${st.busy} onClick=${removeLogo}>Remove</button>`}
          </div>
          <p class="text-xs text-gray-400 mt-2">PNG, JPEG, GIF or WebP · up to 2 MB</p>
        </div>
        <div class="space-y-3" style="flex:1;max-width:420px">
          <div><label class="text-sm font-medium block mb-1">Brand display name</label>
            <input id="brand-name-input" class="input" maxlength="60" placeholder="Your business name" value=${st.brand_name || ''} onInput=${e => { st.brand_name = e.target.value; syncBrandPreview(); }} /></div>
          <div><label class="text-sm font-medium block mb-1">Brand colour</label>
            <input id="brand-color-input" class="input" placeholder="#4f46e5" value=${st.brand_color || ''} onInput=${e => { st.brand_color = e.target.value; syncBrandPreview(); }} /></div>
          <button id="brand-save-btn" class="btn btn-sm" disabled=${st.busy} onClick=${save}>Save branding</button>
        </div>
      </div>
      <p class="text-xs text-gray-500 mt-3">Your logo and business name open every transactional email we send for your account (welcome, password reset, receipts). Leave them blank to keep our default look.</p>
      <div style="margin-top:14px;padding-top:14px;border-top:1px solid #e2e8f0">
        <div class="text-xs text-gray-500 mb-2">Preview — the header every email from this account opens with</div>
        <div style="border:1px solid #e2e8f0;border-radius:8px;padding:14px;background:#fff">
          <div id="brand-bp-header" style="display:none">
            ${logo
              ? html`<img id="brand-bp-logo" src=${logo} alt=${st.brand_name || ''} style="display:block;margin:0 auto 8px;max-height:56px;max-width:240px" />`
              : html`<img id="brand-bp-logo" alt=${st.brand_name || ''} style="display:none;margin:0 auto 8px;max-height:56px;max-width:240px" />`}
            <div id="brand-bp-name" style="display:none;text-align:center;font-size:20px;font-weight:700;color:#111827;margin:0 0 8px"></div>
            <div id="brand-bp-rule" style="border-top:3px solid #4f46e5;margin:0 0 10px"></div>
          </div>
          <div id="brand-bp-blank" class="text-xs text-gray-500">Nothing is set yet, so mail keeps the MissedCall Respondr header.</div>
          <div style="font-size:13.5px;color:#111827;line-height:1.5">Hi Alex — this is a sample of the message body. Only the header above comes from your branding.</div>
        </div>
        <div style="margin-top:14px;padding-top:14px;border-top:1px solid #e2e8f0">
          <div class="text-xs text-gray-500 mb-2">See it in your own inbox</div>
          <p class="text-xs text-gray-500" style="margin:0 0 8px">This box shows the header inside this page. The button mails the same sample to your own address — save your branding first, or the preview carries the default MissedCall Respondr header.</p>
          <button id="brand-preview-btn" class="btn btn-sm btn-outline" disabled=${st.previewBusy} onClick=${sendPreview}>${st.previewBusy ? 'Sending…' : 'Send me a preview email'}</button>
          ${st.previewMsg && html`<p id="brand-preview-msg" class="text-xs" style="margin:8px 0 0;color:${st.previewMsg.ok ? '#047857' : '#dc2626'}">${st.previewMsg.text}</p>`}
        </div>
      </div>
    </div>
  </div>`;
};

// ===== RESPONSE RULES =====
// kanban t_31f9cf38 — these rules used to be stored and never read: the screen was CRUD-only and no
// inbound-call path touched `response_rules`. They now run (src/handlers/response_rule_eval.rs), so
// the form carries exactly what the call path can act on: a trigger the evaluator reads, an action
// that has a transport behind it, the message to send, and the priority the documented evaluation
// order runs on. `email` and `voice` are gone — a call carries no email address to reply to and this
// service has no outbound-call transport, so neither option could ever have done anything.
const RULE_TRIGGERS = [['all_missed_calls', 'All missed calls'], ['specific_numbers', 'Specific numbers'], ['time_of_day', 'Time of day'], ['day_of_week', 'Day of week']];
const RULE_ACTIONS = [['sms', 'SMS — text the caller back'], ['callback', 'Callback — queue a return call']];
const RULE_DAYS = [['mon', 'Mon'], ['tue', 'Tue'], ['wed', 'Wed'], ['thu', 'Thu'], ['fri', 'Fri'], ['sat', 'Sat'], ['sun', 'Sun']];
const ruleLabel = (pairs, v) => { const hit = pairs.find(p => p[0] === v); return hit ? hit[1] : (v || '-'); };
const ruleScheduleOf = (f) => f.trigger === 'specific_numbers'
  ? { numbers: (f.numbers || '').split(/[\n,;]+/).map(s => s.trim()).filter(Boolean) }
  : f.trigger === 'time_of_day'
    ? { window: { start: f.start || '09:00', end: f.end || '17:00' } }
    : f.trigger === 'day_of_week' ? { days: (f.days || []).slice() } : null;
const ResponseRules = () => {
  const st = viewState('rules', { list: [], showModal: false, editItem: null });
  const load = async () => { try { const d = await API.get('/response-rules'); st.list = Array.isArray(d) ? d : []; renderApp(); } catch (e) { console.error(e); } };
  if (!st._loaded) { st._loaded = true; load(); }
  const show = (i) => { st.editItem = i; st.formSeeded = false; st.showModal = true; renderApp(); };
  const hide = () => { st.showModal = false; renderApp(); };
  const save = async (data) => { try { if (st.editItem) await API.put('/response-rules/' + st.editItem.id, data); else await API.post('/response-rules', data); st.showModal = false; load(); } catch (e) { alert(e.message); } };
  const remove = async (id) => { if (!confirm('Delete this rule?')) return; await API.del('/response-rules/' + id); load(); };
  return html`<div>
    <div class="flex items-center justify-between mb-4"><h2 class="text-xl font-bold">Response Rules</h2><button class="btn btn-sm btn-green" onClick=${() => show(null)}>+ Add Rule</button></div>
    <p class="text-sm text-gray-500 mb-4">Rules run when a call comes in. They are checked in priority order (lowest first) and the first matching rule acts: a text back to the caller, or a callback queued for you in Follow Ups. A text leaves through Telnyx, so the Telnyx API key and messaging profile must be saved under Admin → Telnyx Config before one can go out.</p>
    <div class="card p-0 overflow-hidden">
      <table class="table"><thead><tr><th>Name</th><th>Trigger</th><th>Action</th><th>Priority</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody>${st.list.map(r => html`<tr><td class="font-medium">${r.name||'-'}</td><td class="text-gray-500">${ruleLabel(RULE_TRIGGERS, r.trigger_condition)}</td><td class="text-gray-500">${ruleLabel(RULE_ACTIONS, r.response_type)}</td><td class="text-gray-500">${r.priority == null ? 100 : r.priority}</td><td><span class="badge ${r.is_active?'badge-green':'badge-red'}">${r.is_active?'Active':'Inactive'}</span></td><td><button class="btn btn-sm btn-outline" onClick=${() => show(r)}>Edit</button><button class="btn btn-sm btn-red" onClick=${() => remove(r.id)}>Delete</button></td></tr>`)}
        ${st.list.length===0 && html`<tr><td colspan="6" class="text-center text-gray-400 py-8">No response rules yet.</td></tr>`}
      </tbody></table>
    </div>
    ${st.showModal && html`<div class="modal" onClick=${e => e.target===e.currentTarget && hide()}><div class="modal-content"><h3 class="text-lg font-bold mb-4">${st.editItem?'Edit':'Add'} Rule</h3>
      ${(() => {
        // kanban t_13330c68 — the draft lives in the SHARED view object (S.views['rules_form']), seeded ON
        // OPEN because show() clears st.formSeeded. The template IIFE re-runs on every renderApp(), so a
        // per-render local re-initialised the field from the stored ROW and wiped what the operator
        // typed (guard rule 4); a re-render can no longer do that.
        const f = viewState('rules_form', { name: '', trigger: 'all_missed_calls', type: 'sms', text: '', numbers: '', start: '09:00', end: '17:00', days: [], priority: 100, active: true });
        if (!st.formSeeded) {
          const row = st.editItem;
          f.name = row?.name||'';
          // A row written before this change could hold a free-text condition or a retired action;
          // seed the picker with the stored value only when it is one the call path reads.
          f.trigger = RULE_TRIGGERS.some(t => t[0] === row?.trigger_condition) ? row.trigger_condition : 'all_missed_calls';
          f.type = RULE_ACTIONS.some(a => a[0] === row?.response_type) ? row.response_type : 'sms';
          f.text = (row?.response_content||{}).text||'';
          f.numbers = ((row?.schedule||{}).numbers||[]).join('\n');
          f.start = ((row?.schedule||{}).window||{}).start||'09:00';
          f.end = ((row?.schedule||{}).window||{}).end||'17:00';
          f.days = ((row?.schedule||{}).days||[]).slice();
          f.priority = row?.priority == null ? 100 : row.priority;
          f.active = row ? row.is_active !== false : true;
          st.formSeeded = true;
        }
        return html`<div class="space-y-3">
          <div><label class="text-sm font-medium block mb-1">Name</label><input class="input" value=${f.name} onInput=${e => { f.name = e.target.value; }} /></div>
          <div><label class="text-sm font-medium block mb-1">Trigger</label><select class="input" value=${f.trigger} onChange=${e => { f.trigger = e.target.value; renderApp(); }}>${RULE_TRIGGERS.map(t => html`<option value=${t[0]}>${t[1]}</option>`)}</select></div>
          ${f.trigger === 'specific_numbers' && html`<div><label class="text-sm font-medium block mb-1">Caller numbers (one per line)</label><textarea class="input" rows="3" value=${f.numbers} onInput=${e => { f.numbers = e.target.value; }} placeholder="+15550101234"></textarea></div>`}
          ${f.trigger === 'time_of_day' && html`<div class="flex gap-2"><div class="flex-1"><label class="text-sm font-medium block mb-1">From</label><input class="input" type="time" value=${f.start} onInput=${e => { f.start = e.target.value; }} /></div><div class="flex-1"><label class="text-sm font-medium block mb-1">To</label><input class="input" type="time" value=${f.end} onInput=${e => { f.end = e.target.value; }} /></div></div>`}
          ${f.trigger === 'day_of_week' && html`<div><label class="text-sm font-medium block mb-1">Days</label><div class="flex flex-wrap gap-3">${RULE_DAYS.map(d => html`<label class="text-sm flex items-center gap-1"><input type="checkbox" checked=${f.days.indexOf(d[0]) >= 0} onChange=${e => { const on = e.target.checked; f.days = on ? f.days.concat([d[0]]) : f.days.filter(x => x !== d[0]); renderApp(); }} />${d[1]}</label>`)}</div></div>`}
          <div><label class="text-sm font-medium block mb-1">Action</label><select class="input" value=${f.type} onChange=${e => { f.type = e.target.value; renderApp(); }}>${RULE_ACTIONS.map(a => html`<option value=${a[0]}>${a[1]}</option>`)}</select></div>
          ${f.type === 'sms' && html`<div><label class="text-sm font-medium block mb-1">Message</label><textarea class="input" rows="3" value=${f.text} onInput=${e => { f.text = e.target.value; }} placeholder="Sorry we missed you! We will call you back shortly."></textarea></div>`}
          <div class="flex gap-3 items-end"><div style="width:140px"><label class="text-sm font-medium block mb-1">Priority</label><input class="input" type="number" min="1" value=${f.priority} onInput=${e => { f.priority = parseInt(e.target.value, 10) || 100; }} /></div><label class="text-sm flex items-center gap-1 mb-2"><input type="checkbox" checked=${f.active} onChange=${e => { f.active = e.target.checked; renderApp(); }} />Enabled</label></div>
          <div class="flex gap-2 justify-end mt-4"><button class="btn btn-outline" onClick=${() => hide()}>Cancel</button><button class="btn" onClick=${() => save({ name: f.name, trigger_condition: f.trigger, response_type: f.type, response_content: { text: f.text }, schedule: ruleScheduleOf(f), priority: f.priority, is_active: f.active })}>${st.editItem?'Save':'Add'}</button></div>
        </div>`; })()}
    </div></div>`}
  </div>`;
};
