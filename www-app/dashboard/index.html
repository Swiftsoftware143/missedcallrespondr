  const requestPlan = async () => {
    const want = st.requestFor;
    if (!want || st.busy) return;
    st.busy = true; st.notice = null; st.error = null; renderApp();
    try {
      // The term travels with the ask: a yearly request quoted at the monthly rate is an invoice
      // raised at the wrong amount. `want.term` is the switch's own state at the moment of the press.
      const wantTerm = (want.term === 'year') ? 'year' : 'month';
      const res = await API.post('/tickets', {
        subject: 'Upgrade request: ' + want.name + ' plan' + (wantTerm === 'year' ? ' (yearly)' : ''),
        description: 'This workspace asked to move to the ' + want.name + ' plan ($' + want.price
          + '/' + wantTerm + ') from Plan & Billing. The customer chose the '
          + (wantTerm === 'year' ? 'yearly' : 'monthly') + ' term, so quote that price when the'
          + ' invoice is raised. Self-serve checkout is not open on this install, so the'
          + ' request has to be completed by the team.',
        priority: 'normal',
        // The fleet's own name for this queue. The operator console filters on it, the exact-source
        // query parameter takes it, and `platform_stats` counts it — this door filed `billing` until
        // 2026-10-20, which made the operator's "Plan requests waiting" tile read 0 while customers
        // were waiting on a switch. `billing` is still counted by the server for rows already filed.
        source: 'plan_request',
        // The TIER, not just words in the subject (cron 2026-10-20). Without it the operator's
        // resolve had nothing to seat: the request moved to 'resolved' and the workspace stayed on
        // the free plan while the customer was told it was handled. The server validates this
        // against the live catalogue, so an unknown tier is refused when the request is filed.
        plan_slug: want.slug || undefined
      });
      // The receipt is best-effort on the server, so the promise is made only when the server says it
      // actually queued one (`acknowledged`). Before this the customer was never told a copy was
      // coming, because none was ever sent.
      // A press that lands on an OPEN request for the same plan is answered with that request, not a
      // twin (the server refuses the duplicate, cron 2026-10-21). Saying "Request sent" again would
      // read as if the earlier press never registered, so the sentence names the open request.
      st.notice = (res && res.already_open)
        ? 'You already have an open request for the ' + want.name + ' plan \u2014 our team is on it,'
          + ' and its live status is in the list below.'
        : 'Request sent \u2014 our team will move this workspace to the ' + want.name
          + ' plan and confirm here. Nothing was charged.'
          + ((res && res.acknowledged) ? ' We have emailed you a copy of this request.' : '');
      st.requestFor = null;
      loadPlanRequests(st);
    } catch (e) {
      st.error = 'The request could not be sent' + ((e && e.message) ? ': ' + e.message : '')
        + '. Please try again.';
    }
    st.busy = false; renderApp();
  };
  return html`<div data-billing="screen">
    <h2 class="text-xl font-bold mb-4">Plan & Billing</h2>
    ${st.error && html`<div class="card" style="border-left:4px solid #dc2626"><p class="text-sm text-red-700" id="billing-error">${st.error}</p></div>`}
    ${st.requestFor && html`<div class="card" style="border-left:4px solid #2563eb" id="billing-request">
      <p class="text-sm text-gray-700">You can still move plan: send the request and our team completes the switch for you.</p>

// ===== YOUR TEAM (2026-10-31) =====
// Before this screen a workspace had exactly ONE login: the account owner signup minted. A second
// person — a receptionist, a partner, an office manager — could not be given access at all, and the
// only other writer of a `users` row was the cross-app portfolio sync, which also mints a tenant.
// The screen lists the people in THIS workspace (the server takes the tenant from the session, never
// from the page), lets the owner / a company admin add one, and lets them revoke an access that
// should end. Every sentence under the form is the SERVER's answer (whether the credentials mail
// actually left), never invented here.
const Team = () => {
  const st = viewState('team', {
    loaded: false, busy: false, members: [], seats: { used: 0, limit: null },
    can_manage: false, error: null, notice: null
  });
  const form = viewState('team_form', { name: '', email: '' });
  const load = async () => {
    try {
      const d = await API.get('/team/members');
      st.members = Array.isArray(d.members) ? d.members : [];
      st.seats = d.seats || { used: st.members.length, limit: null };
      st.can_manage = !!d.can_manage;
    } catch (e) { st.error = 'Could not load your team: ' + e.message; }
    renderApp();
  };
  if (!st.loaded) { st.loaded = true; load(); }
  const invite = async () => {
    const email = (form.email || '').trim();
    const name = (form.name || '').trim();
    st.error = null; st.notice = null;
    if (!email) { st.error = 'Enter the email address of the person you are adding.'; renderApp(); return; }
    st.busy = true; renderApp();
    try {
      const d = await API.post('/team/invite', { name: name || null, email: email });
      // The server says whether the password mail actually LEFT. A created login whose mail failed
      // (or a reserved test address the sender withholds) must not be painted as a success.
      const mailed = d.credentials_emailed !== false;
      st.notice = { ok: mailed, text: d.detail || (mailed ? 'Their login has been created.' : 'Their login was created, but the password email did not leave.') };
      form.name = ''; form.email = '';
    } catch (e) { st.error = 'Could not add them: ' + e.message; }
    st.busy = false; load();
  };
  const remove = async (m) => {
    if (!confirm('Remove ' + (m.email || 'this person') + '? Their login stops working immediately.')) return;
    st.busy = true; st.error = null; st.notice = null; renderApp();
    try {
      await API.del('/team/members/' + m.id);
      st.notice = (m.email || 'Their login') + ' no longer has access.';
    } catch (e) { st.error = 'Could not remove them: ' + e.message; }
    st.busy = false; load();
  };
  const roleWord = (r) => ({ account_owner: 'Owner', company_admin: 'Admin', business_user: 'Member' }[r] || String(r || 'Member').replace(/_/g, ' '));
  const seats = () => {
    const used = st.seats.used == null ? st.members.length : st.seats.used;
    const people = used === 1 ? '1 person' : used + ' people';
    if (st.seats.limit == null || st.seats.limit < 0) return people + ' in this workspace';
    return people + ' of ' + st.seats.limit + ' seats on your plan';
  };
  return html`<div>
    <h2 class="text-xl font-bold mb-1">Your team</h2>
    <p class="text-sm text-gray-500 mb-4">Everyone with their own login to this workspace. ${seats()}.</p>
    ${st.error && html`<div class="card" style="border-left:4px solid #dc2626"><p class="text-sm text-red-700">${st.error}</p></div>`}
    ${st.notice && html`<div class="card" id="team-notice" style=${'border-left:4px solid ' + (st.notice.ok ? '#059669' : '#d97706')}><p class="text-sm" style=${st.notice.ok ? '' : 'color:#b45309'}>${st.notice.text}</p></div>`}
    <div class="card p-0 overflow-hidden">
      <table class="table"><thead><tr><th>Name</th><th>Email</th><th>Access</th><th>Added</th><th></th></tr></thead>
        <tbody>
          ${st.members.map(m => html`<tr>
            <td class="font-medium">${m.name || '-'}${m.is_you ? html`<span class="text-xs text-gray-400"> (you)</span>` : ''}</td>
            <td class="text-gray-600">${m.email}</td>
            <td><span class="badge ${m.is_owner ? 'badge-blue' : 'badge-green'}">${roleWord(m.role)}</span></td>
            <td class="text-gray-500">${utcDate(m.created_at)}</td>
            <td>${st.can_manage && !m.is_owner && !m.is_you
              ? html`<button class="btn btn-sm btn-red" disabled=${st.busy === true} onClick=${() => remove(m)}>Remove</button>`
              : ''}</td>
          </tr>`)}
          ${st.members.length === 0 && html`<tr><td colspan="5" class="text-center text-gray-400 py-8">No people yet.</td></tr>`}
        </tbody></table>
    </div>
    ${st.can_manage ? html`<div class="card mt-4">
      <h3 class="text-base font-bold mb-1">Add someone to your workspace</h3>
      <p class="text-sm text-gray-500 mb-3">They get their own login and an email with the first password — nobody shares yours. They see the same calls, contacts and settings you do.</p>
      <div class="space-y-3">
        <div><label class="text-sm font-medium block mb-1">Their name</label><input class="input" id="team-name" value=${form.name} onInput=${e => { form.name = e.target.value; }} placeholder="Sam Rivera" /></div>
        <div><label class="text-sm font-medium block mb-1">Their email address</label><input class="input" id="team-email" type="email" value=${form.email} onInput=${e => { form.email = e.target.value; }} placeholder="sam@yourcompany.com" /></div>
        <div class="flex gap-2 justify-end"><button class="btn" id="team-invite" disabled=${st.busy === true} onClick=${invite}>Add them</button></div>
      </div>
    </div>` : html`<div class="card mt-4"><p class="text-sm text-gray-600">Only the workspace owner or a company admin can add or remove someone. Ask them if you need access for a colleague.</p></div>`}
  </div>`;
};

/* ── Workspaces and the inbox (kanban t_44028656) ────────────────────────────────────────────────
   The workspace model and the multi-address private inbox, ported from ADASwift/CoreSwift. The
   server owns every rule — a plan ceiling answers 402 with its own sentence, a duplicate name 409,
   "keep at least one" 400 — so these screens print the server's sentence and never invent one. */

const Workspaces = () => {
  const st = viewState('workspaces', { loaded: false, busy: false, items: [], name: '', error: null, notice: null });
  const load = async () => {
    try {
      const d = await API.get('/workspaces');
      st.items = (d && d.workspaces) || [];
    } catch (e) { st.error = 'Could not load your workspaces: ' + e.message; }
    renderApp();
  };
  if (!st.loaded) { st.loaded = true; load(); }

  const create = async () => {
    const name = (st.name || '').trim();
    st.error = null; st.notice = null;
    if (!name) { st.error = 'Give the workspace a name first.'; renderApp(); return; }
    st.busy = true; renderApp();
    try {
      await API.post('/workspaces', { name });
      st.name = '';
      st.notice = 'Workspace created.';
    } catch (e) { st.error = e.message; }
    st.busy = false; load();
  };
  const rename = async (w) => {
    const name = prompt('New name for this workspace:', w.name || '');
    if (name === null) return;
    st.error = null; st.notice = null;
    try {
      await API.patch('/workspaces/' + w.id, { name });
      st.notice = 'Workspace renamed.';
    } catch (e) { st.error = e.message; }
    load();
  };
  const makeDefault = async (w) => {
    st.error = null; st.notice = null;
    try {
      await API.post('/workspaces/' + w.id + '/default', {});
      st.notice = 'This workspace now opens on sign-in.';
    } catch (e) { st.error = e.message; }
    load();
  };
  const remove = async (w) => {
    if (!confirm('Delete ' + (w.name || 'this workspace') + '? Your account must keep at least one.')) return;
    st.error = null; st.notice = null;
    try {
      await API.del('/workspaces/' + w.id);
      st.notice = 'Workspace deleted.';
    } catch (e) { st.error = e.message; }
    load();
  };

  return html`<div>
    <h2 class="text-xl font-bold mb-1">Workspaces</h2>
    <p class="text-sm text-gray-500 mb-4">A workspace is a separate drawer inside this business account. Your plan says how many you may have, and the first one is always the default a new sign-in opens.</p>
    ${st.error && html`<div class="card" id="ws-error" style="border-left:4px solid #dc2626"><p class="text-sm text-red-700">${st.error}</p></div>`}
    ${st.notice && html`<div class="card" id="ws-notice" style="border-left:4px solid #059669"><p class="text-sm">${st.notice}</p></div>`}
    <div class="card p-0 overflow-hidden">
      <table class="table"><thead><tr><th>Workspace</th><th>Opens on sign-in</th><th></th></tr></thead>
        <tbody>
          ${st.items.length === 0 && html`<tr><td colspan="3" class="text-gray-500">No workspaces yet — create the first one below.</td></tr>`}
          ${st.items.map(w => html`<tr>
            <td class="font-medium">${w.name}</td>
            <td>${w.is_default ? html`<span class="badge badge-blue">Default</span>` : html`<span class="text-gray-400">-</span>`}</td>
            <td class="text-right" style="white-space:nowrap">
              ${!w.is_default && html`<button type="button" class="btn btn-sm btn-outline" id=${'ws-default-' + w.id} onClick=${() => makeDefault(w)}>Make default</button> `}
              <button type="button" class="btn btn-sm btn-outline" id=${'ws-rename-' + w.id} onClick=${() => rename(w)}>Rename</button>
              <button type="button" class="btn btn-sm btn-outline" id=${'ws-delete-' + w.id} onClick=${() => remove(w)}>Delete</button>
            </td>
          </tr>`)}
        </tbody></table>
    </div>
    <div class="card">
      <h3 class="text-base font-bold mb-1">Add a workspace</h3>
      <p class="text-sm text-gray-500 mb-3">Give it the name your team will recognise — a client, a location, or a brand you run from the same account.</p>
      <div class="flex gap-2 items-center flex-wrap">
        <input id="ws-name" class="input" style="max-width:320px" maxlength="120" placeholder="e.g. Miami office" value=${st.name || ''} onInput=${e => { st.name = e.target.value; }} />
        <button type="button" id="ws-create" class="btn" disabled=${st.busy} onClick=${create}>${st.busy ? 'Creating…' : 'Create workspace'}</button>
      </div>
    </div>
  </div>`;
};

const Inbox = () => {
  const st = viewState('inbox', {
    loaded: false, busy: '', domains: [], boxes: [], messages: [],
    domName: '', domKey: '', boxLocal: '', records: null, error: null, notice: null
  });
  const MAIL_HOST = 'https://inbox.missedcallrespondr.com';
  // SEARCH (kanban t_843293af). The server's list route has always accepted `q` (subject, sender and
  // the opening text, case-insensitive) and this list never sent it. Type-and-pause re-queries 350 ms
  // after typing stops, or at once on Enter; the clear button lives in BOTH places (header and the
  // "no mail matches" row) and each carries this same handler.
  const inboxMessagesUrl = () => '/private-email/messages?limit=20'
    + (String(st.q || '').trim() ? '&q=' + encodeURIComponent(String(st.q).trim()) : '');
  let searchTimer = null;
  const searchInbox = async () => {
    try {
      const r = await API.get(inboxMessagesUrl());
      st.messages = (r && r.messages) || [];
    } catch (e) { st.error = 'Could not search your mail: ' + e.message; }
    renderApp();
  };
  const runSearch = () => { clearTimeout(searchTimer); searchInbox(); };
  const clearSearch = () => { st.q = ''; renderApp(); runSearch(); };
  const load = async () => {
    try {
      const d = await API.get('/private-email/domains');
      st.domains = Array.isArray(d) ? d : ((d && d.domains) || []);
    } catch (e) { st.error = 'Could not load your domains: ' + e.message; }
    try {
      const b = await API.get('/private-email/boxes');
      st.boxes = Array.isArray(b) ? b : ((b && b.boxes) || []);
    } catch (e) { st.error = st.error || ('Could not load your addresses: ' + e.message); }
    try {
      const m = await API.get(inboxMessagesUrl());
      st.messages = (m && m.messages) || [];
    } catch (e) { /* an empty inbox is not an error worth a banner */ }
    renderApp();
  };
  if (!st.loaded) { st.loaded = true; load(); }

  const addDomain = async () => {
    const domain = (st.domName || '').trim();
    st.error = null; st.notice = null;
    if (!domain) { st.error = 'Type the domain you own first.'; renderApp(); return; }
    st.busy = 'domain'; renderApp();
    try {
      await API.post('/private-email/domains', { domain, mailgun_api_key: (st.domKey || '').trim() || null });
      st.domName = ''; st.domKey = '';
      st.notice = 'Domain added. Show its records, paste them at your DNS provider, then press Check again.';
    } catch (e) { st.error = e.message; }
    st.busy = ''; load();
  };
  const addBox = async (domainId) => {
    const local = (st.boxLocal || '').trim();
    st.error = null; st.notice = null;
    if (!domainId) { st.error = 'Add a domain first.'; renderApp(); return; }
    if (!local) { st.error = 'Type the address you want, e.g. info.'; renderApp(); return; }
    st.busy = 'box'; renderApp();
    try {
      await API.post('/private-email/boxes', { domain_id: domainId, local_part: local });
      st.boxLocal = '';
      st.notice = 'Address created. Mail to it now lands in the inbox.';
    } catch (e) { st.error = e.message; }
    st.busy = ''; load();
  };
  const verify = async (d) => {
    st.error = null; st.notice = null; st.busy = 'verify-' + d.id; renderApp();
    try {
      const r = await API.post('/private-email/domains/' + d.id + '/verify', {});
      const ok = !!(r && r.verified);
      st.notice = ok ? 'Your records are live — this domain receives mail now.' : 'Not verified yet: the records are not visible in DNS.';
    } catch (e) { st.error = e.message; }
    st.busy = ''; load();
  };
  const showRecords = async (d) => {
    st.error = null;
    try {
      const r = await API.get('/private-email/domains/' + d.id + '/records');
      st.records = { domain: d.domain, groups: (r && r.groups) || [], verified: !!(r && r.verified) };
    } catch (e) { st.error = e.message; }
    renderApp();
  };

  const verified = st.domains.filter(d => d.verified);
  const pick = verified.length ? verified : st.domains;

  return html`<div>
    <h2 class="text-xl font-bold mb-1">Inbox</h2>
    <p class="text-sm text-gray-500 mb-4">Your own addresses on your own domain. Reading and answering happens in the mail client — it is the same account, so there is nothing to sign in to twice.</p>
    <div class="card">
      <a class="btn" id="inbox-open-client" href=${MAIL_HOST} target="_blank" rel="noopener" style="text-decoration:none;display:inline-block">Open the mail client</a>
      <span class="text-sm text-gray-500" style="margin-left:12px">${MAIL_HOST.replace('https://', '')}</span>
    </div>
    ${st.error && html`<div class="card" id="inbox-error" style="border-left:4px solid #dc2626"><p class="text-sm text-red-700">${st.error}</p></div>`}
    ${st.notice && html`<div class="card" id="inbox-notice" style="border-left:4px solid #059669"><p class="text-sm">${st.notice}</p></div>`}

    <div class="card p-0 overflow-hidden">
      <div style="padding:16px 16px 4px"><h3 class="text-base font-bold">Your domains</h3>
        <p class="text-sm text-gray-500" style="margin:4px 0 0">Add the domain you already own. We print the exact records to paste at your DNS provider, and until they verify the addresses below cannot receive mail.</p></div>
      <table class="table"><thead><tr><th>Domain</th><th>State</th><th></th></tr></thead>
        <tbody>
          ${st.domains.length === 0 && html`<tr><td colspan="3" class="text-gray-500">No domain yet — add the one you own below.</td></tr>`}
          ${st.domains.map(d => html`<tr>
            <td class="font-medium">${d.domain}</td>
            <td>${d.verified ? html`<span class="badge badge-green">Receiving</span>` : html`<span class="badge badge-yellow">Waiting for your records</span>`}</td>
            <td class="text-right" style="white-space:nowrap">
              <button type="button" class="btn btn-sm btn-outline" id=${'dom-records-' + d.id} onClick=${() => showRecords(d)}>Show records</button>
              <button type="button" class="btn btn-sm btn-outline" id=${'dom-verify-' + d.id} disabled=${st.busy === 'verify-' + d.id} onClick=${() => verify(d)}>${st.busy === 'verify-' + d.id ? 'Checking…' : 'Check again'}</button>
            </td>
          </tr>`)}
        </tbody></table>
      <div style="padding:16px">
        <div class="flex gap-2 items-end flex-wrap">
          <div style="flex:1;min-width:200px"><label class="text-sm font-medium" for="dom-name">Your domain</label>
            <input id="dom-name" class="input" maxlength="255" placeholder="yourbusiness.com" value=${st.domName || ''} onInput=${e => { st.domName = e.target.value; }} /></div>
          <div style="flex:1;min-width:220px"><label class="text-sm font-medium" for="dom-key">Mailgun API key (stored encrypted)</label>
            <input id="dom-key" type="password" class="input" maxlength="200" placeholder="key-…" value=${st.domKey || ''} onInput=${e => { st.domKey = e.target.value; }} /></div>

        </div>

      <h3 class="text-base font-bold mb-1">Records for ${st.records.domain}</h3>
      <p class="text-sm text-gray-500 mb-3">Paste each line at your DNS provider exactly as shown, then press Check again on the domain.</p>
      ${st.records.groups.map(g => html`<div style="margin-top:10px">
        <p class="text-sm font-medium">${g.title}</p>
        ${(g.records || []).map(r => html`<div style="display:grid;grid-template-columns:70px 1fr 1fr;gap:10px;padding:6px 0;border-bottom:1px solid #eef2f7">
          <strong>${r.type || ''}</strong><span class="text-sm text-gray-600" style="word-break:break-all">${r.name || ''}</span><span class="text-sm text-gray-600" style="word-break:break-all">${String(r.value == null ? '' : r.value)}</span>
        </div>`)}
      </div>`)}
      <button type="button" class="btn btn-outline btn-sm" style="margin-top:10px" onClick=${() => { st.records = null; renderApp(); }}>Hide records</button>
    </div>`}

    <div class="card p-0 overflow-hidden">
      <div style="padding:16px 16px 4px"><h3 class="text-base font-bold">Your addresses</h3>
        <p class="text-sm text-gray-500" style="margin:4px 0 0">Every address the inbox receives on. A plan limit is enforced by the server, and its refusal is the sentence shown above — never a dead button.</p></div>

          ${st.q ? html`<button type="button" class="btn btn-sm btn-outline" id="inbox-search-clear" onClick=${clearSearch}>Clear search</button>` : null}
        </div></div>
      <table class="table"><thead><tr><th>Subject</th><th>From</th><th>To</th><th>Received</th></tr></thead>
        <tbody>
          ${st.messages.length === 0 && (st.q
            ? html`<tr><td colspan="4" class="text-gray-500">No mail matches &ldquo;${st.q}&rdquo;. The search looks at the subject, the sender and the opening text of every message in this view. <button type="button" class="btn btn-sm btn-outline" id="inbox-search-clear2" onClick=${clearSearch}>Clear the search</button></td></tr>`
            : html`<tr><td colspan="4" class="text-gray-500">Nothing has arrived yet. Mail to any address above appears here.</td></tr>`)}
          ${st.messages.map(m => html`<tr>
            <td class="font-medium">${m.subject || '(no subject)'}</td>
            <td class="text-gray-600">${m.from_address || ''}</td>
            <td class="text-gray-600">${m.address || ''}</td>
            <td class="text-gray-500">${m.received_at ? utcDate(m.received_at) : ''}</td>
          </tr>`)}
        </tbody></table>
    </div>
  </div>`;
};

/* ── Top-bar workspace switcher (kanban t_7f817fa5) ───────────────────────────────────────────
   Switch / add / rename / delete / make-default, from a 🗂️ button at the top of the main area,
   ported from the fleet standard (FunnelSwift/CoreSwift). A member sees Switch + Add; the owner,
   a company_admin and the platform admins also see Rename / Delete / Make default — the server
   enforces the SAME rule (src/workspaces/handlers.rs::may_manage), so this gate is cosmetic.
   Switching re-mints the session token with the target workspace's wsid, so we adopt the returned
   token through API.setAuth and reload; the current workspace id is persisted in sessionStorage so
   a reload paints the right name. */
const WS = { items: [], current: null, busy: false, open: false, loaded: false };

const wsCanManage = () => {
  const r = API.user && API.user.role;
  return !!r && ['account_owner', 'company_admin', 'admin', 'super_admin', 'agency_admin'].indexOf(r) !== -1;
};

const wsLoad = async () => {
  try {
    const d = await API.get('/workspaces');
    WS.items = (d && d.workspaces) || [];
  } catch (e) { WS.items = []; }
  let cur = null;
  try { cur = JSON.parse(sessionStorage.getItem('mc_workspace') || 'null'); } catch (e) {}
  let match = null;
  if (cur && cur.id) match = WS.items.filter(w => w.id === cur.id)[0];
  if (!match) match = WS.items.filter(w => w.is_default)[0] || WS.items[0] || null;
  WS.current = match;
  if (match) { try { sessionStorage.setItem('mc_workspace', JSON.stringify(match)); } catch (e) {} }
  renderApp();
};

const wsSwitch = async (w) => {
  if (!w || WS.busy) return;
  WS.busy = true;
  try {
    const d = await API.post('/workspaces/' + w.id + '/switch', {});
    if (!d || !d.token) throw new Error('No token returned');
    API.setAuth(d.token, API.user);
    try { sessionStorage.setItem('mc_workspace', JSON.stringify(d.workspace || w)); } catch (e) {}
    location.reload();
  } catch (e) {
    alert(e && e.message ? e.message : 'Could not switch workspace');
    WS.busy = false;
  }
};

const wsAdd = async () => {
  if (WS.busy) return;
  const name = (prompt('Name for the new workspace') || '').trim();
  if (!name) return;
  WS.busy = true;
  try {
    await API.post('/workspaces', { name });
    await wsLoad();
  } catch (e) {
    alert(e && e.message ? e.message : 'Could not add workspace');
  } finally {
    WS.busy = false;
    renderApp();
  }
};

const wsRename = async (w) => {
  if (!w || WS.busy) return;
  const name = (prompt('New name for this workspace:', w.name || '') || '').trim();
  if (!name || name === w.name) return;
  WS.busy = true;
  try {
    await API.patch('/workspaces/' + w.id, { name });
    await wsLoad();
  } catch (e) {
    alert(e && e.message ? e.message : 'Could not rename workspace');
  } finally {
    WS.busy = false;
    renderApp();
  }
};

const wsMakeDefault = async (w) => {
  if (!w || WS.busy) return;
  WS.busy = true;
  try {
    await API.post('/workspaces/' + w.id + '/default', {});
    await wsLoad();
  } catch (e) {
    alert(e && e.message ? e.message : 'Could not change the default workspace');
  } finally {
    WS.busy = false;
    renderApp();
  }
};

const wsDelete = async (w) => {
  if (!w || WS.busy) return;
  if (!confirm('Delete "' + (w.name || '') + '"? Your account must keep at least one workspace.')) return;
  WS.busy = true;
  try {
    await API.del('/workspaces/' + w.id);
    await wsLoad();
  } catch (e) {
    alert(e && e.message ? e.message : 'Could not delete workspace');
  } finally {
    WS.busy = false;
    renderApp();
  }
};

            </div>

        <div style="border-top:1px solid #eef2f7;margin:4px 0 0"></div>

// ===== API KEYS (kanban t_b6d650d6 re-introduction) =====
// The durable bearer credential every account auto-mints, and the customer can view / copy /
// regenerate / revoke from here. The key is never "shown once": View asks for the account
// password and the server decrypts the SEALED copy, so it can be shown again any time.
const ApiKeys = () => {
  const st = viewState('apikeys', {
    loaded: false, keys: [], notice: null, error: null, busy: false,
    revealId: null, revealPassword: '', revealResult: null, revealBusy: false, revealError: null,
    regenError: null, newName: ''
  });
  const reload = () => {
    API.get('/api-keys').then(d => {
      st.keys = (d && d.api_keys) || [];
      renderApp();
    }).catch(e => {
      st.error = 'Could not load API keys: ' + e.message;
      renderApp();
    });
  };
  if (!st.loaded) { st.loaded = true; reload(); }

  const create = async () => {
    st.busy = true; st.notice = null; st.error = null; renderApp();
    try {
      const d = await API.post('/api-keys', { name: st.newName || undefined });
      st.newName = '';
      st.revealResult = { id: d.id, key_prefix: d.key_prefix, token: d.token, name: d.name, isNew: true };
      st.revealId = d.id;
      reload();
    } catch (e) { st.error = 'Create failed: ' + e.message; }
    st.busy = false; renderApp();
  };

  const openReveal = (k) => { st.revealId = k.id; st.revealPassword = ''; st.revealResult = null; st.revealError = null; renderApp(); };
  const closeReveal = () => { st.revealId = null; st.revealResult = null; st.revealError = null; renderApp(); };
  const doReveal = async () => {
    st.revealBusy = true; st.revealError = null; renderApp();
    try {
      const d = await API.post('/api-keys/' + st.revealId + '/reveal', { password: st.revealPassword });
      st.revealResult = { id: d.id, key_prefix: d.key_prefix, token: d.token };
      st.revealPassword = '';
    } catch (e) { st.revealError = e.message; }
    st.revealBusy = false; renderApp();
  };

  const doRegenerate = async (k) => {
    if (!confirm('Regenerate this key? Anything using the old key stops working immediately.')) return;
    st.busy = true; st.regenError = null; st.notice = null; renderApp();
    try {
      const d = await API.post('/api-keys/' + k.id + '/regenerate', {});
      st.revealResult = { id: d.id, key_prefix: d.key_prefix, token: d.token, name: d.name, isNew: true };
      st.revealId = d.id;
      reload();
    } catch (e) { st.regenError = e.message; }
    st.busy = false; renderApp();
  };

  const doRevoke = async (k) => {
    if (!confirm('Revoke this key? Anything using it stops working immediately.')) return;
    st.busy = true; st.error = null; st.notice = null; renderApp();
    try {
      await API.del('/api-keys/' + k.id);
      st.notice = 'Key revoked';
      reload();
    } catch (e) { st.error = 'Revoke failed: ' + e.message; }
    st.busy = false; renderApp();
  };

  const copy = (tok) => {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(tok).then(() => { st.notice = 'Copied to clipboard'; renderApp(); }).catch(() => {});
    }
  };

  return html`<div>
    <h2 class="text-xl font-bold mb-4">API Keys</h2>
    <p class="text-sm text-gray-500 mb-4">A key lets other software (or our AI assistant) reach this workspace on your behalf. It stays viewable — press View and enter your account password to see it again any time.</p>
    ${st.error && html`<div class="imp-banner"><span>${st.error}</span></div>`}
    ${st.notice && html`<div class="imp-banner" style="background:#d1fae5;border-color:#059669;color:#065f46"><span>${st.notice}</span></div>`}
    ${st.regenError && html`<div class="imp-banner"><span>Regenerate failed: ${st.regenError}</span></div>`}
    <div class="card">
      <div class="flex items-center gap-2 mb-3" style="flex-wrap:wrap">
        <input class="input" style="max-width:260px" placeholder="New key name (optional)" value=${st.newName} onInput=${(e) => { st.newName = e.target.value; }} />
        <button class="btn btn-sm" disabled=${st.busy} onClick=${create}>+ Create key</button>
      </div>
      ${st.keys.length === 0
        ? html`<p class="text-sm text-gray-400">No keys yet. Every new account starts with one — press “+ Create key” to add another.</p>`
        : html`<table class="table">
          <thead><tr><th>Name</th><th>Key</th><th>Created</th><th>Last used</th><th>Status</th><th></th></tr></thead>
          <tbody>
            ${st.keys.map(k => html`<tr>
              <td>${k.name}</td>
              <td><code>${k.key_prefix}…</code></td>
              <td>${(k.created_at || '').slice(0, 10)}</td>
              <td>${k.last_used_at ? k.last_used_at.slice(0, 10) : 'never'}</td>
              <td>${k.revoked_at ? html`<span class="badge badge-red">Revoked</span>` : html`<span class="badge badge-green">Active</span>`}</td>
              <td style="white-space:nowrap">
                ${!k.revoked_at && html`<button class="btn btn-sm btn-outline" onClick=${() => openReveal(k)}>View / Copy</button>`}
                ${!k.revoked_at && html`<button class="btn btn-sm btn-outline" disabled=${st.busy} onClick=${() => doRegenerate(k)}>Regenerate</button>`}
                ${!k.revoked_at && html`<button class="btn btn-sm btn-red" disabled=${st.busy} onClick=${() => doRevoke(k)}>Revoke</button>`}
              </td>
            </tr>`)}
          </tbody>
        </table>`}
    </div>
    ${st.revealId !== null && html`<div class="modal">
      <div class="modal-content">
        <h3 class="text-lg font-bold mb-3">API key</h3>
        ${st.revealResult
          ? html`<div>
              <div class="badge badge-blue mb-2">${st.revealResult.key_prefix}…</div>
              <textarea class="input mb-2" rows="2" readonly>${st.revealResult.token}</textarea>
              <div class="flex gap-2 justify-end">
                <button class="btn btn-sm" onClick=${() => copy(st.revealResult.token)}>Copy</button>
                <button class="btn btn-sm btn-outline" onClick=${closeReveal}>Done</button>
              </div>
            </div>`
          : html`<div>
              <p class="text-sm text-gray-500 mb-3">Enter your account password to see this key.</p>
              ${st.revealError && html`<div class="imp-banner"><span>${st.revealError}</span></div>`}
              <input class="input mb-3" type="password" placeholder="Your password" value=${st.revealPassword} onInput=${(e) => { st.revealPassword = e.target.value; }} />
              <div class="flex gap-2 justify-end">
                <button class="btn btn-sm btn-outline" onClick=${closeReveal}>Cancel</button>
                <button class="btn btn-sm" disabled=${st.revealBusy} onClick=${doReveal}>Show key</button>
              </div>
            </div>`}
      </div>
    </div>`}
  </div>`;
};

// ===== MCP (fleet slot directly above the account entry; docs/fleet-mcp-nav-convention.md) =====
// One nav entry, one panel, same slot relative to the account/settings entry in every app. The
// token is THIS workspace's own API key — the same row a `Authorization: Bearer mcr_…` call
// authenticates with — and Reveal / Regenerate reuse the EXACT endpoints the API Keys screen uses,
// so the two surfaces can never disagree about which key is live. No audit block: the MCP audit
// log is a file owned by the mcp service and has no read API.
const MCP_ENDPOINT = 'https://hooks.swiftsoftware.net/mcp';
// The read-only tools a missedcallrespondr key can reach, one line each — generated by the fleet
// MCP server's AppSpec entries for app "missedcallrespondr" (see /opt/swift/mcp/src/main.rs). Each
// entity exposes `<key>_summary` and `<key>_search`; `<key>_list_tenants` is operator-only and
// refused for a workspace credential.
const MCP_TOOLS = [
  { name: 'missedcallrespondr_summary / missedcallrespondr_search', desc: 'leads: name, email, phone, status' },
  { name: 'missedcallrespondr_contacts_summary / _search', desc: 'contacts: name, email, phone, company' },
  { name: 'missedcallrespondr_tickets_summary / _search', desc: 'tickets: subject, requester email, priority, status' },
  { name: 'missedcallrespondr_ticket_messages_summary / _search', desc: 'ticket messages: sender, ticket subject, 2,000-char body excerpt, received time' },
  { name: 'missedcallrespondr_workspaces_summary / _search', desc: 'workspaces: name, default flag' },
  { name: 'missedcallrespondr_activity_summary / _search', desc: 'activity: action, entity type, entity id' },
  { name: 'missedcallrespondr_plans_summary / _search', desc: 'plans: status, plan id, billing cycle' },
];
// Copy-paste config for any MCP client. `YOUR_API_KEY` is this workspace's own API key from above.
const MCP_CONNECT_JSON = JSON.stringify({ mcpServers: { missedcallrespondr: { url: MCP_ENDPOINT, headers: { Authorization: 'Bearer YOUR_API_KEY' } } } }, null, 2);
const Mcp = () => {
  const st = viewState('mcp', { loaded: false, keys: [], shown: null, error: null, notice: null, busy: false });
  const reload = () => {
    API.get('/api-keys').then(d => { st.keys = (d && d.api_keys) || []; renderApp(); })
      .catch(e => { st.error = 'Could not load API keys: ' + e.message; renderApp(); });
  };
  if (!st.loaded) { st.loaded = true; reload(); }
  const activeKeys = (st.keys || []).filter(k => !k.revoked_at);
  const k = activeKeys[0] || null;
  const copy = async (text, elId) => {
    if (!text) { st.error = 'Reveal the key first'; renderApp(); return; }
    let ok = false;
    try { if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(text); ok = true; } } catch (e) {}
    if (!ok && elId) { const el = document.getElementById(elId); if (el) { const r = document.createRange(); r.selectNodeContents(el); const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r); try { document.execCommand('copy'); ok = true; } catch (e) {} } }
    st.notice = ok ? 'Copied to clipboard' : 'Could not copy — select the text and copy it manually';
    st.error = null; renderApp();
  };
  const reveal = async () => {
    const pw = prompt('Enter your account password to show this key.');
    if (pw === null || pw === '') return;
    st.busy = true; st.error = null; renderApp();
    try {
      const d = await API.post('/api-keys/' + k.id + '/reveal', { password: pw });
      st.shown = { id: k.id, token: d.token };
    } catch (e) { st.error = e.message; }
    st.busy = false; renderApp();
  };
  const regenerate = async () => {
    if (!confirm('Regenerate this key? The old key stops working immediately — any MCP client or API call already using it stops until you paste the new key in.')) return;
    st.busy = true; st.error = null; renderApp();
    try {
      const d = await API.post('/api-keys/' + k.id + '/regenerate', {});
      st.shown = { id: d.id, token: d.token };
      reload();
    } catch (e) { st.error = e.message; }
    st.busy = false; renderApp();
  };
  return html`<div>
    <h2 class="text-xl font-bold mb-4">MCP</h2>
    <p class="text-sm text-gray-500 mb-4">Connect an AI tool (Claude Code, Cursor, or your own agent) to read this workspace. Read-only.</p>
    ${st.error && html`<div class="imp-banner"><span>${st.error}</span></div>`}
    ${st.notice && html`<div class="imp-banner" style="background:#d1fae5;border-color:#059669;color:#065f46"><span>${st.notice}</span></div>`}
    <div class="card">
      <h3 class="font-semibold text-gray-800 mb-2">Endpoint</h3>
      <div class="flex items-center gap-2 flex-wrap">
        <code id="mcp-endpoint" style="flex:1;min-width:260px;word-break:break-all;background:#0f172a;color:#7dd3fc;padding:10px 14px;border-radius:10px;font-size:13px">${MCP_ENDPOINT}</code>
        <button class="btn btn-sm" onClick=${() => copy(MCP_ENDPOINT, 'mcp-endpoint')}>Copy</button>
      </div>
    </div>
    <div class="card">
      <h3 class="font-semibold text-gray-800 mb-1">Your token</h3>
      <p class="text-sm text-gray-500 mb-3">The server accepts this workspace's API key as a Bearer token — the same key the API Keys screen shows. It is listed here by prefix only; the secret is never shown until you Reveal it, which asks for your account password. Treat it like a password: anyone holding it can read this workspace.</p>
      ${!k ? html`<p class="text-sm text-gray-400">No active API key yet. Create one on the API Keys screen, then come back.</p>` : html`
        <div class="flex items-center gap-2 flex-wrap mb-3">
          <code style="background:#f1f5f9;color:#334155;padding:8px 12px;border-radius:8px;font-size:13px">${k.key_prefix}…</code>
          <span class="text-xs text-gray-500">${k.name || 'default'}</span>
          ${k.recoverable === false ? html`<span class="text-xs text-gray-500">(minted before keys were stored recoverably — Regenerate to get a viewable key)</span>` : html`<button class="btn btn-sm btn-outline" disabled=${st.busy} onClick=${reveal}>Reveal</button>`}
          <button class="btn btn-sm btn-outline" onClick=${() => copy(st.shown && st.shown.id === k.id ? st.shown.token : '', 'mcp-revealed-key')}>Copy</button>
          <button class="btn btn-sm btn-outline" disabled=${st.busy} onClick=${regenerate}>Regenerate</button>
        </div>
        <p class="text-xs text-gray-500">Regenerate replaces the key: the old one stops working immediately, so any client already using it stops until you paste the new key in.</p>
      `}
      ${st.shown && st.shown.token ? html`
        <div style="border:2px solid #16a34a;border-radius:10px;padding:12px 14px;margin-top:12px">
          <p class="text-sm text-gray-500 mb-2">Your key (${st.shown.id === (k && k.id) ? 'current' : 'newly generated'}):</p>
          <div class="flex items-center gap-2 flex-wrap">
            <code id="mcp-revealed-key" style="flex:1;min-width:260px;word-break:break-all;background:#0f172a;color:#7dd3fc;padding:10px 14px;border-radius:10px;font-size:13px">${st.shown.token}</code>
            <button class="btn btn-sm" onClick=${() => copy(st.shown.token, 'mcp-revealed-key')}>Copy</button>
            <button class="btn btn-sm btn-outline" onClick=${() => { st.shown = null; renderApp(); }}>Hide</button>
          </div>
        </div>` : ''}
    </div>
    <div class="card">
      <h3 class="font-semibold text-gray-800 mb-2">What it can read</h3>
      <ul class="text-sm text-gray-700 list-disc pl-5 space-y-1" style="line-height:1.6">
        ${MCP_TOOLS.map(t => html`<li><code style="font-size:12px">${t.name}</code> — ${t.desc}</li>`)}
      </ul>
      <p class="text-xs text-gray-500 mt-4">Every tool is read-only and tenant-scoped: a workspace token can only ever return this workspace's rows. There is no write tool and no free-form SQL door, and operator-wide tools are refused for a workspace credential.</p>
    </div>
    <div class="card">
      <h3 class="font-semibold text-gray-800 mb-2">Connect</h3>
      <p class="text-sm text-gray-500 mb-2">Paste this into your client's config — Claude Desktop (<code>claude_desktop_config.json</code>) or Cursor (<code>.cursor/mcp.json</code>). Replace <code>YOUR_API_KEY</code> with the key above.</p>
      <div class="flex items-start gap-2">
        <pre id="mcp-connect-config" style="flex:1;margin:0;background:#0f172a;color:#7dd3fc;padding:12px 14px;border-radius:10px;font-size:12px;overflow:auto">${MCP_CONNECT_JSON}</pre>
        <button class="btn btn-sm" onClick=${() => copy(MCP_CONNECT_JSON, 'mcp-connect-config')}>Copy config</button>
      </div>
    </div>
  </div>`;
};

// ===== APP SHELL =====
const App = () => {
  if (!API.token) return html`<${LoginView} />`;
  // One-shot: re-read the account row from the server so the level label and the header picture are
  // the SERVER's answer (kanban t_9cd2c8f2). The login response carries no plan tier, so without
  // this the label could only be guessed. Guarded by S.meLoaded so the refresh's own render cannot
  // loop it, and cleared on sign-in so every session re-reads.
  if (!S.meLoaded) { S.meLoaded = true; API.refreshMe().then(() => renderApp()); }
  // One-shot: read the workspace list for the top-bar switcher (kanban t_7f817fa5).
  if (!WS.loaded) { WS.loaded = true; wsLoad(); }
  // kanban t_25b8c662 — an impersonated session belongs to the CUSTOMER's tenant, but the token
  // keeps the OPERATOR's `sub` (admin_handler::impersonate switches `aid` only). So PUT
  // /auth/profile and PUT /auth/password would write to the OPERATOR's own user row: the Profile
  // view is removed from an impersonated session, and a banner names the impersonated tenant.
  const impTenant = (API.user && API.user.impersonated) ? (API.user.tenant || 'a tenant') : null;
  const nav = [
    { id: 'overview', label: 'Overview', icon: '📊' },
    { id: 'calls', label: 'Calls', icon: '📞' },
    { id: 'phoneNumbers', label: 'Phone Numbers', icon: '📱' },
    { id: 'rules', label: 'Response Rules', icon: '⚙️' },
    { id: 'templates', label: 'Templates', icon: '📋' },
    { id: 'messages', label: 'Messages', icon: '💬' },
    { id: 'followups', label: 'Follow-ups', icon: '⏰' },
    { id: 'calendar', label: 'Calendar', icon: '📅' },
    { id: 'contacts', label: 'Contacts', icon: '👥' },
    { id: 'lists', label: 'Lists', icon: '🗂️' },
    { id: 'tickets', label: 'Tickets', icon: '🎫' },
    { id: 'inbox', label: 'Inbox', icon: '📬' },
    { id: 'workspaces', label: 'Workspaces', icon: '🗂️' },
    { id: 'integrations', label: 'Integrations', icon: '🔗' },
    { id: 'team', label: 'Your team', icon: '🤝' },
    { id: 'branding', label: 'Email Branding', icon: '🎨' },
    { id: 'apikeys', label: 'API Keys', icon: '🔑' },
    { id: 'billing', label: 'Plan & Billing', icon: '💳' },
    { id: 'mcp', label: 'MCP', icon: '🤖' },
    { id: 'profile', label: 'Profile', icon: '👤' }
  ].filter(n => !(impTenant && n.id === 'profile'));
  const views = { overview: Overview, calls: Calls, phoneNumbers: PhoneNumbers, rules: ResponseRules, templates: Templates, messages: Messages, followups: FollowUps, contacts: Contacts, lists: Lists, calendar: Calendar, tickets: Tickets, inbox: Inbox, workspaces: Workspaces, integrations: Integrations, team: Team, branding: Branding, apikeys: ApiKeys, mcp: Mcp, billing: Billing, profile: Profile };
  const CurrentView = views[S.view] || Overview;
  const c = API.user || {};
  return html`<div class="flex">
    <aside class="sidebar">
      <div class="flex items-center gap-2 px-3 py-4 mb-2">
        ${c.avatar_url
          ? html`<img id="header-avatar" src=${avatarSrc(c.avatar_url, S.avatarBust)} alt="Profile" class="w-8 h-8 rounded-full object-cover" style="border:1px solid #e2e8f0" />`
          : html`<span class="text-2xl">📞</span>`}
        <span class="nav-txt font-bold text-gray-800">MissedCall</span>
      </div>
      <nav class="flex-1 space-y-1" aria-label="Console sections">
        ${nav.map(n => html`<button type="button" class="nav-item ${S.view===n.id?'active':''}" aria-current=${S.view===n.id?'page':'false'} onClick=${() => { S.view = n.id; renderApp(); }}><span aria-hidden="true">${n.icon}</span><span class="nav-txt">${n.label}</span></button>`)}
      </nav>
      <!-- The signed-in person, by NAME like every other app's sidebar (cron 2026-10-18). This used
           to print the raw email address here while the overview said "Welcome back, <name>", so the
           one place a customer looks to confirm who they are showed an address instead of their name.
           The email stays reachable as the tooltip, and remains the fallback when no name is set. -->
      <div class="text-xs text-gray-400 px-3 py-2 truncate" title=${c.email || ''}>${c.name || c.email || ''}</div>
      <!-- The account LEVEL (kanban t_9cd2c8f2): the REAL plan tier from GET /auth/me, never the
           literal word "User" (the FunnelSwift defect). Falls back to "Free" only when the server
           has not answered yet. -->
      <div class="px-3 pb-2"><span id="level-label" class="badge badge-blue" style=${c.plan_name ? '' : 'display:none'}>${c.plan_name || ''}</span></div>
      <!-- User guide link (kanban t_5af0ddda): the fleet standard puts the user guide at
           /guide.html on THIS origin and links it from the app shell beside sign-out. Before this
           the tenant shell linked its own guide nowhere - only the marketing footer did, and it
           pointed at the other origin. -->
      <a class="nav-item" id="user-guide-link" href="/guide.html" target="_blank" rel="noopener"><span>📖</span><span class="nav-txt">User Guide</span></a>
      <button type="button" class="nav-item text-red-500" onClick=${() => { API.logout(); location.href = '/'; }}><span aria-hidden="true">🚪</span><span class="nav-txt">Logout</span></button>
    </aside>
    <div class="main">
      <${WsSwitcher} />
      ${impTenant && html`<div class="imp-banner" id="imp-banner" data-impersonating=${impTenant}>
        <span>🔑 Impersonating <b>${impTenant}</b> — this tab is the customer's session, not yours. Your operator session stays open on the admin panel.</span>
        <button id="imp-stop" onClick=${() => endImpersonation()}>Exit impersonation</button>
        ${S.impStopError && html`<span id="imp-stop-error" class="imp-error">${S.impStopError}</span>`}
      </div>`}
      <${CurrentView} />
    </div>
  </div>`;
};

const renderApp = () => {
  render(html`<${App} />`, document.getElementById('app'));
  // Keep the inline guide on the screen the tenant is looking at. The widget cannot follow a preact
  // SPA by path/hash, so it is told the view id on every render — only when a session exists, so the
  // sign-in screen never shows a screen's guide.
  if (API.token && window.inlineGuidePage) window.inlineGuidePage(S.view);
};
renderApp();
</script>
<div style="max-width:1100px;margin:8px auto 32px;padding:0 24px;text-align:center;font-size:12px;color:#94a3b8">
  <a href="https://missedcallrespondr.com/privacy" style="color:#64748b;text-decoration:none">Privacy Policy</a>
  &middot; <a href="https://missedcallrespondr.com/terms" style="color:#64748b;text-decoration:none">Terms of Service</a>
  &middot; <a href="/guide.html" target="_blank" rel="noopener" style="color:#64748b;text-decoration:none">User Guide</a>
</div>
</body>
</html>
