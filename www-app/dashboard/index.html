<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- IMPERSONATION HAND-OFF (kanban t_25b8c662). The operator console on admin.missedcallrespondr.com
     mints a 15-minute `impersonated` token and opens THIS url with the token in the FRAGMENT.
     A fragment is never sent to the server, so it cannot land in an access log or a Referer; we
     adopt it once, then strip it from the address bar (skill: session-credential-out-of-url-and-logs).
     Inline and in <head> on purpose: it must run BEFORE the module below reads sessionStorage, and
     before any subresource request could carry the fragment in a Referer. -->
<script>
!function () {
  try {
    var h = window.location.hash || '';
    if (h.indexOf('impersonation_token=') < 0) return;
    var q = {};
    h.replace(/^#/, '').split('&').forEach(function (kv) {
      var i = kv.indexOf('=');
      if (i > 0) q[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1));
    });
    if (!q.impersonation_token) return;
    var who = q.impersonation_tenant || 'a tenant';
    sessionStorage.setItem('mc_token', q.impersonation_token);
    // NOT the operator's identity: the impersonated token keeps the operator's `sub`, so
    // GET /auth/me would hand this shell the ADMIN's own user row. A marker instead.
    sessionStorage.setItem('mc_user', JSON.stringify({
      email: 'impersonated@' + who, name: 'Impersonating ' + who, impersonated: true, tenant: who
    }));
    history.replaceState(null, '', window.location.pathname + window.location.search);
  } catch (e) { /* never let the hand-off break the shell; the guard below still applies */ }
}();
</script>
<title>MissedCall Respondr — Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:Inter,system-ui,sans-serif;background:#f8fafc;margin:0}.sidebar{width:230px;background:#fff;border-right:1px solid #e2e8f0;min-height:100vh;padding:18px 12px;display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0}.main{margin-left:230px;padding:24px;min-height:100vh}.card{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);padding:20px;margin-bottom:16px}.btn{background:#2563eb;color:#fff;padding:8px 16px;border-radius:8px;cursor:pointer;border:none;font-weight:500}.btn:hover{background:#1d4ed8}.btn-sm{padding:5px 12px;font-size:13px}.btn-red{background:#dc2626}.btn-red:hover{background:#b91c1c}.btn-green{background:#059669}.btn-green:hover{background:#047857}.btn-outline{background:0 0;border:1px solid #cbd5e1;color:#475569}.btn-outline:hover{background:#f1f5f9}.input{border:1px solid #cbd5e1;border-radius:8px;padding:8px 12px;width:100%;font-size:14px;outline:0}.input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.1)}.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000}.modal-content{background:#fff;border-radius:16px;padding:24px;width:90%;max-width:480px;max-height:80vh;overflow-y:auto}.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:12px;font-weight:500}.badge-green{background:#d1fae5;color:#065f46}.badge-red{background:#fee2e2;color:#991b1b}.badge-yellow{background:#fef3c7;color:#92400e}.badge-blue{background:#dbeafe;color:#1e40af}.nav-item{padding:10px 16px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:10px;color:#64748b;font-size:14px;font-weight:500}.nav-item:hover{background:#f1f5f9;color:#1e293b}.nav-item.active{background:#2563eb;color:#fff}.table{width:100%;border-collapse:collapse}.table th{text-align:left;padding:10px 12px;font-size:12px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid #e2e8f0}.table td{padding:10px 12px;font-size:14px;border-bottom:1px solid #f1f5f9}.table tr:hover td{background:#f8fafc}.stat-card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.08)}.stat-value{font-size:28px;font-weight:700;color:#1e293b}.stat-label{font-size:13px;color:#64748b;margin-top:4px}@media(max-width:768px){.sidebar{width:60px!important}.sidebar .nav-txt{display:none}.sidebar .nav-item{justify-content:center;padding:10px}.main{margin-left:60px!important}}.imp-banner{background:#fef3c7;border:1px solid #f59e0b;color:#92400e;border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:13px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.imp-banner button{background:#92400e;color:#fff;border:0;border-radius:6px;padding:5px 10px;cursor:pointer;font-size:12px;font-weight:500}</style>

<body>
<div id="app"></div>
<script type="module">
// preact + htm, exactly the fleet pattern the other shells use (www-admin, WorkflowSwift).
// The shipped tag loaded cdn.jsdelivr.net/npm/lit-html@2.8.0/lit-html.min.js in a CLASSIC
// script and then read window['lit-html']: jsDelivr serves that path as a raw ES module, so
// the browser threw "Unexpected token 'export'", the destructure threw
// "Cannot destructure property 'html' of 'window.lit-html' as it is undefined", and the
// dashboard rendered NOTHING — every view, and every fetch it owns, was dead. The shell is
// written in preact/htm style anyway (onClick=/onInput= props and <${Component} /> tags, 41/25/3
// occurrences — lit-html supports none of those), so the loader was pointing at the wrong library.
import { h, render } from 'https://esm.sh/preact@10.26.4';
import htm from 'https://esm.sh/htm@3.1.1';
const html = htm.bind(h);

// ===== API =====
const API = (() => {
  const base = window.location.origin + '/api/v1';
  let token = sessionStorage.getItem('mc_token');
  let user = JSON.parse(sessionStorage.getItem('mc_user') || 'null');
  const headers = () => ({ 'Content-Type': 'application/json', ...(token ? { 'Authorization': 'Bearer ' + token } : {}) });
  const handle = async (r) => { const d = await r.json(); if (!r.ok) throw new Error(d.error || d.message || 'Request failed'); return d; };
  const get = (p) => fetch(base + p, { headers: headers() }).then(handle);
  const post = (p, b) => fetch(base + p, { method: 'POST', headers: headers(), body: JSON.stringify(b) }).then(handle);
  const put = (p, b) => fetch(base + p, { method: 'PUT', headers: headers(), body: JSON.stringify(b) }).then(handle);
  const del = (p) => fetch(base + p, { method: 'DELETE', headers: headers() }).then(handle);
  return {
    get, post, put, del,
    get token() { return token; },
    get user() { return user; },
    setAuth(t, u) { token = t; user = u; sessionStorage.setItem('mc_token', t); sessionStorage.setItem('mc_user', JSON.stringify(u)); },
    logout() { token = null; user = null; sessionStorage.removeItem('mc_token'); sessionStorage.removeItem('mc_user'); }
  };
})();

const S = { view: 'overview', loading: false, error: null, views: {} };
const viewState = (name, defaults = {}) => { if (!S.views[name]) S.views[name] = Object.assign({}, defaults); return S.views[name]; };

// ===== LOGIN =====
const LoginView = () => {
  // kanban t_02ef49ca — the login draft lives in the SHARED view object (S.views['login_form']),
  // never a per-render local: the Sign In handler itself calls renderApp() (S.loading / S.error),
  // so the old `let email = '', pw = ''` blanked BOTH fields on every attempt.
  const f = viewState('login_form', { email: '', pw: '' });
  const submit = async (e) => { e.preventDefault(); S.loading = true; S.error = null; renderApp();
    try { const r = await API.post('/auth/login', { email: f.email, password: f.pw }); API.setAuth(r.token, r.team_member || r.user || r); f.email = ''; f.pw = ''; S.view = 'overview'; } catch (err) { S.error = err.message; }
    S.loading = false; renderApp();
  };
  return html`<div class="flex items-center justify-center min-h-screen w-full">
    <div class="card w-full max-w-sm mx-4">
      <div class="text-center mb-6">
        <div class="text-3xl mb-2">📞</div>
        <h1 class="text-xl font-bold text-gray-800">MissedCall Respondr</h1>
        <p class="text-sm text-gray-500 mt-1">Auto-Response Platform</p>
      </div>
      <form onSubmit=${submit} class="space-y-4">
        <div><label class="text-sm font-medium text-gray-600 block mb-1">Email</label><input type="email" class="input" value=${f.email} onInput=${e => f.email = e.target.value} required /></div>
        <div><label class="text-sm font-medium text-gray-600 block mb-1">Password</label><input type="password" class="input" value=${f.pw} onInput=${e => f.pw = e.target.value} required /></div>
        ${S.error && html`<div class="text-red-600 text-sm bg-red-50 p-2 rounded-lg">${S.error}</div>`}
        <button type="submit" class="btn w-full">Sign In</button>
      </form>
      <p class="text-sm text-gray-500 mt-4 text-center">New to MissedCall? <a href="/register.html" class="text-blue-600">Create an account</a></p>
      <p class="text-sm text-gray-500 mt-2 text-center"><a href="/forgot-password.html" class="text-blue-600">Forgot password?</a></p>
    </div>
  </div>`;
};

// ===== OVERVIEW =====
const Overview = () => {
  const st = viewState('overview', {});
  if (!st._loaded) { st._loaded = true;
    API.get('/dashboard/stats').then(s => Object.assign(st, s)).catch(() => {}).then(renderApp);
    API.get('/me/usage').then(u => { st.usage = u; renderApp(); }).catch(() => {});
  }
  const c = API.user || {};
  return html`<div>
    <h2 class="text-xl font-bold mb-4">Overview</h2>
    <div class="card"><p class="text-sm text-gray-600">Welcome back, <b>${c.email || c.name || 'there'}</b>. Here's what's happening with your auto-response setup.</p></div>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4">
      <div class="stat-card"><div class="stat-value">${st.total_rules ?? '...'}</div><div class="stat-label">Response Rules</div></div>
      <div class="stat-card"><div class="stat-value">${st.total_templates ?? '...'}</div><div class="stat-label">Templates</div></div>
      <div class="stat-card"><div class="stat-value">${st.total_contacts ?? '...'}</div><div class="stat-label">Contacts</div></div>
      <div class="stat-card"><div class="stat-value">${st.total_responses ?? '...'}</div><div class="stat-label">Auto-Responses</div></div>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="card"><h3 class="font-semibold mb-2">Credits</h3><p class="text-sm text-gray-600">${st.usage && st.usage.available_credits !== undefined ? st.usage.available_credits + ' credits available' : 'Loading…'}</p></div>
      <div class="card"><h3 class="font-semibold mb-2">Phone Numbers</h3><p class="text-sm text-gray-600">Manage your numbers in the <b>Phone Numbers</b> tab.</p></div>
    </div>
  </div>`;
};

// ===== PHONE NUMBERS =====
// kanban t_f06b1710 — this screen was read-only while POST /telnyx/numbers and
// DELETE /telnyx/numbers/:id were mounted and gated by the plan's own max_phone_numbers, so the
// sold entitlement had no panel. Adding a number buys it on the platform's Telnyx account when the
// platform holds a credential; a Pro/Enterprise tenant that has connected its own Telnyx key
// (Integrations) registers a number it already owns. Releasing leaves the list (the route
// soft-deletes the row) and frees the plan slot. Whatever the server refuses, its own sentence shows.
const PhoneNumbers = () => {
  const st = viewState('phoneNumbers', { list: [], showAdd: false, busy: null, notice: null, error: null });
  const load = async () => {
    // kanban t_f06b1710 — the reload must NOT clear st.error: every write action ends with load(),
    // so a `st.error = null` here wiped the server's own refusal the moment the list reloaded, and
    // the operator saw "nothing happened" instead of "Telnyx not configured by admin" (measured in
    // real Chromium). Each action clears the slot when it STARTS.
    try { const d = await API.get('/telnyx/numbers'); st.list = Array.isArray(d) ? d : (Array.isArray(d.numbers) ? d.numbers : []); }
    catch (e) { st.error = 'Could not load numbers: ' + e.message; st.list = []; }
    renderApp();
  };
  if (!st._loaded) { st._loaded = true; load(); }
  const openAdd = () => { st.error = null; st.notice = null; Object.assign(viewState('numbers_form', {}), { number: '', name: '' }); st.showAdd = true; renderApp(); };
  const add = async () => {
    const f = viewState('numbers_form', { number: '', name: '' });
    const number = (f.number || '').trim();
    if (!number) { st.error = 'Enter the phone number with its country code, e.g. +15551234567'; renderApp(); return; }
    st.busy = 'add'; st.error = null; st.notice = null; renderApp();
    try {
      const body = { number };
      if ((f.name || '').trim()) body.friendly_name = f.name.trim();
      await API.post('/telnyx/numbers', body);
      st.notice = number + ' added'; st.showAdd = false; f.number = ''; f.name = '';
    } catch (e) { st.error = 'Could not add the number: ' + e.message; }
    st.busy = null; load();
  };
  const release = async (n) => {
    if (!confirm('Release ' + (n.number || 'this number') + '? It leaves your account and frees the plan slot.')) return;
    st.busy = n.id; st.error = null; st.notice = null; renderApp();
    try { await API.del('/telnyx/numbers/' + n.id); st.notice = (n.number || 'The number') + ' released'; }
    catch (e) { st.error = 'Could not release the number: ' + e.message; }
    st.busy = null; load();
  };
  return html`<div>
    <div class="flex items-center justify-between mb-4"><h2 class="text-xl font-bold">Phone Numbers</h2>
      <button class="btn btn-sm btn-green" onClick=${openAdd}>+ Add Number</button></div>
    ${st.error && html`<div class="card" style="border-left:4px solid #dc2626"><p class="text-sm text-red-700">${st.error}</p></div>`}
    ${st.notice && html`<div class="card" style="border-left:4px solid #059669"><p class="text-sm text-gray-700">${st.notice}</p></div>`}
    <div class="card p-0 overflow-hidden">
      <table class="table"><thead><tr><th>Number</th><th>Status</th><th>Added</th><th></th></tr></thead>
        <tbody>${st.list.map(n => html`<tr><td class="font-medium">${n.number || n.phone_number || n.id || '-'}</td><td><span class="badge ${n.status==='active'||(n.active!==false)?'badge-green':'badge-yellow'}">${n.status||(n.active!==false?'active':'inactive')}</span></td><td class="text-gray-500">${n.created_at?new Date(n.created_at).toLocaleDateString():'-'}</td><td><button class="btn btn-sm btn-red" disabled=${st.busy === n.id} onClick=${() => release(n)}>Release</button></td></tr>`)}
        ${st.list.length===0 && html`<tr><td colspan="4" class="text-center text-gray-400 py-8">No phone numbers yet. Add one, or wait for the platform operator to provision it.</td></tr>`}
      </tbody></table>
    </div>
    ${st.showAdd && html`<div class="modal" onClick=${e => e.target===e.currentTarget && (st.showAdd = false, renderApp())}><div class="modal-content">
      <h3 class="text-lg font-bold mb-4">Add a number</h3>
      ${(() => { const f = viewState('numbers_form', { number: '', name: '' });
        return html`<div class="space-y-3">
        <div><label class="text-sm font-medium block mb-1">Phone number</label><input class="input" value=${f.number} onInput=${e => { f.number = e.target.value; }} placeholder="+15551234567" /></div>
        <div><label class="text-sm font-medium block mb-1">Label (optional)</label><input class="input" value=${f.name} onInput=${e => { f.name = e.target.value; }} placeholder="Front desk" /></div>
        <p class="text-xs text-gray-500">The number is bought on the platform's Telnyx account when the platform holds one. A tenant that has connected its own Telnyx key under Integrations registers a number it already owns. Your plan limits how many you can hold.</p>
        <div class="flex gap-2 justify-end mt-4"><button class="btn btn-outline" onClick=${() => { st.showAdd = false; renderApp(); }}>Cancel</button><button class="btn" disabled=${st.busy === 'add'} onClick=${add}>Add</button></div>
      </div>`; })()}
    </div></div>`}
  </div>`;
};

// ===== CALLS (the missed-call queue + the respond action) =====
// GET /calls lists this tenant's inbound calls. POST /calls/:id/respond is the product's core
// action: the handler schedules the call-back follow-up, and it only writes one for a call whose
// disposition is 'missed' — so the button is offered exactly there (and never faked elsewhere).
const Calls = () => {
  const st = viewState('calls', { list: [], responded: {}, busy: null, notice: null, error: null });
  const load = async () => {
    try { const d = await API.get('/calls'); st.list = Array.isArray(d) ? d : []; st.error = null; }
    catch (e) { st.error = 'Could not load calls: ' + e.message; st.list = []; }
    renderApp();
  };
  if (!st._loaded) { st._loaded = true; load(); }
  // kanban t_f06b1710 — export what this screen lists. The route used to read `call_logs` while the
  // table below lists `inbound_calls` (GET /calls); it now reads the SAME table and emits these
  // columns, so the file cannot disagree with the rows on screen. The token rides in the header, so
  // the file is fetched and handed to a blob download rather than opened as a bare link.
  const exportCsv = async () => {
    st.error = null; st.notice = null; renderApp();
    try {
      const r = await fetch(window.location.origin + '/api/v1/call-logs/export', { headers: { 'Authorization': 'Bearer ' + API.token } });
      if (!r.ok) {
        let m = 'Export failed (' + r.status + ')';
        try { const j = await r.json(); m = j.error || j.message || m; } catch (e) { /* not JSON */ }
        throw new Error(m);
      }
      const url = URL.createObjectURL(await r.blob());
      const a = document.createElement('a');
      a.href = url; a.download = 'call-log.csv';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      st.notice = 'Call log exported as call-log.csv';
    } catch (e) { st.error = 'Could not export the call log: ' + e.message; }
    renderApp();
  };
  const respond = async (c) => {
    st.busy = c.id; st.notice = null; st.error = null; renderApp();
    try {
      const r = await API.post('/calls/' + c.id + '/respond', {});
      st.responded = Object.assign({}, st.responded, { [c.id]: true });
      st.notice = (r.message || 'Response queued') + ' — a call-back follow-up was created (see Follow-ups).';
    } catch (e) { st.error = 'Respond failed: ' + e.message; }
    st.busy = null; renderApp();
  };
  const rows = st.list.slice(0, 100);
  return html`<div>
    <div class="flex items-center justify-between mb-4"><h2 class="text-xl font-bold">Calls</h2>
      <div class="flex items-center gap-2">
        <button class="btn btn-sm btn-outline" onClick=${exportCsv}>Export CSV</button>
        <button class="btn btn-sm btn-outline" onClick=${() => load()}>Refresh</button>
      </div></div>
    ${st.error && html`<div class="card" style="border-left:4px solid #dc2626"><p class="text-sm text-red-700">${st.error}</p></div>`}
    ${st.notice && html`<div class="card" style="border-left:4px solid #059669"><p class="text-sm text-gray-700">${st.notice}</p></div>`}
    <div class="card p-0 overflow-hidden">
      <table class="table"><thead><tr><th>Caller</th><th>Called</th><th>When</th><th>Disposition</th><th>Action</th></tr></thead>
        <tbody>${rows.map(c => html`<tr>
          <td class="font-medium">${c.caller_name || c.caller_number || '-'}</td>
          <td class="text-gray-500">${c.called_number || '-'}</td>
          <td class="text-gray-500 text-sm">${c.call_time ? new Date(c.call_time).toLocaleString() : '-'}</td>
          <td><span class="badge ${c.disposition === 'missed' ? 'badge-red' : 'badge-blue'}">${c.disposition || '-'}</span></td>
          <td>${c.disposition === 'missed'
            ? html`<button class="btn btn-sm ${st.responded[c.id] ? 'btn-outline' : 'btn-green'}" disabled=${st.busy === c.id || !!st.responded[c.id]} onClick=${() => respond(c)}>${st.responded[c.id] ? 'Queued ✓' : 'Respond'}</button>`
            : html`<span class="text-gray-400 text-sm">—</span>`}</td>
        </tr>`)}
        ${rows.length === 0 && html`<tr><td colspan="5" class="text-center text-gray-400 py-8">No calls yet. Calls land here from your Telnyx number.</td></tr>`}
      </tbody></table>
    </div>
  </div>`;
};

// ===== PROFILE (PUT /auth/profile + PUT /auth/password) =====
const Profile = () => {
  const c = API.user || {};
  const st = viewState('profile', { name: null, notice: null, error: null, busy: false, cur: '', next: '' });
  if (st.name === null) st.name = c.name || '';
  const save = async () => {
    st.busy = true; st.notice = null; st.error = null; renderApp();
    try {
      const r = await API.put('/auth/profile', { name: st.name });
      API.setAuth(API.token, Object.assign({}, c, { name: r.name || st.name }));
      st.notice = r.message || 'Profile updated';
    } catch (e) { st.error = 'Save failed: ' + e.message; }
    st.busy = false; renderApp();
  };
  const changePw = async () => {
    st.busy = true; st.notice = null; st.error = null; renderApp();
    try {
      const r = await API.put('/auth/password', { current_password: st.cur, new_password: st.next });
      st.notice = r.message || 'Password updated'; st.cur = ''; st.next = '';
    } catch (e) { st.error = 'Password change failed: ' + e.message; }
    st.busy = false; renderApp();
  };
  return html`<div>
    <h2 class="text-xl font-bold mb-4">Profile</h2>
    ${st.error && html`<div class="card" style="border-left:4px solid #dc2626"><p class="text-sm text-red-700">${st.error}</p></div>`}
    ${st.notice && html`<div class="card" style="border-left:4px solid #059669"><p class="text-sm text-gray-700">${st.notice}</p></div>`}
    <div class="card">
      <h3 class="font-semibold mb-3">Your details</h3>
      <div class="space-y-3" style="max-width:420px">
        <div><label class="text-sm font-medium block mb-1">Email</label>
          <input class="input" value=${c.email || ''} disabled /></div>
        <div><label class="text-sm font-medium block mb-1">Name</label>
          <input class="input" value=${st.name || ''} onInput=${e => { st.name = e.target.value; }} /></div>
        <button class="btn btn-sm" disabled=${st.busy} onClick=${save}>Save profile</button>
      </div>
    </div>
    <div class="card">
      <h3 class="font-semibold mb-3">Change password</h3>
      <div class="space-y-3" style="max-width:420px">
        <div><label class="text-sm font-medium block mb-1">Current password</label>
          <input class="input" type="password" value=${st.cur} onInput=${e => { st.cur = e.target.value; }} /></div>
        <div><label class="text-sm font-medium block mb-1">New password (min 8)</label>
          <input class="input" type="password" value=${st.next} onInput=${e => { st.next = e.target.value; }} /></div>
        <button class="btn btn-sm" disabled=${st.busy} onClick=${changePw}>Update password</button>
      </div>
    </div>
  </div>`;
};

// ===== RESPONSE RULES =====
// kanban t_31f9cf38 — these rules used to be stored and never read: the screen was CRUD-only and no
// inbound-call path touched `response_rules`. They now run (src/handlers/response_rule_eval.rs), so
// the form carries exactly what the call path can act on: a trigger the evaluator reads, an action
// that has a transport behind it, the message to send, and the priority the documented evaluation
// order runs on. `email` and `voice` are gone — a call carries no email address to reply to and this
// service has no outbound-call transport, so neither option could ever have done anything.
const RULE_TRIGGERS = [['all_missed_calls', 'All missed calls'], ['specific_numbers', 'Specific numbers'], ['time_of_day', 'Time of day'], ['day_of_week', 'Day of week']];
const RULE_ACTIONS = [['sms', 'SMS — text the caller back'], ['callback', 'Callback — queue a return call']];
const RULE_DAYS = [['mon', 'Mon'], ['tue', 'Tue'], ['wed', 'Wed'], ['thu', 'Thu'], ['fri', 'Fri'], ['sat', 'Sat'], ['sun', 'Sun']];
const ruleLabel = (pairs, v) => { const hit = pairs.find(p => p[0] === v); return hit ? hit[1] : (v || '-'); };
const ruleScheduleOf = (f) => f.trigger === 'specific_numbers'
  ? { numbers: (f.numbers || '').split(/[\n,;]+/).map(s => s.trim()).filter(Boolean) }
  : f.trigger === 'time_of_day'
    ? { window: { start: f.start || '09:00', end: f.end || '17:00' } }
    : f.trigger === 'day_of_week' ? { days: (f.days || []).slice() } : null;

  const show = (i) => { st.editItem = i; st.formSeeded = false; st.showModal = true; renderApp(); };
  const hide = () => { st.showModal = false; renderApp(); };
  const save = async (data) => { try { if (st.editItem) await API.put('/response-rules/' + st.editItem.id, data); else await API.post('/response-rules', data); st.showModal = false; load(); } catch (e) { alert(e.message); } };
  const remove = async (id) => { if (!confirm('Delete this rule?')) return; await API.del('/response-rules/' + id); load(); };
  return html`<div>
    <div class="flex items-center justify-between mb-4"><h2 class="text-xl font-bold">Response Rules</h2><button class="btn btn-sm btn-green" onClick=${() => show(null)}>+ Add Rule</button></div>
    <p class="text-sm text-gray-500 mb-4">Rules run when a call comes in. They are checked in priority order (lowest first) and the first matching rule acts: a text back to the caller, or a callback queued for you in Follow Ups. A text leaves through Telnyx, so the Telnyx API key and messaging profile must be saved under Admin &rarr; Telnyx Config before one can go out.</p>
    <div class="card p-0 overflow-hidden">

        ${st.list.length===0 && html`<tr><td colspan="6" class="text-center text-gray-400 py-8">No response rules yet.</td></tr>`}
      </tbody></table>
    </div>
    ${st.showModal && html`<div class="modal" onClick=${e => e.target===e.currentTarget && hide()}><div class="modal-content"><h3 class="text-lg font-bold mb-4">${st.editItem?'Edit':'Add'} Rule</h3>
      ${(() => {
        // kanban t_13330c68 — the draft lives in the SHARED view object (S.views['rules_form']), seeded ON
        // OPEN because show() clears st.formSeeded. The template IIFE re-runs on every renderApp(), so a
        // per-render local re-initialised the field from the stored ROW and wiped what the operator
        // typed (guard rule 4); a re-render can no longer do that.
        const f = viewState('rules_form', { name: '', trigger: 'all_missed_calls', type: 'sms', text: '', numbers: '', start: '09:00', end: '17:00', days: [], priority: 100, active: true });
        if (!st.formSeeded) {
          const row = st.editItem;
          f.name = row?.name||'';
          // A row written before this change could hold a free-text condition or a retired action;
          // seed the picker with the stored value only when it is one the call path reads.
          f.trigger = RULE_TRIGGERS.some(t => t[0] === row?.trigger_condition) ? row.trigger_condition : 'all_missed_calls';
          f.type = RULE_ACTIONS.some(a => a[0] === row?.response_type) ? row.response_type : 'sms';
          f.text = (row?.response_content||{}).text||'';
          f.numbers = ((row?.schedule||{}).numbers||[]).join('\n');
          f.start = ((row?.schedule||{}).window||{}).start||'09:00';
          f.end = ((row?.schedule||{}).window||{}).end||'17:00';
          f.days = ((row?.schedule||{}).days||[]).slice();

        }
        return html`<div class="space-y-3">
          <div><label class="text-sm font-medium block mb-1">Name</label><input class="input" value=${f.name} onInput=${e => { f.name = e.target.value; }} /></div>

          ${f.trigger === 'specific_numbers' && html`<div><label class="text-sm font-medium block mb-1">Caller numbers (one per line)</label><textarea class="input" rows="3" value=${f.numbers} onInput=${e => { f.numbers = e.target.value; }} placeholder="+15550101234"></textarea></div>`}
          ${f.trigger === 'time_of_day' && html`<div class="flex gap-2"><div class="flex-1"><label class="text-sm font-medium block mb-1">From</label><input class="input" type="time" value=${f.start} onInput=${e => { f.start = e.target.value; }} /></div><div class="flex-1"><label class="text-sm font-medium block mb-1">To</label><input class="input" type="time" value=${f.end} onInput=${e => { f.end = e.target.value; }} /></div></div>`}
          ${f.trigger === 'day_of_week' && html`<div><label class="text-sm font-medium block mb-1">Days</label><div class="flex flex-wrap gap-3">${RULE_DAYS.map(d => html`<label class="text-sm flex items-center gap-1"><input type="checkbox" checked=${f.days.indexOf(d[0]) >= 0} onChange=${e => { const on = e.target.checked; f.days = on ? f.days.concat([d[0]]) : f.days.filter(x => x !== d[0]); renderApp(); }} />${d[1]}</label>`)}</div></div>`}
          <div><label class="text-sm font-medium block mb-1">Action</label><select class="input" value=${f.type} onChange=${e => { f.type = e.target.value; renderApp(); }}>${RULE_ACTIONS.map(a => html`<option value=${a[0]}>${a[1]}</option>`)}</select></div>
          ${f.type === 'sms' && html`<div><label class="text-sm font-medium block mb-1">Message</label><textarea class="input" rows="3" value=${f.text} onInput=${e => { f.text = e.target.value; }} placeholder="Sorry we missed you! We will call you back shortly."></textarea></div>`}
          <div class="flex gap-3 items-end"><div style="width:140px"><label class="text-sm font-medium block mb-1">Priority</label><input class="input" type="number" min="1" value=${f.priority} onInput=${e => { f.priority = parseInt(e.target.value, 10) || 100; }} /></div><label class="text-sm flex items-center gap-1 mb-2"><input type="checkbox" checked=${f.active} onChange=${e => { f.active = e.target.checked; renderApp(); }} />Enabled</label></div>
          <div class="flex gap-2 justify-end mt-4"><button class="btn btn-outline" onClick=${() => hide()}>Cancel</button><button class="btn" onClick=${() => save({ name: f.name, trigger_condition: f.trigger, response_type: f.type, response_content: { text: f.text }, schedule: ruleScheduleOf(f), priority: f.priority, is_active: f.active })}>${st.editItem?'Save':'Add'}</button></div>
        </div>`; })()}
    </div></div>`}
  </div>`;
};

// kanban t_2ed95642 — the badge paints the PROVIDER'S answer, never ours: green only for what
// Telnyx confirmed (sent to the carrier / delivered to the handset), blue while it is still with
// the provider, red for a message the provider refused.
const messageBadge = (s) => (s === 'delivered' || s === 'sent') ? 'badge-green' : s === 'failed' ? 'badge-red' : s === 'queued' ? 'badge-blue' : 'badge-yellow';
// The API stores naive UTC (the server writes Utc::now().naive_utc()). A naive ISO string is read
// by the browser as LOCAL time, so the clock time would be wrong by the timezone offset; pin it to
// UTC before formatting.
const utcTime = (v) => { if (!v) return '-'; const s = String(v); const iso = /[zZ]|[+-]\d\d:\d\d$/.test(s) ? s : s + 'Z'; const d = new Date(iso); return isNaN(d.getTime()) ? '-' : d.toLocaleString(); };

const Messages = () => {
  const st = viewState('messages', { list: [], numbers: [], showModal: false });
  const load = async () => { try { const d = await API.get('/messages'); st.list = Array.isArray(d) ? d : []; renderApp(); } catch (e) { console.error(e); } };
  // kanban t_50239b29 — the Send form must POST the route's OWN shape (CreateMessageRequest:
  // direction/from_number/to_number/body). from_number is the tenant's own sending number, read from
  // the scoped endpoint GET /api/v1/telnyx/numbers (there is no /api/v1/phone-numbers route); it is
  // the empty string for a tenant that owns none — the client never invents a number.
  const loadNumbers = async () => { try { const d = await API.get('/telnyx/numbers'); st.numbers = Array.isArray(d) ? d : (d && Array.isArray(d.numbers) ? d.numbers : []); renderApp(); } catch (e) { st.numbers = []; } };
  if (!st._loaded) { st._loaded = true; load(); loadNumbers(); }
  const hide = () => { st.showModal = false; renderApp(); };
  const send = async (data) => { try { await API.post('/messages', data); st.showModal = false; load(); } catch (e) { /* kanban t_2ed95642 — a send can now fail at the provider: the route records the attempt as a "failed" row and answers 424 with Telnyx's own reason (424 rather than 502: the CDN replaces an origin 502 with its own page, so the provider's sentence would never reach this dialog), so the log is reloaded on the error path too (the failed row is part of it) and the modal stays open for a retry. */ alert(e.message); load(); } };
  return html`<div>
    <div class="flex items-center justify-between mb-4"><h2 class="text-xl font-bold">Messages</h2><button class="btn btn-sm btn-green" onClick=${() => { st.formSeeded = false; st.showModal = true; renderApp(); }}>+ Send Message</button></div>
    ${'' /* kanban t_2ed95642 — the send path now really transmits through Telnyx, and this table paints the PROVIDER'S answer: queued/sent/delivered as Telnyx reports them, failed when it refuses. The Sent and Delivered columns show the provider's own timestamps and each stays "-" until the provider says so. */}
    <p class="text-sm text-gray-500 mb-3">Messages are sent from your own number through the Telnyx number this account holds. A message shows <span class="font-medium">queued</span> when Telnyx accepts it, <span class="font-medium">sent</span> when the carrier takes it and <span class="font-medium">delivered</span> when the recipient's network confirms it. A message the provider refuses is recorded as <span class="font-medium">failed</span> and the reason is shown when you send it.</p>
    <div class="card p-0 overflow-hidden">
      <table class="table"><thead><tr><th>To</th><th>Body</th><th>Status</th><th>Sent</th><th>Delivered</th></tr></thead>
        <tbody>${st.list.slice(0,100).map(m => html`<tr><td class="font-medium">${m.to_number||m.to||m.phone||'-'}</td><td class="text-gray-500">${m.body||m.content||'-'}</td><td><span class="badge ${messageBadge(m.status)}">${m.status||'pending'}</span></td><td class="text-gray-500 text-sm">${utcTime(m.sent_at)}</td><td class="text-gray-500 text-sm">${utcTime(m.delivered_at)}</td></tr>`)}
        ${st.list.length===0 && html`<tr><td colspan="5" class="text-center text-gray-400 py-8">No messages yet.</td></tr>`}
      </tbody></table>
    </div>
    ${st.showModal && html`<div class="modal" onClick=${e => e.target===e.currentTarget && hide()}><div class="modal-content"><h3 class="text-lg font-bold mb-4">Send Message</h3>
      ${(() => { const f = viewState('messages_form', { from: '', to: '', body: '' });
        // kanban t_02ef49ca — CREATE-only draft, no row to re-seed from; shared so a renderApp()
        // while the modal is open cannot reset it to the literals.
        // kanban t_50239b29 — the From number is seeded from the tenant's OWN numbers
        // (GET /api/v1/telnyx/numbers) so a provisioned tenant just hits Send; the operator can
        // correct it, and the client never invents a number the tenant does not own.
        if (!st.formSeeded) { const n0 = (st.numbers || [])[0] || {}; f.from = n0.number || n0.phone_number || ''; f.to = ''; f.body = ''; st.formSeeded = true; }
        return html`<div class="space-y-3"><div><label class="text-sm font-medium block mb-1">From (your number)</label><input class="input" value=${f.from} onInput=${e => f.from=e.target.value} /></div><div><label class="text-sm font-medium block mb-1">To (phone)</label><input class="input" value=${f.to} onInput=${e => f.to=e.target.value} /></div><div><label class="text-sm font-medium block mb-1">Message</label><textarea class="input" rows="4" value=${f.body} onInput=${e => f.body=e.target.value}></textarea></div><div class="flex gap-2 justify-end mt-4"><button class="btn btn-outline" onClick=${() => hide()}>Cancel</button><button class="btn" onClick=${() => { const from = (f.from || '').trim(), to = (f.to || '').trim(); if (!from || !to) { alert('Enter your sending number (From) and the recipient number (To) before sending.'); return; } send({ direction: 'outbound', from_number: from, to_number: to, body: f.body }); }}>Send</button></div></div>`; })()}
    </div></div>`}

};

// ===== FOLLOW-UPS =====
// kanban t_f06b1710 — this screen was read-only while POST/PUT/DELETE /follow-ups were mounted and
// gated by the plan's own max_follow_ups (a gate whose only caller would have been a panel that did
// not exist: the Respond action and a Callback rule INSERT the row directly). The "Contact" column is
// fixed here too: it read f.contact_name || f.contact_id and FollowUp has NEITHER key (the row holds
// call_id), so every row painted '-' — the column now resolves call_id against GET /calls, which is
// what the row really references. A follow-up is always attached to one of your calls (call_id is a
// NOT NULL foreign key), so the picker lists your calls and the button is off until one exists.
const FollowUps = () => {
  const st = viewState('followups', { list: [], calls: [], showNew: false, busy: null, notice: null, error: null });
  const load = async () => {
    try { const c = await API.get('/calls'); st.calls = Array.isArray(c) ? c : (Array.isArray(c.calls) ? c.calls : []); } catch (e) { st.calls = []; }
    // kanban t_f06b1710 — no `st.error = null` on the reload: it erased a write action's own error.
    try { const d = await API.get('/follow-ups'); st.list = Array.isArray(d) ? d : []; }
    catch (e) { st.error = 'Could not load follow-ups: ' + e.message; st.list = []; }
    renderApp();
  };
  if (!st._loaded) { st._loaded = true; load(); }
  const callOf = (f) => (st.calls || []).find(c => c.id === f.call_id) || null;
  const callLabel = (f) => {
    const c = callOf(f);
    if (!c) return f.call_id ? String(f.call_id).slice(0, 8) + '…' : '-';
    return (c.caller_name || c.caller_number || 'call') + (c.call_time ? ' · ' + new Date(c.call_time).toLocaleString() : '');
  };
  const openNew = () => { st.error = null; st.notice = null; Object.assign(viewState('followups_form', {}), { call_id: '', type: 'call_back', when: '', notes: '' }); st.showNew = true; renderApp(); };
  const create = async () => {
    const f = viewState('followups_form', { call_id: '', type: 'call_back', when: '', notes: '' });
    if (!f.call_id) { st.error = 'Pick the call this follow-up belongs to'; renderApp(); return; }
    if (!f.when) { st.error = 'Pick when the call-back is due'; renderApp(); return; }
    st.busy = 'new'; st.error = null; st.notice = null; renderApp();
    try {
      // datetime-local is 'YYYY-MM-DDTHH:MM' and the route binds a NaiveDateTime, which needs seconds
      const when = String(f.when).length === 16 ? String(f.when) + ':00' : String(f.when);
      await API.post('/follow-ups', { call_id: f.call_id, follow_type: (f.type || '').trim() || 'call_back', scheduled_at: when, notes: (f.notes || '').trim() || null });
      st.notice = 'Follow-up scheduled'; st.showNew = false;
      f.call_id = ''; f.when = ''; f.notes = '';
    } catch (e) { st.error = 'Could not schedule the follow-up: ' + e.message; }
    st.busy = null; load();
  };
  const markDone = async (f) => {
    st.busy = f.id; st.error = null; st.notice = null; renderApp();
    try {
      // naive UTC like every other timestamp the app stores (the server writes Utc::now().naive_utc())
      const now = new Date().toISOString().slice(0, 19);
      await API.put('/follow-ups/' + f.id, { status: 'completed', completed_at: now });
      st.notice = 'Follow-up marked completed';
    } catch (e) { st.error = 'Could not update the follow-up: ' + e.message; }
    st.busy = null; load();
  };
  const remove = async (f) => {
    if (!confirm('Delete this follow-up?')) return;
    st.busy = f.id; st.error = null; st.notice = null; renderApp();
    try { await API.del('/follow-ups/' + f.id); st.notice = 'Follow-up deleted'; }
    catch (e) { st.error = 'Could not delete the follow-up: ' + e.message; }
    st.busy = null; load();
  };
  return html`<div>
    <div class="flex items-center justify-between mb-4"><h2 class="text-xl font-bold">Follow-ups</h2>
      <button class="btn btn-sm btn-green" disabled=${st.calls.length === 0} onClick=${openNew}>+ New Follow-up</button></div>
    ${st.error && html`<div class="card" style="border-left:4px solid #dc2626"><p class="text-sm text-red-700">${st.error}</p></div>`}
    ${st.notice && html`<div class="card" style="border-left:4px solid #059669"><p class="text-sm text-gray-700">${st.notice}</p></div>`}
    ${st.calls.length === 0 && html`<p class="text-xs text-gray-500 mb-2">A follow-up is always attached to one of your calls; none have come in yet, so there is nothing to schedule against.</p>`}
    <div class="card p-0 overflow-hidden">
      <table class="table"><thead><tr><th>Call</th><th>Scheduled</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody>${st.list.map(f => html`<tr><td class="text-gray-500">${callLabel(f)}</td><td class="text-gray-500">${f.scheduled_at?new Date(f.scheduled_at + 'Z').toLocaleString():'-'}</td><td><span class="badge ${f.status==='completed'||f.status==='done'?'badge-green':f.status==='scheduled'?'badge-blue':'badge-yellow'}">${f.status||'pending'}</span></td><td>${f.status==='completed'||f.status==='done' ? '' : html`<button class="btn btn-sm btn-outline" disabled=${st.busy === f.id} onClick=${() => markDone(f)}>Mark done</button>`}<button class="btn btn-sm btn-red" disabled=${st.busy === f.id} onClick=${() => remove(f)}>Delete</button></td></tr>`)}
        ${st.list.length===0 && html`<tr><td colspan="4" class="text-center text-gray-400 py-8">No follow-ups scheduled.</td></tr>`}
      </tbody></table>
    </div>
    ${st.showNew && html`<div class="modal" onClick=${e => e.target===e.currentTarget && (st.showNew = false, renderApp())}><div class="modal-content">
      <h3 class="text-lg font-bold mb-4">New Follow-up</h3>
      ${(() => { const f = viewState('followups_form', { call_id: '', type: 'call_back', when: '', notes: '' });
        return html`<div class="space-y-3">
        <div><label class="text-sm font-medium block mb-1">Call</label><select class="input" value=${f.call_id} onChange=${e => { f.call_id = e.target.value; }}><option value="">Pick a call…</option>${st.calls.map(c => html`<option value=${c.id}>${(c.caller_name || c.caller_number || 'call') + (c.call_time ? ' · ' + new Date(c.call_time).toLocaleString() : '')}</option>`)}</select></div>
        <div><label class="text-sm font-medium block mb-1">Type</label><input class="input" value=${f.type} onInput=${e => { f.type = e.target.value; }} placeholder="call_back" /></div>
        <div><label class="text-sm font-medium block mb-1">Due</label><input class="input" type="datetime-local" value=${f.when} onInput=${e => { f.when = e.target.value; }} /></div>
        <div><label class="text-sm font-medium block mb-1">Notes (optional)</label><textarea class="input" rows="3" value=${f.notes} onInput=${e => { f.notes = e.target.value; }}></textarea></div>
        <div class="flex gap-2 justify-end mt-4"><button class="btn btn-outline" onClick=${() => { st.showNew = false; renderApp(); }}>Cancel</button><button class="btn" disabled=${st.busy === 'new'} onClick=${create}>Schedule</button></div>
      </div>`; })()}
    </div></div>`}
  </div>`;
};

// ===== CONTACTS =====
// Server-side search (GET /contacts/search — q= substring, phone= LIKE pattern), the tenant's
// custom-field definitions (GET /contacts/custom-fields) rendered as real columns
// (GET /contacts/with-fields), and per-contact values saved with
// PUT /contacts/:contact_id/fields/:field_id.
//
// Key trap: a DEFINITION comes back keyed by `id`, while the same field inside a contact's
// `custom_fields` comes back keyed by `field_id`. Reading a definition with `f.field_id` is
// undefined — which silently rendered every custom column as "—" and made Save iterate zero
// values, so PUT /contacts/:id/fields/:fid was never sent while the UI reported success.
const fieldKey = (f) => (f && (f.field_id || f.id)) || '';
const Contacts = () => {
  const st = viewState('contacts', {
    list: [], fields: [], search: '', searching: false, showFields: false, showValues: null,
    values: {}, draft: { name: '', type: 'text', order: 0 }, responder: '', busy: null,
    notice: null, error: null,
    showForm: false, editItem: null, formSeeded: false
  });
  const load = async () => {
    try { const f = await API.get('/contacts/custom-fields'); st.fields = Array.isArray(f) ? f : []; }
    catch (e) { st.fields = []; }
    try {
      const d = st.fields.length ? await API.get('/contacts/with-fields') : await API.get('/contacts');
      // kanban t_f06b1710 — no `st.error = null` here: the write actions reload through load(), and
      // clearing the slot on a successful reload hid the server's refusal (e.g. a duplicate email).
      st.list = Array.isArray(d) ? d : [];
    } catch (e) { st.error = 'Could not load contacts: ' + e.message; st.list = []; }
    renderApp();
  };
  if (!st._loaded) { st._loaded = true; load(); }

  let timer = null;
  const onSearch = (v) => {
    st.search = v; renderApp();
    if (timer) clearTimeout(timer);
    timer = setTimeout(async () => {
      st.searching = true; renderApp();
      const q = (st.search || '').trim();
      try {
        const d = q ? await API.get('/contacts/search?q=' + encodeURIComponent(q)) : await API.get('/contacts');
        st.list = Array.isArray(d) ? d : []; st.error = null;
      } catch (e) { st.error = 'Search failed: ' + e.message; }
      st.searching = false; renderApp();
    }, 300);
  };

  const addField = async () => {
    const name = (st.draft.name || '').trim();
    if (!name) { st.error = 'Field name is required'; renderApp(); return; }
    st.busy = 'addfield'; st.error = null; renderApp();
    try {
      await API.post('/contacts/custom-fields', { field_name: name, field_type: st.draft.type || 'text', field_order: Number(st.draft.order) || 0 });
      st.draft = { name: '', type: 'text', order: 0 }; st.notice = 'Custom field "' + name + '" created'; st.showFields = false;
    } catch (e) { st.error = 'Could not add field: ' + e.message; }
    st.busy = null; load();
  };
  const removeField = async (f) => {
    if (!confirm('Delete the custom field "' + f.field_name + '"? Its per-contact values go too.')) return;
    st.busy = f.id; st.error = null; renderApp();
    try { await API.del('/contacts/custom-fields/' + f.id); st.notice = 'Custom field "' + f.field_name + '" deleted'; }
    catch (e) { st.error = 'Could not delete field: ' + e.message; }
    st.busy = null; load();
  };

  // kanban t_f06b1710 — POST /contacts and PUT|DELETE /contacts/:id were mounted with no control
  // anywhere in the console. The panel below is the create/edit form (one shared draft, seeded on
  // OPEN — guard rule 4) plus the per-row Edit/Delete controls.
  //   create: empty optionals are OMITTED so the API stores NULL (some('') would store an empty
  //           string, which the create path's duplicate-email check treats as absent but the UI
  //           would then show as a real value);
  //   update: an emptied box sends '' — PUT binds it straight through, so that is how a field is
  //           cleared, and the row shows '-' again.
  const showContact = (c) => { st.editItem = c; st.formSeeded = false; st.error = null; st.notice = null; st.showForm = true; renderApp(); };
  const hideContact = () => { st.showForm = false; renderApp(); };
  const saveContact = async (data, isEdit) => {
    st.busy = 'form'; st.error = null; st.notice = null; renderApp();
    try {
      if (isEdit) await API.put('/contacts/' + st.editItem.id, data);
      else {
        const body = {};
        Object.keys(data).forEach(k => { const v = data[k]; if (v !== undefined && v !== null && !(typeof v === 'string' && v.trim() === '') && !(Array.isArray(v) && v.length === 0)) body[k] = v; });
        await API.post('/contacts', body);
      }
      st.showForm = false; st.notice = isEdit ? 'Contact updated' : 'Contact added';
    } catch (e) { st.error = 'Could not save the contact: ' + e.message; }
    st.busy = null; load();
  };
  const removeContact = async (c) => {
    if (!confirm('Delete ' + (c.name || 'this contact') + '? Their custom-field values go too.')) return;
    st.busy = c.id; st.error = null; st.notice = null; renderApp();
    try { await API.del('/contacts/' + c.id); st.notice = 'Contact deleted'; }
    catch (e) { st.error = 'Could not delete the contact: ' + e.message; }
    st.busy = null; load();
  };

  const openValues = async (c) => {
    st.showValues = c; st.values = {}; st.error = null; renderApp();
    const seed = (c.custom_fields || []).reduce((a, f) => { a[f.field_id] = f.value == null ? '' : f.value; return a; }, {});
    if (Object.keys(seed).length) { st.values = seed; renderApp(); return; }
    try {
      const d = await API.get('/contacts/' + c.id + '/fields');
      (d.custom_fields || []).forEach(f => { st.values[f.field_id] = f.value == null ? '' : f.value; });
    } catch (e) { /* no values yet is not an error */ }
    renderApp();
  };
  const saveValues = async () => {
    const c = st.showValues; if (!c) return;
    st.busy = 'values'; st.error = null; renderApp();
    try {
      for (const f of st.fields) {
        const v = st.values[fieldKey(f)];
        if (v === undefined) continue;
        await API.put('/contacts/' + c.id + '/fields/' + fieldKey(f), { value: v });
      }
      st.notice = 'Saved custom fields for ' + (c.name || c.phone || 'contact');
      st.showValues = null; st.busy = null; load();
    } catch (e) { st.error = 'Could not save field values: ' + e.message; st.busy = null; renderApp(); }
  };

  const rows = st.list.slice(0, 100);
  return html`<div>
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-xl font-bold">Contacts</h2>
      <div class="flex items-center gap-2">
        <input class="input" style="width:240px" placeholder="Search name, phone, email..." value=${st.search || ''} onInput=${e => onSearch(e.target.value)} />
        <button class="btn btn-sm btn-green" onClick=${() => showContact(null)}>+ New Contact</button>
        <button class="btn btn-sm btn-outline" onClick=${() => { st.showFields = !st.showFields; renderApp(); }}>Custom fields (${st.fields.length})</button>
        <button class="btn btn-sm btn-outline" onClick=${() => load()}>Refresh</button>
      </div>
    </div>
    ${st.searching && html`<p class="text-xs text-gray-400 mb-2">Searching…</p>`}
    ${st.error && html`<div class="card" style="border-left:4px solid #dc2626"><p class="text-sm text-red-700">${st.error}</p></div>`}
    ${st.notice && html`<div class="card" style="border-left:4px solid #059669"><p class="text-sm text-gray-700">${st.notice}</p></div>`}
    ${st.showFields && html`<div class="card">
      <h3 class="font-semibold mb-2">Custom field definitions</h3>
      <table class="table mb-3"><thead><tr><th>Name</th><th>Type</th><th>Order</th><th></th></tr></thead>
        <tbody>${st.fields.map(f => html`<tr><td class="font-medium">${f.field_name}</td><td class="text-gray-500">${f.field_type}</td><td class="text-gray-500">${f.field_order}</td>
          <td><button class="btn btn-sm btn-red" disabled=${st.busy === f.id} onClick=${() => removeField(f)}>Delete</button></td></tr>`)}
          ${st.fields.length === 0 && html`<tr><td colspan="4" class="text-center text-gray-400 py-4">No custom fields defined yet.</td></tr>`}
        </tbody></table>
      <div class="flex items-end gap-2">
        <div><label class="text-sm font-medium block mb-1">Field name</label><input class="input" value=${st.draft.name || ''} onInput=${e => { st.draft.name = e.target.value; }} /></div>
        <div><label class="text-sm font-medium block mb-1">Type</label><select class="input" onChange=${e => { st.draft.type = e.target.value; }}>
          <option value="text">text</option><option value="number">number</option><option value="date">date</option><option value="boolean">boolean</option></select></div>
        <div><label class="text-sm font-medium block mb-1">Order</label><input class="input" style="width:80px" value=${String(st.draft.order || 0)} onInput=${e => { st.draft.order = e.target.value; }} /></div>
        <button class="btn btn-sm btn-green" disabled=${st.busy === 'addfield'} onClick=${addField}>Add field</button>
      </div>
    </div>`}
    <div class="card p-0 overflow-hidden">
      <table class="table"><thead><tr><th>Name</th><th>Phone</th><th>Email</th>${st.fields.map(f => html`<th>${f.field_name}</th>`)}<th></th></tr></thead>
        <tbody>${rows.map(c => {
          const vals = (c.custom_fields || []).reduce((a, f) => { a[f.field_id] = f.value; return a; }, {});
          return html`<tr>
            <td class="font-medium">${c.name || c.full_name || '-'}</td>
            <td class="text-gray-500">${c.phone || '-'}</td>
            <td class="text-gray-500">${c.email || '-'}</td>
            ${st.fields.map(f => { const k = fieldKey(f); return html`<td class="text-gray-500">${vals[k] != null && vals[k] !== '' ? vals[k] : html`<span class="text-gray-300">—</span>`}</td>`; })}
            <td><div class="flex gap-1 justify-end">${st.fields.length ? html`<button class="btn btn-sm btn-outline" onClick=${() => openValues(c)}>Fields</button>` : ''}<button class="btn btn-sm btn-outline" onClick=${() => showContact(c)}>Edit</button><button class="btn btn-sm btn-red" disabled=${st.busy === c.id} onClick=${() => removeContact(c)}>Delete</button></div></td>
          </tr>`; })}
        ${rows.length === 0 && html`<tr><td colspan=${4 + st.fields.length} class="text-center text-gray-400 py-8">No contacts yet.</td></tr>`}
      </tbody></table>
    </div>
    ${st.showValues && html`<div class="modal" onClick=${e => e.target === e.currentTarget && (st.showValues = null, renderApp())}><div class="modal-content">
      <h3 class="text-lg font-bold mb-4">Field values — ${st.showValues.name || st.showValues.phone || 'contact'}</h3>
      <div class="space-y-3">${st.fields.map(f => html`<div><label class="text-sm font-medium block mb-1">${f.field_name}</label>
        <input class="input" value=${st.values[fieldKey(f)] == null ? '' : st.values[fieldKey(f)]} onInput=${e => { st.values[fieldKey(f)] = e.target.value; }} /></div>`)}
        ${st.fields.length === 0 && html`<p class="text-sm text-gray-500">Define a custom field first.</p>`}</div>
      <div class="flex gap-2 justify-end mt-4">
        <button class="btn btn-outline" onClick=${() => { st.showValues = null; renderApp(); }}>Cancel</button>
        <button class="btn" disabled=${st.busy === 'values' || st.fields.length === 0} onClick=${saveValues}>Save</button>
      </div>
    </div></div>`}
    ${st.showForm && html`<div class="modal" onClick=${e => e.target === e.currentTarget && hideContact()}><div class="modal-content">
      <h3 class="text-lg font-bold mb-4">${st.editItem ? 'Edit' : 'New'} Contact</h3>
      ${(() => {
        const f = viewState('contacts_form', { name: '', phone: '', email: '', company: '', notes: '', tags: '' });
        if (!st.formSeeded) {
          const row = st.editItem;
          f.name = row ? (row.name || '') : '';
          f.phone = row ? (row.phone || '') : '';
          f.email = row ? (row.email || '') : '';
          f.company = row ? (row.company || '') : '';
          f.notes = row ? (row.notes || '') : '';
          f.tags = row && Array.isArray(row.tags) ? row.tags.join(', ') : '';
          st.formSeeded = true;
        }
        const submit = () => {
          const name = (f.name || '').trim(), phone = (f.phone || '').trim();
          if (!name || !phone) { st.error = 'Name and phone are required'; renderApp(); return; }
          saveContact({ name: name, phone: phone, email: (f.email || '').trim(), company: (f.company || '').trim(), notes: (f.notes || '').trim(), tags: (f.tags || '').split(',').map(s => s.trim()).filter(Boolean) }, !!st.editItem);
        };
        return html`<div class="space-y-3">
        <div><label class="text-sm font-medium block mb-1">Name</label><input class="input" value=${f.name} onInput=${e => { f.name = e.target.value; }} /></div>
        <div><label class="text-sm font-medium block mb-1">Phone</label><input class="input" value=${f.phone} onInput=${e => { f.phone = e.target.value; }} placeholder="+15551234567" /></div>
        <div><label class="text-sm font-medium block mb-1">Email (optional)</label><input class="input" value=${f.email} onInput=${e => { f.email = e.target.value; }} /></div>
        <div><label class="text-sm font-medium block mb-1">Company (optional)</label><input class="input" value=${f.company} onInput=${e => { f.company = e.target.value; }} /></div>
        <div><label class="text-sm font-medium block mb-1">Tags (comma separated, optional)</label><input class="input" value=${f.tags} onInput=${e => { f.tags = e.target.value; }} placeholder="vip, after-hours" /></div>
        <div><label class="text-sm font-medium block mb-1">Notes (optional)</label><textarea class="input" rows="3" value=${f.notes} onInput=${e => { f.notes = e.target.value; }}></textarea></div>
        <div class="flex gap-2 justify-end mt-4"><button class="btn btn-outline" onClick=${hideContact}>Cancel</button><button class="btn" disabled=${st.busy === 'form'} onClick=${submit}>${st.editItem ? 'Save' : 'Add'}</button></div>
      </div>`; })()}
    </div></div>`}
  </div>`;
};

// ===== TICKETS =====
const Tickets = () => {
  const st = viewState('tickets', { list: [], showModal: false, editItem: null });
  const load = async () => { try { const d = await API.get('/tickets'); st.list = Array.isArray(d) ? d : []; renderApp(); } catch (e) { console.error(e); } };
  if (!st._loaded) { st._loaded = true; load(); }
  const show = (i) => { st.editItem = i; st.formSeeded = false; st.showModal = true; renderApp(); };
  const hide = () => { st.showModal = false; renderApp(); };
  const save = async (data) => { try { if (st.editItem) await API.put('/tickets/' + st.editItem.id, data); else await API.post('/tickets', data); st.showModal = false; load(); } catch (e) { alert(e.message); } };
  return html`<div>
    <div class="flex items-center justify-between mb-4"><h2 class="text-xl font-bold">Tickets</h2><button class="btn btn-sm btn-green" onClick=${() => show(null)}>+ New Ticket</button></div>
    <div class="card p-0 overflow-hidden">
      <table class="table"><thead><tr><th>Subject</th><th>Status</th><th>Priority</th><th>Actions</th></tr></thead>
        <tbody>${st.list.map(t => html`<tr><td class="font-medium">${t.subject||'-'}</td><td><span class="badge ${t.status==='open'?'badge-yellow':t.status==='resolved'?'badge-green':'badge-blue'}">${t.status||'open'}</span></td><td class="text-gray-500">${t.priority||'medium'}</td><td><button class="btn btn-sm btn-outline" onClick=${() => show(t)}>Edit</button></td></tr>`)}
        ${st.list.length===0 && html`<tr><td colspan="4" class="text-center text-gray-400 py-8">No tickets yet.</td></tr>`}
      </tbody></table>
    </div>
    ${st.showModal && html`<div class="modal" onClick=${e => e.target===e.currentTarget && hide()}><div class="modal-content"><h3 class="text-lg font-bold mb-4">${st.editItem?'Edit':'New'} Ticket</h3>
      ${(() => {
        // kanban t_13330c68 — the draft lives in the SHARED view object (S.views['tickets_form']), seeded ON
        // OPEN because show() clears st.formSeeded. The template IIFE re-runs on every renderApp(), so a
        // per-render local re-initialised the field from the stored ROW and wiped what the operator
        // typed (guard rule 4); a re-render can no longer do that.
        const f = viewState('tickets_form', { subject: '', status: 'open', priority: 'medium' });
        if (!st.formSeeded) {
          f.subject = st.editItem?.subject||'';
          f.status = st.editItem?.status||'open';
          f.priority = st.editItem?.priority||'medium';
          st.formSeeded = true;
        }
        return html`<div class="space-y-3"><div><label class="text-sm font-medium block mb-1">Subject</label><input class="input" value=${f.subject} onInput=${e => { f.subject = e.target.value; }} /></div><div><label class="text-sm font-medium block mb-1">Status</label><select class="input" value=${f.status} onChange=${e => { f.status = e.target.value; }}><option value="open">Open</option><option value="in_progress">In Progress</option><option value="resolved">Resolved</option><option value="closed">Closed</option></select></div><div><label class="text-sm font-medium block mb-1">Priority</label><select class="input" value=${f.priority} onChange=${e => { f.priority = e.target.value; }}><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option><option value="urgent">Urgent</option></select></div><div class="flex gap-2 justify-end mt-4"><button class="btn btn-outline" onClick=${() => hide()}>Cancel</button><button class="btn" onClick=${() => save({subject: f.subject, status: f.status, priority: f.priority})}>${st.editItem?'Save':'Add'}</button></div></div>`; })()}
    </div></div>`}
  </div>`;
};

// ===== INTEGRATIONS (Integration Center) =====
// Renders the LIVE available_providers catalogue (no hardcoded provider array), CoreSwift
// pinned first as the upgrade path. Keys are BYOK per tenant: stored via
// POST /api/v1/provider-keys, masked on read, never rendered raw.
const Integrations = () => {
  const st = viewState('integrations', { providers: [], keys: [], hubStatus: null, keyInput: {}, baseInput: {}, busy: null, probe: null, error: null, notice: null, push: {}, pushRes: null, pushBusy: false });
  const load = async () => {
    try { const p = await API.get('/available-providers'); st.providers = Array.isArray(p) ? p : (p.providers || []); }
    catch (e) { st.error = 'Could not load providers: ' + e.message; }
    try { const k = await API.get('/provider-keys'); st.keys = Array.isArray(k) ? k : (k.keys || []); } catch (e) { st.keys = []; }
    try { st.hubStatus = await API.get('/integrations/coreswift/status'); } catch (e) { st.hubStatus = null; }
    renderApp();
  };
  if (!st._loaded) { st._loaded = true; load(); }
  const keyFor = (key) => (st.keys || []).find(k => k.provider === key && k.is_active !== false);
  const isConnected = (p) => p.key === 'coreswift' ? !!(st.hubStatus && st.hubStatus.connected) : !!keyFor(p.key);
  // CoreSwift is pinned first (fleet standard); the rest is whatever the catalogue returns.
  const ordered = () => st.providers.slice().sort((a, b) => (a.key === 'coreswift' ? -1 : 0) - (b.key === 'coreswift' ? -1 : 0) || (a.name || a.key || '').localeCompare(b.name || b.key || ''));
  const connect = async (p) => {
    const api_key = (st.keyInput[p.key] || '').trim();
    if (!api_key) { st.error = 'Paste the ' + (p.name || p.key) + ' key first'; renderApp(); return; }
    st.busy = p.key; st.error = null; st.probe = null; renderApp();
    const body = { provider: p.key, api_key };
    const bu = (st.baseInput[p.key] || '').trim();
    if (bu) body.base_url = bu;
    try { await API.post('/provider-keys', body); st.keyInput[p.key] = ''; st.notice = (p.name || p.key) + ' connected'; }
    catch (e) { st.error = (p.name || p.key) + ': ' + e.message; }
    st.busy = null; load();
  };
  const disconnect = async (p) => {
    if (!confirm('Disconnect ' + (p.name || p.key) + '?')) return;
    st.busy = p.key; st.error = null; renderApp();
    try { await API.del('/provider-keys/' + p.key); st.notice = (p.name || p.key) + ' disconnected'; }
    catch (e) { st.error = (p.name || p.key) + ': ' + e.message; }
    st.busy = null; load();
  };
  const test = async (p) => {
    st.busy = p.key; st.probe = null; renderApp();
    try { const r = await API.post('/provider-keys/' + p.key + '/test', {}); st.probe = { key: p.key, ok: r.ok, message: r.message || '' }; }
    catch (e) { st.probe = { key: p.key, ok: false, message: e.message }; }
    st.busy = null; renderApp();
  };
  const controls = (p) => {
    const k = keyFor(p.key);
    const connected = isConnected(p);
    const pr = st.probe && st.probe.key === p.key ? st.probe : null;
    return html`<div class="mt-3 space-y-2">
      <div class="flex items-center gap-2">
        <span class="badge ${connected ? 'badge-green' : 'badge-yellow'}">${connected ? 'Connected' : 'Not connected'}</span>
        ${connected && k ? html`<span class="text-xs text-gray-400">key ${k.api_key}</span>` : ''}
        ${connected && p.key === 'coreswift' && st.hubStatus && st.hubStatus.base_url ? html`<span class="text-xs text-gray-400">→ ${st.hubStatus.base_url}</span>` : ''}
      </div>
      ${connected ? html`<div class="flex gap-2">
          <button class="btn btn-sm btn-outline" disabled=${st.busy === p.key} onClick=${() => test(p)}>Test connection</button>
          <button class="btn btn-sm btn-red" disabled=${st.busy === p.key} onClick=${() => disconnect(p)}>Disconnect</button>
        </div>`
      : html`<div class="space-y-2">
          <input class="input" type="password" placeholder=${(p.name || p.key) + ' API key'} value=${st.keyInput[p.key] || ''} onInput=${e => st.keyInput[p.key] = e.target.value} />
          ${p.requires_base_url ? html`<input class="input" placeholder="Base URL (optional — defaults to the platform URL)" value=${st.baseInput[p.key] || ''} onInput=${e => st.baseInput[p.key] = e.target.value} />` : ''}
          <div class="flex gap-2">
            <button class="btn btn-sm" disabled=${st.busy === p.key} onClick=${() => connect(p)}>Connect</button>
            <button class="btn btn-sm btn-outline" disabled=${st.busy === p.key} onClick=${() => test(p)}>Test connection</button>
          </div>
        </div>`}
      ${pr ? html`<div class="text-xs ${pr.ok ? 'text-green-700' : 'text-amber-700'}">${pr.message || (pr.ok ? 'OK' : 'Failed')}</div>` : ''}
    </div>`;
  };
  // Manual "push now" — POST /integrations/coreswift/push is the same code path the automatic
  // capture uses, exposed for the operator who captured a lead outside the normal flow.
  const pushNow = async () => {
    const p = st.push || {};
    if (!(p.name || '').trim() && !(p.phone || '').trim() && !(p.email || '').trim()) {
      st.error = 'Give the lead at least a name, a phone or an email'; renderApp(); return;
    }
    st.pushBusy = true; st.pushRes = null; st.error = null; renderApp();
    const body = { name: p.name, company: p.company, email: p.email, phone: p.phone, list_id: p.list_id, notes: p.notes };
    body.tags = (p.tags || '').split(',').map(s => s.trim()).filter(Boolean);
    Object.keys(body).forEach(k => { if (body[k] === undefined || body[k] === '') delete body[k]; });
    try { st.pushRes = { ok: true, text: JSON.stringify(await API.post('/integrations/coreswift/push', body)) }; }
    catch (e) { st.pushRes = { ok: false, text: 'Push failed: ' + e.message }; }
    st.pushBusy = false; renderApp();
  };
  const list = ordered();
  const core = list.find(p => p.key === 'coreswift');
  const rest = list.filter(p => p.key !== 'coreswift');
  return html`<div>
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-xl font-bold">Integrations</h2>
      <button class="btn btn-sm btn-outline" onClick=${() => load()}>Refresh</button>
    </div>
    ${st.error ? html`<div class="card" style="border-left:4px solid #dc2626"><b class="text-red-700">Error</b><p class="text-sm text-gray-600 mt-.5">${st.error}</p></div>` : ''}
    ${st.notice ? html`<div class="card" style="border-left:4px solid #059669"><p class="text-sm text-gray-600">${st.notice}</p></div>` : ''}
    ${core ? html`<div class="card" style="border:2px solid #2563eb">
      <div class="flex items-start justify-between gap-4">
        <div style="flex:1">
          <h3 class="font-semibold text-lg">🔗 ${core.name || 'CoreSwift CRM'} <span class="badge badge-blue">Recommended</span></h3>
          <p class="text-sm text-gray-600 mt-1">${core.description || 'Push leads into CoreSwift CRM'}</p>
          <p class="text-xs text-gray-500 mt-1">Every caller you capture here lands in CoreSwift automatically — the single home for all of your leads.</p>
          ${controls(core)}
        </div>
        <div style="min-width:210px" class="text-right">
          <div class="text-sm font-semibold text-blue-700">One CRM for every tool you connect</div>
          <a class="btn btn-sm" style="display:inline-block;margin-top:8px;text-decoration:none" href="https://coreswiftcrm.com/?utm_source=missedcallrespondr&utm_medium=integration_center" target="_blank" rel="noopener">Get CoreSwift CRM →</a>
          <div class="mt-2"><a class="text-xs text-blue-600" href="https://coreswiftcrm.com/pricing?utm_source=missedcallrespondr&utm_medium=integration_center" target="_blank" rel="noopener">See plans &amp; upgrade</a></div>
        </div>
      </div>
    </div>` : ''}
    ${core && st.hubStatus && st.hubStatus.connected ? html`<div class="card" style="border-left:4px solid #059669">
      <h3 class="font-semibold">Push a lead to CoreSwift now</h3>
      <p class="text-sm text-gray-600 mt-1">The same push the automatic capture path uses, for a lead you captured by hand.</p>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-2 mt-3">
        <input class="input" placeholder="Name" value=${st.push.name || ''} onInput=${e => { st.push.name = e.target.value; }} />
        <input class="input" placeholder="Company" value=${st.push.company || ''} onInput=${e => { st.push.company = e.target.value; }} />
        <input class="input" placeholder="Phone" value=${st.push.phone || ''} onInput=${e => { st.push.phone = e.target.value; }} />
        <input class="input" placeholder="Email" value=${st.push.email || ''} onInput=${e => { st.push.email = e.target.value; }} />
        <input class="input" placeholder="Tags (comma separated)" value=${st.push.tags || ''} onInput=${e => { st.push.tags = e.target.value; }} />
        <input class="input" placeholder="CoreSwift list id (optional)" value=${st.push.list_id || ''} onInput=${e => { st.push.list_id = e.target.value; }} />
        <input class="input" placeholder="Notes" value=${st.push.notes || ''} onInput=${e => { st.push.notes = e.target.value; }} />
      </div>
      <div class="flex items-center gap-3 mt-3">
        <button class="btn btn-sm btn-green" disabled=${st.pushBusy} onClick=${pushNow}>Push now</button>
        ${st.pushRes && html`<span class="text-xs ${st.pushRes.ok ? 'text-green-700' : 'text-red-600'}">${st.pushRes.ok ? 'Pushed' : 'Failed'}</span>`}
      </div>
      ${st.pushRes && html`<pre class="text-xs bg-gray-50 border rounded p-2 mt-2 overflow-auto" style="max-height:160px">${st.pushRes.text}</pre>`}
    </div>` : ''}
    ${rest.length === 0 && !core ? html`<div class="card text-center text-gray-400 py-8">No providers available yet.</div>` : ''}
    ${rest.map(p => html`<div class="card">
      <h3 class="font-semibold">${p.icon ? p.icon + ' ' : ''}${p.name || p.key}</h3>
      <p class="text-sm text-gray-600 mt-1">${p.description || ''}</p>
      ${controls(p)}
    </div>`)}
  </div>`;
};

// ===== APP SHELL =====
const App = () => {
  if (!API.token) return html`<${LoginView} />`;
  // kanban t_25b8c662 — an impersonated session belongs to the CUSTOMER's tenant, but the token
  // keeps the OPERATOR's `sub` (admin_handler::impersonate switches `aid` only). So PUT
  // /auth/profile and PUT /auth/password would write to the OPERATOR's own user row: the Profile
  // view is removed from an impersonated session, and a banner names the impersonated tenant.
  const impTenant = (API.user && API.user.impersonated) ? (API.user.tenant || 'a tenant') : null;
  const nav = [
    { id: 'overview', label: 'Overview', icon: '📊' },
    { id: 'calls', label: 'Calls', icon: '📞' },
    { id: 'phoneNumbers', label: 'Phone Numbers', icon: '📱' },
    { id: 'rules', label: 'Response Rules', icon: '⚙️' },
    { id: 'templates', label: 'Templates', icon: '📋' },
    { id: 'messages', label: 'Messages', icon: '💬' },
    { id: 'followups', label: 'Follow-ups', icon: '⏰' },
    { id: 'contacts', label: 'Contacts', icon: '👥' },
    { id: 'tickets', label: 'Tickets', icon: '🎫' },
    { id: 'integrations', label: 'Integrations', icon: '🔗' },
    { id: 'profile', label: 'Profile', icon: '👤' }
  ].filter(n => !(impTenant && n.id === 'profile'));
  const views = { overview: Overview, calls: Calls, phoneNumbers: PhoneNumbers, rules: ResponseRules, templates: Templates, messages: Messages, followups: FollowUps, contacts: Contacts, tickets: Tickets, integrations: Integrations, profile: Profile };
  const CurrentView = views[S.view] || Overview;
  const c = API.user || {};
  return html`<div class="flex">
    <div class="sidebar">
      <div class="flex items-center gap-2 px-3 py-4 mb-2">
        <span class="text-2xl">📞</span>
        <span class="nav-txt font-bold text-gray-800">MissedCall</span>
      </div>
      <div class="flex-1 space-y-1">
        ${nav.map(n => html`<div class="nav-item ${S.view===n.id?'active':''}" onClick=${() => { S.view = n.id; renderApp(); }}><span>${n.icon}</span><span class="nav-txt">${n.label}</span></div>`)}
      </div>
      <div class="text-xs text-gray-400 px-3 py-2 truncate">${c.email || ''}</div>
      <!-- User guide link (kanban t_5af0ddda): the fleet standard puts the user guide at
           /guide.html on THIS origin and links it from the app shell beside sign-out. Before this
           the tenant shell linked its own guide nowhere - only the marketing footer did, and it
           pointed at the other origin. -->
      <a class="nav-item" id="user-guide-link" href="/guide.html" target="_blank" rel="noopener"><span>📖</span><span class="nav-txt">User Guide</span></a>
      <div class="nav-item text-red-500" onClick=${() => { API.logout(); location.href = '/'; }}><span>🚪</span><span class="nav-txt">Logout</span></div>
    </div>
    <div class="main">
      ${impTenant && html`<div class="imp-banner" data-impersonating=${impTenant}>
        <span>🔑 Impersonating <b>${impTenant}</b> — this tab is the customer's session, not yours. Your operator session stays open on the admin panel.</span>
        <button onClick=${() => { API.logout(); window.location.href = 'https://admin.missedcallrespondr.com/'; }}>Exit impersonation</button>
      </div>`}
      <${CurrentView} />
    </div>
  </div>`;
};

const renderApp = () => render(html`<${App} />`, document.getElementById('app'));
renderApp();
</script>
</body>
</html>
