<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Confirm your new sign-in email — MissedCall Respondr</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="alternate icon" href="/favicon.ico">
<style>
:root{--page-bg:linear-gradient(135deg,#eef2ff,#e0e7ff);--card-bg:#ffffff;--heading:#1e1b4b;--text-primary:#16181d;--text-secondary:#4b5563;--accent:#6366f1;--accent-hover:#4f46e5;--border:#d1d5db;--surface-0:#f6f7fb;--surface-1:#eef0f6;--surface-2:#ffffff;--surface-3:#ffffff;--shadow-1:0 1px 3px rgba(16,24,40,.08);--shadow-2:0 8px 32px rgba(16,24,40,.16);--z-sticky:10;--z-dropdown:20;--z-modal:30;--z-toast:40;color-scheme:light}
html[data-theme="dark"]{--page-bg:linear-gradient(135deg,#1e1b4b,#312e81);--card-bg:#1a1d27;--heading:#e8eaed;--text-primary:#e8eaed;--text-secondary:#9aa0a6;--accent:#818cf8;--accent-hover:#a5b4fc;--border:#2d3148;--surface-0:#0f1117;--surface-1:#1a1d27;--surface-2:#222532;--surface-3:#2a2d3a;--shadow-1:0 1px 3px rgba(0,0,0,.35);--shadow-2:0 8px 32px rgba(0,0,0,.5);color-scheme:dark}
.theme-toggle{position:fixed;left:16px;bottom:16px;z-index:var(--z-toast);display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;border:1px solid var(--border);background:var(--card-bg);color:var(--text-primary);font-size:13px;font-weight:600;cursor:pointer;box-shadow:var(--shadow-1);font-family:inherit}
.theme-toggle:hover{border-color:var(--accent)}
html[data-theme="dark"] .msg.e{background:rgba(239,68,68,.15);color:#fca5a5}
html[data-theme="dark"] .msg.o{background:rgba(34,197,94,.15);color:#4ade80}
html[data-theme="dark"] .msg.i{background:rgba(99,102,241,.15)}

*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:var(--page-bg);display:flex;justify-content:center;align-items:center;min-height:100vh;padding:24px}
.c{background:var(--card-bg);border-radius:12px;padding:40px;width:440px;max-width:95vw;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.c h1{font-size:22px;color:var(--heading);margin-bottom:4px}
.c p.sub{font-size:13px;color:var(--text-secondary);margin-bottom:18px;line-height:1.55}
.msg{padding:11px 13px;border-radius:8px;font-size:13.5px;margin-top:12px;display:none;line-height:1.5}
.msg.e{background:#fee2e2;color:#991b1b;display:block}
.msg.o{background:#d1fae5;color:#065f46;display:block}
.msg.i{color:var(--accent);display:block;background:#eef2ff}
.lk{margin-top:18px;font-size:12px;border-top:1px solid var(--border);padding-top:14px;text-align:center}
.lk a{color:var(--accent);text-decoration:none}
.lk a.btn{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px}
</style>
<script>
(function(){try{var t=localStorage.getItem('mc_theme');if(!t)t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light');}catch(e){document.documentElement.setAttribute('data-theme','light');}})();
</script>
</head>
<body>
<button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle day/night mode"><span id="theme-toggle-icon" aria-hidden="true">🌙</span><span id="theme-toggle-label">Night mode</span></button>
<script>
(function(){var b=document.getElementById('theme-toggle');if(!b)return;function p(){var d=document.documentElement.getAttribute('data-theme')==='dark';var i=document.getElementById('theme-toggle-icon');var l=document.getElementById('theme-toggle-label');if(i)i.textContent=d?'☀️':'🌙';if(l)l.textContent=d?'Day mode':'Night mode';}b.addEventListener('click',function(){var n=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('mc_theme',n);}catch(e){}p();});p();})();
</script>

<div class="c">
<h1>Confirm your new sign-in email</h1>
<p class="sub" id="lede">Checking your confirmation link&hellip;</p>
<div id="m" class="msg" role="status" aria-live="polite"></div>
<div class="lk" id="lk"><a href="/login">&larr; Back to sign in</a></div>
</div>
<script>
/* kanban t_0d1aa081 — the SECOND arm of the sign-in-address change.
   This page is opened from a mailbox, so it carries no session: the token in the URL IS the
   credential. It posts that token once, anonymously, to /api/v1/auth/email-change/confirm, and the
   server moves users.email for the row that token names. The link works once — a second open (or a
   reload) answers "invalid or has expired", which is what stops a forwarded mail from being reused.
   The path needs its own nginx rule (location = /confirm-email-change) or it falls through to the
   SPA shell, which bounces a visitor to /login and the move is never confirmed. */
(function () {
  var m = document.getElementById('m'),
      lede = document.getElementById('lede'),
      lk = document.getElementById('lk');
  function show(cls, text) { m.className = 'msg ' + cls; m.textContent = text; }
  var token = '';
  try { token = (new URLSearchParams(window.location.search).get('token') || '').trim(); } catch (e) {}
  if (!token) {
    lede.textContent = 'This link is incomplete.';
    show('e', 'The confirmation code is missing from the link. Open the link from your email again, or ask for a new one from Your account on your dashboard.');
    return;
  }
  fetch('/api/v1/auth/email-change/confirm', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token: token })
  }).then(function (r) {
    return r.text().then(function (t) {
      var d = null; try { d = JSON.parse(t); } catch (e) {}
      if (!r.ok) throw new Error((d && (d.error || d.message)) || ('Error ' + r.status));
      return d || {};
    });
  }).then(function (d) {
    lede.textContent = 'Done.';
    show('o', (d && d.message) || 'Your sign-in address has been changed.');
    lk.innerHTML = '<a class="btn" href="/login">Go to sign in</a>';
  }).catch(function (e) {
    lede.textContent = 'That link did not work.';
    show('e', (e && e.message) || 'That confirmation link is invalid or has expired.');
  });
})();
</script>
</body>
</html>
