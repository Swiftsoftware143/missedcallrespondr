<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — MissedCall Respondr</title>
<meta name="robots" content="noindex">
<script>
(function(){try{var t=localStorage.getItem('mc_theme');if(!t)t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark');}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();
</script>
<style>
  :root { color-scheme: dark; --page-bg:#0f172a; --text:#e2e8f0; --heading:#f8fafc; --muted:#94a3b8; --brand:#a5b4fc; --link:#c7d2fe; --accent:#4f46e5; --accent-hover:#4338ca;
          --surface-0:#f6f7fb;--surface-1:#eef0f6;--surface-2:#ffffff;--surface-3:#ffffff;--shadow-1:0 1px 3px rgba(0,0,0,.35);--shadow-2:0 8px 32px rgba(0,0,0,.5);--z-sticky:10;--z-dropdown:20;--z-modal:30;--z-toast:40; }
  html[data-theme="light"] { color-scheme: light; --page-bg:#f6f7fb; --text:#16181d; --heading:#16181d; --muted:#4b5563; --brand:#4f46e5; --link:#4f46e5; --accent:#4f46e5; --accent-hover:#4338ca; --shadow-1:0 1px 3px rgba(16,24,40,.08);--shadow-2:0 8px 32px rgba(16,24,40,.16); }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: var(--page-bg); color: var(--text); font: 16px/1.6 -apple-system, BlinkMacSystemFont,
         "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 24px; }
  .card { max-width: 560px; width: 100%; }
  .brand { font-weight: 700; letter-spacing: .3px; color: var(--brand); font-size: 15px; }
  h1 { font-size: 30px; line-height: 1.25; margin: 14px 0 10px; color: var(--heading); }
  p { margin: 0 0 22px; color: var(--muted); }
  a.btn { display: inline-block; padding: 11px 22px; border-radius: 10px; background: var(--accent);
           color: #fff; text-decoration: none; font-weight: 600; }
  a.btn:hover { background: var(--accent-hover); }
  .links { margin-top: 26px; display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 15px; }
  .links a { color: var(--link); text-decoration: none; }
  .links a:hover { text-decoration: underline; }
  .theme-toggle{position:fixed;left:16px;bottom:16px;z-index:var(--z-toast);display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;border:1px solid var(--muted);background:var(--surface-2);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;box-shadow:var(--shadow-1);font-family:inherit}
  .theme-toggle:hover{border-color:var(--accent)}
</style>
</head>
<body>
<main class="card">
  <div class="brand">MissedCall Respondr</div>
  <h1>That page isn&rsquo;t here</h1>
  <p>The address may have a typo, or the link may be out of date. Your account and your work are untouched.</p>
  <a class="btn" href="/dashboard/">Back to my dashboard</a>
  <nav class="links">
    <a href="/guide.html">User guide</a>
    <a href="/contact.html">Contact support</a>
    <a href="/login">Sign in</a>
  </nav>
</main>
<button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle day/night mode"><span id="theme-toggle-icon" aria-hidden="true">☀️</span><span id="theme-toggle-label">Day mode</span></button>
<script>
(function(){var b=document.getElementById('theme-toggle');if(!b)return;function p(){var d=document.documentElement.getAttribute('data-theme')==='dark';var i=document.getElementById('theme-toggle-icon');var l=document.getElementById('theme-toggle-label');if(i)i.textContent=d?'☀️':'🌙';if(l)l.textContent=d?'Day mode':'Night mode';}b.addEventListener('click',function(){var n=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('mc_theme',n);}catch(e){}p();});p();})();
</script>
</body>
</html>
